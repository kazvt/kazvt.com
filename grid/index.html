<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table</title>
  <style>
    :root {
      --columns: 15;
      --gap: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #111;
    }

    body {
      background-position: center center;
      background-repeat: no-repeat;
      background-size: 100vw 100vh;
      background-attachment: fixed;
    }

    .page {
      min-height: 100vh;
      padding: 16px;
      background: rgba(0, 0, 0, 0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      gap: var(--gap);
      align-items: start;
    }

    .cell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      min-height: 1px;
    }

    .cell img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: transparent;
      user-select: none;
      -webkit-user-drag: none;
    }

    .username-label {
      position: absolute;
      left: 50%;
      bottom: 4px;
      transform: translateX(-50%);
      width: calc(100% - 4px);
      padding: 0 2px;
      font-size: 12px;
      line-height: 1.05;
      text-align: center;
      color: #fff;
      background: transparent;
      white-space: normal;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens: none;
      pointer-events: none;
      display: block;
      -webkit-text-stroke: 1.5px #000;
      paint-order: stroke fill;
      text-shadow:
        1px 0 0 #000,
        -1px 0 0 #000,
        0 1px 0 #000,
        0 -1px 0 #000,
        1px 1px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
    }

    .hidden-input {
      display: none;
    }

    .corner-zone {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 320px;
      min-height: 170px;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
    }

    .corner-controls {
      margin: 0 12px 12px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .settings-panel,
    .button-row {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: auto;
    }

    .corner-zone:hover .settings-panel,
    .corner-zone:hover .button-row,
    .corner-zone :focus-within {
      opacity: 1;
      transform: translateY(0);
    }

    .settings-panel {
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.8);
    }

    .settings-title {
      font-size: 12px;
      margin-bottom: 8px;
      opacity: 0.9;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-row label {
      font-size: 14px;
      white-space: nowrap;
    }

    .settings-row input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    .settings-value {
      min-width: 28px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .corner-button {
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 0;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .corner-button:disabled {
      cursor: wait;
      opacity: 1;
      transform: translateY(0);
    }

    .measure-label {
      position: absolute;
      left: -999999px;
      top: -999999px;
      visibility: hidden;
      white-space: nowrap;
      line-height: 1;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: normal;
      padding: 0 2px;
      -webkit-text-stroke: 1.5px #000;
    }
  </style>
</head>

<body>
  <div class="page">
    <input id="imagePicker" class="hidden-input" type="file" accept="image/*" multiple />

    <div id="grid" class="grid"></div>

    <div class="corner-zone" aria-label="Page controls">
      <div class="corner-controls">
        <div class="settings-panel">
          <div class="settings-title">Settings</div>
          <div class="settings-row">
            <label for="columnsRange">Cells per row</label>
            <input id="columnsRange" type="range" min="5" max="30" step="1" value="15" />
            <span id="columnsValue" class="settings-value">15</span>
          </div>
        </div>

        <div class="button-row">
          <button id="clearButton" class="corner-button" type="button">Clear all</button>
          <button id="exportButton" class="corner-button" type="button">Export JPEG</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const imagePicker = document.getElementById('imagePicker');
    const exportButton = document.getElementById('exportButton');
    const clearButton = document.getElementById('clearButton');
    const columnsRange = document.getElementById('columnsRange');
    const columnsValue = document.getElementById('columnsValue');

    const CELL_CANDIDATES = ['cell.png', 'cell.jpg', 'cell.jpeg'];
    const BG_CANDIDATES = ['bg.png', 'bg.jpg', 'bg.jpeg'];

    let cellFallbackFile = null;
    let waitingForNextImage = false;
    let isExporting = false;

    const STORAGE_KEY = 'image-grid-page-state-v2';
    const DEFAULT_COLUMNS = 15;
    const MIN_COLUMNS = 5;
    const MAX_COLUMNS = 30;

    let fitLabelsRaf = 0;
    let resizeObserver = null;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function assetExists(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = src + '?v=' + Date.now();
      });
    }

    async function findFirstExisting(candidates) {
      for (const file of candidates) {
        const exists = await assetExists(file);
        if (exists) return file;
      }
      return null;
    }

    async function applyWallpaper() {
      const bgFile = await findFirstExisting(BG_CANDIDATES);
      if (bgFile) {
        document.body.style.backgroundImage = `url("${bgFile}")`;
      }
    }

    function createUsernameLabel(text) {
      const label = document.createElement('div');
      label.className = 'username-label';
      label.textContent = text;
      return label;
    }

    function measureTextWidth(text, fontSizePx) {
      const probe = document.createElement('span');
      probe.className = 'measure-label';
      probe.style.fontSize = `${fontSizePx}px`;
      probe.textContent = text;
      document.body.appendChild(probe);
      const width = probe.getBoundingClientRect().width;
      probe.remove();
      return width;
    }

    function getWords(text) {
      return String(text || '')
        .replace(/\s+/g, ' ')
        .trim()
        .split(' ')
        .filter(Boolean);
    }

    function fitUsernameLabel(label) {
      if (!label || !label.textContent) return;

      const cell = label.closest('.cell');
      if (!cell) return;

      const text = label.textContent.trim();
      if (!text) return;

      const usableWidth = Math.max(1, cell.clientWidth - 4);
      const maxHeight = Math.max(1, cell.clientHeight * 0.28);

      const words = getWords(text);
      if (!words.length) return;

      const testFontSize = 100;
      let widestWordWidth = 0;

      for (const word of words) {
        widestWordWidth = Math.max(widestWordWidth, measureTextWidth(word, testFontSize));
      }

      if (!widestWordWidth) return;

      let fontSize = (usableWidth / widestWordWidth) * testFontSize;
      label.style.fontSize = `${fontSize}px`;

      while (fontSize > 1 && label.scrollHeight > maxHeight) {
        fontSize -= 0.5;
        label.style.fontSize = `${fontSize}px`;
      }
    }

    function fitAllUsernames() {
      grid.querySelectorAll('.username-label').forEach(fitUsernameLabel);
    }

    function queueFitAllUsernames() {
      cancelAnimationFrame(fitLabelsRaf);
      fitLabelsRaf = requestAnimationFrame(() => {
        fitAllUsernames();
      });
    }

    function observeCellResize(cell) {
      if (!resizeObserver || !cell) return;
      resizeObserver.observe(cell);
    }

    function setColumns(value, shouldSave = true) {
      const normalized = clamp(Number(value) || DEFAULT_COLUMNS, MIN_COLUMNS, MAX_COLUMNS);
      document.documentElement.style.setProperty('--columns', String(normalized));
      columnsRange.value = String(normalized);
      columnsValue.textContent = String(normalized);

      queueFitAllUsernames();

      if (shouldSave) {
        saveState();
      }
    }

    function setUsername(cell) {
      const currentLabel = cell.querySelector('.username-label');
      const currentName = currentLabel ? currentLabel.textContent : '';
      const username = window.prompt('Enter username:', currentName || '');

      if (username === null) return;

      const trimmed = username.trim();
      if (!trimmed) {
        if (currentLabel) currentLabel.remove();
        saveState();
        return;
      }

      let label = currentLabel;
      if (label) {
        label.textContent = trimmed;
      } else {
        label = createUsernameLabel(trimmed);
        cell.appendChild(label);
      }

      fitUsernameLabel(label);
      saveState();
    }

    function createCellWithImage(src) {
      const cell = document.createElement('div');
      cell.className = 'cell';

      const img = document.createElement('img');
      img.alt = 'Grid image';
      img.src = src;

      img.addEventListener('load', () => {
        queueFitAllUsernames();
      });

      cell.appendChild(img);

      cell.addEventListener('click', (event) => {
        event.stopPropagation();
        setUsername(cell);
      });

      cell.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (resizeObserver) resizeObserver.unobserve(cell);
        cell.remove();
        saveState();
      });

      observeCellResize(cell);
      return cell;
    }

    function getPersistableCells() {
      return Array.from(grid.querySelectorAll('.cell')).map((cell) => {
        const img = cell.querySelector('img');
        const label = cell.querySelector('.username-label');
        return {
          src: img ? img.src : '',
          username: label ? label.textContent : '',
          isFallback: !!(img && cellFallbackFile && img.getAttribute('src') === cellFallbackFile)
        };
      });
    }

    function saveState() {
      try {
        const state = {
          columns: clamp(Number(columnsRange.value) || DEFAULT_COLUMNS, MIN_COLUMNS, MAX_COLUMNS),
          cells: getPersistableCells().filter((item) => {
            if (!item.src) return false;
            if (item.src.startsWith('blob:')) return false;
            return true;
          })
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn('Failed to save state.', error);
      }
    }

    function appendImage(src, username = '') {
      const cell = createCellWithImage(src);
      grid.appendChild(cell);

      if (username) {
        const label = createUsernameLabel(username);
        cell.appendChild(label);
        fitUsernameLabel(label);
      }

      queueFitAllUsernames();
      saveState();
      return cell;
    }

    function addImageFiles(files) {
      const imageFiles = Array.from(files).filter((file) => file.type.startsWith('image/'));
      for (const file of imageFiles) {
        const reader = new FileReader();
        reader.onload = () => {
          appendImage(String(reader.result || ''));
        };
        reader.readAsDataURL(file);
      }
    }

    function openPickerForNextImage() {
      waitingForNextImage = true;
      imagePicker.value = '';
      imagePicker.click();
    }

    imagePicker.addEventListener('change', (event) => {
      const files = event.target.files || [];
      if (files.length > 0) {
        addImageFiles(files);
      }
      waitingForNextImage = false;
    });

    document.addEventListener('click', (event) => {
      if (isExporting) return;
      if (event.target.closest('.corner-zone')) return;
      if (event.target.closest('.cell')) return;
      if (waitingForNextImage) return;

      if (cellFallbackFile) {
        appendImage(cellFallbackFile);
        return;
      }

      openPickerForNextImage();
    });

    function clearAllCells() {
      const cells = grid.querySelectorAll('.cell');
      cells.forEach((cell) => {
        if (resizeObserver) resizeObserver.unobserve(cell);
        cell.remove();
      });

      try {
        const existingRaw = localStorage.getItem(STORAGE_KEY);
        const existing = existingRaw ? JSON.parse(existingRaw) : {};
        const nextState = {
          columns: clamp(Number(columnsRange.value) || DEFAULT_COLUMNS, MIN_COLUMNS, MAX_COLUMNS),
          cells: []
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...existing, ...nextState }));
      } catch (error) {
        console.warn('Failed to clear saved state.', error);
      }
    }

    clearButton.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      clearAllCells();
    });

    columnsRange.addEventListener('input', () => {
      setColumns(columnsRange.value, true);
    });

    function downloadDataUrl(filename, dataUrl) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function exportWholePageAsJpeg() {
      if (typeof window.html2canvas !== 'function') {
        window.alert('Export library failed to load.');
        return;
      }

      isExporting = true;
      exportButton.disabled = true;
      clearButton.disabled = true;
      columnsRange.disabled = true;
      exportButton.textContent = 'Exporting...';

      const originalScrollX = window.scrollX;
      const originalScrollY = window.scrollY;
      const doc = document.documentElement;
      const body = document.body;
      const cornerZone = document.querySelector('.corner-zone');
      const previousVisibility = cornerZone ? cornerZone.style.visibility : '';

      const fullWidth = Math.max(
        doc.scrollWidth,
        doc.offsetWidth,
        doc.clientWidth,
        body.scrollWidth,
        body.offsetWidth,
        body.clientWidth
      );

      const fullHeight = Math.max(
        doc.scrollHeight,
        doc.offsetHeight,
        doc.clientHeight,
        body.scrollHeight,
        body.offsetHeight,
        body.clientHeight
      );

      try {
        if (cornerZone) cornerZone.style.visibility = 'hidden';

        fitAllUsernames();

        const canvas = await window.html2canvas(document.body, {
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#111',
          width: fullWidth,
          height: fullHeight,
          windowWidth: fullWidth,
          windowHeight: fullHeight,
          scrollX: 0,
          scrollY: 0
        });

        const jpegQuality = 0.82;
        const jpegDataUrl = canvas.toDataURL('image/jpeg', jpegQuality);
        downloadDataUrl('export-lossy.jpg', jpegDataUrl);
      } catch (error) {
        console.error(error);
        window.alert('Failed to export the page as JPEG.');
      } finally {
        if (cornerZone) cornerZone.style.visibility = previousVisibility;
        window.scrollTo(originalScrollX, originalScrollY);
        exportButton.disabled = false;
        clearButton.disabled = false;
        columnsRange.disabled = false;
        exportButton.textContent = 'Export JPEG';
        isExporting = false;
      }
    }

    exportButton.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      exportWholePageAsJpeg();
    });

    function restoreState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          setColumns(DEFAULT_COLUMNS, false);
          return false;
        }

        const parsed = JSON.parse(raw);
        const savedColumns = parsed && parsed.columns != null ? parsed.columns : DEFAULT_COLUMNS;
        setColumns(savedColumns, false);

        if (!parsed || !Array.isArray(parsed.cells) || parsed.cells.length === 0) {
          return false;
        }

        parsed.cells.forEach((item) => {
          if (!item || !item.src) return;
          appendImage(item.src, item.username || '');
        });

        return true;
      } catch (error) {
        console.warn('Failed to restore state.', error);
        setColumns(DEFAULT_COLUMNS, false);
        return false;
      }
    }

    async function init() {
      if ('ResizeObserver' in window) {
        resizeObserver = new ResizeObserver(() => {
          queueFitAllUsernames();
        });
      }

      window.addEventListener('resize', queueFitAllUsernames);

      setColumns(DEFAULT_COLUMNS, false);

      await applyWallpaper();
      cellFallbackFile = await findFirstExisting(CELL_CANDIDATES);

      const restored = restoreState();
      if (!restored && cellFallbackFile) {
        const initialCount = clamp(Number(columnsRange.value) || DEFAULT_COLUMNS, MIN_COLUMNS, MAX_COLUMNS);
        for (let i = 0; i < initialCount; i += 1) {
          appendImage(cellFallbackFile);
        }
      }

      queueFitAllUsernames();
    }

    init();
  </script>
</body>

</html>
