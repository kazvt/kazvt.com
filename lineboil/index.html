<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kazvt</title>
    <meta
      name="description"
      content="kazvt's drawn, DS-art-program-inspired old web personal site with links and live status."
    >
    <meta name="theme-color" content="#ff9d16">
    <meta property="og:title" content="kazvt">
    <meta property="og:description" content="A scribbly old-web link page for kazvt.">
    <meta property="og:image" content="assets/kazvt-transparent.gif">
    <link rel="icon" href="assets/kazvt-transparent.gif">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="home">
    <svg class="boil-filters" aria-hidden="true" focusable="false">
      <filter id="boil-a">
        <feTurbulence baseFrequency="0.012 0.034" numOctaves="2" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
      <filter id="boil-b">
        <feTurbulence baseFrequency="0.018 0.026" numOctaves="2" seed="9" />
        <feDisplacementMap in="SourceGraphic" scale="6" />
      </filter>
      <filter id="boil-c">
        <feTurbulence baseFrequency="0.015 0.04" numOctaves="2" seed="15" />
        <feDisplacementMap in="SourceGraphic" scale="5" />
      </filter>
    </svg>

    <main class="site-wrap boil-stage w-[min(1060px,calc(100%_-_24px))] mx-auto px-0 pt-3 sm:pt-6 lg:pt-8 pb-10" aria-label="kazvt personal site">
      <header class="site-header text-center grid justify-items-center gap-2">
        <p class="tiny-status" data-current-url></p>
        <a class="logo-home" href="#top" aria-label="kazvt home">
          <img class="site-logo" src="assets/kazvt-transparent.gif" alt="kazvt">
        </a>
        <p class="tagline">retro streams, old games, links, live status</p>
      </header>

      <nav class="oldweb-nav scribble-box" aria-label="Main links">
        <a href="#links">links</a>
        <a href="#profile">profile</a>
        <a href="#guestbook">guestbook</a>
        <a href="multistream-guide.html">multistream guide</a>
        <a href="#paint">paint</a>
        <a href="#badges">badges</a>
      </nav>

      <div class="marquee scribble-box" aria-label="Site notice">
        <span data-marquee-text></span>
      </div>

      <section class="web-grid grid grid-cols-1 lg:grid-cols-[180px_minmax(0,1fr)_180px] gap-3.5 items-start">
        <aside class="sidebar scribble-box">
          <h2>palette</h2>
          <div class="palette big-palette" aria-label="Color palette">
            <button type="button" data-tool-theme="p1" style="--swatch: conic-gradient(#F599C6 0 25%, #FFEA88 0 50%, #7DCCAD 0 75%, #4D6787 0)" aria-label="Use pastel stars palette" aria-pressed="true"><span></span></button>
            <button type="button" data-tool-theme="p2" style="--swatch: conic-gradient(#8B2626 0 25%, #EF6905 0 50%, #F1E5A1 0 75%, #486C2F 0)" aria-label="Use campfire checker palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p3" style="--swatch: conic-gradient(#1D4533 0 25%, #F7EAE0 0 50%, #F9D2BA 0 75%, #5E3122 0)" aria-label="Use forest vines palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p4" style="--swatch: conic-gradient(#30AFFF 0 25%, #92EEFF 0 50%, #D8FFC5 0 75%, #C4F7CA 0)" aria-label="Use ocean bubbles palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p5" style="--swatch: conic-gradient(#133458 0 25%, #838921 0 50%, #D99B21 0 75%, #FAF7BB 0)" aria-label="Use night map palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p6" style="--swatch: conic-gradient(#FEF2A0 0 25%, #F3CD97 0 50%, #E98B50 0 75%, #BC4F4F 0)" aria-label="Use desert gingham palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p7" style="--swatch: conic-gradient(#524646 0 25%, #A8A492 0 50%, #FCF2E5 0 75%, #EC5B38 0)" aria-label="Use newsprint bricks palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p8" style="--swatch: conic-gradient(#E8F5E9 0 25%, #A5D6A7 0 50%, #66BB6A 0 75%, #1B5E20 0)" aria-label="Use garden vines palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p9" style="--swatch: conic-gradient(#E3F2FD 0 25%, #90CAF9 0 50%, #2196F3 0 75%, #0D47A1 0)" aria-label="Use sky clouds palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p10" style="--swatch: conic-gradient(#5D3140 0 25%, #CF4173 0 50%, #F39399 0 75%, #F6D8BD 0)" aria-label="Use rose curtain palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p11" style="--swatch: conic-gradient(#4E1F6E 0 25%, #3E3E75 0 50%, #45A9A9 0 75%, #98E8DE 0)" aria-label="Use deep circuit palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p12" style="--swatch: conic-gradient(#007DCC 0 25%, #FFB900 0 50%, #D10056 0 75%, #B2054C 0)" aria-label="Use arcade marquee palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p13" style="--swatch: conic-gradient(#E73F1E 0 25%, #FB6C00 0 50%, #F9B637 0 75%, #FFDD9C 0)" aria-label="Use fire stripes palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p14" style="--swatch: conic-gradient(#FED24F 0 25%, #FFF449 0 50%, #B2D959 0 75%, #7EC151 0)" aria-label="Use meadow dots palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p15" style="--swatch: conic-gradient(#F8B2B2 0 25%, #AF719D 0 50%, #8B639B 0 75%, #403D88 0)" aria-label="Use dream checker palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p16" style="--swatch: conic-gradient(#063B00 0 25%, #266210 0 50%, #90B800 0 75%, #E1E100 0)" aria-label="Use swamp terminal palette" aria-pressed="false"><span></span></button>
          </div>
        </aside>

        <div id="app" class="content-stack"></div>

        <aside class="sidebar scribble-box">
          <h2>kaz radio</h2>
          <div id="music-player" class="music-player"></div>
        </aside>
      </section>
    </main>

    <script src="assets/vendor/cursor-effects/browser.js"></script>
    <script src="site.js"></script>
  </body>
</html>
