<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kazvt</title>
    <meta
      name="description"
      content="kazvt's drawn, DS-art-program-inspired old web personal site with links and live status."
    >
    <meta name="theme-color" content="#ff9d16">
    <meta property="og:title" content="kazvt">
    <meta property="og:description" content="A scribbly old-web link page for kazvt.">
    <meta property="og:image" content="assets/kazvt-transparent.gif">
    <link rel="icon" href="assets/kazvt-transparent.gif">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg class="boil-filters" aria-hidden="true" focusable="false">
      <filter id="boil-a">
        <feTurbulence baseFrequency="0.012 0.034" numOctaves="2" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
      <filter id="boil-b">
        <feTurbulence baseFrequency="0.018 0.026" numOctaves="2" seed="9" />
        <feDisplacementMap in="SourceGraphic" scale="6" />
      </filter>
      <filter id="boil-c">
        <feTurbulence baseFrequency="0.015 0.04" numOctaves="2" seed="15" />
        <feDisplacementMap in="SourceGraphic" scale="5" />
      </filter>
    </svg>

    <main class="site-wrap boil-stage w-[min(1060px,calc(100%_-_24px))] mx-auto px-0 pt-3 sm:pt-6 lg:pt-8 pb-10" aria-label="kazvt personal site">
      <header class="site-header text-center grid justify-items-center gap-2">
        <p class="tiny-status">best viewed on desktop</p>
        <a class="logo-home" href="#top" aria-label="kazvt home">
          <img class="site-logo" src="assets/kazvt-transparent.gif" alt="kazvt">
        </a>
        <p class="tagline">retro streams, old games, links, live status</p>
      </header>

      <nav class="oldweb-nav scribble-box" aria-label="Main links">
        <a href="#links">links</a>
        <a href="#profile">profile</a>
        <a href="#guestbook">guestbook</a>
        <a href="#paint">paint</a>
        <a href="#badges">badges</a>
      </nav>

      <div class="marquee scribble-box" aria-label="Site notice">
        <span>welcome to kazvt.com!! links, streams, tiny web magic!!</span>
      </div>

      <section class="web-grid grid grid-cols-1 lg:grid-cols-[180px_minmax(0,1fr)_180px] gap-3.5 items-start">
        <aside class="sidebar scribble-box">
          <h2>palette</h2>
          <div class="palette big-palette" aria-label="Color palette">
            <button type="button" data-tool-theme="p1" style="--swatch: conic-gradient(#302135 0 20%, #ff432f 0 40%, #ff9f18 0 60%, #ffe45c 0 80%, #48cfff 0)" aria-label="Use warm arcade palette" aria-pressed="true"><span></span></button>
            <button type="button" data-tool-theme="p2" style="--swatch: conic-gradient(#1d2b53 0 20%, #ff004d 0 40%, #ffa300 0 60%, #00e436 0 80%, #29adff 0)" aria-label="Use PICO-8 palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p3" style="--swatch: conic-gradient(#081820 0 25%, #346856 0 50%, #88c070 0 75%, #e0f8d0 0)" aria-label="Use Game Boy palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p4" style="--swatch: conic-gradient(#1a1c2c 0 20%, #b13e53 0 40%, #ffcd75 0 60%, #73eff7 0 80%, #f4f4f4 0)" aria-label="Use Sweetie palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p5" style="--swatch: conic-gradient(#1f0e1c 0 20%, #9d303b 0 40%, #e4943a 0 60%, #7ec4c1 0 80%, #f5edba 0)" aria-label="Use NA16 palette" aria-pressed="false"><span></span></button>
            <button type="button" data-tool-theme="p6" style="--swatch: conic-gradient(#0e071b 0 20%, #ea323c 0 40%, #ffa214 0 60%, #99e65f 0 80%, #94fdff 0)" aria-label="Use Endesga palette" aria-pressed="false"><span></span></button>
          </div>
        </aside>

        <div id="app" class="content-stack"></div>

        <aside class="sidebar scribble-box">
          <h2>kaz radio</h2>
          <div id="music-player" class="music-player"></div>
        </aside>
      </section>
    </main>

    <script src="site.js"></script>
  </body>
</html>
