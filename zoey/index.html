    document.documentElement.dataset.zoeyMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on";
  </script>

<body class="zoey-page" data-motion="on" data-audio="off">
  <a class="z-skip-link" href="#constellation" tabindex="-1">Skip to Zoey's star-mail</a>
  <div class="z-galaxy-sky" aria-hidden="true"></div>
  <img class="z-galaxy-motion" src="/zoey/assets/background/starfield-simulation.gif" alt="" width="500" height="400" decoding="async" fetchpriority="low" aria-hidden="true">
  <div class="z-gif-sky" id="gifSky" aria-hidden="true" hidden></div>

  <div class="z-loader" id="fakeLoader">
    <div class="z-loader-window" role="dialog" aria-modal="true" aria-labelledby="loaderTitle">
      <div class="z-titlebar"><span class="z-titlebar-brand"><img class="z-titlebar-icon" src="/zoey/assets/gifs/signal-054.gif?v=20261106-02" width="20" height="20" alt="" aria-hidden="true"><span class="z-titlebar-label">Popup</span></span><span class="z-window-lights" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="z-loader-inner">
        <p id="loaderTitle" class="z-popup-message">Anytime you're ready, Zoey</p>
        <button class="z-enter-button" id="enterGalaxy" type="button" aria-label="Enter Zoey's message">Enter...</button>
      </div>
    </div>
  </div>

  <main class="z-viewport" id="constellation" inert>
    <section class="z-stage" aria-labelledby="pageTitle">
      <img class="z-featured-art" id="featuredArt" src="/zoey/assets/zoey-featured-pirate.png?v=20261109-01" width="481" height="858" alt="Zoey's character in a pirate costume">
      <div class="z-stage-heading">
        <h1 id="pageTitle" tabindex="-1">ZOEY, YOU ARE LOVED<br><span>TO THE MOON + BACK</span></h1>
      </div>

      <div class="z-constellation" id="entryCanvas" role="list" aria-label="Friend star-mail stickers"></div>

      <div id="audioStatus" class="z-visually-hidden" role="status" aria-live="polite" aria-atomic="true">Audio is muted.</div>
    </section>

  </main>
</body>
