name: Refresh generated site files

on:
  push:
    paths:
      - "links.js"
      - "_includes/reward/**"
      - "scripts/build-reward-pages.mjs"
      - "reward/reward.css"
      - "reward/demo/demo.css"
      - "reward/reward.js"
      - "zzz_redirect/template.html"
      - "zzz_redirect/build-shortlinks.mjs"
      - "zzz_assets/emotes/**"
      - "zzz_assets/rewards/*.png"
      - "zzz_assets/rewards/*.PNG"
      - "zzz_assets/rewards/*.gif"
      - "zzz_assets/rewards/*.GIF"
      - "scripts/build-emote-manifest.py"
      - "obs/trivia-rewards-widget/generate-reward-catalog.mjs"
      - "scripts/build-radio-playlist.mjs"
      - "scripts/analyze-radio-loudness.mjs"
      - "radio/normalization.json"
      - "radio/track-metadata.json"
      - "radio/assets/tracks/**"
      - "radio/assets/*.aac"
      - "radio/assets/*.m4a"
      - "radio/assets/*.mp3"
      - "radio/assets/*.ogg"
      - "radio/assets/*.opus"
      - "radio/assets/*.wav"
      - "radio/assets/*.webm"

permissions:
  actions: write
  contents: write

concurrency:
  group: reward-registry-writes
  queue: max

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check whether radio audio files changed
        id: radio_audio
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_audio="$(git diff --name-only "$EVENT_BEFORE" "$PUSH_SHA" -- radio/assets)"
          if printf '%s\n' "$changed_audio" | grep -Eiq '^radio/assets/(tracks/.*\.(aac|m4a|mp3|ogg|opus|wav|webm)|[^/]+\.(aac|m4a|mp3|ogg|opus|wav|webm))$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install FFmpeg for radio loudness analysis
        if: steps.radio_audio.outputs.changed == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Analyze new or changed radio tracks
        if: steps.radio_audio.outputs.changed == 'true'
        run: node scripts/analyze-radio-loudness.mjs --changed-only
      - name: Regenerate generated site data and manifests
        run: |
          node scripts/build-reward-pages.mjs
          node scripts/build-radio-playlist.mjs
          node zzz_redirect/build-shortlinks.mjs
          python scripts/build-emote-manifest.py
          node obs/trivia-rewards-widget/generate-reward-catalog.mjs
      - name: Commit generated files when needed
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh generated site files"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish generated files on GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run jekyll-gh-pages.yml --repo "$GH_REPO" --ref main
