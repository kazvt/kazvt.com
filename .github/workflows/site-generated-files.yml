name: Refresh generated site files

on:
  push:
    paths:
      - "links.js"
      - "_includes/reward/**"
      - "scripts/build-reward-pages.mjs"
      - "reward/reward.css"
      - "reward/demo/demo.css"
      - "reward/reward.js"
      - "zzz_redirect/template.html"
      - "zzz_redirect/build-shortlinks.mjs"
      - "zzz_assets/emotes/**"
      - "zzz_assets/rewards/*.png"
      - "zzz_assets/rewards/*.PNG"
      - "zzz_assets/rewards/*.gif"
      - "zzz_assets/rewards/*.GIF"
      - "scripts/build-emote-manifest.py"
      - "obs/trivia-rewards-widget/generate-reward-catalog.mjs"

permissions:
  actions: write
  contents: write

concurrency:
  group: reward-registry-writes
  queue: max

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate shortlinks, emote manifest, and reward catalogs
        run: |
          node scripts/build-reward-pages.mjs
          node zzz_redirect/build-shortlinks.mjs
          python scripts/build-emote-manifest.py
          node obs/trivia-rewards-widget/generate-reward-catalog.mjs
      - name: Commit generated files when needed
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh generated site files"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish generated files on GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run jekyll-gh-pages.yml --repo "$GH_REPO" --ref main
