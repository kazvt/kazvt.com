name: Issue one reward
run-name: "Reward issuance: ${{ inputs.event_id }}"

on:
  workflow_dispatch:
    inputs:
      username:
        description: Winning user's public username
        required: true
        type: string
      asset_id:
        description: SHA-256 content ID of an available reward PNG
        required: true
        type: string
      event_id:
        description: Stable opaque ID for this game win; reuse it when retrying
        required: true
        type: string
      platform:
        description: Game or stream name
        required: false
        default: stream-game
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: reward-registry-writes
  queue: max

jobs:
  issue:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh the catalog from the reward folder
        run: node obs/trivia-rewards-widget/generate-reward-catalog.mjs

      - name: Validate and record the award
        env:
          REWARD_USERNAME: ${{ inputs.username }}
          REWARD_ASSET_ID: ${{ inputs.asset_id }}
          REWARD_EVENT_ID: ${{ inputs.event_id }}
          REWARD_PLATFORM: ${{ inputs.platform }}
        run: node reward/api/apply-award.mjs

      - name: Commit the ledger update
        shell: bash
        run: |
          git add zzz_assets/rewards/assignments.json zzz_assets/rewards/manifest.json obs/trivia-rewards-widget/rewards.json
          if git diff --cached --quiet; then
            echo "Award was an idempotent retry; registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "reward: issue award for ${REWARD_EVENT_ID:-game win}"
          git push origin HEAD:main
        env:
          REWARD_EVENT_ID: ${{ inputs.event_id }}

      - name: Publish the updated static reward pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run jekyll-gh-pages.yml --repo "$GH_REPO" --ref main
