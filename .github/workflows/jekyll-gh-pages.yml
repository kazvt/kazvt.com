# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate radio playlist from audio files
        run: node scripts/build-radio-playlist.mjs
      - name: Build static reward pages from shared components
        run: node scripts/build-reward-pages.mjs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages enforces a 10-minute deployment ceiling.
          timeout: "600000"
      - name: Brief pause after a timed-out deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry only if this is still the newest commit on the branch
        id: retry_gate
        if: steps.deployment.outcome == 'failure'
        env:
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote "${SERVER_URL}/${REPOSITORY}.git" "$CURRENT_REF")"
          latest_sha="$(awk 'NR == 1 { print $1 }' <<< "$remote_refs")"
          if [[ -z "$latest_sha" ]]; then
            echo "::error::Could not verify the latest branch commit; refusing to hide the failed Pages deployment."
            exit 1
          fi
          if [[ "$latest_sha" == "$CURRENT_SHA" ]]; then
            echo "should_retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer branch commit exists; leaving the deployment slot for its Pages run."
            {
              echo "## Pages attempt superseded"
              echo "The deployment for $CURRENT_SHA failed, but this branch has advanced to $latest_sha. This run will not retry its stale artifact; the newer push run owns deployment."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retry GitHub Pages deployment once
        id: deployment_retry
        if: steps.retry_gate.outputs.should_retry == 'true'
        uses: actions/deploy-pages@v5
        with:
          timeout: "600000"
      - name: Report a second deployment timeout
        if: always() && steps.retry_gate.outputs.should_retry == 'true' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages timed out twice. Open the Pages workflow in Actions and retry after checking its deployment queue."
          exit 1
