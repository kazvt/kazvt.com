<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ff9d16">
    <title>opening link... | kazvt</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <script>
      (() => {
        let theme = "p1";
        try {
          const saved = localStorage.getItem("kazvt-theme");
          if (/^p(?:[1-9]|1[0-6])$/.test(saved || "")) theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/redirect/redirect.css">
    <link rel="stylesheet" href="/shared/cursor-packs.css">
    <link rel="stylesheet" href="/shared/language-dock.css">
  </head>
  <body class="redirect-page">
    <main class="redirect-shell" aria-live="polite">
      <div class="redirect-tape">
        <span>&gt;&gt; opening outside link &lt;&lt;</span>
        <small>kazvt.com</small>
      </div>

      <div class="redirect-stage" aria-hidden="true">
        <div class="redirect-speedlines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="redirect-dots"><b></b><b></b><b></b><b></b></div>
        <div class="redirect-logo-wrap">
          <img class="redirect-logo" src="/zzz_assets/kazvt-transparent.gif" alt="" fetchpriority="high" decoding="async">
        </div>
      </div>

      <div class="redirect-copy">
        <strong data-redirect-status>warping through the old web...</strong>
        <span class="redirect-host" data-redirect-host>loading destination</span>
      </div>
      <div class="redirect-meter" aria-hidden="true"></div>
    </main>

    <noscript><div class="redirect-noscript">javascript is needed for automatic redirects.</div></noscript>

    <script src="/shared/language-dock.js"></script>
    <script src="/links.js"></script>
    <script src="/redirect/redirect.js"></script>
  </body>
</html>
