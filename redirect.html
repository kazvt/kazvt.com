<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ff9d16">
    <title></title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <script>
      (() => {
        let theme = "p1";
        try {
          const saved = localStorage.getItem("kazvt-theme");
          if (/^p(?:[1-9]|1[0-6])$/.test(saved || "")) theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script>
      (() => {
        let lineboil = "on";
        try {
          if (localStorage.getItem("kazvt-lineboil") === "off") lineboil = "off";
        } catch {}
        document.documentElement.dataset.lineboil = lineboil;
      })();
    </script>
    <link rel="stylesheet" href="/redirect/redirect.css">
    <link rel="stylesheet" href="/shared/cursor-packs.css">
    <link rel="stylesheet" href="/shared/language-dock.css">
    <link rel="stylesheet" href="/lineboil-control.css">
  </head>
  <body class="redirect-page" data-page="redirect">
    <main class="redirect-shell" aria-live="polite">
      <div class="redirect-tape">
        <span data-i18n="redirect.banner"></span>
        <small data-i18n="redirect.site"></small>
      </div>

      <div class="redirect-stage" aria-hidden="true">
        <div class="redirect-speedlines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="redirect-dots"><b></b><b></b><b></b><b></b></div>
        <div class="redirect-logo-wrap">
          <img class="redirect-logo" src="/zzz_assets/kazvt-transparent.gif" alt="" fetchpriority="high" decoding="async">
        </div>
      </div>

      <div class="redirect-copy">
        <strong data-redirect-status data-i18n="redirect.status.generic"></strong>
        <span class="redirect-host" data-redirect-host data-i18n="redirect.loading_destination"></span>
      </div>
      <div class="redirect-meter" aria-hidden="true"></div>
    </main>
<script src="/i18n.js"></script>
    <script src="/language-dock.js"></script>
    <script src="/lineboil-control.js"></script>
    <script src="/links.js"></script>
    <script src="/redirect.js"></script>
  </body>
</html>
