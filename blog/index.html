    <script>
      (() => {
        let theme = "p1";
        let lineboil = "off";
        try {
          const savedTheme = localStorage.getItem("kazvt-theme");
          if (/^p(?:[1-9]|1[0-6])$/.test(savedTheme || "")) theme = savedTheme;
          const savedLineboil = localStorage.getItem("kazvt-lineboil");
          if (savedLineboil === "on" || savedLineboil === "off") lineboil = savedLineboil;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.lineboil = lineboil;
        if (navigator.maxTouchPoints > 0 && matchMedia("(pointer: coarse)").matches) {
          document.documentElement.classList.add("touch-device");
        }
      })();
    </script>
