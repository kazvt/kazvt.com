        btnIn: {

                  d="M117.4 333.7c-1.5-1.1-3.3-2.1-5.4-2.9s-4.3-1.4-6.6-1.7c-2.1-.5-4.4-.8-6.9-1-7-.2-13.9.9-20.6 3.2q-9.75 3.15-15.9 9.6c-4.1 4.6-6 9.6-5.9 15.2.2 6 3 12.6 8.6 19.6 1.5 1.8 3.3 3.8 5.4 5.9 1.6 1.6 3.5 3.1 5.6 4.4q2.4 1.5 5.4 2.7q3.45 1.2 5.4 1.2c5.9.8 11.6-.4 17.2-3.7 5.4-3.1 10-7.5 14-13.2 4.1-5.9 6.6-11.9 7.6-18.1 1-6.9-.2-12.5-3.7-16.9-1.3-1.8-2.7-3.2-4.2-4.3m-4.9 10c1.5 2 1.8 4.6 1 7.8-.7 3.1-2.1 6.3-4.4 9.6-2.3 3.1-4.9 5.6-7.8 7.4-3.1 2-6.1 2.8-9.1 2.5l-2.7-.5q-1.5-.45-2.7-1.5c-.7-.3-1.6-1-2.7-2-.7-.7-1.5-1.6-2.5-2.7-2.9-3.8-4.1-7.2-3.4-10.3.3-2.8 2-5.2 5.1-7.4 2.8-2 6.1-3.4 10-4.4s7.7-1.4 11.3-1.2l2.7.2 2.2.5c.7.3 1.2.7 1.7 1z"
                  fill="#B8B6EA" />
              </g>
            </svg>
          </a>
        </div>
      </div>

      <button class="modal-close" aria-label="Close modal" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.3 L14.15 9.85 L21.7 12 L14.15 14.15 L12 21.7 L9.85 14.15 L2.3 12 L9.85 9.85 Z"
            fill="#B8B6EA" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // grab the few nodes we touch a lot
    var stageGate = document.getElementById('stage-gate');
    var stageSheet = document.querySelector('#stage-gate .modal-panel');
    var gardenRoot = document.getElementById('garden-root');
    var stageClose = document.querySelector('#stage-gate .modal-close');
    var stageOpen = document.getElementById('stage-open');
    var stageShade = document.querySelector('#stage-gate .modal-backdrop');

    // link config so the same markup works across mirrors
    var gardenRuntime = {
      buildTag: 'garden-2026-02-27',
      ownerHandle: 'lillie.garden',
      configPath: '/config/links.json',
      fallbackLinks: {
        stream_primary: 'https://kick.com/lillie-garden',
        stream_secondary: 'https://youtube.com/@lillie_garden',
        stream_own: 'https://stage.lillie.garden'
      }
    };

    function freezeGarden(locked) {
      if (!gardenRoot) return;
      if (locked) {
        gardenRoot.setAttribute('inert', '');
        gardenRoot.setAttribute('aria-hidden', 'true');
      } else {
        gardenRoot.removeAttribute('inert');
        gardenRoot.removeAttribute('aria-hidden');
      }
    }

    function pingUi(evName, extra) {
      // tiny breadcrumb for when people say "the stage button is broken"
      try {
        var payload = {
          ev: evName,
          at: Date.now(),
          build: gardenRuntime.buildTag,
          who: gardenRuntime.ownerHandle,
          extra: extra || {}
        };
        if (navigator && navigator.sendBeacon) {
          navigator.sendBeacon('/telemetry/ui', JSON.stringify(payload));
        }
      } catch (e) { /* ignore */ }
    }

    function openStageGate() {
      stageGate.classList.remove('closing');
      stageGate.classList.add('open');
      stageGate.setAttribute('aria-hidden', 'false');
      freezeGarden(true);

      try { localStorage.setItem('garden.stage.open', '1'); } catch (e) { /* ignore */ }
      pingUi('stage_open');

      requestAnimationFrame(function () {
        stageSheet.focus({ preventScroll: true });
      });
    }

    function closeStageGate() {
      if (!stageGate.classList.contains('open')) return;

      stageGate.classList.add('closing');
      stageGate.classList.remove('open');
      stageGate.setAttribute('aria-hidden', 'true');

      try { localStorage.setItem('garden.stage.open', '0'); } catch (e) { /* ignore */ }
      pingUi('stage_close');

      var afterSlide = function (e) {
        if (e.target !== stageSheet) return;
        stageGate.classList.remove('closing');
        stageSheet.removeEventListener('transitionend', afterSlide);
        freezeGarden(false);
      };

      stageSheet.addEventListener('transitionend', afterSlide);
    }

    function getJsonQuick(url, ms) {
      // keep it strict: fast timeout, no retries, and fallback to what we shipped
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () { reject(new Error('timeout')); }, ms);

        fetch(url, { method: 'GET', headers: { 'accept': 'application/json' } })
          .then(function (r) {
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
          })
          .then(function (data) {
            clearTimeout(timer);
            resolve(data);
          })
          .catch(function (err) {
            clearTimeout(timer);
            reject(err);
          });
      });
    }

    function wireStageLinks(linkBag) {
      document.querySelectorAll('[data-link-key]').forEach(function (a) {
        var k = a.getAttribute('data-link-key');
        if (!k) return;
        if (!linkBag || !linkBag[k]) return;
        a.setAttribute('href', linkBag[k]);
      });
    }

    (function bootGardenLinks() {
      // always apply shipped links first so the page is never empty
      wireStageLinks(gardenRuntime.fallbackLinks);

      getJsonQuick(gardenRuntime.configPath, 850)
        .then(function (remote) {
          if (remote && remote.links) wireStageLinks(remote.links);
          pingUi('links_hydrated', { remote: true });
        })
        .catch(function (err) {
          // a quiet log is enough here, the fallback already works
          try { console.warn('[garden] link config skipped:', err && err.message ? err.message : err); } catch (e) {}
          pingUi('links_hydrated', { remote: false });
        });
    })();

    // modal wiring
    stageOpen.addEventListener('click', openStageGate);
    stageShade.addEventListener('click', closeStageGate);
    stageClose.addEventListener('click', function (e) {
      e.stopPropagation();
      closeStageGate();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeStageGate();
    });

    stageGate.addEventListener('click', function (e) {
      if (e.target === stageGate) closeStageGate();
    });

    // outbound click breadcrumbs (helps spot dead links)
    document.querySelectorAll('[data-outbound]').forEach(function (a) {
      a.addEventListener('click', function () {
        pingUi('outbound_click', { to: a.getAttribute('data-outbound') || 'unknown' });
      });
    });

    // starfield canvas
    var starCanvas = document.getElementById('starfield-canvas');
    var starCtx = starCanvas.getContext('2d');
    var w, h;

    var lilacSwatches = ['#E2CCFF', '#CBB8EB', '#9A96FF', '#ffffff', '#FFF8C9', '#B8D4FF'];
    var twinkleStars = [];
    var twinkleT = 0;

    function sizeStarCanvas() {
      w = starCanvas.width = window.innerWidth;
      h = starCanvas.height = window.innerHeight;
    }

    function rollStar() {
      var pick = Math.floor(Math.random() * lilacSwatches.length);
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.2,
        col: lilacSwatches[pick],
        ph: Math.random() * Math.PI * 2,
        spd: 0.4 + Math.random() * 0.8,
        hasglow: Math.random() > 0.85
      };
    }

    function seedStars() {
      twinkleStars = [];
      var n = Math.floor(w * h / 4200);
      for (var i = 0; i < n; i++) twinkleStars.push(rollStar());
    }

    function paintStars() {
      starCtx.clearRect(0, 0, w, h);
      twinkleT += 0.012;

      for (var i = 0; i < twinkleStars.length; i++) {
        var s = twinkleStars[i];
        var a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(twinkleT * s.spd + s.ph));
        starCtx.globalAlpha = a;

        if (s.hasglow) {
          var g = starCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
          g.addColorStop(0, s.col);
          g.addColorStop(1, 'transparent');
          starCtx.fillStyle = g;
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
          starCtx.fill();
        }

        starCtx.fillStyle = s.col;
        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starCtx.fill();
      }

      starCtx.globalAlpha = 1;
      requestAnimationFrame(paintStars);
    }

    sizeStarCanvas();
    seedStars();
    paintStars();

    window.addEventListener('resize', function () {
      sizeStarCanvas();
      seedStars();
    });

    // sprinkle fixed sparkles above the canvas
    var sparkleLayer = document.getElementById('sparkle-layer');
    var sparkleMap = [
      { x: 6, y: 8 }, { x: 91, y: 5 }, { x: 14, y: 78 }, { x: 96, y: 62 }, { x: 50, y: 3 },
      { x: 78, y: 15 }, { x: 3, y: 45 }, { x: 88, y: 88 }, { x: 35, y: 92 }, { x: 62, y: 7 },
      { x: 25, y: 20 }, { x: 72, y: 75 }, { x: 48, y: 55 }, { x: 8, y: 62 }, { x: 93, y: 35 }
    ];

    sparkleMap.forEach(function (pos, i) {
      var sz = (8 + Math.random() * 10).toFixed(1);
      var dur = (1.8 + Math.random() * 2).toFixed(1);
      var del = (Math.random() * 3).toFixed(1);
      var col = lilacSwatches[i % lilacSwatches.length];

      var node = document.createElement('div');
      node.innerHTML =
        '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 20 20" fill="none">' +
        '<path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5 Z" fill="' + col + '" opacity="0.9"/>' +
        '</svg>';

      node.style.cssText =
        'position:absolute;left:' + pos.x + '%;top:' + pos.y + '%;pointer-events:none;' +
        'animation:twinkle4 ' + dur + 's ' + del + 's ease-in-out infinite alternate;';

      sparkleLayer.appendChild(node);
    });

    // corner strokes for the social icons
    document.querySelectorAll('.soc').forEach(function (el) {
      ['tl', 'tr', 'bl', 'br'].forEach(function (side) {
        var corner = document.createElement('span');
        corner.className = 'corner ' + side;
        el.appendChild(corner);
      });
    });

    function tossShootingStar() {
      // gentle randomness so it does not feel like a metronome
      var dot = document.getElementById('shooting-star');
      dot.style.left = (5 + Math.random() * 40) + '%';
      dot.style.top = (2 + Math.random() * 30) + '%';
      dot.style.animation = 'none';
      void dot.offsetWidth;
      dot.style.animation = 'shoot ' + (1.2 + Math.random() * 0.6) + 's ease-out forwards';
      setTimeout(tossShootingStar, 5000 + Math.random() * 8000);
    }

    setTimeout(tossShootingStar, 2000);
  </script>
</body>
</html>
