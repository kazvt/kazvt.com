<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Chat reward</title>
  <link rel="preload" href="/zzz_assets/fonts/SPIRAL.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/reward/reward.css?v=retro-11">
  <script type="module" src="/reward/reward.js?v=retro-11"></script>
</head>
<body>
  <div id="artWallpaper" class="art-wallpaper" aria-hidden="true"></div>
  <main class="reward-card" aria-live="polite">
    <section id="loadingState">
      <h1>Opening reward…</h1>
      <p class="message">One moment.</p>
    </section>
    <section id="rewardState" hidden>
      <img id="rewardImage" class="reward-image" alt="">
      <p id="filename" class="filename"></p>
      <div id="rewardTier" class="tier-badge" data-tier="common" role="img" aria-label="Reward tier">
        <span id="tierIcon" class="tier-icon" aria-hidden="true"></span>
        <span id="tierName" class="tier-name"></span>
        <span class="tier-glint" aria-hidden="true"></span>
      </div>
      <h1 id="recipient"></h1>
      <p id="awardNote" class="award-note"></p>
    </section>
    <section id="errorState" hidden>
      <h1>Reward link unavailable</h1>
      <p id="errorMessage" class="message">Complete link required.</p>
    </section>
  </main>
</body>
</html>
