<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Reward</title>
  <link rel="preload" href="/zzz_assets/fonts/SPIRAL.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/reward/patterns/loading-stars.gif" as="image">
  <link rel="preload" href="/reward/retro/hourglass.gif" as="image">
  <link rel="stylesheet" href="/reward/reward.css?v=retro-46">
  <script type="module" src="/reward/reward.js?v=reward-music-20261016-1"></script>
<link rel="stylesheet" href="/zzz_shared/square-corners.css?v=1">
</head>
<body data-page-state="loading">
  <div id="artWallpaper" class="art-wallpaper" aria-hidden="true"></div>
  <main class="reward-card" aria-live="polite" aria-busy="true">
    <div id="rewardDecals" class="reward-decal-layer" aria-hidden="true"></div>
    <section id="loadingState" class="loading-state" role="status" aria-live="polite" aria-atomic="true">
      <div class="loading-heading">
        <img class="loading-hourglass" src="/reward/retro/hourglass.gif" alt="" width="79" height="79">
        <span class="loading-hourglass-fallback" aria-hidden="true">⌛</span>
        <h1 class="loading-title" aria-label="Loading..."><span class="loading-lineboil">Loading<span class="loading-ellipsis" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></span></h1>
      </div>
      <p id="loadingNote" class="loading-note" hidden></p>
    </section>
    <section id="rewardState" hidden>
      <div id="rewardArtworkMotion" class="reward-artwork-motion">
        <div id="rewardImage" class="reward-image" role="img" aria-label="" draggable="false"></div>
      </div>
      <p id="filename" class="filename"></p>
      <div id="rewardTier" class="tier-badge" data-tier="common" role="img" aria-label="Reward tier">
        <span id="tierIcon" class="tier-icon" aria-hidden="true"></span>
        <span id="tierName" class="tier-name"></span>
      </div>
      <h1 id="recipient"></h1>
      <p id="awardNote" class="award-note"></p>
      <section id="rewardMusic" class="reward-music" hidden aria-label="Generated reward soundtrack">
        <div class="reward-music-heading">
          <h2>Artwork soundtrack</h2>
          <p id="rewardMusicKey" class="reward-music-key">Finding the artwork key…</p>
        </div>
        <p id="rewardMusicInstruments" class="reward-music-instruments"></p>
        <div class="reward-music-controls">
          <button id="rewardMusicToggle" class="reward-music-play" type="button" aria-pressed="false" disabled>▶ Play</button>
          <button id="rewardMusicChords" class="reward-music-track" type="button" aria-pressed="true" disabled>Chords ✓</button>
          <button id="rewardMusicArp" class="reward-music-track" type="button" aria-pressed="true" disabled>Arp ✓</button>
          <label class="reward-music-volume"><span>Vol</span><input id="rewardMusicVolume" type="range" min="0" max="80" value="42" aria-label="Reward music volume" disabled><output id="rewardMusicVolumeValue" for="rewardMusicVolume">42%</output></label>
        </div>
        <p id="rewardMusicStatus" class="reward-music-status" role="status" aria-live="polite">Reading the artwork pixels…</p>
      </section>
      <section id="awardCollection" class="award-collection" hidden aria-labelledby="awardCollectionHeading">
        <h2 id="awardCollectionHeading" class="award-collection-heading"></h2>
        <ul id="awardCollectionGrid" class="award-collection-grid" aria-label="Awards, newest first"></ul>
        <p id="awardCollectionStatus" class="award-collection-status" role="status" hidden></p>
      </section>
      <a id="allRewardsLink" class="all-rewards-link" href="/reward/list/" hidden>
        <svg class="all-rewards-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <rect x="1.5" y="4.5" width="9" height="10"></rect>
          <path d="m3 12 2.5-2.5 2 1.75L9 9.5l1.5 1.5"></path>
          <circle cx="4.25" cy="7.25" r=".75"></circle>
          <path d="M5.5 2h9v10"></path>
        </svg>
        <span>Reward gallery</span>
      </a>
    </section>
    <section id="errorState" hidden>
      <h1>Reward link unavailable</h1>
      <p id="errorMessage" class="message">Complete link required.</p>
    </section>
  </main>
</body>
</html>
