<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A randomized, non-claimable preview of the kazvt.com chat rewards.">
  <meta name="robots" content="noindex,follow">
  <title>Reward demo - kazvt.com</title>
  <link rel="preload" href="/zzz_assets/fonts/SPIRAL.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/reward/patterns/loading-stars.gif" as="image">
  <link rel="preload" href="/reward/retro/hourglass.gif" as="image">
  <link rel="stylesheet" href="/reward/reward.css?v=retro-39">
  <link rel="stylesheet" href="/reward/demo/demo.css?v=demo-4">
  <script type="module" src="/reward/reward.js?v=retro-54"></script>
<link rel="stylesheet" href="/zzz_shared/square-corners.css?v=1">
</head>
<body data-reward-demo data-page-state="loading">
  <div id="artWallpaper" class="art-wallpaper" aria-hidden="true"></div>
  <main class="reward-card reward-demo-card" aria-live="polite" aria-busy="true">
    <div id="rewardDecals" class="reward-decal-layer" aria-hidden="true"></div>
    <section id="loadingState" class="loading-state" role="status" aria-live="polite" aria-atomic="true">
      <div class="loading-heading">
        <img class="loading-hourglass" src="/reward/retro/hourglass.gif" alt="" width="79" height="79">
        <span class="loading-hourglass-fallback" aria-hidden="true">⌛</span>
        <h1 class="loading-title" aria-label="Loading...">Loading<span class="loading-ellipsis" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
      </div>
    </section>
    <section id="rewardState" hidden>
      <div id="rewardArtworkMotion" class="reward-artwork-motion">
        <div id="rewardImage" class="reward-image" role="img" aria-label="" draggable="false"></div>
      </div>
      <p id="filename" class="filename"></p>
      <div id="rewardTier" class="tier-badge" data-tier="common" role="img" aria-label="Demo reward tier">
        <span id="tierIcon" class="tier-icon" aria-hidden="true"></span>
        <span id="tierName" class="tier-name"></span>
      </div>
      <h1 id="recipient"></h1>
      <p id="awardNote" class="award-note">Demo only. No award is issued or attached to this name.</p>
    </section>
    <section id="errorState" hidden>
      <h1>Demo temporarily unavailable</h1>
      <p id="errorMessage" class="message">Couldn't load a demo. Please try again.</p>
    </section>
    <p class="demo-footnote" hidden>The name and artwork are randomized. Nothing is assigned or saved.</p>
  </main>
</body>
</html>
