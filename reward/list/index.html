<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Awards — kazvt</title>
  <link rel="preload" href="/zzz_assets/fonts/SPIRAL.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/reward/list/list.css?v=compact-pool-readout-20261017-1">
  <script type="module" src="/reward/list/list.js?v=compact-pool-readout-20261017-1"></script>
<link rel="stylesheet" href="/zzz_shared/square-corners.css?v=1">
</head>
<body>
  <main class="index-shell">
    <header class="page-header">
      <a class="back-link" href="/reward/">&larr; rewards</a>
      <div class="archive-stickers" aria-hidden="true">
        <img class="archive-sticker archive-sticker--chest" src="/reward/list/gifcities/M72S62BMGK2EW4YHWEYTFXRTSM7HYERH.gif" alt="" width="90" height="60">
        <img class="archive-sticker archive-sticker--star" src="/reward/list/gifcities/C2VUVFZAMAM22S3B5P3ZNSEUH623I3MK.gif" alt="" width="35" height="36">
        <img class="archive-sticker archive-sticker--trophy" src="/reward/list/gifcities/LHPZYDHWQZWA5QMMAVSBTJNP6CADGLMP.gif" alt="" width="60" height="92">
        <img class="archive-sticker archive-sticker--star" src="/reward/list/gifcities/C2VUVFZAMAM22S3B5P3ZNSEUH623I3MK.gif" alt="" width="35" height="36">
        <img class="archive-sticker archive-sticker--chest" src="/reward/list/gifcities/M72S62BMGK2EW4YHWEYTFXRTSM7HYERH.gif" alt="" width="90" height="60">
      </div>
      <h1 id="pageTitle">Awards</h1>
      <div class="pool-readout">
        <div id="poolMeter" class="pool-meter" role="progressbar" aria-label="Unique rewards remaining in the pool" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="Loading reward pool">
          <span id="poolMeterFill" class="pool-meter-fill" aria-hidden="true"></span>
        </div>
        <p id="poolStatus" class="pool-status" role="status" aria-live="polite">… left</p>
      </div>
    </header>

    <section class="search-panel" aria-labelledby="search-label">
      <label id="search-label" class="visually-hidden" for="awardSearch">Search awards</label>
      <div class="search-row">
        <input id="awardSearch" type="search" autocomplete="off" spellcheck="false"
          placeholder="Search…" aria-controls="awardList">
        <button id="clearSearch" class="clear-button" type="button" hidden>Clear</button>
      </div>
      <p id="resultStatus" class="result-status" role="status" aria-live="polite">Loading…</p>
    </section>

    <section id="awardList" class="award-list" aria-label="Assigned awards" aria-busy="true"></section>
    <p id="emptyState" class="empty-state" hidden>No matches.</p>
    <p id="errorState" class="error-state" role="alert" hidden>Couldn’t load awards. Refresh.</p>
  </main>
</body>
</html>
