<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CubePaint Gallery</title>
    <meta name="description" content="A small CubePaint gallery for sharing animated creations and short creator notes." />
    <meta name="theme-color" content="#140306" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CubePaint" />
    <meta property="og:title" content="CubePaint Gallery" />
    <meta property="og:description" content="A small CubePaint gallery for sharing animated creations and short creator notes." />
    <meta property="og:image" content="thumbnail.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CubePaint Gallery" />
    <meta name="twitter:description" content="A small CubePaint gallery for sharing animated creations and short creator notes." />
    <meta name="twitter:image" content="thumbnail.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <style>
        @font-face {
            font-family: "Monaspace Krypton Frozen";
            font-style: normal;
            font-display: swap;
            font-weight: 400;
            src: url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-400-normal.woff2") format("woff2"),
                 url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-400-normal.woff") format("woff");
        }

        @font-face {
            font-family: "Monaspace Krypton Frozen";
            font-style: normal;
            font-display: swap;
            font-weight: 700;
            src: url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-700-normal.woff2") format("woff2"),
                 url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-700-normal.woff") format("woff");
        }

        @font-face {
            font-family: "Monaspace Krypton Frozen";
            font-style: normal;
            font-display: swap;
            font-weight: 900;
            src: url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-700-normal.woff2") format("woff2"),
                 url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-700-normal.woff") format("woff");
        }

        :root {
            --font-main: "Monaspace Krypton Frozen", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --paper: #fff6d8;
            --paper2: #efe0b8;
            --paper3: #dfc995;
            --ink: #140306;
            --ink2: #2a070c;
            --accent: #9d3d2c;
            --line: #140306;
            --shadow: rgba(20, 3, 6, 0.35);
            --checker1: #ead9ad;
            --checker2: #fff6d8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-main);
            font-feature-settings: "calt" 1, "liga" 1, "ss01" 1, "ss02" 1, "ss03" 1;
            letter-spacing: 0.03em;
        }

        a {
            color: inherit;
        }

        .gallery-app {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .gallery-top {
            border-bottom: 3px solid var(--line);
            background: var(--ink);
            color: var(--paper);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            font-weight: 900;
        }

        .brand-wrap {
            display: grid;
            gap: 3px;
            line-height: 1;
        }

        .brand {
            letter-spacing: 0.09em;
            white-space: nowrap;
        }

        .brand-sub {
            color: var(--paper2);
            font-size: 9px;
            letter-spacing: 0.14em;
        }

        .gallery-title {
            justify-self: center;
            border: 2px solid var(--paper);
            padding: 5px 12px;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .back-link {
            min-height: 32px;
            border: 2px solid var(--paper);
            display: grid;
            place-items: center;
            padding: 0 10px;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.08em;
            box-shadow: 0 3px 0 rgba(255, 246, 216, 0.28);
        }

        .back-link:hover,
        .back-link:focus-visible {
            background: var(--paper);
            color: var(--ink);
        }

        main {
            min-width: 0;
            padding: 12px;
            display: grid;
            align-content: start;
            gap: 12px;
        }

        .gallery-note {
            border: 3px solid var(--line);
            background: var(--paper2);
            box-shadow: 0 5px 0 var(--ink);
            padding: 10px;
            font-size: 11px;
            font-weight: 900;
            line-height: 1.5;
        }

        .gallery-grid {
            min-width: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            align-items: start;
        }

        .gallery-card {
            min-width: 0;
            border: 3px solid var(--line);
            background: var(--paper2);
            box-shadow: 0 5px 0 var(--ink);
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        .creation-frame {
            background:
                linear-gradient(45deg, var(--checker1) 25%, transparent 25%),
                linear-gradient(-45deg, var(--checker1) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--checker1) 75%),
                linear-gradient(-45deg, transparent 75%, var(--checker1) 75%),
                var(--checker2);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            border-bottom: 3px solid var(--line);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr) 30px;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 6px;
            align-items: center;
            padding: 8px;
        }

        .creation-media {
            min-width: 0;
            width: 100%;
            height: 100%;
            grid-column: 2;
            grid-row: 1;
            display: grid;
            place-items: center;
            overflow: hidden;
            touch-action: pan-y;
            cursor: zoom-in;
        }

        .creation-media.zoomed {
            cursor: zoom-out;
        }

        .creation-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
            transform: scale(var(--gallery-zoom, 1));
            transform-origin: var(--gallery-origin-x, 50%) var(--gallery-origin-y, 50%);
            transition: transform 90ms linear;
            will-change: transform;
            pointer-events: none;
        }

        .gallery-nav {
            width: 30px;
            min-width: 30px;
            height: 54px;
            border: 2px solid var(--line);
            background: var(--paper2);
            color: var(--ink);
            box-shadow: 0 3px 0 var(--ink);
            display: grid;
            place-items: center;
            cursor: pointer;
            font: inherit;
            font-size: 16px;
            font-weight: 900;
            padding: 0;
            user-select: none;
        }

        .gallery-nav:hover,
        .gallery-nav:focus-visible {
            background: var(--paper);
        }

        .gallery-nav:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink);
        }

        .gallery-nav:disabled {
            opacity: 0.25;
            pointer-events: none;
        }

        .gallery-prev {
            grid-column: 1;
            grid-row: 1;
        }

        .gallery-next {
            grid-column: 3;
            grid-row: 1;
        }

        .gallery-count {
            grid-column: 1 / -1;
            grid-row: 2;
            justify-self: center;
            min-height: 18px;
            border: 2px solid var(--line);
            background: var(--paper2);
            padding: 2px 7px;
            font-size: 9px;
            font-weight: 900;
        }

        .creation-missing {
            width: 100%;
            height: 100%;
            border: 2px dashed var(--line);
            display: grid;
            place-items: center;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            padding: 8px;
            color: var(--ink2);
        }

        .gallery-copy {
            padding: 9px;
            display: grid;
            gap: 7px;
        }

        .gallery-user {
            background: var(--ink);
            color: var(--paper);
            padding: 5px 7px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.08em;
            word-break: break-word;
        }

        .gallery-bio {
            margin: 0;
            white-space: pre-wrap;
            font-size: 11px;
            font-weight: 900;
            line-height: 1.55;
        }

        .empty-state {
            border: 3px dashed var(--line);
            background: var(--paper2);
            padding: 16px;
            text-align: center;
            font-size: 11px;
            font-weight: 900;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 620px) {
            .gallery-top {
                grid-template-columns: 1fr auto;
            }

            .gallery-title {
                grid-column: 1 / -1;
                grid-row: 2;
                justify-self: stretch;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }


        .gallery-app,
        .gallery-top,
        main,
        .gallery-grid,
        .gallery-card,
        .creation-frame,
        .gallery-copy {
            min-width: 0;
        }

        .gallery-grid {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        }

        .gallery-top {
            grid-template-columns: minmax(90px, auto) minmax(0, 1fr) minmax(70px, auto);
        }

        .gallery-title,
        .back-link,
        .brand,
        .brand-sub {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creation-frame {
            grid-template-columns: clamp(24px, 8vw, 30px) minmax(0, 1fr) clamp(24px, 8vw, 30px);
            padding: clamp(6px, 2vw, 8px);
        }

        .gallery-nav {
            width: clamp(24px, 8vw, 30px);
            min-width: clamp(24px, 8vw, 30px);
            height: clamp(42px, 12vw, 54px);
        }

        @media (max-width: 720px) {
            .gallery-top {
                grid-template-columns: 1fr auto;
                gap: 8px;
            }

            .gallery-title {
                grid-column: 1 / -1;
                grid-row: 2;
                justify-self: stretch;
            }

            main {
                padding: 8px;
                gap: 8px;
            }
        }

        @media (max-width: 420px) {
            .gallery-note,
            .gallery-bio,
            .empty-state {
                font-size: 10px;
            }

            .back-link {
                padding: 0 7px;
                font-size: 10px;
            }
        }

    </style>
</head>

<body>
    <div class="gallery-app">
        <header class="gallery-top">
            <div class="brand-wrap">
                <div class="brand">CUBEPAINT</div>
                <div class="brand-sub">GALLERY</div>
            </div>
            <div class="gallery-title">CREATIONS</div>
            <a class="back-link" href="index.html">BACK</a>
        </header>

        <main>
            <div class="gallery-note" id="galleryStatus">folder notes<br>gifs + tiny bio</div>
            <section class="gallery-grid" id="galleryGrid" aria-label="CubePaint gallery"></section>
        </main>
    </div>

    <script>
        const grid = document.getElementById("galleryGrid");
        const statusEl = document.getElementById("galleryStatus");
        const galleryFolders = ["gallery", "/gallery", "./gallery", "."];
        const manifestFile = "!gallery.txt";
        const imagePattern = /\.(gif|png|jpg|jpeg|webp|avif)$/i;

        function cleanLines(text) {
            return text.replace(/\r/g, "").split("\n").map((line) => line.trim()).filter((line) => line && !line.startsWith("#"));
        }

        async function fetchText(path) {
            const response = await fetch(path, { cache: "no-store" });
            if (!response.ok) throw new Error(path);
            return response.text();
        }

        function joinPath(base, file) {
            const cleanBase = String(base || "").replace(/\/$/, "");
            const cleanFile = String(file || "").replace(/^\//, "");
            return cleanBase ? `${cleanBase}/${cleanFile}` : cleanFile;
        }

        function folderFromPath(path) {
            const parts = String(path || "").split("/");
            parts.pop();
            return parts.join("/");
        }

        async function findManifestEntries() {
            for (const folder of galleryFolders) {
                const manifestPath = joinPath(folder, manifestFile);
                try {
                    const text = await fetchText(manifestPath);
                    const base = folderFromPath(manifestPath);
                    const entries = cleanLines(text).map((line) => joinPath(base, line.endsWith(".txt") ? line : `${line}.txt`));
                    if (entries.length) return entries;
                } catch (error) {}
            }
            return [];
        }

        function displayNameFromPath(path) {
            const file = path.split("/").pop() || path;
            return decodeURIComponent(file.replace(/\.txt$/i, "").replace(/[-_]+/g, " "));
        }

        function splitCreationList(value) {
            return value.split(/[,|]/).map((item) => item.trim()).filter(Boolean);
        }

        function parseEntry(path, text) {
            const lines = text.replace(/\r/g, "").split("\n");
            const user = displayNameFromPath(path);
            const base = folderFromPath(path);
            const creations = [];
            const bioLines = [];

            function addCreation(src) {
                const clean = String(src || "").trim();
                if (!imagePattern.test(clean)) return;
                creations.push(/^(https?:|data:|\/)/i.test(clean) ? clean : joinPath(base, clean));
            }

            for (const originalLine of lines) {
                const line = originalLine.trim();
                const match = line.match(/^(gif|gifs|image|images|creation|creations)\s*:\s*(.+)$/i);
                if (match) {
                    splitCreationList(match[2]).forEach(addCreation);
                    continue;
                }
                if (imagePattern.test(line)) {
                    addCreation(line);
                    continue;
                }
                bioLines.push(originalLine);
            }

            if (!creations.length) creations.push(`${path.replace(/\.txt$/i, "")}.gif`);
            return {
                user,
                creations: [...new Set(creations)],
                bio: bioLines.join("\n").trim() || "No note yet."
            };
        }

        function setGalleryImage(frame, img, missing, entry, index) {
            const src = entry.creations[index];
            img.hidden = false;
            missing.hidden = true;
            img.src = src;
            img.alt = `${entry.user} creation ${index + 1}`;
            img.onerror = () => {
                img.hidden = true;
                missing.hidden = false;
                missing.textContent = `${src} not found`;
            };
        }


        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function setMediaZoom(media, scale, x = 50, y = 50) {
            const nextScale = clamp(scale, 1, 3);
            media.dataset.zoom = String(nextScale);
            media.style.setProperty("--gallery-zoom", nextScale.toFixed(3));
            media.style.setProperty("--gallery-origin-x", `${clamp(x, 0, 100).toFixed(2)}%`);
            media.style.setProperty("--gallery-origin-y", `${clamp(y, 0, 100).toFixed(2)}%`);
            media.classList.toggle("zoomed", nextScale > 1.001);
        }

        function resetMediaZoom(media) {
            setMediaZoom(media, 1, 50, 50);
        }

        function mediaPointerPercent(media, event) {
            const rect = media.getBoundingClientRect();
            const x = rect.width ? ((event.clientX - rect.left) / rect.width) * 100 : 50;
            const y = rect.height ? ((event.clientY - rect.top) / rect.height) * 100 : 50;
            return { x: clamp(x, 0, 100), y: clamp(y, 0, 100) };
        }

        function makeCard(entry) {
            const card = document.createElement("article");
            card.className = "gallery-card";
            let index = 0;

            const frame = document.createElement("div");
            frame.className = "creation-frame";

            const prev = document.createElement("button");
            prev.type = "button";
            prev.className = "gallery-nav gallery-prev";
            prev.textContent = "‹";
            prev.title = "previous";

            const next = document.createElement("button");
            next.type = "button";
            next.className = "gallery-nav gallery-next";
            next.textContent = "›";
            next.title = "next";

            const media = document.createElement("div");
            media.className = "creation-media";

            const img = document.createElement("img");
            img.loading = "lazy";
            img.decoding = "async";

            const missing = document.createElement("div");
            missing.className = "creation-missing";
            missing.hidden = true;

            const count = document.createElement("div");
            count.className = "gallery-count";

            function renderMedia() {
                setGalleryImage(frame, img, missing, entry, index);
                resetMediaZoom(media);
                const many = entry.creations.length > 1;
                prev.disabled = !many;
                next.disabled = !many;
                count.textContent = many ? `${index + 1}/${entry.creations.length}` : "1/1";
            }

            prev.addEventListener("click", () => {
                index = (index - 1 + entry.creations.length) % entry.creations.length;
                renderMedia();
            });

            next.addEventListener("click", () => {
                index = (index + 1) % entry.creations.length;
                renderMedia();
            });

            media.addEventListener("wheel", (event) => {
                if (img.hidden) return;
                event.preventDefault();
                const current = Number(media.dataset.zoom || 1) || 1;
                const step = event.deltaY < 0 ? 1.16 : 1 / 1.16;
                const point = mediaPointerPercent(media, event);
                setMediaZoom(media, current * step, point.x, point.y);
            }, { passive: false });

            media.addEventListener("dblclick", () => {
                resetMediaZoom(media);
            });

            media.append(img, missing);
            frame.append(prev, media, next, count);

            const copy = document.createElement("div");
            copy.className = "gallery-copy";

            const user = document.createElement("div");
            user.className = "gallery-user";
            user.textContent = entry.user;

            const bio = document.createElement("p");
            bio.className = "gallery-bio";
            bio.textContent = entry.bio;

            copy.append(user, bio);
            card.append(frame, copy);
            renderMedia();
            return card;
        }

        async function bootGallery() {
            const files = await findManifestEntries();
            if (!files.length) {
                statusEl.innerHTML = "no folder notes<br>add !gallery.txt";
                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.textContent = "no notes found yet";
                grid.append(empty);
                return;
            }

            const entries = [];
            for (const file of files) {
                try {
                    const text = await fetchText(file);
                    entries.push(parseEntry(file, text));
                } catch (error) {}
            }

            if (!entries.length) {
                statusEl.textContent = "no entries loaded";
                return;
            }

            statusEl.innerHTML = `${entries.length} card${entries.length === 1 ? "" : "s"}<br>folder loaded`;
            grid.replaceChildren(...entries.map(makeCard));
        }

        bootGallery();
    </script>
</body>

</html>
