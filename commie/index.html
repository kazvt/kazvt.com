<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>commaker</title>

    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            overflow: auto;
        }

        .app {
            display: grid;
            gap: 12px;
            justify-items: center;
            padding: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #2f2f2f;
            padding: 10px;
            border-radius: 0px;
            flex-wrap: wrap;
            justify-content: center;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        input,
        button {
            background: #1d1d1d;
            color: white;
            border: 1px solid #555;
            border-radius: 0px;
            padding: 7px;
        }

        input[type="color"] {
            padding: 0;
            width: 42px;
            height: 34px;
        }

        button {
            cursor: pointer;
        }

        .pickBtn {
            padding: 7px 9px;
        }

        .stage {
            position: relative;
            padding: 120px;
            overflow: visible;
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            border: 1px solid #555;
            background:
                linear-gradient(45deg, #bbb 25%, transparent 25%),
                linear-gradient(-45deg, #bbb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #bbb 75%),
                linear-gradient(-45deg, transparent 75%, #bbb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #eee;
            max-width: calc(90vw - 240px);
            max-height: calc(80vh - 240px);
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        body.picking,
        body.picking * {
            cursor: crosshair !important;
        }

        #transformBox {
            position: absolute;
            border: 1.5px dashed #00aaff;
            display: none;
            cursor: move;
            z-index: 5;
            pointer-events: auto;
        }

        .handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border: 2px solid #00aaff;
            box-sizing: border-box;
            display: none;
            z-index: 6;
            pointer-events: auto;
            transform: translate(-50%, -50%);
        }

        .handle[data-handle="nw"],
        .handle[data-handle="se"] {
            cursor: nwse-resize;
        }

        .handle[data-handle="ne"],
        .handle[data-handle="sw"] {
            cursor: nesw-resize;
        }

        .handle[data-handle="n"],
        .handle[data-handle="s"] {
            cursor: ns-resize;
        }

        .handle[data-handle="e"],
        .handle[data-handle="w"] {
            cursor: ew-resize;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="controls">
            <input id="upload" type="file" accept="image/*,.gif,.webp">

            <label>
                shadow
                <input id="shadowColor" type="color" value="#000000">
                <button type="button" class="pickBtn" data-pick="shadowColor">pick</button>
            </label>

            <label>
                4px outline
                <input id="outerStrokeColor" type="color" value="#ffffff">
                <button type="button" class="pickBtn" data-pick="outerStrokeColor">pick</button>
            </label>

            <label>
                2px outline
                <input id="innerStrokeColor" type="color" value="#000000">
                <button type="button" class="pickBtn" data-pick="innerStrokeColor">pick</button>
            </label>

            <button id="exportBtn" type="button">Export</button>
        </div>

        <div id="stage" class="stage">
            <canvas id="canvas"></canvas>

            <div id="transformBox"></div>

            <div class="handle" data-handle="nw"></div>
            <div class="handle" data-handle="n"></div>
            <div class="handle" data-handle="ne"></div>
            <div class="handle" data-handle="e"></div>
            <div class="handle" data-handle="se"></div>
            <div class="handle" data-handle="s"></div>
            <div class="handle" data-handle="sw"></div>
            <div class="handle" data-handle="w"></div>
        </div>
    </div>

    <script src="./gif.js"></script>
    <script src="./gif.worker.js"></script>

    <script type="module">
        import { parseGIF, decompressFrames } from "https://esm.sh/gifuct-js@2.1.2";

        const stageEl = document.getElementById("stage");
        const editorCanvas = document.getElementById("canvas");
        const editorCtx = editorCanvas.getContext("2d", { willReadFrequently: true });

        const uploadInput = document.getElementById("upload");
        const shadowPicker = document.getElementById("shadowColor");
        const outerStrokePicker = document.getElementById("outerStrokeColor");
        const innerStrokePicker = document.getElementById("innerStrokeColor");
        const exportButton = document.getElementById("exportBtn");

        const transformBox = document.getElementById("transformBox");
        const resizeHandles = [...document.querySelectorAll(".handle")];

        // These match the little sticker style I was aiming for.
        // Not configurable in the UI yet because three color controls already felt busy.
        const FAT_OUTLINE = 4;
        const THIN_OUTLINE = 2;

        let logoImg = null;
        let shadowImg = null;

        // currentArtwork is either a normal image or a list of already-composed animation frames.
        // I left this fairly plain instead of wrapping it in a class; it is easier to debug in DevTools.
        let currentArtwork = null;
        let heldFrameIndex = null;
        let previewLoop = null;

        let artCenterX = 0;
        let artCenterY = 0;
        let artScaleX = 1;
        let artScaleY = 1;

        let dragKind = null;
        let selectedHandle = null;
        let pointerStart = null;
        let boxStart = null;

        let pickerWaitingForClick = null;

        function newCanvas(width, height) {
            const c = document.createElement("canvas");
            c.width = width;
            c.height = height;
            return c;
        }

        function loadPicture(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();

                img.onload = () => resolve(img);
                img.onerror = () => reject(src);
                img.src = src;
            });
        }

        async function startApp() {
            logoImg = await loadPicture("logo.png");
            shadowImg = await loadPicture("logo_shadow.png");

            editorCanvas.width = Math.max(logoImg.naturalWidth, shadowImg.naturalWidth);
            editorCanvas.height = Math.max(logoImg.naturalHeight, shadowImg.naturalHeight);

            artCenterX = editorCanvas.width / 2;
            artCenterY = editorCanvas.height / 2;

            paint();
        }

        function artworkWidth() {
            return currentArtwork ? currentArtwork.width : 0;
        }

        function artworkHeight() {
            return currentArtwork ? currentArtwork.height : 0;
        }

        function frameIndexFor(artwork) {
            if (heldFrameIndex !== null) {
                return heldFrameIndex;
            }

            const passed = (performance.now() - artwork.startedAt) % artwork.duration;
            let runningTime = 0;

            for (let i = 0; i < artwork.frames.length; i++) {
                runningTime += artwork.frames[i].delay;
                if (passed < runningTime) {
                    return i;
                }
            }

            // Should almost never hit, but GIF timing can be weird, so frame zero is safe enough.
            return 0;
        }

        function artworkSource() {
            if (!currentArtwork) {
                return null;
            }

            if (currentArtwork.frames) {
                const frame = frameIndexFor(currentArtwork);
                return currentArtwork.frames[frame].canvas;
            }

            return currentArtwork.image;
        }

        function updateExportLabel() {
            exportButton.textContent = currentArtwork && currentArtwork.animated ? "Export GIF" : "Export PNG";
        }

        function runPreviewLoop() {
            stopPreviewLoop();

            if (!currentArtwork || !currentArtwork.animated) {
                return;
            }

            const loopOnce = () => {
                paint();
                previewLoop = requestAnimationFrame(loopOnce);
            };

            previewLoop = requestAnimationFrame(loopOnce);
        }

        function stopPreviewLoop() {
            if (previewLoop !== null) {
                cancelAnimationFrame(previewLoop);
                previewLoop = null;
            }
        }

        function drawColoredShadow() {
            const out = newCanvas(editorCanvas.width, editorCanvas.height);
            const outCtx = out.getContext("2d");

            outCtx.drawImage(shadowImg, 0, 0);

            outCtx.globalCompositeOperation = "source-in";
            outCtx.fillStyle = shadowPicker.value;
            outCtx.fillRect(0, 0, out.width, out.height);

            outCtx.globalCompositeOperation = "source-over";
            return out;
        }

        function drawArtworkInsideLogo() {
            const out = newCanvas(editorCanvas.width, editorCanvas.height);
            const outCtx = out.getContext("2d");

            if (!currentArtwork) {
                outCtx.drawImage(logoImg, 0, 0);
                return out;
            }

            const source = artworkSource();

            outCtx.save();
            outCtx.translate(artCenterX, artCenterY);
            outCtx.scale(artScaleX, artScaleY);
            outCtx.drawImage(
                source,
                -artworkWidth() / 2,
                -artworkHeight() / 2
            );
            outCtx.restore();

            // Clip the uploaded image to the logo shape. This is the main trick of the whole page.
            outCtx.globalCompositeOperation = "destination-in";
            outCtx.drawImage(logoImg, 0, 0);

            outCtx.globalCompositeOperation = "source-over";
            return out;
        }

        function makeStickerLayer() {
            const sticker = newCanvas(editorCanvas.width, editorCanvas.height);
            const stickerCtx = sticker.getContext("2d");

            stickerCtx.drawImage(drawColoredShadow(), 0, 0);
            stickerCtx.drawImage(drawArtworkInsideLogo(), 0, 0);

            return sticker;
        }

        function strokeOutside(maskCanvas, amount, color) {
            const out = newCanvas(maskCanvas.width, maskCanvas.height);
            const outCtx = out.getContext("2d");
            const radius = Math.ceil(amount);

            // This brute-force stamp method is not glamorous, but for these small masks it is simple
            // and gives a nice rounded outline without pulling in another dependency.
            for (let y = -radius; y <= radius; y++) {
                for (let x = -radius; x <= radius; x++) {
                    if (x * x + y * y <= radius * radius) {
                        outCtx.drawImage(maskCanvas, x, y);
                    }
                }
            }

            outCtx.globalCompositeOperation = "source-in";
            outCtx.fillStyle = color;
            outCtx.fillRect(0, 0, out.width, out.height);

            outCtx.globalCompositeOperation = "destination-out";
            outCtx.drawImage(maskCanvas, 0, 0);

            outCtx.globalCompositeOperation = "source-over";
            return out;
        }

        function finalArtworkCanvas() {
            const sticker = makeStickerLayer();
            const result = newCanvas(editorCanvas.width, editorCanvas.height);
            const resultCtx = result.getContext("2d");

            resultCtx.drawImage(strokeOutside(sticker, FAT_OUTLINE, outerStrokePicker.value), 0, 0);
            resultCtx.drawImage(strokeOutside(sticker, THIN_OUTLINE, innerStrokePicker.value), 0, 0);
            resultCtx.drawImage(sticker, 0, 0);

            return result;
        }

        function artworkBox() {
            if (!currentArtwork) {
                return null;
            }

            const w = artworkWidth() * artScaleX;
            const h = artworkHeight() * artScaleY;

            return {
                left: artCenterX - w / 2,
                top: artCenterY - h / 2,
                right: artCenterX + w / 2,
                bottom: artCenterY + h / 2,
                width: w,
                height: h
            };
        }

        function canvasPointToStage(x, y) {
            const canvasRect = editorCanvas.getBoundingClientRect();
            const stageRect = stageEl.getBoundingClientRect();

            return {
                x: canvasRect.left - stageRect.left + (x / editorCanvas.width) * canvasRect.width,
                y: canvasRect.top - stageRect.top + (y / editorCanvas.height) * canvasRect.height
            };
        }

        function eventPointOnCanvas(evt) {
            const rect = editorCanvas.getBoundingClientRect();

            return {
                x: (evt.clientX - rect.left) * editorCanvas.width / rect.width,
                y: (evt.clientY - rect.top) * editorCanvas.height / rect.height
            };
        }

        function handleAnchorPoints() {
            const box = artworkBox();
            if (!box) {
                return {};
            }

            const midX = (box.left + box.right) / 2;
            const midY = (box.top + box.bottom) / 2;

            return {
                nw: { x: box.left, y: box.top },
                n: { x: midX, y: box.top },
                ne: { x: box.right, y: box.top },
                e: { x: box.right, y: midY },
                se: { x: box.right, y: box.bottom },
                s: { x: midX, y: box.bottom },
                sw: { x: box.left, y: box.bottom },
                w: { x: box.left, y: midY }
            };
        }

        function refreshTransformOverlay() {
            if (!currentArtwork) {
                transformBox.style.display = "none";
                resizeHandles.forEach(handle => handle.style.display = "none");
                return;
            }

            const box = artworkBox();
            const topLeft = canvasPointToStage(box.left, box.top);
            const bottomRight = canvasPointToStage(box.right, box.bottom);

            transformBox.style.display = "block";
            transformBox.style.left = `${topLeft.x}px`;
            transformBox.style.top = `${topLeft.y}px`;
            transformBox.style.width = `${bottomRight.x - topLeft.x}px`;
            transformBox.style.height = `${bottomRight.y - topLeft.y}px`;

            const points = handleAnchorPoints();

            resizeHandles.forEach(handle => {
                const handleName = handle.dataset.handle;
                const point = canvasPointToStage(points[handleName].x, points[handleName].y);

                handle.style.display = "block";
                handle.style.left = `${point.x}px`;
                handle.style.top = `${point.y}px`;
            });
        }

        function paint() {
            if (!logoImg || !shadowImg) {
                return;
            }

            editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
            editorCtx.drawImage(finalArtworkCanvas(), 0, 0);

            refreshTransformOverlay();
        }

        function fitArtworkOverCanvas() {
            if (!currentArtwork) {
                return;
            }

            // Cover the logo area instead of contain it. This is intentional, even though it means cropping.
            const fit = Math.max(
                editorCanvas.width / artworkWidth(),
                editorCanvas.height / artworkHeight()
            );

            artScaleX = fit;
            artScaleY = fit;
            artCenterX = editorCanvas.width / 2;
            artCenterY = editorCanvas.height / 2;
        }

        async function loadStillImage(file) {
            const objectUrl = URL.createObjectURL(file);
            const img = await loadPicture(objectUrl);

            currentArtwork = {
                type: "image",
                image: img,
                width: img.naturalWidth,
                height: img.naturalHeight,
                animated: false
            };

            fitArtworkOverCanvas();
            updateExportLabel();
            stopPreviewLoop();
            paint();
        }

        function readGifSize(parsed, frames) {
            const width =
                parsed?.lsd?.width ||
                Math.max(...frames.map(frame => frame.dims.left + frame.dims.width));

            const height =
                parsed?.lsd?.height ||
                Math.max(...frames.map(frame => frame.dims.top + frame.dims.height));

            return { width, height };
        }

        function composeGifFrames(rawFrames, width, height) {
            const workCanvas = newCanvas(width, height);
            const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });

            const finishedFrames = [];
            let lastFrame = null;
            let savedCanvasState = null;

            for (const frame of rawFrames) {
                if (lastFrame) {
                    const old = lastFrame.dims;

                    if (lastFrame.disposalType === 2) {
                        workCtx.clearRect(old.left, old.top, old.width, old.height);
                    } else if (lastFrame.disposalType === 3 && savedCanvasState) {
                        workCtx.putImageData(savedCanvasState, 0, 0);
                    }
                }

                savedCanvasState = frame.disposalType === 3
                    ? workCtx.getImageData(0, 0, width, height)
                    : null;

                const patchCanvas = newCanvas(frame.dims.width, frame.dims.height);
                const patchCtx = patchCanvas.getContext("2d");

                const patch = new ImageData(
                    new Uint8ClampedArray(frame.patch),
                    frame.dims.width,
                    frame.dims.height
                );

                patchCtx.putImageData(patch, 0, 0);
                workCtx.drawImage(patchCanvas, frame.dims.left, frame.dims.top);

                const fullFrame = newCanvas(width, height);
                fullFrame.getContext("2d").drawImage(workCanvas, 0, 0);

                finishedFrames.push({
                    canvas: fullFrame,
                    delay: Math.max(20, frame.delay || 100)
                });

                lastFrame = frame;
            }

            return finishedFrames;
        }

        async function loadGifImage(file) {
            const buffer = await file.arrayBuffer();
            const parsed = parseGIF(buffer);
            const rawFrames = decompressFrames(parsed, true);

            console.log("GIF frames decoded:", rawFrames.length);

            if (!rawFrames.length) {
                throw new Error("GIF decoded, but no frames were found.");
            }

            const size = readGifSize(parsed, rawFrames);
            const frames = composeGifFrames(rawFrames, size.width, size.height);
            const duration = frames.reduce((total, frame) => total + frame.delay, 0);

            currentArtwork = {
                type: "gif",
                frames,
                width: size.width,
                height: size.height,
                duration,
                startedAt: performance.now(),
                animated: frames.length > 1
            };

            fitArtworkOverCanvas();
            updateExportLabel();
            paint();

            if (currentArtwork.animated) {
                runPreviewLoop();
            } else {
                stopPreviewLoop();
            }
        }

        async function looksLikeWebp(file) {
            const header = new Uint8Array(await file.slice(0, 12).arrayBuffer());

            const riff = String.fromCharCode(...header.slice(0, 4));
            const webp = String.fromCharCode(...header.slice(8, 12));

            return riff === "RIFF" && webp === "WEBP";
        }

        async function loadWebpImage(file) {
            if (!("ImageDecoder" in window)) {
                throw new Error("This browser does not support ImageDecoder, which is needed for animated WebP import.");
            }

            const canDecodeWebp = await ImageDecoder.isTypeSupported("image/webp");

            if (!canDecodeWebp) {
                throw new Error("This browser's ImageDecoder does not support image/webp.");
            }

            const buffer = await file.arrayBuffer();
            const decoder = new ImageDecoder({
                data: buffer,
                type: "image/webp"
            });

            await decoder.tracks.ready;

            const selectedTrack = decoder.tracks.selectedTrack;
            const totalFrames = selectedTrack.frameCount || 1;

            const frames = [];
            let width = 0;
            let height = 0;

            for (let i = 0; i < totalFrames; i++) {
                const decoded = await decoder.decode({ frameIndex: i });
                const image = decoded.image;

                width = image.displayWidth || image.codedWidth;
                height = image.displayHeight || image.codedHeight;

                const frameCanvas = newCanvas(width, height);
                const frameCtx = frameCanvas.getContext("2d");

                frameCtx.drawImage(image, 0, 0);

                frames.push({
                    canvas: frameCanvas,
                    delay: Math.max(20, image.duration ? image.duration / 1000 : 100)
                });

                image.close();
            }

            decoder.close();

            const duration = frames.reduce((total, frame) => total + frame.delay, 0);

            currentArtwork = {
                type: "webp",
                frames,
                width,
                height,
                duration,
                startedAt: performance.now(),
                animated: frames.length > 1
            };

            fitArtworkOverCanvas();
            updateExportLabel();
            paint();

            if (currentArtwork.animated) {
                runPreviewLoop();
            } else {
                stopPreviewLoop();
            }
        }

        async function looksLikeGif(file) {
            const header = new Uint8Array(await file.slice(0, 6).arrayBuffer());
            const signature = String.fromCharCode(...header);

            return signature === "GIF87a" || signature === "GIF89a";
        }

        uploadInput.addEventListener("change", async () => {
            const file = uploadInput.files[0];
            if (!file) {
                return;
            }

            const isGif = await looksLikeGif(file);
            const isWebp = await looksLikeWebp(file);

            try {
                if (isGif) {
                    await loadGifImage(file);
                } else if (isWebp) {
                    await loadWebpImage(file);
                } else {
                    await loadStillImage(file);
                }
            } catch (err) {
                console.error("Import failed:", err);
                stopPreviewLoop();

                if (isGif) {
                    currentArtwork = null;
                    exportButton.textContent = "GIF import failed";
                    paint();
                    alert("GIF import failed. Check the browser console.");
                    return;
                }

                if (isWebp) {
                    currentArtwork = null;
                    exportButton.textContent = "WebP import failed";
                    paint();
                    alert("Animated WebP import failed. This browser may not support ImageDecoder for WebP.");
                    return;
                }

                alert("Image import failed. Check the browser console.");
            }
        });

        shadowPicker.addEventListener("input", paint);
        outerStrokePicker.addEventListener("input", paint);
        innerStrokePicker.addEventListener("input", paint);

        function startManualColorPick(input) {
            pickerWaitingForClick = input;
            document.body.classList.add("picking");
        }

        function cancelManualColorPick() {
            pickerWaitingForClick = null;
            document.body.classList.remove("picking");
        }

        document.querySelectorAll(".pickBtn").forEach(button => {
            button.addEventListener("click", async evt => {
                evt.preventDefault();
                evt.stopPropagation();

                const targetInput = document.getElementById(button.dataset.pick);

                if (window.EyeDropper) {
                    try {
                        const dropper = new EyeDropper();
                        const result = await dropper.open();

                        targetInput.value = result.sRGBHex;
                        paint();
                        return;
                    } catch (err) {
                        // User probably pressed escape. No need to nag them with an alert.
                        return;
                    }
                }

                // Fallback for browsers without EyeDropper: pick from the canvas only.
                startManualColorPick(targetInput);
            });
        });

        window.addEventListener("pointerdown", evt => {
            if (!pickerWaitingForClick) {
                return;
            }

            evt.preventDefault();
            evt.stopPropagation();

            const rect = editorCanvas.getBoundingClientRect();
            const isInsideCanvas =
                evt.clientX >= rect.left &&
                evt.clientX <= rect.right &&
                evt.clientY >= rect.top &&
                evt.clientY <= rect.bottom;

            if (!isInsideCanvas) {
                cancelManualColorPick();
                return;
            }

            const x = Math.floor((evt.clientX - rect.left) * editorCanvas.width / rect.width);
            const y = Math.floor((evt.clientY - rect.top) * editorCanvas.height / rect.height);

            try {
                const pixel = editorCtx.getImageData(x, y, 1, 1).data;
                const hex = "#" + [pixel[0], pixel[1], pixel[2]]
                    .map(value => value.toString(16).padStart(2, "0"))
                    .join("");

                pickerWaitingForClick.value = hex;
                cancelManualColorPick();
                paint();
            } catch (err) {
                cancelManualColorPick();
            }
        }, true);

        function startMoving(evt) {
            if (pickerWaitingForClick || !currentArtwork) {
                return;
            }

            dragKind = "move";
            selectedHandle = null;
            pointerStart = eventPointOnCanvas(evt);
            boxStart = {
                ...artworkBox(),
                artCenterX,
                artCenterY,
                artScaleX,
                artScaleY
            };

            evt.preventDefault();
        }

        function startResizing(evt, handleName) {
            if (pickerWaitingForClick || !currentArtwork) {
                return;
            }

            dragKind = "resize";
            selectedHandle = handleName;
            pointerStart = eventPointOnCanvas(evt);
            boxStart = {
                ...artworkBox(),
                artCenterX,
                artCenterY,
                artScaleX,
                artScaleY
            };

            evt.preventDefault();
            evt.stopPropagation();
        }

        function updateDrag(evt) {
            if (!currentArtwork || !dragKind) {
                return;
            }

            const p = eventPointOnCanvas(evt);
            const dx = p.x - pointerStart.x;
            const dy = p.y - pointerStart.y;

            if (dragKind === "move") {
                artCenterX = boxStart.artCenterX + dx;
                artCenterY = boxStart.artCenterY + dy;
                paint();
                return;
            }

            let left = boxStart.left;
            let right = boxStart.right;
            let top = boxStart.top;
            let bottom = boxStart.bottom;

            if (selectedHandle.includes("w")) left += dx;
            if (selectedHandle.includes("e")) right += dx;
            if (selectedHandle.includes("n")) top += dy;
            if (selectedHandle.includes("s")) bottom += dy;

            const minSize = 20;

            if (right - left < minSize) {
                if (selectedHandle.includes("w")) left = right - minSize;
                if (selectedHandle.includes("e")) right = left + minSize;
            }

            if (bottom - top < minSize) {
                if (selectedHandle.includes("n")) top = bottom - minSize;
                if (selectedHandle.includes("s")) bottom = top + minSize;
            }

            artCenterX = (left + right) / 2;
            artCenterY = (top + bottom) / 2;
            artScaleX = (right - left) / artworkWidth();
            artScaleY = (bottom - top) / artworkHeight();

            paint();
        }

        function stopDragging() {
            dragKind = null;
            selectedHandle = null;
            pointerStart = null;
            boxStart = null;
        }

        editorCanvas.addEventListener("pointerdown", startMoving);
        transformBox.addEventListener("pointerdown", startMoving);

        resizeHandles.forEach(handle => {
            handle.addEventListener("pointerdown", evt => {
                startResizing(evt, handle.dataset.handle);
            });
        });

        window.addEventListener("pointermove", updateDrag);
        window.addEventListener("pointerup", stopDragging);
        window.addEventListener("pointercancel", stopDragging);

        editorCanvas.addEventListener("wheel", evt => {
            if (!currentArtwork) {
                return;
            }

            evt.preventDefault();

            const p = eventPointOnCanvas(evt);
            const zoom = evt.deltaY < 0 ? 1.06 : 0.94;

            artCenterX = p.x - (p.x - artCenterX) * zoom;
            artCenterY = p.y - (p.y - artCenterY) * zoom;

            artScaleX *= zoom;
            artScaleY *= zoom;

            paint();
        }, { passive: false });

        function downloadBlob(blob, filename) {
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);

            link.download = filename;
            link.href = url;
            link.click();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function flattenFrameForGif(sourceCanvas, transparentRgb) {
            const out = newCanvas(sourceCanvas.width, sourceCanvas.height);
            const outCtx = out.getContext("2d", { willReadFrequently: true });

            outCtx.drawImage(sourceCanvas, 0, 0);

            const imageData = outCtx.getImageData(0, 0, out.width, out.height);
            const data = imageData.data;
            const visibleColors = new Set();

            for (let i = 0; i < data.length; i += 4) {
                const alpha = data[i + 3];

                if (alpha < 128) {
                    data[i] = transparentRgb[0];
                    data[i + 1] = transparentRgb[1];
                    data[i + 2] = transparentRgb[2];
                    data[i + 3] = 255;
                } else {
                    const key = `${data[i]},${data[i + 1]},${data[i + 2]}`;
                    visibleColors.add(key);
                    data[i + 3] = 255;
                }
            }

            outCtx.putImageData(imageData, 0, 0);
            return { canvas: out, visibleColors };
        }

        function pickGifTransparentColor(colorSets) {
            // Bright weird colors are easier to avoid in most user images. Not perfect, but good enough.
            const candidates = [
                [0, 255, 0],
                [255, 0, 255],
                [0, 255, 255],
                [255, 255, 0],
                [255, 0, 0],
                [0, 0, 255]
            ];

            const usedColors = new Set();

            colorSets.forEach(set => {
                set.forEach(color => usedColors.add(color));
            });

            for (const rgb of candidates) {
                const key = `${rgb[0]},${rgb[1]},${rgb[2]}`;
                if (!usedColors.has(key)) {
                    return rgb;
                }
            }

            return [0, 255, 0];
        }

        function gifTransparentNumber(rgb) {
            return (rgb[0] << 16) | (rgb[1] << 8) | rgb[2];
        }

        async function exportAsAnimatedGif() {
            if (!window.GIF) {
                throw new Error("gif.js is missing. Add gif.js before your main script.");
            }

            exportButton.disabled = true;
            exportButton.textContent = "Rendering GIF...";

            const renderedFrames = [];
            const visibleColorSets = [];

            try {
                for (let i = 0; i < currentArtwork.frames.length; i++) {
                    heldFrameIndex = i;
                    renderedFrames.push(finalArtworkCanvas());
                }

                heldFrameIndex = null;

                // First pass: find colors that are actually visible, so we do not pick one as transparency.
                const colorPass = renderedFrames.map(frameCanvas => {
                    const temp = newCanvas(frameCanvas.width, frameCanvas.height);
                    const tempCtx = temp.getContext("2d", { willReadFrequently: true });
                    tempCtx.drawImage(frameCanvas, 0, 0);

                    const imageData = tempCtx.getImageData(0, 0, temp.width, temp.height);
                    const colors = new Set();

                    for (let i = 0; i < imageData.data.length; i += 4) {
                        if (imageData.data[i + 3] >= 128) {
                            colors.add(`${imageData.data[i]},${imageData.data[i + 1]},${imageData.data[i + 2]}`);
                        }
                    }

                    return colors;
                });

                visibleColorSets.push(...colorPass);

                const transparentRgb = pickGifTransparentColor(visibleColorSets);
                const preparedFrames = renderedFrames.map(frameCanvas => {
                    return flattenFrameForGif(frameCanvas, transparentRgb).canvas;
                });

                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    repeat: 0,
                    width: editorCanvas.width,
                    height: editorCanvas.height,
                    workerScript: "./gif.worker.js",
                    transparent: gifTransparentNumber(transparentRgb)
                });

                preparedFrames.forEach((frameCanvas, i) => {
                    gif.addFrame(frameCanvas, {
                        delay: currentArtwork.frames[i].delay,
                        copy: true
                    });
                });

                const blob = await new Promise((resolve, reject) => {
                    gif.on("finished", resolve);
                    gif.on("abort", () => reject(new Error("GIF export aborted.")));
                    gif.render();
                });

                downloadBlob(blob, "export.gif");
            } finally {
                heldFrameIndex = null;
                exportButton.disabled = false;
                updateExportLabel();
                paint();
            }
        }

        function exportAsPng() {
            const out = finalArtworkCanvas();

            const link = document.createElement("a");
            link.download = "export.png";
            link.href = out.toDataURL("image/png");
            link.click();
        }

        exportButton.addEventListener("click", async () => {
            try {
                if (currentArtwork && currentArtwork.animated) {
                    await exportAsAnimatedGif();
                } else {
                    exportAsPng();
                }
            } catch (err) {
                console.error(err);
                exportButton.disabled = false;
                updateExportLabel();
            }
        });

        window.addEventListener("resize", refreshTransformOverlay);
        window.addEventListener("scroll", refreshTransformOverlay, true);

        startApp().catch(() => {
            // Keeping this quiet because I usually run the file before copying the image assets over.
            // alert("Missing logo.png or logo_shadow.png next to this HTML file.");
        });
    </script>
</body>

</html>
