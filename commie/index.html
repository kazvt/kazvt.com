<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>commie</title>

    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            overflow: auto;
        }

        .app {
            display: grid;
            gap: 12px;
            justify-items: center;
            padding: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #2f2f2f;
            padding: 10px;
            border-radius: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        input,
        button {
            background: #1d1d1d;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 7px;
        }

        input[type="color"] {
            padding: 0;
            width: 42px;
            height: 34px;
        }

        button {
            cursor: pointer;
        }

        .pickBtn {
            padding: 7px 9px;
        }

        .stage {
            position: relative;
            padding: 120px;
            overflow: visible;
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            border: 1px solid #555;
            background:
                linear-gradient(45deg, #bbb 25%, transparent 25%),
                linear-gradient(-45deg, #bbb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #bbb 75%),
                linear-gradient(-45deg, transparent 75%, #bbb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #eee;
            max-width: calc(90vw - 240px);
            max-height: calc(80vh - 240px);
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        body.picking,
        body.picking * {
            cursor: crosshair !important;
        }

        #transformBox {
            position: absolute;
            border: 1.5px dashed #00aaff;
            display: none;
            cursor: move;
            z-index: 5;
            pointer-events: auto;
        }

        .handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border: 2px solid #00aaff;
            box-sizing: border-box;
            display: none;
            z-index: 6;
            pointer-events: auto;
            transform: translate(-50%, -50%);
        }

        .handle[data-handle="nw"],
        .handle[data-handle="se"] {
            cursor: nwse-resize;
        }

        .handle[data-handle="ne"],
        .handle[data-handle="sw"] {
            cursor: nesw-resize;
        }

        .handle[data-handle="n"],
        .handle[data-handle="s"] {
            cursor: ns-resize;
        }

        .handle[data-handle="e"],
        .handle[data-handle="w"] {
            cursor: ew-resize;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="controls">
            <input id="upload" type="file" accept="image/*,.gif">

            <label>
                shadow
                <input id="shadowColor" type="color" value="#000000">
                <button type="button" class="pickBtn" data-pick="shadowColor">pick</button>
            </label>

            <label>
                4px outline
                <input id="outerStrokeColor" type="color" value="#ffffff">
                <button type="button" class="pickBtn" data-pick="outerStrokeColor">pick</button>
            </label>

            <label>
                2px outline
                <input id="innerStrokeColor" type="color" value="#000000">
                <button type="button" class="pickBtn" data-pick="innerStrokeColor">pick</button>
            </label>

            <button id="exportBtn" type="button">Export</button>
        </div>

        <div id="stage" class="stage">
            <canvas id="canvas"></canvas>

            <div id="transformBox"></div>

            <div class="handle" data-handle="nw"></div>
            <div class="handle" data-handle="n"></div>
            <div class="handle" data-handle="ne"></div>
            <div class="handle" data-handle="e"></div>
            <div class="handle" data-handle="se"></div>
            <div class="handle" data-handle="s"></div>
            <div class="handle" data-handle="sw"></div>
            <div class="handle" data-handle="w"></div>
        </div>
    </div>

    <script src="./gif.js"></script>

    <script type="module">
        import { parseGIF, decompressFrames } from "https://esm.sh/gifuct-js@2.1.2";
        const stage = document.getElementById("stage");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        const upload = document.getElementById("upload");
        const shadowColor = document.getElementById("shadowColor");
        const outerStrokeColor = document.getElementById("outerStrokeColor");
        const innerStrokeColor = document.getElementById("innerStrokeColor");
        const exportBtn = document.getElementById("exportBtn");

        const transformBox = document.getElementById("transformBox");
        const handles = [...document.querySelectorAll(".handle")];

        const OUTER_STROKE = 4;
        const INNER_STROKE = 2;

        let logo = null;
        let shadow = null;

        /*
            imported can now be:
            {
                type: "image",
                image,
                width,
                height,
                animated: false
            }
    
            or:
    
            {
                type: "gif",
                frames: [{ canvas, delay }],
                width,
                height,
                duration,
                startedAt,
                animated: true
            }
        */
        let imported = null;
        let forcedGifFrameIndex = null;
        let animationLoopId = null;

        let imgX = 0;
        let imgY = 0;
        let imgScaleX = 1;
        let imgScaleY = 1;

        let action = null;
        let activeHandle = null;
        let startPointer = null;
        let startBox = null;

        let pickingColorInput = null;

        function makeCanvas(w, h) {
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            return c;
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(src);
                img.src = src;
            });
        }

        async function init() {
            logo = await loadImage("logo.png");
            shadow = await loadImage("logo_shadow.png");

            canvas.width = Math.max(logo.naturalWidth, shadow.naturalWidth);
            canvas.height = Math.max(logo.naturalHeight, shadow.naturalHeight);

            imgX = canvas.width / 2;
            imgY = canvas.height / 2;

            render();
        }

        function getImportedWidth() {
            return imported ? imported.width : 0;
        }

        function getImportedHeight() {
            return imported ? imported.height : 0;
        }

        function getGifFrameIndex(gifImport) {
            if (forcedGifFrameIndex !== null) return forcedGifFrameIndex;

            const elapsed = (performance.now() - gifImport.startedAt) % gifImport.duration;

            let t = 0;
            for (let i = 0; i < gifImport.frames.length; i++) {
                t += gifImport.frames[i].delay;
                if (elapsed < t) return i;
            }

            return 0;
        }

        function getImportedSource() {
            if (!imported) return null;

            if (imported.type === "gif") {
                const index = getGifFrameIndex(imported);
                return imported.frames[index].canvas;
            }

            return imported.image;
        }

        function updateExportButton() {
            exportBtn.textContent = imported && imported.animated ? "Export GIF" : "Export PNG";
        }

        function startAnimationLoop() {
            stopAnimationLoop();

            if (!imported || !imported.animated) return;

            const tick = () => {
                render();
                animationLoopId = requestAnimationFrame(tick);
            };

            animationLoopId = requestAnimationFrame(tick);
        }

        function stopAnimationLoop() {
            if (animationLoopId !== null) {
                cancelAnimationFrame(animationLoopId);
                animationLoopId = null;
            }
        }

        function drawSolidShadow() {
            const out = makeCanvas(canvas.width, canvas.height);
            const o = out.getContext("2d");

            o.drawImage(shadow, 0, 0);

            o.globalCompositeOperation = "source-in";
            o.fillStyle = shadowColor.value;
            o.fillRect(0, 0, out.width, out.height);

            o.globalCompositeOperation = "source-over";

            return out;
        }

        function drawMaskedImage() {
            const out = makeCanvas(canvas.width, canvas.height);
            const o = out.getContext("2d");

            if (!imported) {
                o.drawImage(logo, 0, 0);
                return out;
            }

            const source = getImportedSource();

            o.save();
            o.translate(imgX, imgY);
            o.scale(imgScaleX, imgScaleY);
            o.drawImage(
                source,
                -getImportedWidth() / 2,
                -getImportedHeight() / 2
            );
            o.restore();

            o.globalCompositeOperation = "destination-in";
            o.drawImage(logo, 0, 0);

            o.globalCompositeOperation = "source-over";

            return out;
        }

        function makeGroup() {
            const group = makeCanvas(canvas.width, canvas.height);
            const g = group.getContext("2d");

            g.drawImage(drawSolidShadow(), 0, 0);
            g.drawImage(drawMaskedImage(), 0, 0);

            return group;
        }

        function outsideStroke(mask, size, color) {
            const out = makeCanvas(mask.width, mask.height);
            const o = out.getContext("2d");
            const r = Math.ceil(size);

            for (let y = -r; y <= r; y++) {
                for (let x = -r; x <= r; x++) {
                    if (x * x + y * y <= r * r) {
                        o.drawImage(mask, x, y);
                    }
                }
            }

            o.globalCompositeOperation = "source-in";
            o.fillStyle = color;
            o.fillRect(0, 0, out.width, out.height);

            o.globalCompositeOperation = "destination-out";
            o.drawImage(mask, 0, 0);

            o.globalCompositeOperation = "source-over";

            return out;
        }

        function finalImage() {
            const group = makeGroup();

            const result = makeCanvas(canvas.width, canvas.height);
            const r = result.getContext("2d");

            r.drawImage(outsideStroke(group, OUTER_STROKE, outerStrokeColor.value), 0, 0);
            r.drawImage(outsideStroke(group, INNER_STROKE, innerStrokeColor.value), 0, 0);
            r.drawImage(group, 0, 0);

            return result;
        }

        function getImageBox() {
            if (!imported) return null;

            const w = getImportedWidth() * imgScaleX;
            const h = getImportedHeight() * imgScaleY;

            return {
                left: imgX - w / 2,
                top: imgY - h / 2,
                right: imgX + w / 2,
                bottom: imgY + h / 2,
                width: w,
                height: h
            };
        }

        function canvasToStagePoint(x, y) {
            const canvasRect = canvas.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();

            return {
                x: canvasRect.left - stageRect.left + (x / canvas.width) * canvasRect.width,
                y: canvasRect.top - stageRect.top + (y / canvas.height) * canvasRect.height
            };
        }

        function pointerToCanvas(e) {
            const rect = canvas.getBoundingClientRect();

            return {
                x: (e.clientX - rect.left) * canvas.width / rect.width,
                y: (e.clientY - rect.top) * canvas.height / rect.height
            };
        }

        function getHandlePoints() {
            const b = getImageBox();
            if (!b) return {};

            const cx = (b.left + b.right) / 2;
            const cy = (b.top + b.bottom) / 2;

            return {
                nw: { x: b.left, y: b.top },
                n: { x: cx, y: b.top },
                ne: { x: b.right, y: b.top },
                e: { x: b.right, y: cy },
                se: { x: b.right, y: b.bottom },
                s: { x: cx, y: b.bottom },
                sw: { x: b.left, y: b.bottom },
                w: { x: b.left, y: cy }
            };
        }

        function updateOverlay() {
            if (!imported) {
                transformBox.style.display = "none";
                handles.forEach(h => h.style.display = "none");
                return;
            }

            const b = getImageBox();

            const topLeft = canvasToStagePoint(b.left, b.top);
            const bottomRight = canvasToStagePoint(b.right, b.bottom);

            transformBox.style.display = "block";
            transformBox.style.left = `${topLeft.x}px`;
            transformBox.style.top = `${topLeft.y}px`;
            transformBox.style.width = `${bottomRight.x - topLeft.x}px`;
            transformBox.style.height = `${bottomRight.y - topLeft.y}px`;

            const points = getHandlePoints();

            handles.forEach(handle => {
                const name = handle.dataset.handle;
                const p = canvasToStagePoint(points[name].x, points[name].y);

                handle.style.display = "block";
                handle.style.left = `${p.x}px`;
                handle.style.top = `${p.y}px`;
            });
        }

        function render() {
            if (!logo || !shadow) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(finalImage(), 0, 0);

            updateOverlay();
        }

        function fitImportedToCanvas() {
            if (!imported) return;

            const fit = Math.max(
                canvas.width / getImportedWidth(),
                canvas.height / getImportedHeight()
            );

            imgScaleX = fit;
            imgScaleY = fit;
            imgX = canvas.width / 2;
            imgY = canvas.height / 2;
        }

        async function loadStaticImport(file) {
            const objectUrl = URL.createObjectURL(file);
            const img = await loadImage(objectUrl);

            imported = {
                type: "image",
                image: img,
                width: img.naturalWidth,
                height: img.naturalHeight,
                animated: false
            };

            fitImportedToCanvas();
            updateExportButton();
            stopAnimationLoop();
            render();
        }

        function getGifLogicalSize(parsed, frames) {
            const width =
                parsed?.lsd?.width ||
                Math.max(...frames.map(f => f.dims.left + f.dims.width));

            const height =
                parsed?.lsd?.height ||
                Math.max(...frames.map(f => f.dims.top + f.dims.height));

            return { width, height };
        }

        function composeGifFrames(rawFrames, width, height) {
            const working = makeCanvas(width, height);
            const wctx = working.getContext("2d", { willReadFrequently: true });

            const composed = [];

            let previousFrame = null;
            let restoreData = null;

            for (const frame of rawFrames) {
                if (previousFrame) {
                    const d = previousFrame.dims;

                    if (previousFrame.disposalType === 2) {
                        wctx.clearRect(d.left, d.top, d.width, d.height);
                    } else if (previousFrame.disposalType === 3 && restoreData) {
                        wctx.putImageData(restoreData, 0, 0);
                    }
                }

                restoreData =
                    frame.disposalType === 3
                        ? wctx.getImageData(0, 0, width, height)
                        : null;

                const patch = new ImageData(
                    new Uint8ClampedArray(frame.patch),
                    frame.dims.width,
                    frame.dims.height
                );

                wctx.putImageData(patch, frame.dims.left, frame.dims.top);

                const fullFrame = makeCanvas(width, height);
                fullFrame.getContext("2d").drawImage(working, 0, 0);

                composed.push({
                    canvas: fullFrame,
                    delay: Math.max(20, frame.delay || 100)
                });

                previousFrame = frame;
            }

            return composed;
        }

        async function loadGifImport(file) {
            const buffer = await file.arrayBuffer();

            const parsed = parseGIF(buffer);
            const rawFrames = decompressFrames(parsed, true);

            console.log("GIF frames decoded:", rawFrames.length);

            if (!rawFrames.length) {
                throw new Error("GIF decoded, but no frames were found.");
            }

            const { width, height } = getGifLogicalSize(parsed, rawFrames);
            const frames = composeGifFrames(rawFrames, width, height);
            const duration = frames.reduce((sum, frame) => sum + frame.delay, 0);

            imported = {
                type: "gif",
                frames,
                width,
                height,
                duration,
                startedAt: performance.now(),
                animated: frames.length > 1
            };

            fitImportedToCanvas();
            updateExportButton();

            render();

            if (imported.animated) {
                startAnimationLoop();
            } else {
                stopAnimationLoop();
            }
        }

        async function isGifFile(file) {
            const header = new Uint8Array(await file.slice(0, 6).arrayBuffer());
            const signature = String.fromCharCode(...header);

            return signature === "GIF87a" || signature === "GIF89a";
        }

        upload.addEventListener("change", async () => {
            const file = upload.files[0];
            if (!file) return;

            const isGif = await isGifFile(file);

            try {
                if (isGif) {
                    await loadGifImport(file);
                } else {
                    await loadStaticImport(file);
                }
            } catch (err) {
                console.error("Import failed:", err);

                stopAnimationLoop();

                if (isGif) {
                    imported = null;
                    exportBtn.textContent = "GIF import failed";
                    render();
                    alert("GIF import failed. Check the browser console for the real error.");
                    return;
                }

                alert("Image import failed. Check the browser console.");
            }
        });

        shadowColor.addEventListener("input", render);
        outerStrokeColor.addEventListener("input", render);
        innerStrokeColor.addEventListener("input", render);

        function startPicking(input) {
            pickingColorInput = input;
            document.body.classList.add("picking");
        }

        function stopPicking() {
            pickingColorInput = null;
            document.body.classList.remove("picking");
        }

        document.querySelectorAll(".pickBtn").forEach(button => {
            button.addEventListener("click", async e => {
                e.preventDefault();
                e.stopPropagation();

                const targetInput = document.getElementById(button.dataset.pick);

                if (window.EyeDropper) {
                    try {
                        const eyeDropper = new EyeDropper();
                        const result = await eyeDropper.open();

                        targetInput.value = result.sRGBHex;
                        render();
                        return;
                    } catch (err) {
                        return;
                    }
                }

                startPicking(targetInput);
            });
        });

        window.addEventListener("pointerdown", e => {
            if (!pickingColorInput) return;

            e.preventDefault();
            e.stopPropagation();

            const rect = canvas.getBoundingClientRect();

            const inside =
                e.clientX >= rect.left &&
                e.clientX <= rect.right &&
                e.clientY >= rect.top &&
                e.clientY <= rect.bottom;

            if (!inside) {
                stopPicking();
                return;
            }

            const x = Math.floor((e.clientX - rect.left) * canvas.width / rect.width);
            const y = Math.floor((e.clientY - rect.top) * canvas.height / rect.height);

            try {
                const pixel = ctx.getImageData(x, y, 1, 1).data;

                const hex =
                    "#" +
                    [pixel[0], pixel[1], pixel[2]]
                        .map(v => v.toString(16).padStart(2, "0"))
                        .join("");

                pickingColorInput.value = hex;
                stopPicking();
                render();
            } catch (err) {
                stopPicking();
            }
        }, true);

        function startMove(e) {
            if (pickingColorInput) return;
            if (!imported) return;

            action = "move";
            activeHandle = null;
            startPointer = pointerToCanvas(e);
            startBox = {
                ...getImageBox(),
                imgX,
                imgY,
                imgScaleX,
                imgScaleY
            };

            e.preventDefault();
        }

        function startScale(e, handleName) {
            if (pickingColorInput) return;
            if (!imported) return;

            action = "scale";
            activeHandle = handleName;
            startPointer = pointerToCanvas(e);
            startBox = {
                ...getImageBox(),
                imgX,
                imgY,
                imgScaleX,
                imgScaleY
            };

            e.preventDefault();
            e.stopPropagation();
        }

        function moveTransform(e) {
            if (!imported || !action) return;

            const p = pointerToCanvas(e);
            const dx = p.x - startPointer.x;
            const dy = p.y - startPointer.y;

            if (action === "move") {
                imgX = startBox.imgX + dx;
                imgY = startBox.imgY + dy;
                render();
                return;
            }

            let left = startBox.left;
            let right = startBox.right;
            let top = startBox.top;
            let bottom = startBox.bottom;

            if (activeHandle.includes("w")) left += dx;
            if (activeHandle.includes("e")) right += dx;
            if (activeHandle.includes("n")) top += dy;
            if (activeHandle.includes("s")) bottom += dy;

            const minSize = 20;

            if (right - left < minSize) {
                if (activeHandle.includes("w")) left = right - minSize;
                if (activeHandle.includes("e")) right = left + minSize;
            }

            if (bottom - top < minSize) {
                if (activeHandle.includes("n")) top = bottom - minSize;
                if (activeHandle.includes("s")) bottom = top + minSize;
            }

            imgX = (left + right) / 2;
            imgY = (top + bottom) / 2;
            imgScaleX = (right - left) / getImportedWidth();
            imgScaleY = (bottom - top) / getImportedHeight();

            render();
        }

        function endTransform() {
            action = null;
            activeHandle = null;
            startPointer = null;
            startBox = null;
        }

        canvas.addEventListener("pointerdown", startMove);
        transformBox.addEventListener("pointerdown", startMove);

        handles.forEach(handle => {
            handle.addEventListener("pointerdown", e => {
                startScale(e, handle.dataset.handle);
            });
        });

        window.addEventListener("pointermove", moveTransform);
        window.addEventListener("pointerup", endTransform);
        window.addEventListener("pointercancel", endTransform);

        canvas.addEventListener("wheel", e => {
            if (!imported) return;

            e.preventDefault();

            const p = pointerToCanvas(e);
            const zoom = e.deltaY < 0 ? 1.06 : 0.94;

            imgX = p.x - (p.x - imgX) * zoom;
            imgY = p.y - (p.y - imgY) * zoom;

            imgScaleX *= zoom;
            imgScaleY *= zoom;

            render();
        }, { passive: false });

        function downloadBlob(blob, filename) {
            const a = document.createElement("a");
            const url = URL.createObjectURL(blob);

            a.download = filename;
            a.href = url;
            a.click();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function collectVisibleColorsAndPrepareFrame(sourceCanvas, transparentRgb) {
            const out = makeCanvas(sourceCanvas.width, sourceCanvas.height);
            const o = out.getContext("2d", { willReadFrequently: true });

            o.drawImage(sourceCanvas, 0, 0);

            const imageData = o.getImageData(0, 0, out.width, out.height);
            const data = imageData.data;
            const visibleColors = new Set();

            for (let i = 0; i < data.length; i += 4) {
                const alpha = data[i + 3];

                if (alpha < 128) {
                    data[i] = transparentRgb[0];
                    data[i + 1] = transparentRgb[1];
                    data[i + 2] = transparentRgb[2];
                    data[i + 3] = 255;
                } else {
                    const key = `${data[i]},${data[i + 1]},${data[i + 2]}`;
                    visibleColors.add(key);
                    data[i + 3] = 255;
                }
            }

            o.putImageData(imageData, 0, 0);

            return { canvas: out, visibleColors };
        }

        function chooseTransparentColor(visibleColorSets) {
            const candidates = [
                [0, 255, 0],
                [255, 0, 255],
                [0, 255, 255],
                [255, 255, 0],
                [255, 0, 0],
                [0, 0, 255]
            ];

            const used = new Set();

            visibleColorSets.forEach(set => {
                set.forEach(color => used.add(color));
            });

            for (const rgb of candidates) {
                const key = `${rgb[0]},${rgb[1]},${rgb[2]}`;
                if (!used.has(key)) return rgb;
            }

            return [0, 255, 0];
        }

        function rgbToGifTransparentNumber(rgb) {
            return (rgb[0] << 16) | (rgb[1] << 8) | rgb[2];
        }

        async function exportAnimatedGif() {
            if (!window.GIF) {
                throw new Error("gif.js is missing. Add gif.js before your main script.");
            }

            exportBtn.disabled = true;
            exportBtn.textContent = "Rendering GIF...";

            const renderedFrames = [];
            const visibleColorSets = [];

            try {
                for (let i = 0; i < imported.frames.length; i++) {
                    forcedGifFrameIndex = i;
                    const frameCanvas = finalImage();
                    renderedFrames.push(frameCanvas);
                }

                forcedGifFrameIndex = null;

                const firstPass = renderedFrames.map(frameCanvas => {
                    const temp = makeCanvas(frameCanvas.width, frameCanvas.height);
                    const t = temp.getContext("2d", { willReadFrequently: true });
                    t.drawImage(frameCanvas, 0, 0);

                    const imageData = t.getImageData(0, 0, temp.width, temp.height);
                    const set = new Set();

                    for (let i = 0; i < imageData.data.length; i += 4) {
                        if (imageData.data[i + 3] >= 128) {
                            set.add(`${imageData.data[i]},${imageData.data[i + 1]},${imageData.data[i + 2]}`);
                        }
                    }

                    return set;
                });

                visibleColorSets.push(...firstPass);

                const transparentRgb = chooseTransparentColor(visibleColorSets);

                const preparedFrames = renderedFrames.map(frameCanvas => {
                    return collectVisibleColorsAndPrepareFrame(frameCanvas, transparentRgb).canvas;
                });

                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    repeat: 0,
                    width: canvas.width,
                    height: canvas.height,
                    workerScript: "./gif.worker.js",
                    transparent: rgbToGifTransparentNumber(transparentRgb)
                });

                preparedFrames.forEach((frameCanvas, i) => {
                    gif.addFrame(frameCanvas, {
                        delay: imported.frames[i].delay,
                        copy: true
                    });
                });

                const blob = await new Promise((resolve, reject) => {
                    gif.on("finished", resolve);
                    gif.on("abort", () => reject(new Error("GIF export aborted.")));
                    gif.render();
                });

                downloadBlob(blob, "export.gif");
            } finally {
                forcedGifFrameIndex = null;
                exportBtn.disabled = false;
                updateExportButton();
                render();
            }
        }

        function exportPng() {
            const out = finalImage();

            const a = document.createElement("a");
            a.download = "export.png";
            a.href = out.toDataURL("image/png");
            a.click();
        }

        exportBtn.addEventListener("click", async () => {
            try {
                if (imported && imported.animated) {
                    await exportAnimatedGif();
                } else {
                    exportPng();
                }
            } catch (err) {
                console.error(err);
                exportBtn.disabled = false;
                updateExportButton();
            }
        });

        window.addEventListener("resize", updateOverlay);
        window.addEventListener("scroll", updateOverlay, true);

        init().catch(() => {
            // alert("Missing logo.png or logo_shadow.png next to this HTML file.");
        });
    </script>
</body>

</html>
