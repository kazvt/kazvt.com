<!doctype html>
<html lang="en" data-theme="p16" class="radio-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#063b00">
    <title>KAZVT Radio - 銀の血脈</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("kazvt-theme");
        if (/^p(?:[1-9]|1[0-6])$/.test(savedTheme || "")) {
          document.documentElement.dataset.theme = savedTheme;
        }
        if (localStorage.getItem("kazvt-radio-theatre") === "on") {
          document.documentElement.classList.add("radio-theatre");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css?v=username-contrast-20261113">
    <link rel="stylesheet" href="/radio/radio.css?v=radio-theatre-gif-controls-20261113-v12">
    <script defer src="/radio/vendor/butterchurn-2.6.7.min.js"></script>
    <script defer src="/radio/vendor/butterchurn-presets-minimal-2.4.7.min.js"></script>
    <script defer src="/radio/radio.js?v=radio-canvas-fill-20261113"></script>
  </head>
  <body class="radio-page" data-theme="p16">
    <script>
      document.body.dataset.theme = document.documentElement.dataset.theme || "p16";
    </script>
    <div class="radio-site">
      <header class="radio-masthead">
        <a class="radio-home" href="/">KAZVT <span>RADIO</span></a>
        <div class="radio-air-status"><i class="air-lamp"></i><span id="air-status">STANDBY</span></div>
      </header>

      <main>
        <section class="radio-console">
          <div class="visualizer-side">
            <div class="visualizer-heading">
              <div class="visualizer-tools">
                <span class="screen-rec"><i></i> <span id="screen-state">READY</span></span>
                <button class="small-control fullscreen-control" id="visualizer-fullscreen" type="button" data-icon="select" title="Enter theatre mode (F)"></button>
              </div>
            </div>
            <div class="visualizer-bezel" title="Click the picture to play or pause">
              <canvas id="radio-visualizer" width="960" height="520"></canvas>
              <div class="visualizer-fallback" id="visualizer-fallback">
                <span class="fallback-star">✦</span>
                <p>PRESS PLAY</p>
              </div>
              <div class="screen-lines"></div>
            </div>
            <div class="preset-strip">
              <button class="small-control" id="preset-prev" type="button" data-icon="stepback" title="Previous visual"></button>
              <div class="preset-readout"><strong id="preset-name">MILKDROP PRESET</strong></div>
              <button class="small-control" id="preset-next" type="button" data-icon="stepforward" title="Next visual"></button>
            </div>
            <div class="preset-controls">
              <label class="select-wrap">MODE
                <select id="preset-select"><option>Loading visual modes…</option></select>
              </label>
              <button class="small-control shuffle-control" id="preset-random" type="button" data-icon="search" title="Choose a random visual"></button>
              <button class="small-control cycle-control" id="preset-cycle" type="button" data-icon="fastforward" title="Automatic preset changes are off"></button>
              <button class="small-control visuals-control" id="visualizer-toggle" type="button" data-icon="treestatus" title="Pause visuals"></button>
            </div>
          </div>

          <div class="player-side">
            <div class="track-card">
              <h2>銀の血脈</h2>
              <p class="track-artist">本田恭之 <span>/</span> Yasuyuki Honda</p>
            </div>

            <audio id="radio-audio" preload="metadata" src="/radio/assets/gin-no-ketsumyaku-1994.mp3"></audio>
            <div class="transport">
              <button class="transport-button play-button" id="play-toggle" type="button" data-icon="play" title="Play playback (Space)"></button>
              <button class="transport-button" id="restart-track" type="button" data-icon="rewind" title="Restart track (R)"></button>
              <button class="transport-button loop-button" id="loop-toggle" type="button" data-icon="refresh" title="Repeat is off"></button>
              <button class="small-control mute-control" id="mute-toggle" type="button" data-icon="speaker" title="Mute (M)"></button>
            </div>
            <div class="seek-row">
              <span id="time-current">0:00</span>
              <input id="track-seek" type="range" min="0" max="100" value="0">
              <span id="time-total">--:--</span>
            </div>
            <div class="volume-row">
              <span>VOLUME</span>
              <input id="track-volume" type="range" min="0" max="1" step="0.01" value="0.72">
              <span id="volume-value">72%</span>
            </div>
            <p class="player-message" id="player-message"></p>
          </div>
        </section>

        <section class="palette-desk">
          <label class="palette-caption" for="palette-select">PALETTE</label>
          <select class="palette-select" id="palette-select">
            <option value="p1">Palette 01</option><option value="p2">Palette 02</option>
            <option value="p3">Palette 03</option><option value="p4">Palette 04</option>
            <option value="p5">Palette 05</option><option value="p6">Palette 06</option>
            <option value="p7">Palette 07</option><option value="p8">Palette 08</option>
            <option value="p9">Palette 09</option><option value="p10">Palette 10</option>
            <option value="p11">Palette 11</option><option value="p12">Palette 12</option>
            <option value="p13">Palette 13</option><option value="p14">Palette 14</option>
            <option value="p15">Palette 15</option><option value="p16">Palette 16</option>
          </select>
        </section>
      </main>
    </div>
  </body>
</html>
