<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay/Dock Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root {
      --bg: #0b0b0e;
      --panel: #121217;
      --panel2: #16161d;
      --stroke: rgba(255, 255, 255, .10);
      --stroke2: rgba(255, 255, 255, .18);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #fbbf24;
      --accent2: #f59e0b;
      --good: #34d399;
      --bad: #fb7185;
      --selection-bg: rgba(251, 191, 36, .28);
      --selection-text: #0b0b0e;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--selection-text);
    }

    ::-moz-selection {
      background: var(--selection-bg);
      color: var(--selection-text);
    }

    body * {
      border-radius: 0 !important;
    }

    button,
    input {
      box-shadow: none !important;
    }

    button:disabled,
    input:disabled {
      opacity: .55 !important;
      cursor: not-allowed !important;
    }

    input:focus {
      outline: 1px solid var(--stroke2) !important;
      outline-offset: 0px !important;
    }
  </style>
</head>

<body class="min-h-screen" style="background:var(--bg); color:var(--text);">
  <header class="sticky top-0 z-50 backdrop-blur-xl"
    style="background:rgba(11,11,14,.78); border-bottom:1px solid var(--stroke);">
    <div class="mx-auto max-w-6xl px-3 py-3">
      <div class="flex flex-col gap-2">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex items-center gap-3">
            <span class="inline-flex h-9 w-9 items-center justify-center"
              style="background:rgba(251,191,36,.10); border:1px solid rgba(251,191,36,.22);">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"
                style="color:var(--accent);">
                <path
                  d="M4 4a2 2 0 012-2h3a1 1 0 010 2H6v12h8V4h-3a1 1 0 110-2h3a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
                <path
                  d="M7 8a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1zM7 12a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1z" />
              </svg>
            </span>
            <div class="leading-tight">
              <div class="text-sm font-semibold tracking-tight">hazelberry settings</div>
              <div class="text-[11px]" style="color:var(--muted);">paste your previous url here if u wanna recall
                settings</div>
            </div>

            <div id="meta" class="px-2.5 py-1 text-[11px]"
              style="border:1px solid var(--stroke); background:rgba(255,255,255,.03); color:rgba(244,244,245,.9);">
              loadingberry...
            </div>
          </div>

          <div class="flex items-center gap-2">
            <div class="flex overflow-hidden p-0.5"
              style="border:1px solid var(--stroke); background:rgba(255,255,255,.03);">
              <button id="modeOverlay" class="px-3 py-1.5 text-xs font-semibold transition">Overlay</button>
              <button id="modeDock" class="px-3 py-1.5 text-xs font-semibold transition">Dock</button>
            </div>

            <button id="applyBtn" class="px-3 py-2 text-xs font-semibold transition active:scale-[0.99]"
              style="border:1px solid var(--stroke); background:rgba(255,255,255,.03); color:rgba(244,244,245,.9);">
              apply url
            </button>
          </div>
        </div>

        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex w-full items-center gap-2">
            <input id="urlIn" type="text" class="w-full px-3 py-2 font-mono text-xs outline-none transition"
              style="border:1px solid var(--stroke); background:rgba(255,255,255,.03); color:var(--text);"
              placeholder="paste/edit URLberry here (cards update this, apply reads from it)" />

            <button id="copyBtn"
              class="shrink-0 px-3 py-2 text-xs font-semibold transition active:scale-[0.99]"
              style="border:1px solid rgba(251,191,36,.22); background:rgba(251,191,36,.10); color:var(--text);">
              copy
            </button>
          </div>

          <div class="flex w-full items-center gap-2 sm:w-[560px]">
            <div class="relative w-full">
              <input id="search" type="text" class="w-full px-3 py-2 pr-9 text-sm outline-none transition"
                style="border:1px solid var(--stroke); background:rgba(255,255,255,.03); color:var(--text);"
                placeholder="filter params..." />
              <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center" style="color:var(--muted);">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd"
                    d="M9 3a6 6 0 104.472 10.03l2.249 2.249a1 1 0 001.414-1.414l-2.249-2.249A6 6 0 009 3zm-4 6a4 4 0 118 0 4 4 0 01-8 0z"
                    clip-rule="evenodd" />
                </svg>
              </div>
            </div>

            <button id="clearBtn" class="shrink-0 px-3 py-2 text-sm transition active:scale-[0.99]"
              style="border:1px solid var(--stroke); background:rgba(255,255,255,.03); color:rgba(244,244,245,.9);">
              clearberry
            </button>

            <button id="reloadBtn" class="shrink-0 px-3 py-2 text-sm transition active:scale-[0.99]"
              style="border:1px solid var(--stroke); background:rgba(255,255,255,.03); color:rgba(244,244,245,.9);">
              reloadberry
            </button>
          </div>
        </div>

        <div id="err" class="hidden px-3 py-2 text-xs"
          style="border:1px solid rgba(251,113,133,.30); background:rgba(251,113,133,.08); color:rgba(255,228,230,.95);">
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-3 py-4">
    <div id="list" class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
  </main>

  <script>
    (() => {
      const PATHS = { overlay: "./overlay.html", dock: "./dock.html" };
      const OVERLAY_DEFAULTS = {
        scale: "0.75",
        horizontal: true,
        notime: true,
        smooth: "true",
        compact: true,
        chatonly: true
      };

      let currentMode = "overlay";
      let params = [];
      const state = new Map();
      let busy = false;

      const urlIn = document.getElementById("urlIn");
      const applyBtn = document.getElementById("applyBtn");
      const copyBtn = document.getElementById("copyBtn");
      const list = document.getElementById("list");
      const search = document.getElementById("search");
      const meta = document.getElementById("meta");
      const clearBtn = document.getElementById("clearBtn");
      const modeOverlay = document.getElementById("modeOverlay");
      const modeDock = document.getElementById("modeDock");
      const reloadBtn = document.getElementById("reloadBtn");
      const errBox = document.getElementById("err");

      function showErr(msg) {
        errBox.textContent = msg;
        errBox.classList.remove("hidden");
      }
      function clearErr() {
        errBox.classList.add("hidden");
        errBox.textContent = "";
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, s =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[s])
        );
      }

      function getTargetPath() {
        return PATHS[currentMode] || PATHS.overlay;
      }

      function setBusy(v) {
        busy = v;
        const dis = !!v;
        modeOverlay.disabled = dis;
        modeDock.disabled = dis;
        applyBtn.disabled = dis;
        copyBtn.disabled = dis;
        reloadBtn.disabled = dis;
        clearBtn.disabled = dis;
        search.disabled = dis;
        urlIn.disabled = dis;

        const btnOn = "bg-white/10 text-white";
        const btnOff = "text-zinc-300 hover:bg-white/10";
        const btnDis = "opacity-50 cursor-not-allowed";

        modeOverlay.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "overlay" ? btnOn : btnOff) + (dis ? " " + btnDis : "");
        modeDock.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "dock" ? btnOn : btnOff) + (dis ? " " + btnDis : "");

        list.classList.toggle("opacity-50", dis);
        list.classList.toggle("pointer-events-none", dis);
      }

      async function getScanText() {
        const primary = getTargetPath();
        const primaryRes = await fetch(primary, { cache: "no-store" });
        if (primaryRes.ok) return await primaryRes.text();

        if (currentMode !== "overlay") {
          const fallbackRes = await fetch(PATHS.overlay, { cache: "no-store" });
          if (fallbackRes.ok) {
            meta.textContent = `Dock missing (${primaryRes.status}); scanned overlay.html`;
            return await fallbackRes.text();
          }
        }
        throw new Error(`Failed to load ${primary} (HTTP ${primaryRes.status})`);
      }

      function parseParamsFromText(text) {
        const hasRe = /urlParams\.has\(\s*['"]([^'"]+)['"]\s*\)/g;
        const getRe = /urlParams\.get\(\s*['"]([^'"]+)['"]\s*\)/g;

        const hasSet = new Set();
        const getSet = new Set();

        for (const m of text.matchAll(hasRe)) hasSet.add(m[1]);
        for (const m of text.matchAll(getRe)) getSet.add(m[1]);

        const detected = Array.from(new Set([...hasSet, ...getSet]))
          .sort((a, b) => a.localeCompare(b))
          .map(name => ({ name, type: getSet.has(name) ? "value" : "flag" }));

        const prev = new Map(state);
        state.clear();
        params = detected;

        for (const p of params) {
          const old = prev.get(p.name);
          state.set(p.name, old ? old : { enabled: false, value: "" });
        }
      }

      function applyOverlayDefaults() {
        if (currentMode !== "overlay") return;
        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;
          if (p.name in OVERLAY_DEFAULTS) {
            const dv = OVERLAY_DEFAULTS[p.name];
            if (p.type === "flag") s.enabled = !!dv;
            else s.value = String(dv);
          }
        }
      }

      function serializeUrlFromState() {
        const base = new URL(getTargetPath(), location.href);
        const sp = new URLSearchParams();

        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;

          if (p.type === "flag") {
            if (s.enabled) sp.set(p.name, "");
          } else {
            const v = (s.value ?? "").trim();
            if (v !== "") sp.set(p.name, v);
          }
        }

        let qs = sp.toString();
        if (qs) qs = qs.replace(/=(&|$)/g, "$1");

        return qs ? (base.origin + base.pathname + "?" + qs) : (base.origin + base.pathname);
      }

      function syncUrlInputFromState() {
        const out = serializeUrlFromState();
        if (!urlIn.matches(":focus")) urlIn.value = out;
      }

      function makeCard(p) {
        const s = state.get(p.name);

        const card = document.createElement("div");
        card.className = "p-3 transition";
        card.style.border = "1px solid var(--stroke)";
        card.style.background = "rgba(255,255,255,.03)";

        const header = document.createElement("div");
        header.className = "flex items-center justify-between gap-2";

        const name = document.createElement("div");
        name.className = "min-w-0";
        const pillStyle = p.type === "flag"
          ? "border:1px solid rgba(56,189,248,.25); background:rgba(56,189,248,.08); color:rgba(224,242,254,.95);"
          : "border:1px solid rgba(251,191,36,.25); background:rgba(251,191,36,.08); color:rgba(254,243,199,.95);";
        name.innerHTML = `
          <div class="truncate text-sm font-semibold">${escapeHtml(p.name)}</div>
          <div class="mt-1 inline-flex items-center gap-1 px-2 py-0.5 text-[10px]" style="${pillStyle}">
            ${p.type === "flag" ? "toggle" : "value"}
          </div>
        `;

        const ctrl = document.createElement("div");
        ctrl.className = "shrink-0";

        if (p.type === "flag") {
          const label = document.createElement("label");
          label.className = "inline-flex cursor-pointer items-center";
          label.innerHTML = `
            <input type="checkbox" class="peer sr-only" ${s.enabled ? "checked" : ""} />
            <span class="relative h-5 w-9 transition" style="background:rgba(255,255,255,.08); border:1px solid var(--stroke);">
              <span class="absolute left-0.5 top-0.5 h-4 w-4 transition" style="background:rgba(255,255,255,.85);"></span>
            </span>
          `;
          const cb = label.querySelector("input");
          const track = label.querySelector("span");
          const knob = track.querySelector("span");

          function paint() {
            if (cb.checked) {
              track.style.background = "rgba(52,211,153,.20)";
              track.style.borderColor = "rgba(52,211,153,.30)";
              knob.style.transform = "translateX(1rem)";
            } else {
              track.style.background = "rgba(255,255,255,.08)";
              track.style.borderColor = "var(--stroke)";
              knob.style.transform = "translateX(0)";
            }
          }

          cb.addEventListener("change", () => {
            s.enabled = cb.checked;
            paint();
            syncUrlInputFromState();
          });

          paint();
          ctrl.appendChild(label);
        }

        header.appendChild(name);
        header.appendChild(ctrl);

        const body = document.createElement("div");
        body.className = "mt-2";

        if (p.type === "value") {
          const inp = document.createElement("input");
          inp.type = "text";
          inp.value = s.value;
          inp.placeholder = "...";
          inp.className = "w-full px-2.5 py-2 text-sm outline-none transition";
          inp.style.border = "1px solid var(--stroke)";
          inp.style.background = "rgba(255,255,255,.03)";
          inp.style.color = "var(--text)";
          inp.addEventListener("input", () => {
            s.value = inp.value;
            syncUrlInputFromState();
          });
          body.appendChild(inp);
        } else {
          const hint = document.createElement("div");
          hint.className = "text-[11px]";
          hint.style.color = "var(--muted)";
          hint.textContent = `Adds ?${p.name}`;
          body.appendChild(hint);
        }

        card.appendChild(header);
        card.appendChild(body);
        return card;
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        list.innerHTML = "";
        for (const p of params) {
          if (q && !p.name.toLowerCase().includes(q)) continue;
          list.appendChild(makeCard(p));
        }
        syncUrlInputFromState();
      }

      function applyFromUrl(raw) {
        clearErr();
        let u;
        try {
          const trimmed = (raw || "").trim();
          if (!trimmed) throw new Error("Paste a URL first.");
          if (trimmed.startsWith("?")) u = new URL(location.origin + location.pathname + trimmed);
          else if (trimmed.startsWith("/")) u = new URL(trimmed, location.origin);
          else u = new URL(trimmed);
        } catch (e) {
          showErr("Invalid URL: " + (e && e.message ? e.message : e));
          return;
        }

        const path = (u.pathname || "").toLowerCase();
        if (path.endsWith("/overlay.html") || path.endsWith("overlay.html")) currentMode = "overlay";
        if (path.endsWith("/dock.html") || path.endsWith("dock.html")) currentMode = "dock";

        const sp = u.searchParams;

        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;
          if (p.type === "flag") s.enabled = sp.has(p.name);
          else s.value = sp.get(p.name) ?? "";
        }

        if (currentMode === "overlay") applyOverlayDefaults();
        setModeUI();
        render();
        meta.textContent = `Applied from URL`;
      }

      function setModeUI() {
        const on = "bg-white/10 text-white";
        const off = "text-zinc-300 hover:bg-white/10";
        const dis = busy ? " opacity-50 cursor-not-allowed" : "";
        modeOverlay.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "overlay" ? on : off) + dis;
        modeDock.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "dock" ? on : off) + dis;
      }

      async function rescanAndRender() {
        clearErr();
        setBusy(true);
        meta.textContent = "retrieving...";
        try {
          const text = await getScanText();
          meta.textContent = "parsing...";
          parseParamsFromText(text);
          if (currentMode === "overlay") applyOverlayDefaults();
          meta.textContent = `Detected ${params.length} params`;
          render();
        } catch (e) {
          params = [];
          state.clear();
          list.innerHTML = "";
          meta.textContent = "No params detected";
          showErr(String(e && e.message ? e.message : e));
        } finally {
          setBusy(false);
          setModeUI();
        }
      }

      async function copyUrl() {
        const text = urlIn.value || "";
        try {
          await navigator.clipboard.writeText(text);
          const old = copyBtn.textContent;
          copyBtn.textContent = "copied";
          copyBtn.style.borderColor = "rgba(52,211,153,.30)";
          copyBtn.style.background = "rgba(52,211,153,.15)";
          setTimeout(() => {
            copyBtn.textContent = old;
            copyBtn.style.borderColor = "rgba(251,191,36,.22)";
            copyBtn.style.background = "rgba(251,191,36,.10)";
          }, 700);
        } catch {
          prompt("Copy URL:", text);
        }
      }

      modeOverlay.addEventListener("click", async () => {
        if (busy) return;
        currentMode = "overlay";
        setModeUI();
        await rescanAndRender();
      });

      modeDock.addEventListener("click", async () => {
        if (busy) return;
        currentMode = "dock";
        setModeUI();
        await rescanAndRender();
      });

      reloadBtn.addEventListener("click", () => { if (!busy) rescanAndRender(); });

      search.addEventListener("input", () => { if (!busy) render(); });

      clearBtn.addEventListener("click", () => {
        if (busy) return;
        search.value = "";
        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;
          s.enabled = false;
          s.value = "";
        }
        if (currentMode === "overlay") applyOverlayDefaults();
        render();
      });

      copyBtn.addEventListener("click", () => { if (!busy) copyUrl(); });

      applyBtn.addEventListener("click", () => { if (!busy) applyFromUrl(urlIn.value); });
      urlIn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !busy) applyFromUrl(urlIn.value);
      });

      setModeUI();
      rescanAndRender().then(() => {
        if (location.search && location.search !== "?") {
          applyFromUrl(location.origin + location.pathname + location.search);
        }
      });
    })();
  </script>
</body>

</html>
