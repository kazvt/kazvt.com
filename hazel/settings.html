<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay/Dock Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root {
      --bg: #050507;

      --panel-1: #0c0c10;
      --panel-2: #101018;

      --surface: rgba(255, 255, 255, .06);
      --surface-hover: rgba(255, 255, 255, .10);

      --border: rgba(255, 255, 255, .18);
      --border-strong: rgba(255, 255, 255, .35);

      --text: #ffffff;
      --muted: rgba(255, 255, 255, .70);

      --accent: #ffd34a;
      --accent-soft: rgba(255, 211, 74, .12);
      --accent-border: rgba(255, 211, 74, .35);

      --good: #34d399;
      --bad: #fb7185;

      --selection-bg: rgba(255, 211, 74, .35);
      --selection-text: #050507;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--selection-text);
    }

    ::-moz-selection {
      background: var(--selection-bg);
      color: var(--selection-text);
    }

    body * {
      border-radius: 0 !important;
    }

    button,
    input {
      box-shadow: none !important;
    }

    button:disabled,
    input:disabled {
      opacity: .55 !important;
      cursor: not-allowed !important;
    }

    input:focus {
      outline: 1px solid var(--border-strong) !important;
      outline-offset: 0px !important;
    }

    @keyframes urlflash {
      0% {
        outline: 2px solid rgba(255, 211, 74, .85);
        box-shadow: 0 0 0 2px rgba(255, 211, 74, .25), 0 0 18px rgba(255, 211, 74, .18);
      }

      100% {
        outline: 0px solid transparent;
        box-shadow: none;
      }
    }

    .url-flash {
      animation: urlflash 220ms ease-out;
    }

    .surface {
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .surface-hover:hover {
      background: var(--surface-hover);
    }

    .panel {
      background: var(--panel-1);
      border: 1px solid var(--border);
    }

    .accent-btn {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--text);
    }
  </style>
</head>

<body class="min-h-screen" style="background:var(--bg); color:var(--text);">
  <header class="sticky top-0 z-50 backdrop-blur-xl"
    style="background:rgba(11,11,14,.78); border-bottom:1px solid var(--border);">
    <div class="mx-auto max-w-6xl px-3 py-3">
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center accent-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"
              style="color:var(--accent);">
              <path
                d="M4 4a2 2 0 012-2h3a1 1 0 010 2H6v12h8V4h-3a1 1 0 110-2h3a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
              <path d="M7 8a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1zM7 12a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1z" />
            </svg>
          </span>
          <div class="leading-tight">
            <div class="text-sm font-semibold tracking-tight">hazelberry settings</div>
            <div class="text-[11px]" style="color:var(--muted);">paste your previous url here if u wanna recall settings
            </div>
          </div>
          <div id="meta" class="px-2.5 py-1 text-[11px] surface">
            loadingberry...
          </div>
        </div>

        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2">
            <span class="text-xs" style="color:var(--muted);">session</span>
            <input id="sessionCode" type="text" class="px-2 py-1 text-xs font-mono outline-none surface"
              placeholder="code" />
          </div>

          <div class="flex overflow-hidden surface">
            <button id="modeOverlay" class="px-3 py-1.5 text-xs font-semibold transition">Overlay</button>
            <button id="modeDock" class="px-3 py-1.5 text-xs font-semibold transition">Dock</button>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex w-full items-center gap-2">
          <input id="urlIn" type="text"
            class="w-full px-3 py-2 font-mono text-xs outline-none transition surface surface-hover"
            placeholder="paste/edit URLberry here (cards update this, apply reads from it)" />
          <button id="copyBtn"
            class="shrink-0 px-3 py-2 text-xs font-semibold transition active:scale-[0.99] accent-btn">
            copy
          </button>
          <button id="resetBtn"
            class="shrink-0 px-3 py-2 text-xs font-semibold transition active:scale-[0.99] surface surface-hover">
            reset
          </button>
        </div>

        <div class="flex w-full items-center gap-2 sm:w-[560px]">
          <div class="relative w-full">
            <input id="search" type="text"
              class="w-full px-3 py-2 pr-9 text-sm outline-none transition surface surface-hover"
              placeholder="filter params..." />
            <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center" style="color:var(--muted);">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                  d="M9 3a6 6 0 104.472 10.03l2.249 2.249a1 1 0 001.414-1.414l-2.249-2.249A6 6 0 009 3zm-4 6a4 4 0 118 0 4 4 0 01-8 0z"
                  clip-rule="evenodd" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div id="err" class="hidden px-3 py-2 text-xs surface surface-hover">
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-3 py-4">
    <div id="list" class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
  </main>
<!-- https://kazvt.com/hazel/overlay.html?session=SH7BmbLRgN&chatonly&compact&font=Bookman Old Style&horizontal&msgmaxchars=75&nodate&notime&overlaymode&scale=0.75&smooth=true& -->
  <script>
    (() => {
      const PATHS = { overlay: "./overlay.html", dock: "./dock.html" };
      const OVERLAY_DEFAULTS = {
        scale: "0.6",
        horizontal: true,
        notime: true,
        nodate: true,
        smooth: "true",
        compact: true,
        chatonly: true,
        font: "Consolas",
        msgmaxchars: 75,
        overlaymode: true,
        delaytime: 1000
      };

      const COOKIE_KEY = "hazelberry_session_v1";
      const LS_KEY = "hazelberry_settings_v1";

      function setCookie(name, value, days = 365) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      }

      function getCookie(name) {
        const match = document.cookie.match(new RegExp(`(?:^|;\\s*)${name}=([^;]*)`));
        return match ? decodeURIComponent(match[1]) : null;
      }

      let currentMode = "overlay";
      let params = [];
      const state = new Map();
      let busy = false;
      let docs = new Map();
      let restoring = false;

      const urlIn = document.getElementById("urlIn");
      const copyBtn = document.getElementById("copyBtn");
      const list = document.getElementById("list");
      const search = document.getElementById("search");
      const meta = document.getElementById("meta");
      const modeOverlay = document.getElementById("modeOverlay");
      const modeDock = document.getElementById("modeDock");
      const errBox = document.getElementById("err");
      const sessionInput = document.getElementById("sessionCode");

      const resetBtn = document.getElementById("resetBtn");

      function resetToDefaults({ keepSession = true, keepMode = false } = {}) {
        if (!keepMode) currentMode = "overlay";

        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;
          s.enabled = false;
          s.value = "";
        }

        if (currentMode === "overlay") applyOverlayDefaults();

        if (!keepSession) sessionInput.value = "";

        setModeUI();
        render();
        syncUrlInputFromState();
        savePrefs();
        meta.textContent = "Reset to defaults";
      }

      resetBtn.addEventListener("click", () => {
        if (busy) return;
        resetToDefaults({ keepSession: true, keepMode: false });
      });

      function savePrefs() {
        const snapshot = {
          mode: currentMode,
          session: sessionInput.value || "",
          url: urlIn.value || "",
          state: Object.fromEntries([...state.entries()].map(([k, v]) => [k, { enabled: !!v.enabled, value: String(v.value ?? "") }])),
          ts: Date.now()
        };
        localStorage.setItem(LS_KEY, JSON.stringify(snapshot));

        setCookie(COOKIE_KEY, sessionInput.value || "");
      }

      let urlEditTimer = null;
      let userEditingUrl = false;

      function showErr(msg) {
        errBox.textContent = msg;
        errBox.classList.remove("hidden");
      }
      function clearErr() {
        errBox.classList.add("hidden");
        errBox.textContent = "";
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, s =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[s])
        );
      }

      function getTargetPath() {
        return PATHS[currentMode] || PATHS.overlay;
      }

      function setUserEditing(v) {
        userEditingUrl = v;
        list.classList.toggle("opacity-50", v);
        list.classList.toggle("pointer-events-none", v);
        if (v) meta.textContent = "editing url...";
      }

      function scheduleApplyFromUrl() {
        if (busy) return;
        setUserEditing(true);
        if (urlEditTimer) clearTimeout(urlEditTimer);
        urlEditTimer = setTimeout(() => {
          setUserEditing(false);
          applyFromUrl(urlIn.value, true);
        }, 2000);
      }

      function setBusy(v) {
        busy = v;
        const dis = !!v;
        modeOverlay.disabled = dis;
        modeDock.disabled = dis;
        copyBtn.disabled = dis;
        search.disabled = dis;
        urlIn.disabled = dis;

        const btnOn = "bg-white/10 text-white";
        const btnOff = "text-zinc-300 hover:bg-white/10";
        const btnDis = "opacity-50 cursor-not-allowed";

        modeOverlay.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "overlay" ? btnOn : btnOff) + (dis ? " " + btnDis : "");
        modeDock.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "dock" ? btnOn : btnOff) + (dis ? " " + btnDis : "");

        list.classList.toggle("opacity-50", dis);
        list.classList.toggle("pointer-events-none", dis);
      }

      async function getScanText() {
        const primary = getTargetPath();
        const primaryRes = await fetch(primary, { cache: "no-store" });
        if (primaryRes.ok) return await primaryRes.text();

        if (currentMode !== "overlay") {
          const fallbackRes = await fetch(PATHS.overlay, { cache: "no-store" });
          if (fallbackRes.ok) {
            meta.textContent = `Dock missing (${primaryRes.status}); scanned overlay.html`;
            return await fallbackRes.text();
          }
        }
        throw new Error(`Failed to load ${primary} (HTTP ${primaryRes.status})`);
      }

      function parseParamsFromText(text) {
        const lines = String(text).replace(/\r\n/g, "\n").split("\n");

        function getAllStringArgs(line) {
          const out = [];
          const re = /urlParams\.(?:has|get)\(\s*['"]([^'"]+)['"]\s*\)/g;
          for (const m of line.matchAll(re)) out.push(m[1]);
          return out;
        }

        function isCommentLine(line) {
          return /^\s*\/\/(.*)$/.test(line);
        }

        function stripComment(line) {
          const m = line.match(/^\s*\/\/(.*)$/);
          return (m ? m[1] : "").trim();
        }

        function collectNearbyComments(idx) {
          const out = [];
          const seen = new Set();

          let up = idx - 1;
          while (up >= 0) {
            const t = lines[up].trim();
            if (t === "") { up--; continue; }
            if (!isCommentLine(lines[up])) break;
            out.unshift(stripComment(lines[up]));
            up--;
            break;
          }

          let up2 = idx - 2;
          while (up2 >= 0 && isCommentLine(lines[up2])) {
            out.unshift(stripComment(lines[up2]));
            up2--;
          }

          let down = idx + 1;
          let downCount = 0;
          while (down < lines.length && downCount < 2) {
            const t = lines[down].trim();
            if (t === "") { down++; continue; }
            if (isCommentLine(lines[down])) {
              out.push(stripComment(lines[down]));
              down++;
              downCount++;
              continue;
            }
            break;
          }

          const joined = out.map(s => s.trim()).filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
          if (!joined) return "";

          if (!seen.has(joined)) {
            seen.add(joined);
            return joined;
          }
          return "";
        }

        const hasSet = new Set();
        const getSet = new Set();
        const docMap = new Map();

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (!/urlParams\.(has|get)\(/.test(line)) continue;

          const names = getAllStringArgs(line);
          if (!names.length) continue;

          const desc = collectNearbyComments(i);

          for (const name of names) {
            if (line.includes(`urlParams.has("${name}")`) || line.includes(`urlParams.has('${name}')`)) hasSet.add(name);
            if (line.includes(`urlParams.get("${name}")`) || line.includes(`urlParams.get('${name}')`)) getSet.add(name);

            if (desc) {
              const prev = docMap.get(name);
              if (!prev) docMap.set(name, desc);
              else if (!prev.includes(desc)) docMap.set(name, (prev + " " + desc).replace(/\s+/g, " ").trim());
            }
          }
          if (desc) {
            const prev = docMap.get(name);
            if (!prev) docMap.set(name, desc);
            else if (!prev.includes(desc)) docMap.set(name, (prev + " " + desc).replace(/\s+/g, " ").trim());
          }
        }

        const detected = Array.from(new Set([...hasSet, ...getSet]))
          .sort((a, b) => a.localeCompare(b))

          .filter(name => name !== "session")
          .map(name => ({ name, type: getSet.has(name) ? "value" : "flag" }));

        const prev = new Map(state);
        state.clear();
        params = detected;

        for (const p of params) {
          const old = prev.get(p.name);
          state.set(p.name, old ? old : { enabled: false, value: "" });
        }

        docs = docMap;
      }

      function loadPrefs() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      const saved = loadPrefs();

      let pendingRestoreUrl = saved?.url || "";
      let pendingRestoreMode = saved?.mode || "";
      let pendingRestoreSession = saved?.session || "";
      let pendingRestoreState = saved?.state || null;

      const cookieSession = getCookie(COOKIE_KEY);
      if (cookieSession !== null && cookieSession !== "") {
        pendingRestoreSession = cookieSession;
      }

      function applyOverlayDefaults() {
        if (currentMode !== "overlay") return;
        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;
          if (p.name in OVERLAY_DEFAULTS) {
            const dv = OVERLAY_DEFAULTS[p.name];
            if (p.type === "flag") s.enabled = !!dv;
            else s.value = String(dv);
          }
        }
      }

      function serializeUrlFromState() {
        const base = new URL(getTargetPath(), location.href);
        const sp = new URLSearchParams();

        const sessionVal = sessionInput.value.trim();
        if (sessionVal) {
          sp.append("session", sessionVal);
        }

        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;

          if (p.name === "session") continue;

          if (p.type === "flag") {
            if (s.enabled) sp.append(p.name, "");
          } else {
            const v = (s.value ?? "").trim();
            if (v !== "") sp.append(p.name, v);
          }
        }

        let qs = sp.toString();
        if (qs) qs = qs.replace(/=(&|$)/g, "$1");

        return qs
          ? (base.origin + base.pathname + "?" + qs)
          : (base.origin + base.pathname);
      }

      function flashUrl() {
        urlIn.classList.remove("url-flash");
        void urlIn.offsetWidth;
        urlIn.classList.add("url-flash");
        setTimeout(() => urlIn.classList.remove("url-flash"), 260);
      }

      function syncUrlInputFromState() {
        if (restoring) return;
        const out = serializeUrlFromState();
        if (!urlIn.matches(":focus")) urlIn.value = out;
        if (!userEditingUrl) flashUrl();
      }

      function makeCard(p) {
        const s = state.get(p.name);

        const card = document.createElement("div");
        card.className = "p-3 transition surface";

        const header = document.createElement("div");
        header.className = "flex items-center justify-between gap-2";

        const name = document.createElement("div");
        name.className = "min-w-0";
        const pillStyle = p.type === "flag"
          ? "border:1px solid rgba(56,189,248,.25); background:rgba(56,189,248,.08); color:rgba(224,242,254,.95);"
          : "border:1px solid rgba(251,191,36,.25); background:rgba(251,191,36,.08); color:rgba(254,243,199,.95);";
        name.innerHTML = `
          <div class="truncate text-sm font-semibold">${escapeHtml(p.name)}</div>
          <div class="mt-1 inline-flex items-center gap-1 px-2 py-0.5 text-[10px]" style="${pillStyle}">
            ${p.type === "flag" ? "toggle" : "value"}
          </div>
        `;

        const d = docs.get(p.name);
        if (d) {
          const dEl = document.createElement("div");
          dEl.className = "mt-1 text-[11px] leading-snug";
          dEl.style.color = "var(--muted)";
          dEl.textContent = d;
          name.appendChild(dEl);
        }

        const ctrl = document.createElement("div");
        ctrl.className = "shrink-0";

        if (p.type === "flag") {
          const label = document.createElement("label");
          label.className = "inline-flex cursor-pointer items-center";
          label.innerHTML = `
            <input type="checkbox" class="peer sr-only" ${s.enabled ? "checked" : ""} />
            <span class="relative h-5 w-9 transition surface">
              <span class="absolute left-0.5 top-0.5 h-4 w-4 transition surface"></span>
            </span>
          `;
          const cb = label.querySelector("input");
          const track = label.querySelector("span");
          const knob = track.querySelector("span");

          function paint() {
            if (cb.checked) {
              track.style.background = "rgba(52,211,153,.20)";
              track.style.borderColor = "rgba(52,211,153,.30)";
              knob.style.transform = "translateX(1rem)";
            } else {
              track.style.background = "rgba(255,255,255,.08)";
              track.style.borderColor = "var(--border)";
              knob.style.transform = "translateX(0)";
            }
          }

          cb.addEventListener("change", () => {
            s.enabled = cb.checked;
            paint();
            syncUrlInputFromState();
            savePrefs();
          });

          paint();
          ctrl.appendChild(label);
        }

        header.appendChild(name);
        header.appendChild(ctrl);

        const body = document.createElement("div");
        body.className = "mt-2";

        if (p.type === "value") {
          const ta = document.createElement("textarea");
          ta.value = s.value;
          ta.placeholder = "...";
          ta.rows = 1;
          ta.className = "w-full px-2.5 py-2 text-sm outline-none transition surface resize-none whitespace-pre-wrap";
          ta.style.overflowY = "hidden";
          ta.style.maxHeight = "50vh";
          ta.style.minHeight = "2.2rem";

          function autoGrow() {
            ta.style.height = "auto";
            const max = window.innerHeight * 0.5;
            const needed = ta.scrollHeight;
            if (needed > max) {
              ta.style.height = max + "px";
              ta.style.overflowY = "auto";
            } else {
              ta.style.height = needed + "px";
              ta.style.overflowY = "hidden";
            }
          }

          ta.addEventListener("input", () => {
            s.value = ta.value;
            autoGrow();
            syncUrlInputFromState();
            savePrefs();
          });

          ta.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              ta.blur();
            }
          });

          autoGrow();
          body.appendChild(ta);
        } else {
          const hint = document.createElement("div");
          hint.className = "text-[11px]";
          hint.style.color = "var(--muted)";
          hint.textContent = `Adds ?${p.name}`;
          body.appendChild(hint);
        }

        card.appendChild(header);
        card.appendChild(body);
        return card;
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        list.innerHTML = "";
        for (const p of params) {
          if (q && !p.name.toLowerCase().includes(q)) continue;
          list.appendChild(makeCard(p));
        }
        syncUrlInputFromState();
        savePrefs();
      }

      function applyFromUrl(raw, preserveSession = false) {
        clearErr();

        let u;
        try {
          const trimmed = (raw || "").trim();
          if (!trimmed) throw new Error("Paste a URL first.");
          if (trimmed.startsWith("?")) u = new URL(location.origin + location.pathname + trimmed);
          else if (trimmed.startsWith("/")) u = new URL(trimmed, location.origin);
          else u = new URL(trimmed);
        } catch (e) {
          showErr("Invalid URL: " + (e && e.message ? e.message : e));
          return;
        }

        const path = (u.pathname || "").toLowerCase();
        if (path.endsWith("/overlay.html") || path.endsWith("overlay.html")) currentMode = "overlay";
        if (path.endsWith("/dock.html") || path.endsWith("dock.html")) currentMode = "dock";

        const sp = u.searchParams;

        if (!preserveSession) {
          const strictSession = sp.get("session");
          if (strictSession !== null) {
            sessionInput.value = strictSession;
            setCookie(COOKIE_KEY, strictSession);
          }
        }

        for (const p of params) {
          const s = state.get(p.name);
          if (!s) continue;
          if (p.type === "flag") s.enabled = sp.has(p.name);
          else s.value = sp.get(p.name) ?? "";
        }

        // if (currentMode === "overlay") applyOverlayDefaults();
        setModeUI();
        render();
        syncUrlInputFromState();
        savePrefs();
        meta.textContent = `Applied from URL`;
      }

      function setModeUI() {
        const on = "bg-white/10 text-white";
        const off = "text-zinc-300 hover:bg-white/10";
        const dis = busy ? " opacity-50 cursor-not-allowed" : "";
        modeOverlay.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "overlay" ? on : off) + dis;
        modeDock.className = "px-3 py-1.5 text-xs font-semibold transition " + (currentMode === "dock" ? on : off) + dis;
      }

      async function rescanAndRender() {
        clearErr();
        setBusy(true);
        meta.textContent = "retrieving...";
        try {
          const text = await getScanText();
          meta.textContent = "parsing...";
          parseParamsFromText(text);
          if (currentMode === "overlay") applyOverlayDefaults();
          meta.textContent = `Detected ${params.length} params`;
          render();
        } catch (e) {
          params = [];
          state.clear();
          list.innerHTML = "";
          meta.textContent = "No params detected";
          showErr(String(e && e.message ? e.message : e));
        } finally {
          setBusy(false);
          setModeUI();
        }
      }

      async function copyUrl() {
        const text = urlIn.value || "";
        try {
          await navigator.clipboard.writeText(text);
          const old = copyBtn.textContent;
          copyBtn.textContent = "copied";
          copyBtn.style.borderColor = "rgba(52,211,153,.30)";
          copyBtn.style.background = "rgba(52,211,153,.15)";
          setTimeout(() => {
            copyBtn.textContent = old;
            copyBtn.style.borderColor = "rgba(251,191,36,.22)";
            copyBtn.style.background = "rgba(251,191,36,.10)";
          }, 700);
        } catch {
          prompt("Copy URL:", text);
        }
      }

      modeOverlay.addEventListener("click", async () => {
        if (busy) return;
        currentMode = "overlay";
        savePrefs();
        setModeUI();
        await rescanAndRender();
      });

      modeDock.addEventListener("click", async () => {
        if (busy) return;
        currentMode = "dock";
        savePrefs();
        setModeUI();
        await rescanAndRender();
      });

      search.addEventListener("input", () => { if (!busy) render(); });

      copyBtn.addEventListener("click", () => { if (!busy) copyUrl(); });

      urlIn.addEventListener("input", () => {
        scheduleApplyFromUrl();
        savePrefs();
      });

      sessionInput.addEventListener("input", () => {
        if (busy) return;

        const raw = sessionInput.value.trim();
        const m = raw.match(/(?:^|[?&])session=([^?&]+)/i);
        if (m) {
          sessionInput.value = decodeURIComponent(m[1]);
        } else if (/^session=/i.test(raw)) {
          sessionInput.value = raw.replace(/^session=/i, "");
        }

        setCookie(COOKIE_KEY, sessionInput.value);
        syncUrlInputFromState();
        savePrefs();
      });

      setModeUI();

      if (!location.search && saved) {
        restoring = true;
        if (pendingRestoreMode === "dock" || pendingRestoreMode === "overlay") currentMode = pendingRestoreMode;

        sessionInput.value = pendingRestoreSession || "";
        if (typeof pendingRestoreUrl === "string" && pendingRestoreUrl.trim()) urlIn.value = pendingRestoreUrl.trim();
        restoring = false;
      }

      rescanAndRender().then(() => {
        restoring = true;

        if (location.search && location.search !== "?") {
          applyFromUrl(location.origin + location.pathname + location.search);
        } else if (pendingRestoreUrl && pendingRestoreUrl.trim()) {

          applyFromUrl(pendingRestoreUrl.trim(), true);

          sessionInput.value = pendingRestoreSession || "";
        } else if (pendingRestoreState) {
          for (const [k, v] of Object.entries(pendingRestoreState)) {
            const s = state.get(k);
            if (!s) continue;
            s.enabled = !!v.enabled;
            s.value = String(v.value ?? "");
          }
          render();
        } else {
          render();
        }

        restoring = false;
        syncUrlInputFromState();
        savePrefs();
      });

      if (saved && !location.search) {
        if (saved.mode === "dock" || saved.mode === "overlay") currentMode = saved.mode;

        sessionInput.value = pendingRestoreSession || "";

        if (saved.url) {
          urlIn.value = saved.url;
          applyFromUrl(saved.url, true);
          sessionInput.value = pendingRestoreSession || "";
        } else if (saved.state) {
          for (const [k, v] of Object.entries(saved.state)) {
            const s = state.get(k);
            if (!s) continue;
            s.enabled = !!v.enabled;
            s.value = String(v.value ?? "");
          }
          render();
        }
      }
    })();
  </script>
</body>

</html>
