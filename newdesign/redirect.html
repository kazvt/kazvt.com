<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1.5; url=./">
    <link rel="canonical" href="./">
    <title>Redirecting...</title>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/redirect.css">
  </head>
  <body class="redirect-body">
    <main class="redirect-desktop" aria-label="Windows XP styled redirect page">
      <span class="redirect-sun" aria-hidden="true"></span>
      <section class="window redirect-window" role="status" aria-live="polite">
        <div class="title-bar">
          <div class="title-bar-text" data-redirect-title>Redirecting...</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <div class="redirect-content">
            <div class="redirect-icon" aria-hidden="true"></div>
            <div class="redirect-copy">
              <h1 class="redirect-heading" data-redirect-heading>Preparing your shortcut</h1>
              <p class="redirect-message" data-redirect-message>Windows XP is opening the destination. Click the link if it does not continue automatically.</p>
              <a class="redirect-link" data-redirect-link data-redirect-now href="./">Redirecting...</a>
              <div class="redirect-progress-wrap" aria-hidden="true">
                <div class="redirect-progress" data-redirect-progress></div>
              </div>
              <div class="redirect-actions">
                <a class="redirect-button" data-redirect-button data-redirect-now href="./" role="button">Open now</a>
              </div>
            </div>
          </div>
        </div>
      </section>
      <nav class="redirect-taskbar" aria-label="Windows XP redirect taskbar">
        <button class="redirect-start" type="button">start</button>
        <span class="redirect-task">Redirecting...</span>
        <span class="redirect-clock">please wait</span>
      </nav>
    </main>
    <script type="module" src="assets/js/components/redirect.js"></script>
  </body>
</html>
