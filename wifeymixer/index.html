  function updateGridGeometry(stemCount) {
    const stripMin = 112;
    const stripMax = 148;

    // The master strip is no longer part of this grid. This grid contains stems
    // only, so horizontal scrolling can never move the master control surface.
    const scrollerWidth = horizontalScroller?.clientWidth || window.innerWidth || 1200;
    const stripPercentCap = scrollerWidth * 0.125;
    const stripWidth = Math.max(stripMin,Math.min(stripMax,stripPercentCap));

    if (!stemCount) {
      grid.style.gridTemplateColumns = "0px";
      grid.style.minWidth = "0px";
      grid.style.width = "0px";
      grid.style.maxWidth = "none";
      return;
    }

    const naturalWidth = stemCount*stripWidth;
    const minimumScrollableWidth = stemCount*stripMin;

    grid.style.setProperty("--stem-strip-width",`${stripWidth}px`);
    grid.style.gridTemplateColumns =
      `repeat(${stemCount}, minmax(${stripMin}px, var(--stem-strip-width)))`;

    grid.style.minWidth = `${minimumScrollableWidth}px`;
    grid.style.width = `${Math.max(minimumScrollableWidth,naturalWidth)}px`;
    grid.style.maxWidth = "none";
  }

  function renderMixer(playlist) {
    grid.innerHTML = "";
    masterDock.innerHTML = "";

    const stems = playlist?.stems || [];
    updateGridGeometry(stems.length);

    stems.forEach((stem,index)=>{
      const state = defaultStemState(stem);
      grid.insertAdjacentHTML("beforeend",channelMarkup(stem,index,state));
    });

    // Master is a physically separate, fixed dock at the far-right chassis edge.
    masterDock.insertAdjacentHTML("beforeend",masterMarkup());

    bindControlSurface();
    showSystemReadout(
      playlist?.title ? String(playlist.title).toUpperCase() : "WIFEY MIX-8",
      "READY",
      stems.length ? `${stems.length} STEM${stems.length === 1 ? "" : "S"}` : "NO STEMS"
    );
  }

  function decodeAudioDataCompat(ctx,arrayBuffer) {
    const copy = arrayBuffer.slice(0);

    // Promise form is standard now. Callback fallback keeps older Safari/WebKit happy.
    try {
      const maybePromise = ctx.decodeAudioData(copy);
      if (maybePromise && typeof maybePromise.then === "function") return maybePromise;
    } catch (_) {}

    return new Promise((resolve,reject)=>{
      try {
        ctx.decodeAudioData(copy,resolve,reject);
      } catch (error) {
        reject(error);
      }
    });
  }


  function stemCacheKey(stem) {
    return String(stem?.key || stem?.displayPath || stem?.src || stem?.name || "");
  }

  function touchDecodedBuffer(key,buffer) {
    if (!key || !buffer) return buffer;

    if (decodedBufferCache.has(key)) decodedBufferCache.delete(key);
    decodedBufferCache.set(key,buffer);
    pruneDecodedBufferCache();
    return buffer;
  }

  function pruneDecodedBufferCache() {
    if (decodedBufferCache.size <= MAX_DECODED_STEMS) return;

    const protectedKeys = new Set(
      (currentPlaylist?.stems || []).map(stemCacheKey)
    );

    for (const key of [...decodedBufferCache.keys()]) {
      if (decodedBufferCache.size <= MAX_DECODED_STEMS) break;
      if (protectedKeys.has(key)) continue;
      decodedBufferCache.delete(key);
    }
  }

  async function getDecodedStemBuffer(stem) {
    ensureAudioGraph();

    const key = stemCacheKey(stem);
    if (!key) throw new Error("Stem has no cache key.");

    if (decodedBufferCache.has(key)) {
      return touchDecodedBuffer(key,decodedBufferCache.get(key));
    }

    if (decodedBufferPromises.has(key)) {
      return decodedBufferPromises.get(key);
    }

    const promise = (async()=>{
      const response = await fetch(stem.src,{cache:"force-cache"});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const bytes = await response.arrayBuffer();
      const buffer = await decodeAudioDataCompat(audioCtx,bytes);
      return touchDecodedBuffer(key,buffer);
    })();

    decodedBufferPromises.set(key,promise);

    try {
      return await promise;
    } finally {
      decodedBufferPromises.delete(key);
    }
  }

  function idleTask(callback) {
    if ("requestIdleCallback" in window) {
      return window.requestIdleCallback(callback,{timeout:1400});
    }
    return window.setTimeout(()=>callback({didTimeout:true,timeRemaining:()=>0}),90);
  }

  async function preloadPlaylist(index) {
    if (!playlists.length) return;

    const normalized = (Number(index)+playlists.length)%playlists.length;
    if (normalized === currentPlaylistIndex) return;

    const playlist = playlists[normalized];
    if (!playlist?.stems?.length) return;

    const jobKey = String(playlist.id || normalized);
    if (backgroundPlaylistJobs.has(jobKey)) {
      return backgroundPlaylistJobs.get(jobKey);
    }

    const job = new Promise(resolve=>{
      idleTask(async()=>{
        const queue = playlist.stems.filter(stem=>{
          const key = stemCacheKey(stem);
          return key && !decodedBufferCache.has(key);
        });

        let cursor = 0;

        async function worker() {
          while (cursor < queue.length) {
            const stem = queue[cursor++];
            try {
              await getDecodedStemBuffer(stem);
            } catch (error) {
              // Background preload failures should never interrupt current playback.
              console.warn("Background stem preload skipped:",stem?.displayPath || stem?.name,error);
            }

            // Yield between decodes so UI/audio work stays responsive.
            await new Promise(done=>setTimeout(done,0));
          }
        }

        const workers = Array.from(
          {length:Math.min(BACKGROUND_DECODE_CONCURRENCY,Math.max(1,queue.length))},
          ()=>worker()
        );

        await Promise.allSettled(workers);
        resolve();
      });
    });

    backgroundPlaylistJobs.set(jobKey,job);

    try {
      await job;
    } finally {
      backgroundPlaylistJobs.delete(jobKey);
    }
  }

  function chooseQueuedShuffleIndex() {
    if (playlists.length <= 1) {
      queuedShuffleIndex = 0;
      return queuedShuffleIndex;
    }

    let pick = Math.floor(Math.random()*(playlists.length-1));
    if (pick >= currentPlaylistIndex) pick += 1;
    queuedShuffleIndex = pick;
    return pick;
  }

  function scheduleBackgroundPreload() {
    if (!playlists.length || playlists.length <= 1) return;

    const nextIndex = (currentPlaylistIndex+1)%playlists.length;
    const previousIndex = (currentPlaylistIndex-1+playlists.length)%playlists.length;

    // Sequential/manual navigation gets the next song first.
    preloadPlaylist(nextIndex);

    // Previous is also cheap insurance for manual navigation.
    if (previousIndex !== nextIndex) {
      idleTask(()=>preloadPlaylist(previousIndex));
    }

    // In SHUFFLE mode, choose the actual future shuffle target now, then decode
    // that exact song in advance instead of waiting until the transition.
    if (playlistMode === "shuffle") {
      const shuffleIndex = chooseQueuedShuffleIndex();
      if (shuffleIndex !== nextIndex && shuffleIndex !== previousIndex) {
        idleTask(()=>preloadPlaylist(shuffleIndex));
      }
    }
  }

  async function loadStemBuffer(channel,generation) {
    try {
      const buffer = await getDecodedStemBuffer(channel.stem);
      if (generation !== loadGeneration) return channel;

      channel.buffer = buffer;
      channel.ready = true;
      channel.error = false;
      updatePlaylistDuration();
      return channel;
    } catch (error) {
      channel.error = true;
      channel.ready = true;
      channel.el?.classList.add("channel-error");
      loadReadout.textContent = "AUDIO ERR";
      console.error(`Could not decode stem: ${channel.stem?.displayPath || channel.stem?.name}`,error);
      return channel;
    }
  }

  function setupAudioForRenderedChannels(playlist,generation) {
    ensureAudioGraph();
    const stripEls = [...grid.querySelectorAll("[data-channel]")];

    channels = playlist.stems.map((stem,index)=>{
      const state = defaultStemState(stem);

      const trim = audioCtx.createGain();
      const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
      const fader = audioCtx.createGain();
      const send = audioCtx.createGain();
      const analyser = audioCtx.createAnalyser();

      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = .68;

      const meterData = new Uint8Array(analyser.fftSize);

      trim.connect(pan);
      pan.connect(fader);
      fader.connect(masterBus);
      fader.connect(send);
      send.connect(reverb);
      fader.connect(analyser);

      const channel = {
        stem,index,state,buffer:null,sources:new Set(),
        trim,pan,fader,send,analyser,meterData,
        el:stripEls[index],
        meterL:stripEls[index]?.querySelector("[data-meter-l]"),
        meterR:stripEls[index]?.querySelector("[data-meter-r]"),
        ready:false,error:false
      };

      channel.readyPromise = loadStemBuffer(channel,generation);
      return channel;
    });

    channels.forEach(channel=>{
      applyChannelState(channel);
      syncStemActionButtons(channel);
    });
    updateSoloRouting();

    Promise.allSettled(channels.map(c=>c.readyPromise)).then(()=>{
      if (generation !== loadGeneration) return;

      updatePlaylistDuration();

      if (randomizerEnabled) {
        randomizeTrackMutes("load");
        loadReadout.textContent = channels.some(c=>c.error) ? "RND PART" : "RND ON";
      } else {
        loadReadout.textContent = channels.some(c=>c.error) ? "PARTIAL" : "READY";
      }

      // Current song gets full priority. Once it is decoded, prepare likely
      // next/previous/shuffle destinations quietly in the background.
      scheduleBackgroundPreload();
    });
  }

  function applyChannelState(channel) {
    if (!audioCtx || !channel) return;
    setParam(channel.trim.gain,dbToGain(trimValueToDb(channel.state.trim)));
    if (channel.pan?.pan) setParam(channel.pan.pan,panValue(channel.state.pan));
    setParam(channel.send.gain,roomValue(channel.state.room));
    updateChannelEffectiveLevel(channel);
  }

  function updateChannelEffectiveLevel(channel) {
    const anySolo = channels.some(c=>c.state.solo);
    const shouldSound = !channel.state.mute && (!anySolo || channel.state.solo);
    const gain = shouldSound ? faderValueToGain(channel.state.level) : 0;
    setParam(channel.fader.gain,gain,.008);
  }

  function updateSoloRouting() { channels.forEach(updateChannelEffectiveLevel); }

  function setKnobRotation(input) {
    const tick = input.closest(".knob-wrap")?.querySelector(".knob-tick");
    if (!tick) return;
    const angle = -135+(Number(input.value)/100)*270;
    tick.style.transform = `rotate(${angle}deg)`;
    updateKnobAria(input);
  }

  function updateKnobAria(input) {
    const control = input.dataset.control;
    const value = Number(input.value);
    let text = `${value}%`;
    if (control === "trim") text = formatDb(trimValueToDb(value));
    else if (control === "pan") {
      const p = panValue(value);
      text = Math.abs(p)<.02 ? "Center" : `${p<0 ? "L" : "R"} ${Math.round(Math.abs(p)*100)}`;
    } else if (control === "tone") text = `${Math.round(1800+Math.pow(value/100,2.1)*18200)} Hz`;
    input.setAttribute("aria-valuetext",text);
  }

  function bindRelativeVerticalControl(input,onValue) {
    const wrap = input.closest(".knob-wrap");
    setKnobRotation(input);
    if (!wrap) return;
    let startY=0,startValue=0,pointerId=null;
    wrap.addEventListener("pointerdown",event=>{
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault(); event.stopPropagation();
      pointerId=event.pointerId; startY=event.clientY; startValue=Number(input.value);
      showTouchedControl(input,startValue);
      wrap.setPointerCapture?.(event.pointerId);
    });
    wrap.addEventListener("pointermove",event=>{
      if (pointerId !== event.pointerId) return;
      event.preventDefault(); event.stopPropagation();
      const sensitivity=event.shiftKey ? .18 : .72;
      input.value=Math.round(Math.max(0,Math.min(100,startValue-(event.clientY-startY)*sensitivity)));
      setKnobRotation(input);
      showTouchedControl(input,Number(input.value));
      onValue(Number(input.value));
    });
    const finish=event=>{
      if (pointerId !== event.pointerId) return;
      event.preventDefault(); event.stopPropagation();
      try { wrap.releasePointerCapture?.(event.pointerId); } catch (_) {}
      pointerId=null;
    };
    wrap.addEventListener("pointerup",finish);
    wrap.addEventListener("pointercancel",finish);
    input.addEventListener("input",()=>{
      setKnobRotation(input);
      showTouchedControl(input,Number(input.value));
      onValue(Number(input.value));
    });
  }

  function syncFader(input) {
    const bay=input.closest(".fader-bay");
    if (!bay) return;
    const pct=Number(input.value)/100;
    bay.style.setProperty("--fader-y",`${8+(1-pct)*84}%`);
    input.setAttribute("aria-valuetext",formatDb(faderValueToDb(input.value)));
  }

  function bindFader(input,onValue) {
    syncFader(input);
    const bay=input.closest(".fader-bay");
    if (!bay) return;
    let startY=0,startValue=0,pointerId=null;
    bay.addEventListener("pointerdown",event=>{
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault(); event.stopPropagation();
      pointerId=event.pointerId; startY=event.clientY; startValue=Number(input.value);
      showTouchedControl(input,startValue);
      bay.setPointerCapture?.(event.pointerId);
    });
    bay.addEventListener("pointermove",event=>{
      if (pointerId !== event.pointerId) return;
      event.preventDefault(); event.stopPropagation();
      const usable=Math.max(36,bay.clientHeight-22);
      const next=startValue+((startY-event.clientY)/usable)*100;
      input.value=Math.round(Math.max(0,Math.min(100,next)));
      syncFader(input);
      showTouchedControl(input,Number(input.value));
      onValue(Number(input.value));
    });
    const finish=event=>{
      if (pointerId !== event.pointerId) return;
      event.preventDefault(); event.stopPropagation();
      try { bay.releasePointerCapture?.(event.pointerId); } catch (_) {}
      pointerId=null;
    };
    bay.addEventListener("pointerup",finish);
    bay.addEventListener("pointercancel",finish);
    input.addEventListener("input",()=>{
      syncFader(input);
      showTouchedControl(input,Number(input.value));
      onValue(Number(input.value));
    });
  }


  function syncStemActionButtons(channel) {
    if (!channel?.el) return;

    const muteBtn = channel.el.querySelector('[data-action="mute"]');
    const soloBtn = channel.el.querySelector('[data-action="solo"]');
    const lockBtn = channel.el.querySelector('[data-action="lock"]');

    if (muteBtn) {
      muteBtn.classList.toggle("active",!!channel.state.mute);
      muteBtn.setAttribute("aria-pressed",String(!!channel.state.mute));
    }

    const muteLed = channel.el.querySelector("[data-mute-led]");
    if (muteLed) {
      const isSolo = !!channel.state.solo;
      const isAudible = !channel.state.mute;

      muteLed.classList.toggle("is-on",isAudible && !isSolo);
      muteLed.classList.toggle("is-solo",isSolo);

      muteLed.title = isSolo
        ? "Solo"
        : (isAudible ? "Active / not muted" : "Muted");
    }

    if (soloBtn) {
      soloBtn.classList.toggle("active",!!channel.state.solo);
      soloBtn.setAttribute("aria-pressed",String(!!channel.state.solo));
    }

    if (lockBtn) {
      lockBtn.classList.toggle("active",!!channel.state.locked);
      lockBtn.setAttribute("aria-pressed",String(!!channel.state.locked));
      lockBtn.title = `${channel.state.locked ? "Unlock" : "Lock"} ${channel.stem.name} from randomizer`;
      lockBtn.setAttribute("aria-label",lockBtn.title);
      lockBtn.innerHTML = `<i class="fa-solid ${channel.state.locked ? "fa-lock" : "fa-lock-open"}" aria-hidden="true"></i>`;
    }
  }


  const PLAYLIST_MODES = ["loop","shuffle","sequential"];

  const PLAYLIST_MODE_UI = {
    loop:{
      icon:"fa-repeat",
      name:"LOOPING",
      description:"CURRENT SONG REPEATS"
    },
    shuffle:{
      icon:"fa-shuffle",
      name:"SHUFFLE",
      description:"RANDOM SONG AT END"
    },
    sequential:{
      icon:"fa-list-ol",
      name:"SEQUENTIAL",
      description:"NEXT SONG · WRAP"
    }
  };

  function updatePlaylistModeButton(showOnMonitor=false) {
    if (!playlistModeBtn) return;

    const mode = PLAYLIST_MODE_UI[playlistMode] || PLAYLIST_MODE_UI.loop;
    playlistModeBtn.innerHTML = `<i class="fa-solid ${mode.icon}" aria-hidden="true"></i>`;
    playlistModeBtn.dataset.mode = playlistMode;
    playlistModeBtn.setAttribute("aria-label",`Playlist mode: ${mode.name}`);
    playlistModeBtn.title = `Playlist mode: ${mode.name}`;

    if (showOnMonitor) {
      showSystemReadout(
        "PLAYLIST MODE",
        mode.description,
        mode.name
      );
    }
  }

  function cyclePlaylistMode() {
    const currentPosition = getPosition();
    const wasPlaying = isPlaying;

    const currentIndex = Math.max(0,PLAYLIST_MODES.indexOf(playlistMode));
    playlistMode = PLAYLIST_MODES[(currentIndex+1)%PLAYLIST_MODES.length];

    persistentPrefs.playlistMode = playlistMode;
    savePersistentPrefs();
    updatePlaylistModeButton(true);

    // Reschedule the current arrangement so old pre-scheduled loop cycles
    // cannot survive a change from LOOPING to SHUFFLE/SEQUENTIAL.
    if (wasPlaying && playlistDuration) {
      startClockedPlaybackAt(currentPosition);
      updatePlaybackButtons();
    }

    loadReadout.textContent =
      playlistMode === "loop" ? "LOOP" :
      playlistMode === "shuffle" ? "SHUFFLE" :
      "SEQ";

    queuedShuffleIndex=null;
    scheduleBackgroundPreload();
  }

  function getShuffledPlaylistIndex() {
    const count = playlists.length;
    if (count <= 1) return 0;

    if (
      Number.isInteger(queuedShuffleIndex) &&
      queuedShuffleIndex >= 0 &&
      queuedShuffleIndex < count &&
      queuedShuffleIndex !== currentPlaylistIndex
    ) {
      const pick = queuedShuffleIndex;
      queuedShuffleIndex = null;
      return pick;
    }

    return chooseQueuedShuffleIndex();
  }

  async function advanceAtSongEnd() {
    if (playlistAdvanceInProgress || !playlists.length) return;
    playlistAdvanceInProgress = true;

    try {
      if (playlistMode === "shuffle") {
        await changePlaylist(getShuffledPlaylistIndex(),true);
      } else if (playlistMode === "sequential") {
        // changePlaylist normalizes the index, so the last song wraps to the first.
        await changePlaylist(currentPlaylistIndex+1,true);
      }
    } finally {
      playlistAdvanceInProgress = false;
    }
  }

  function updateRandomizerButton() {
    if (!randomizerBtn) return;
    randomizerBtn.classList.toggle("active",randomizerEnabled);
    randomizerBtn.setAttribute("aria-pressed",String(randomizerEnabled));
    randomizerBtn.title = randomizerEnabled
      ? "Randomizer ON — unlocked stems will randomize again at the next loop"
      : "Randomizer OFF — click to randomize unlocked stems and enable it";
  }

  function randomizeTrackMutes(reason="manual") {
    if (!channels.length) return;

    const unlocked = channels.filter(channel=>!channel.state.locked && !channel.error);
    if (!unlocked.length) {
      showSystemReadout("RANDOMIZER","ALL STEMS LOCKED","HOLD");
      return;
    }

    // About half the unlocked arrangement is muted per pass.
    // Locked strips retain their exact current mute state.
    for (const channel of unlocked) {
      channel.state.mute = Math.random() < .47;
    }

    // Avoid an accidental fully-silent random pass whenever an unlocked stem exists.
    const anyAudible = channels.some(channel=>!channel.error && !channel.state.mute);
    if (!anyAudible) {
      const keep = unlocked[Math.floor(Math.random()*unlocked.length)];
      if (keep) keep.state.mute = false;
    }

    for (const channel of channels) {
      syncStemActionButtons(channel);
      saveChannelState(channel);
    }

    updateSoloRouting();

    const mutedCount = channels.filter(channel=>channel.state.mute).length;
    const lockedCount = channels.filter(channel=>channel.state.locked).length;
    showSystemReadout(
      currentPlaylist?.title ? String(currentPlaylist.title).toUpperCase() : "RANDOMIZER",
      reason === "loop" ? `LOOP ${loopCount} · RANDOMIZED` : "RANDOMIZED",
      `${mutedCount} MUTE · ${lockedCount} LOCK`
    );
  }

  function toggleRandomizer() {
    randomizerEnabled = !randomizerEnabled;
    persistentPrefs.randomizerEnabled = randomizerEnabled;
    savePersistentPrefs();
    updateRandomizerButton();

    if (randomizerEnabled) {
      randomizeTrackMutes("manual");
      loadReadout.textContent = "RND ON";
    } else {
      showSystemReadout("RANDOMIZER","OFF","HOLD");
      loadReadout.textContent = "RND OFF";
    }
  }

  function bindControlSurface() {
    mixerSurface.querySelectorAll(".knob-range").forEach(input=>{
      const owner=input.dataset.owner;
      const control=input.dataset.control;
      bindRelativeVerticalControl(input,value=>{
        if (owner === "master") {
          masterState[control]=value;
          applyMasterState();
          saveMasterState();
          return;
        }
        const channel=channels[Number(owner)];
        if (!channel) return;
        channel.state[control]=value;
        saveChannelState(channel);
        applyChannelState(channel);
      });
    });

    mixerSurface.querySelectorAll(".fader").forEach(input=>{
      const owner=input.dataset.owner;
      bindFader(input,value=>{
        if (input.dataset.master === "1" || owner === "master") {
          masterState.level=value;
          applyMasterState();
          saveMasterState();
          return;
        }
        const channel=channels[Number(owner)];
        if (!channel) return;
        channel.state.level=value;
        saveChannelState(channel);
        updateChannelEffectiveLevel(channel);
      });
    });

    mixerSurface.querySelectorAll("[data-btn-channel]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const channel=channels[Number(btn.dataset.btnChannel)];
        if (!channel) return;
        const action=btn.dataset.action;

        if (action === "lock") {
          channel.state.locked = !channel.state.locked;
          setStemLocked(channel.stem,channel.state.locked);
          saveChannelState(channel);
          syncStemActionButtons(channel);
          showSystemReadout(
            String(channel.stem.name).toUpperCase(),
            channel.state.locked ? "RANDOM LOCK" : "RANDOM UNLOCK",
            channel.state.locked ? "HOLD" : "FREE"
          );
          return;
        }

        channel.state[action]=!channel.state[action];
        syncStemActionButtons(channel);
        saveChannelState(channel);
        updateSoloRouting();
      });
    });

    document.getElementById("masterPlayBtn")?.addEventListener("click",togglePlayback);
    document.getElementById("masterStopBtn")?.addEventListener("click",stopCurrent);
    document.getElementById("megaphoneBtn")?.addEventListener("click",toggleMegaphone);
    syncMegaphoneButton();
  }

  function updatePlaylistDuration() {
    playlistDuration = channels.reduce((max,channel)=>{
      const duration = channel.buffer?.duration;
      return Number.isFinite(duration) ? Math.max(max,duration) : max;
    },0);

    updateTransportDisplay();
  }

  function createScheduledSource(channel,when,offset=0) {
    if (!audioCtx || !channel?.buffer || channel.error) return null;

    const duration = channel.buffer.duration;
    if (!Number.isFinite(duration) || offset >= duration-.0005) return null;

    const source = audioCtx.createBufferSource();
    source.buffer = channel.buffer;
    source.connect(channel.trim);
    channel.sources.add(source);

    source.onended = ()=>{
      channel.sources.delete(source);
      try { source.disconnect(); } catch (_) {}
    };

    try {
      source.start(when,Math.max(0,offset));
      return source;
    } catch (error) {
      channel.sources.delete(source);
      try { source.disconnect(); } catch (_) {}
      console.error("Could not schedule stem",channel.stem?.name,error);
      return null;
    }
  }

  function scheduleCycle(cycleIndex) {
    if (!audioCtx || !playlistDuration || cycleIndex < 1) return;

    const when = cycleZeroContextTime + cycleIndex*playlistDuration;

    for (const channel of channels) {
      createScheduledSource(channel,when,0);
    }

    scheduledThroughCycle = Math.max(scheduledThroughCycle,cycleIndex);
  }

  function ensureScheduleHorizon(currentCycle=0) {
    if (!isPlaying || !playlistDuration || !audioCtx || playlistMode !== "loop") return;

    const target = currentCycle + SCHEDULE_AHEAD_CYCLES;
    for (let cycle=scheduledThroughCycle+1; cycle<=target; cycle++) {
      scheduleCycle(cycle);
    }
  }

  function startClockedPlaybackAt(position) {
    if (!audioCtx || !playlistDuration) return false;

    const target = Math.max(0,Math.min(playlistDuration,Number(position)||0));
    stopAllScheduledSources();

    // A small shared lead-in lets every source be scheduled before the exact same
    // AudioContext timestamp. No stem receives its own independent start clock.
    const startAt = audioCtx.currentTime + .045;
    cycleZeroContextTime = startAt - target;
    lastKnownPosition = target;
    loopCount = 0;
    scheduledThroughCycle = 0;

    let scheduled = 0;
    for (const channel of channels) {
      if (createScheduledSource(channel,startAt,target)) scheduled += 1;
    }

    if (!scheduled && target >= playlistDuration-.001) {
      cycleZeroContextTime = startAt;
      lastKnownPosition = 0;
      for (const channel of channels) {
        if (createScheduledSource(channel,startAt,0)) scheduled += 1;
      }
    }

    isPlaying = scheduled > 0;
    if (isPlaying) ensureScheduleHorizon(0);
    return isPlaying;
  }

  function getAbsoluteCyclePosition() {
    if (!isPlaying || !audioCtx || !playlistDuration) return lastKnownPosition || 0;

    const elapsed = audioCtx.currentTime - cycleZeroContextTime;
    if (elapsed <= 0) return Math.max(0,lastKnownPosition || 0);

    return elapsed;
  }

  function getPosition() {
    if (!playlistDuration) return 0;
    if (!isPlaying || !audioCtx) {
      return Math.max(0,Math.min(playlistDuration,lastKnownPosition || 0));
    }

    const absolute = getAbsoluteCyclePosition();

    if (playlistMode === "loop") {
      const wrapped = absolute % playlistDuration;
      return Math.max(0,Math.min(playlistDuration,wrapped));
    }

    return Math.max(0,Math.min(playlistDuration,absolute));
  }

  function updateLoopScheduler() {
    if (!isPlaying || !audioCtx || !playlistDuration) return;

    const absolute = getAbsoluteCyclePosition();

    if (playlistMode === "loop") {
      const currentCycle = Math.max(0,Math.floor(absolute/playlistDuration));
      ensureScheduleHorizon(currentCycle);

      if (currentCycle > loopCount) {
        loopCount = currentCycle;

        if (randomizerEnabled) randomizeTrackMutes("loop");
        loadReadout.textContent = randomizerEnabled ? "RND LOOP" : "LOOP";
      }

      return;
    }

    // SHUFFLE and SEQUENTIAL wait until the *longest stem* has fully ended.
    // Then we change songs; no shorter stem is allowed to trigger a transition.
    if (absolute >= playlistDuration-.012) {
      isPlaying = false;
      stopAllScheduledSources();
      updatePlaybackButtons();
      lastKnownPosition = playlistDuration;
      advanceAtSongEnd();
    }
  }

  function seekAll(seconds) {
    const target = Math.max(0,Math.min(playlistDuration || Number.MAX_SAFE_INTEGER,Number(seconds)||0));

    if (isPlaying && audioCtx && playlistDuration) {
      startClockedPlaybackAt(target);
    } else {
      lastKnownPosition = target;
    }

    updateTransportDisplay();
  }

  async function resumeAudioContext() {
    ensureAudioGraph();

    if (audioCtx.state === "suspended") await audioCtx.resume();

    // Some WebKit versions briefly remain "interrupted". A second resume after
    // the user gesture is safe and improves laptop/iOS reliability.
    if (audioCtx.state !== "running" && typeof audioCtx.resume === "function") {
      try { await audioCtx.resume(); } catch (_) {}
    }
  }


  function showAudioEngineStatus() {
    if (!audioCtx) return;
    const rate = Math.round(audioCtx.sampleRate || 0);
    showSystemReadout(
      currentPlaylist?.title ? String(currentPlaylist.title).toUpperCase() : "WIFEY MIX-8",
      "AUDIO CLOCK",
      rate ? `${(rate/1000).toFixed(1)} kHz` : "READY"
    );
  }

  async function playCurrent() {
    if (!currentPlaylist || !channels.length) return;

    try {
      await resumeAudioContext();
    } catch (error) {
      loadReadout.textContent = "NO AUDIO";
      return;
    }

    loadReadout.textContent = "LOADING";
    await Promise.allSettled(channels.map(c=>c.readyPromise));
    updatePlaylistDuration();

    if (!playlistDuration) {
      loadReadout.textContent = "NO AUDIO";
      return;
    }

    let position = Math.max(0,Math.min(playlistDuration,lastKnownPosition || 0));
    if (position >= playlistDuration-.03) position = 0;

    startClockedPlaybackAt(position);
    updatePlaybackButtons();
    loadReadout.textContent = isPlaying ? "PLAYING" : "READY";
    if (isPlaying) showAudioEngineStatus();
  }

  function pauseCurrent() {
    if (!isPlaying) return;

    lastKnownPosition = getPosition();
    stopAllScheduledSources();
    isPlaying = false;

    updatePlaybackButtons();
    updateTransportDisplay();
    loadReadout.textContent = "PAUSED";
  }

  function togglePlayback() {
    isPlaying ? pauseCurrent() : playCurrent();
  }

  function stopCurrent() {
    stopAllScheduledSources();
    isPlaying = false;
    lastKnownPosition = 0;
    loopCount = 0;
    scheduledThroughCycle = 0;

    updatePlaybackButtons();
    updateTransportDisplay();
    loadReadout.textContent = "STOPPED";
  }

  function updatePlaybackButtons() {
    playPauseBtn.innerHTML=isPlaying
      ? '<i class="fa-solid fa-pause" aria-hidden="true"></i>'
      : '<i class="fa-solid fa-play" aria-hidden="true"></i>';
    playPauseBtn.setAttribute("aria-label",isPlaying?"Pause":"Play");
    playPauseBtn.title=isPlaying?"Pause":"Play";
    playPauseBtn.classList.toggle("playing",isPlaying);

    const masterPlay=document.getElementById("masterPlayBtn");
    if (masterPlay) {
      masterPlay.innerHTML=isPlaying
        ? '<i class="fa-solid fa-pause" aria-hidden="true"></i>'
        : '<i class="fa-solid fa-play" aria-hidden="true"></i>';
      masterPlay.setAttribute("aria-label",isPlaying?"Pause":"Play");
      masterPlay.title=isPlaying?"Pause":"Play";
      masterPlay.classList.toggle("active",isPlaying);
    }
  }

  async function changePlaylist(index,autoplay=false) {
    if (!playlists.length) return;

    const normalized=(Number(index)+playlists.length)%playlists.length;
    const generation=++loadGeneration;

    stopAllScheduledSources();
    isPlaying=false;
    updatePlaybackButtons();
    cleanupChannels();

    currentPlaylistIndex=normalized;
    currentPlaylist=playlists[normalized];
    queuedShuffleIndex=null;
    playlistSelect.value=String(normalized);
    trackReadout.textContent=`${normalized+1}/${playlists.length}`;

    playlistDuration=0;
    lastKnownPosition=0;
    loopCount=0;
    scheduledThroughCycle=0;
    cycleZeroContextTime=0;

    loadReadout.textContent="LOADING";
    renderMixer(currentPlaylist);
    setupAudioForRenderedChannels(currentPlaylist,generation);
    horizontalScroller.scrollLeft=0;
    updateTransportDisplay();

    if (autoplay) await playCurrent();
  }

  function populatePlaylistSelect() {
    playlistSelect.innerHTML="";
    playlists.forEach((playlist,index)=>{
      const option=document.createElement("option");
      option.value=String(index);
      option.textContent=`${playlist.title} · ${playlist.stems.length} stems`;
      playlistSelect.appendChild(option);
    });
  }

  async function previousPlaylist() {
    playlistAdvanceInProgress=false;
    const shouldPlay=isPlaying;
    // Normalized indexing wraps first -> last in every playlist mode.
    await changePlaylist(currentPlaylistIndex-1,shouldPlay);
  }

  async function nextPlaylist(forceAutoplay=null) {
    playlistAdvanceInProgress=false;
    const shouldPlay=forceAutoplay===null ? isPlaying : forceAutoplay;
    // Normalized indexing wraps last -> first in every playlist mode.
    await changePlaylist(currentPlaylistIndex+1,shouldPlay);
  }

  function updateTransportDisplay() {
    const position=getPosition();
    if (!isSeeking && playlistDuration>0) seekRange.value=String(Math.round((position/playlistDuration)*1000));
    else if (!isSeeking && !playlistDuration) seekRange.value="0";
    timeReadout.textContent=`${formatTime(position)} / ${formatTime(playlistDuration)}`;
  }

  function analyserLevel(analyser,data) {
    if (!analyser || !data) return 0;
    analyser.getByteTimeDomainData(data);
    let sum=0;
    for (let i=0;i<data.length;i++) { const sample=(data[i]-128)/128; sum+=sample*sample; }
    const rms=Math.sqrt(sum/data.length);
    if (rms < .0005) return 0;
    const db=20*Math.log10(rms);
    return Math.max(0,Math.min(100,((db+54)/54)*100));
  }

  function animationLoop(timestamp) {
    for (const channel of channels) {
      const level=analyserLevel(channel.analyser,channel.meterData);
      if (channel.meterL) channel.meterL.style.height=`${level}%`;
      if (channel.meterR) channel.meterR.style.height=`${Math.max(0,level*.96)}%`;
    }
    if (masterAnalyser) {
      const level=analyserLevel(masterAnalyser,masterMeterData);
      const left=document.querySelector("[data-master-meter-l]");
      const right=document.querySelector("[data-master-meter-r]");
      if (left) left.style.height=`${level}%`;
      if (right) right.style.height=`${Math.max(0,level*.97)}%`;
    }

    if (isPlaying) {
      lastKnownPosition=getPosition();
      updateLoopScheduler();
    }
    updateTransportDisplay();
    requestAnimationFrame(animationLoop);
  }

  playlistSelect.addEventListener("change",()=>{
    playlistAdvanceInProgress=false;
    changePlaylist(Number(playlistSelect.value),isPlaying);
  });
  prevTrackBtn.addEventListener("click",previousPlaylist);
  playPauseBtn.addEventListener("click",togglePlayback);
  stopBtn.addEventListener("click",stopCurrent);
  nextTrackBtn.addEventListener("click",()=>nextPlaylist());
  randomizerBtn?.addEventListener("click",toggleRandomizer);
  playlistModeBtn?.addEventListener("click",cyclePlaylistMode);

  seekRange.addEventListener("pointerdown",()=>{isSeeking=true;});
  seekRange.addEventListener("input",()=>{
    if (!playlistDuration) return;
    const target=(Number(seekRange.value)/1000)*playlistDuration;
    seekAll(target);
  });
  seekRange.addEventListener("change",()=>{isSeeking=false;});
  seekRange.addEventListener("pointerup",()=>{isSeeking=false;});


  mixerSurface.addEventListener("wheel",event=>{
    if (event.ctrlKey || event.metaKey) return;
    const canScroll=horizontalScroller.scrollWidth>horizontalScroller.clientWidth+1;
    if (!canScroll) return;
    const delta=Math.abs(event.deltaY)>=Math.abs(event.deltaX)?event.deltaY:event.deltaX;
    if (delta!==0) { event.preventDefault(); horizontalScroller.scrollLeft+=delta; }
  },{passive:false});

  window.addEventListener("beforeunload",revokeLocalObjectUrls);

  window.addEventListener("resize",()=>{
    if (currentPlaylist) updateGridGeometry(currentPlaylist.stems.length);
  },{passive:true});

  (async function init() {
    setSevenSegmentScreen({
      owner:"WIFEY MIX-8",
      label:"BOOT",
      value:"READY",
      animate:true
    });
    updateRandomizerButton();
    updatePlaylistModeButton(false);
    loadReadout.textContent="INIT";
    const manifest=await getManifest();
    bundledPlaylists=buildPlaylistsFromManifest(manifest);
    playlists=bundledPlaylists;
    populatePlaylistSelect();
    if (!playlists.length) {
      trackReadout.textContent="0/0";
      loadReadout.textContent="NO TRACKS";
      updateGridGeometry(0);
      grid.innerHTML="";
      masterDock.innerHTML=masterMarkup();
      bindControlSurface();
      return;
    }
    await changePlaylist(0,false);
    requestAnimationFrame(animationLoop);
  })();
</script>
</body>
</html>
