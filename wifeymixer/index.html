<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wifey Mix-8</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root{
      --label:#e8e5dc;
      --orange:#d9984f;
      --red:#b94d5b;
      --purple-a:#625db7;
      --purple-b:#504ba5;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      overscroll-behavior:none;
    }

    body{
      min-width:0;
      min-height:0;
      font-family:"Inter",system-ui,sans-serif;
      color:var(--label);
      background:#5752aa;
    }

    /* Equal square checkerboard, rotated exactly 45 degrees. */
    .diamond-bg{
      position:fixed;
      inset:-30vmax;
      z-index:-10;
      transform:rotate(45deg);
      transform-origin:center;
      background:
        linear-gradient(90deg,var(--purple-a) 50%,var(--purple-b) 50%) 0 0/96px 96px,
        linear-gradient(90deg,var(--purple-b) 50%,var(--purple-a) 50%) 0 48px/96px 96px;
    }

    .mixer{
      border:1px solid #08080a;
      border-radius:9px;
      background:
        radial-gradient(circle at 13% 21%,rgba(255,255,255,.020) 0 1px,transparent 1.25px) 0 0/17px 19px,
        radial-gradient(circle at 76% 66%,rgba(0,0,0,.065) 0 1px,transparent 1.3px) 0 0/23px 29px,
        repeating-linear-gradient(90deg,rgba(255,255,255,.007) 0 1px,rgba(0,0,0,.013) 1px 2px,transparent 2px 5px),
        linear-gradient(180deg,#28282c 0%,#202024 22%,#19191d 100%);
      box-shadow:
        0 18px 34px rgba(15,11,43,.34),
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -2px 0 rgba(0,0,0,.48),
        inset 2px 0 0 rgba(255,255,255,.018),
        inset -2px 0 0 rgba(0,0,0,.22);
      isolation:isolate;
    }

    .mixer::before{
      content:"";
      position:absolute;
      inset:4px;
      z-index:-1;
      border:1px solid rgba(255,255,255,.035);
      border-bottom-color:rgba(0,0,0,.35);
      border-radius:6px;
      pointer-events:none;
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.22),
        0 1px 0 rgba(255,255,255,.018);
    }

    .mixer::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      opacity:.24;
      background:
        linear-gradient(102deg,transparent 0 13%,rgba(255,255,255,.016) 13.2% 13.45%,transparent 13.7% 100%),
        linear-gradient(78deg,transparent 0 71%,rgba(0,0,0,.045) 71.2% 71.5%,transparent 71.8% 100%),
        radial-gradient(ellipse at 25% 10%,rgba(255,255,255,.025),transparent 28%),
        radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.075),transparent 30%);
      mix-blend-mode:soft-light;
    }

    .brand{
      font-family:"Archivo Black",system-ui,sans-serif;
      font-size:clamp(16px,2.2vw,29px);
      line-height:1;
      letter-spacing:-.02em;
      color:#dedbd2;
      text-shadow:0 1px 0 #09090a;
      filter:contrast(.98);
    }
    .brand span{
      color:#cf8842;
      font-size:.82em;
      margin-left:.3em;
      text-shadow:0 1px 0 rgba(0,0,0,.75);
    }

    .subbrand{
      margin-top:4px;
      font-size:8px;
      line-height:1;
      font-weight:800;
      letter-spacing:.17em;
      text-transform:uppercase;
      color:#85827c;
    }

    .status-block small{
      display:block;
      margin-bottom:1px;
      font-size:7px;
      line-height:1;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#77746f;
    }
    .status-block strong{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:11px;
      color:#c7d6a7;
    }

    .screw{
      position:absolute;
      z-index:5;
      width:12px;
      height:12px;
      border-radius:50%;
      border:1px solid #08080a;
      background:
        radial-gradient(circle at 36% 30%,#a4a4a6 0 8%,#747477 11% 25%,#47474b 29% 54%,#222226 58% 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,.05),
        0 1px 2px rgba(0,0,0,.8),
        0 0 0 2px rgba(0,0,0,.20);
    }
    .screw::before{
      content:"";
      position:absolute;
      inset:-3px;
      z-index:-1;
      border-radius:50%;
      background:radial-gradient(circle,rgba(0,0,0,.28),transparent 66%);
    }
    .screw::after{
      content:"";
      position:absolute;
      left:2px;
      top:5px;
      width:7px;
      height:1px;
      background:#161619;
      box-shadow:0 1px rgba(255,255,255,.06);
      transform:rotate(-18deg);
    }

    .scroll-wrap{
      scrollbar-gutter:stable;
      overscroll-behavior:contain;
      touch-action:pan-x;
    }
    .scroll-wrap::-webkit-scrollbar{height:8px}
    .scroll-wrap::-webkit-scrollbar-track{
      background:#111115;
      border-top:1px solid #070709;
      box-shadow:inset 0 1px 2px #000;
    }
    .scroll-wrap::-webkit-scrollbar-thumb{
      background:linear-gradient(#4b4b50,#36363b);
      border:1px solid #202024;
      border-radius:2px;
      box-shadow:inset 0 1px rgba(255,255,255,.05);
    }

    .channel-grid{
      display:grid;
      grid-template-columns:116px;
      width:max-content;
      max-width:100%;
      min-width:0;
      height:100%;
      min-height:0;
      overflow:hidden;
      justify-content:start;
      border:1px solid #0f0f12;
      border-radius:4px;
      background:#18181c;
    }

    /* Critical responsive change:
       every strip is an internal grid, and the fader gets ONLY the leftover height.
       Nothing uses a rotated fixed-length slider anymore. */
    .channel{
      position:relative;
      display:grid;
      grid-template-rows:
        auto
        minmax(0,3fr)
        minmax(0,2fr);
      gap:clamp(3px,.55vh,6px);
      height:100%;
      min-height:0;
      overflow:hidden;
      padding:clamp(5px,1vh,9px) 8px clamp(5px,1vh,9px);
      border-right:1px solid #34343a;
      border-left:1px solid rgba(0,0,0,.28);
      background:
        radial-gradient(circle at 18% 21%,rgba(255,255,255,.018) 0 1px,transparent 1.3px) 0 0/14px 17px,
        radial-gradient(circle at 77% 69%,rgba(0,0,0,.05) 0 1px,transparent 1.4px) 0 0/19px 23px,
        linear-gradient(180deg,#232327,#1b1b1f);
      box-shadow:
        inset 1px 0 0 rgba(255,255,255,.018),
        inset -1px 0 0 rgba(0,0,0,.30);
    }
    .channel:nth-child(even){
      background:
        radial-gradient(circle at 18% 21%,rgba(255,255,255,.018) 0 1px,transparent 1.3px) 0 0/14px 17px,
        radial-gradient(circle at 77% 69%,rgba(0,0,0,.05) 0 1px,transparent 1.4px) 0 0/19px 23px,
        linear-gradient(180deg,#252529,#1d1d21);
    }
    .channel::before{
      content:"";
      position:absolute;
      left:5px;
      right:5px;
      top:clamp(19px,3.1vh,26px);
      height:1px;
      pointer-events:none;
      background:linear-gradient(90deg,transparent,#3e3e43 12%,#3e3e43 88%,transparent);
      box-shadow:0 1px 0 rgba(0,0,0,.5);
      opacity:.72;
    }
    .channel::after{
      content:"";
      position:absolute;
      inset:3px;
      pointer-events:none;
      border:1px solid rgba(255,255,255,.012);
      border-bottom-color:rgba(0,0,0,.16);
      border-radius:2px;
    }

    .channel-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:8px;
      line-height:1;
      font-weight:800;
      letter-spacing:.13em;
      text-transform:uppercase;
      color:#d0cdc4;
      text-shadow:0 1px 0 #070709;
      opacity:.94;
    }


    .controls-zone{
      display:grid;
      grid-template-rows:minmax(0,1fr) auto auto;
      gap:clamp(4px,.7vh,7px);
      min-height:0;
      overflow:hidden;
    }

    .fader-zone{
      display:grid;
      min-height:0;
      overflow:hidden;
      align-items:stretch;
      justify-items:center;
      padding-top:clamp(3px,.55vh,6px);
      border-top:1px solid rgba(255,255,255,.025);
      box-shadow:inset 0 1px 0 rgba(0,0,0,.34);
    }

    .knob-stack{
      display:grid;
      grid-template-rows:repeat(3,minmax(0,1fr));
      gap:clamp(3px,.6vh,6px);
      min-height:0;
      height:100%;
    }

    .knob-block{
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      align-items:center;
      min-height:0;
    }

    .tiny-label{
      margin-bottom:clamp(1px,.35vh,4px);
      font-size:7px;
      line-height:1;
      font-weight:700;
      letter-spacing:.11em;
      text-align:center;
      text-transform:uppercase;
      color:#96938b;
      text-shadow:0 1px 0 #08080a;
    }

    .knob-wrap{
      --knob-size:clamp(28px,9vh,68px);
      position:relative;
      width:var(--knob-size);
      height:var(--knob-size);
      margin:0 auto;
      cursor:ns-resize;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
    }
    .knob-wrap::before{
      content:"";
      position:absolute;
      inset:2%;
      border-radius:50%;
      background:
        radial-gradient(circle,#111115 0 58%,#39393d 60% 63%,#101014 66% 100%);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.045),
        0 1px 2px rgba(0,0,0,.85);
    }

    .knob{
      position:absolute;
      inset:9%;
      border:1px solid #08080a;
      border-radius:50%;
      background:
        repeating-conic-gradient(from 2deg,#29292e 0 5deg,#151519 5deg 9deg),
        radial-gradient(circle at 35% 30%,#444449 0 10%,#29292e 28%,#151519 68%,#0b0b0e 100%);
      box-shadow:
        0 2px 1px rgba(0,0,0,.90),
        0 0 0 1px #343439,
        inset 0 1px 0 rgba(255,255,255,.035);
    }

    .knob-cap{
      position:absolute;
      inset:17%;
      border-radius:50%;
      background:
        radial-gradient(circle at 39% 33%,rgba(255,255,255,.045) 0 5%,transparent 7%),
        radial-gradient(circle at 40% 38%,#38383d 0 7%,#29292e 30%,#17171b 70%,#101014 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 0 0 1px rgba(0,0,0,.35);
    }

    .knob-tick{
      position:absolute;
      left:50%;
      top:8%;
      width:2px;
      height:30%;
      margin-left:-1px;
      border-radius:1px;
      background:linear-gradient(90deg,#bdb9af,#f0ece2 55%,#a9a69d);
      box-shadow:0 1px 0 rgba(0,0,0,.7);
      transform-origin:50% 148%;
    }

    .knob-range{
      position:absolute;
      inset:0;
      opacity:0;
      pointer-events:none;
    }

    .knob-mark{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:#817f78;
      box-shadow:0 1px 0 #08080a;
      opacity:.82;
    }
    .knob-mark.m1{left:4%;top:61%}
    .knob-mark.m2{left:19%;top:18%}
    .knob-mark.m3{left:48%;top:0}
    .knob-mark.m4{right:19%;top:18%}
    .knob-mark.m5{right:4%;top:61%}

    .meter{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:3px;
      height:clamp(20px,6.2vh,54px);
      min-height:0;
    }
    .meter-col{
      position:relative;
      width:7px;
      height:100%;
      min-height:12px;
      overflow:hidden;
      border:1px solid #08080a;
      border-radius:1px;
      background:
        repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 2px,#070709 2px 4px);
      box-shadow:
        inset 0 0 4px #000,
        0 1px 0 rgba(255,255,255,.025);
    }
    .meter-col::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.82) 3px 4px);
    }
    .meter-fill{
      position:absolute;
      inset:auto 0 0;
      height:10%;
      transition:height .1s linear;
      background:linear-gradient(to top,#6e9a63 0 72%,#aa914d 72% 88%,#a74350 88% 100%);
      filter:saturate(.78) brightness(.92);
    }

    .buttons{
      display:grid;
      grid-template-columns:1fr;
      gap:clamp(5px,.8vh,8px);
    }

    .hw-button{
      position:relative;
      height:clamp(23px,3.8vh,31px);
      min-height:0;
      border:1px solid #070709;
      border-radius:2px;
      font-size:7px;
      line-height:1;
      font-weight:800;
      letter-spacing:.05em;
      cursor:pointer;
      color:#1a1713;
      background:
        linear-gradient(180deg,rgba(255,255,255,.12),transparent 17%),
        linear-gradient(180deg,#bdb7a6 0%,#a59f90 78%,#8d887c 100%);
      box-shadow:
        0 2px 0 #08080a,
        0 0 0 2px #2b2b30,
        inset 0 1px 0 rgba(255,255,255,.20),
        inset 0 -1px 0 rgba(0,0,0,.16);
      text-shadow:0 1px rgba(255,255,255,.18);
    }
    .hw-button::after{
      content:"";
      position:absolute;
      inset:3px 4px;
      pointer-events:none;
      border-radius:1px;
      border-top:1px solid rgba(255,255,255,.055);
      border-bottom:1px solid rgba(0,0,0,.12);
    }
    .hw-button[data-kind="mute"]{
      background:
        linear-gradient(180deg,rgba(255,255,255,.11),transparent 17%),
        linear-gradient(180deg,#d49a59,#bc7f42 78%,#9c6734);
      color:#25190d;
    }
    .hw-button[data-kind="arm"]{
      background:
        linear-gradient(180deg,rgba(255,255,255,.09),transparent 17%),
        linear-gradient(180deg,#bd5966,#a83f4e 78%,#84303d);
      color:#f2e7e8;
      text-shadow:0 1px rgba(0,0,0,.4);
    }
    .hw-button.active{
      filter:brightness(1.05);
      transform:translateY(1px);
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #242429,
        inset 0 2px 3px rgba(0,0,0,.28),
        inset 0 0 0 1px rgba(255,255,255,.04);
    }

    /* FADER BAY:
       This row is minmax(..., 1fr), so it can shrink/grow safely with browser zoom.
       The visual thumb is positioned INSIDE the bay and can never overlap buttons. */
    .fader-bay{
      --fader-y:50%;
      position:relative;
      width:clamp(44px,5vw,56px);
      height:100%;
      min-height:0;
      max-height:none;
      margin:0 auto;
      align-self:stretch;
      overflow:hidden;
      border:1px solid #09090b;
      border-radius:2px;
      background:
        radial-gradient(circle at 18% 16%,rgba(255,255,255,.025) 0 1px,transparent 1.2px) 0 0/12px 15px,
        linear-gradient(90deg,#17171b,#111115 42%,#101014 58%,#17171b);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        inset 0 -1px 0 rgba(0,0,0,.55),
        inset 3px 0 5px rgba(0,0,0,.26),
        inset -3px 0 5px rgba(0,0,0,.26),
        0 0 0 1px #2a2a2f;
      cursor:ns-resize;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
    }
    .fader-bay::before{
      content:"";
      position:absolute;
      inset:4px;
      pointer-events:none;
      border:1px solid rgba(255,255,255,.017);
      border-bottom-color:rgba(0,0,0,.28);
    }
    .fader-bay::after{
      content:"";
      position:absolute;
      left:9px;
      right:9px;
      bottom:4px;
      height:4px;
      pointer-events:none;
      opacity:.18;
      background:radial-gradient(ellipse,rgba(165,155,136,.34),transparent 70%);
      filter:blur(1px);
    }

    .fader-slot{
      position:absolute;
      top:9px;
      bottom:9px;
      left:50%;
      width:7px;
      transform:translateX(-50%);
      border-left:1px solid #323238;
      border-right:1px solid #323238;
      background:linear-gradient(90deg,#020203,#09090b 48%,#020203);
      box-shadow:
        inset 1px 0 2px #000,
        inset -1px 0 2px #000,
        0 0 0 1px rgba(255,255,255,.014);
    }

    .fader-scale-left,.fader-scale-right{
      position:absolute;
      top:8px;
      bottom:8px;
      width:8px;
      opacity:.67;
      background:
        repeating-linear-gradient(to bottom,#807d75 0 1px,transparent 1px 14px);
      filter:drop-shadow(0 1px 0 #000);
    }
    .fader-scale-left{left:5px}
    .fader-scale-right{right:5px}

    .fader-thumb{
      position:absolute;
      z-index:2;
      left:50%;
      top:var(--fader-y);
      width:31px;
      height:23px;
      transform:translate(-50%,-50%);
      border:1px solid #0e0e12;
      border-radius:2px;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent 0 47%,#b9b6ad 47% 53%,transparent 53% 100%),
        repeating-linear-gradient(to bottom,#5f5f64 0 2px,#3b3b40 2px 4px);
      box-shadow:
        0 2px 2px rgba(0,0,0,.88),
        0 0 0 1px #27272c,
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -2px 2px rgba(0,0,0,.34);
    }

    .fader{
      position:absolute;
      inset:0;
      opacity:0;
      pointer-events:none;
    }

    .master-strip{
      background:
        radial-gradient(circle at 18% 21%,rgba(255,255,255,.018) 0 1px,transparent 1.3px) 0 0/14px 17px,
        linear-gradient(180deg,#26262a,#1d1d21) !important;
      border-left:1px solid #3a3a40;
      box-shadow:
        inset 2px 0 0 rgba(255,255,255,.018),
        inset 4px 0 7px rgba(0,0,0,.16);
    }



    .master-meter-wrap{
      display:flex;
      justify-content:center;
      gap:4px;
      height:clamp(26px,5.5vh,52px);
      margin:clamp(3px,.6vh,6px) 0;
    }
    .master-meter-wrap .meter-col{width:7px;height:100%}

    .master-value{
      margin-bottom:clamp(3px,.6vh,6px);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:9px;
      line-height:1;
      text-align:center;
      color:#c6d8a3;
    }

    .footer-note{
      flex:0 0 auto;
      margin-top:clamp(3px,.7vh,7px);
      padding:0 3px;
      font-size:8px;
      line-height:1;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#c9c4b7;
      text-shadow:0 1px rgba(0,0,0,.35);
    }

    /* Browser zoom changes control sizing, never the 60/40 strip ratio.
       The fader zone always remains 2fr out of the 5fr body area. */
    @media (max-height:650px){
      .subbrand{display:none}
      .brand{font-size:17px}
      .status-block small{display:none}
      .channel{gap:3px;padding-top:4px;padding-bottom:4px}
      .controls-zone{gap:3px}
      .knob-stack{gap:2px}
      .knob-wrap{--knob-size:clamp(28px,8.7vh,54px)}
      .tiny-label{font-size:6px;margin-bottom:1px}
      .meter{height:clamp(18px,5.7vh,38px)}
      .hw-button{height:clamp(20px,3.8vh,25px)}
    }

    @media (max-height:500px){
      .channel{gap:2px;padding-top:3px;padding-bottom:3px}
      .controls-zone{gap:2px}
      .knob-stack{gap:1px}
      .knob-wrap{--knob-size:clamp(24px,8.2vh,39px)}
      .tiny-label{font-size:5px;margin-bottom:0}
      .meter{height:clamp(14px,4.8vh,24px)}
      .hw-button{height:clamp(17px,3.7vh,20px)}
      .channel-name{font-size:7px}
      .fader-zone{padding-top:2px}
    }

    @media (max-height:410px){
      .channel{gap:1px;padding-top:2px;padding-bottom:2px}
      .controls-zone{gap:1px}
      .knob-stack{gap:0}
      .knob-wrap{--knob-size:clamp(20px,7.6vh,29px)}
      .tiny-label{display:none}
      .meter{height:clamp(10px,3.6vh,15px)}
      .hw-button{height:15px;font-size:6px}
      .fader-zone{padding-top:1px}
    }

  
    /* ===== WIFEY MIX-8 / worn analogue hardware pass ===== */

    .mixer{
      background:
        radial-gradient(circle at 18% 17%,rgba(255,255,255,.030) 0 1px,transparent 1.25px) 0 0/13px 17px,
        radial-gradient(circle at 73% 62%,rgba(0,0,0,.115) 0 1px,transparent 1.45px) 0 0/19px 23px,
        repeating-linear-gradient(91deg,rgba(255,255,255,.007) 0 1px,transparent 1px 4px),
        repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px),
        linear-gradient(180deg,#2b2b2f 0%,#242428 18%,#1c1c20 68%,#18181c 100%);
      box-shadow:
        0 18px 36px rgba(11,8,36,.40),

    /* ===== amber hardware parameter readout ===== */
    .casio-readout{
      position:relative;
      width:clamp(184px,24vw,310px);
      height:clamp(44px,6.6vh,57px);
      min-width:0;
      overflow:hidden;
      border:1px solid #080706;
      border-radius:3px;
      padding:5px 9px 5px;
      color:#2a1707;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(82,37,4,.045) 0 1px,
          transparent 1px 3px
        ),
        radial-gradient(ellipse at 50% 35%,rgba(255,205,112,.36),transparent 61%),
        linear-gradient(180deg,#e89a3e 0%,#d9852d 48%,#bc681e 100%);
      box-shadow:
        0 2px 0 #08080a,
        0 0 0 2px #343035,
        0 0 0 3px #111014,
        inset 0 1px 0 rgba(255,224,171,.34),
        inset 0 0 13px rgba(91,35,2,.34),
        inset 0 -5px 9px rgba(72,27,1,.14);
      font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,monospace;
      font-variant-numeric:tabular-nums;
      text-shadow:0 1px 0 rgba(255,197,101,.18);
      isolation:isolate;
    }

    .casio-readout::before{
      content:"";
      position:absolute;
      inset:-3px;
      z-index:-2;
      border-radius:5px;
      background:
        linear-gradient(180deg,#2b292b,#151417);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        inset 0 -1px 0 #050506;
    }

    .casio-readout::after{
      content:"";
      position:absolute;
      left:5px;
      right:5px;
      bottom:3px;
      height:1px;
      pointer-events:none;
      background:rgba(56,22,1,.26);
      box-shadow:0 -1px rgba(255,189,85,.11);
    }

    .casio-readout__glass{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:
        linear-gradient(110deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.035) 20%,transparent 43%),
        radial-gradient(ellipse at 76% 0%,rgba(255,235,194,.13),transparent 38%);
      mix-blend-mode:screen;
      opacity:.62;
    }

    .casio-readout__ghost{
      position:absolute;
      right:8px;
      bottom:2px;
      z-index:0;

      font-size:clamp(23px,4.2vh,35px);
      font-weight:900;
      letter-spacing:-.09em;
      line-height:1;
      pointer-events:none;
      user-select:none;
    }

    .casio-readout__top,
    .casio-readout__main{
      position:relative;
      z-index:2;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .casio-readout__top{
      gap:8px;
      height:34%;
      overflow:hidden;
      border-bottom:1px solid rgba(71,28,2,.19);
      font-size:clamp(6px,1.05vh,8px);
      font-weight:900;
      line-height:1;
      letter-spacing:.075em;
      text-transform:uppercase;
      color:rgba(54,25,5,.76);

    #controlReadoutOwner{

    .casio-readout__track{

    .casio-readout__label{

        inset 0 2px 4px rgba(0,0,0,.35) !important;
    }

    .transport-btn--stop:active,
    .master-stop-btn:active{
      color:#fff0ec !important;
      background:
        radial-gradient(ellipse at 50% 52%,#ff7d80 0%,#d9404c 44%,transparent 74%),
        linear-gradient(180deg,#d84b57,#a72431 70%,#73131d) !important;
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #381b20,
        0 0 7px rgba(255,53,66,.68),
        inset 0 0 8px rgba(255,174,172,.55) !important;
    }

    /* Randomizer + megaphone are amber backlit latching switches. */
    .transport-btn--randomizer.active,
    .megaphone-btn.active{
      color:#291605 !important;
      filter:saturate(1.08) brightness(1.06) !important;
      background:
        radial-gradient(ellipse at 50% 52%,#ffd37d 0%,#e49a42 43%,transparent 74%),
        linear-gradient(180deg,#e6aa59,#bc7530 70%,#85491d) !important;
      text-shadow:0 1px rgba(255,231,188,.28) !important;
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #392918,
        0 0 8px rgba(238,145,44,.65),
        0 0 14px rgba(232,116,28,.21),
        inset 0 0 8px rgba(255,224,157,.58),
        inset 0 -3px 4px rgba(92,44,5,.23) !important;
    }

    .megaphone-btn.active::before{
      opacity:.86;
      background:radial-gradient(ellipse at 50% 54%,rgba(255,242,200,.80),rgba(232,144,44,.28) 54%,transparent 77%);
    }

    /* Grey transport navigation gets a brief warm-white lamp flash when pressed. */
    .transport-btn--nav:active{
      color:#171611 !important;
      background:
        radial-gradient(ellipse at 50% 52%,#f0e7ce 0%,#aaa38f 45%,transparent 74%),
        linear-gradient(180deg,#b8b09c,#847e70 72%,#625e54) !important;
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #35322c,
        0 0 6px rgba(239,221,180,.34),
        inset 0 0 7px rgba(255,247,222,.48) !important;
    }

    /* Pressed caps sit fractionally deeper in their bezels. */
    .hw-button.active,
    .transport-btn.playing,
    .transport-btn--randomizer.active,
    .megaphone-btn.active{
      transform:translateY(1px);
    }

  
    /* Compact strip bank: individual stems never balloon when there are only a few. */
    .scroll-wrap{
      background:
        radial-gradient(circle at 17% 18%,rgba(255,255,255,.012) 0 1px,transparent 1.2px) 0 0/13px 17px,
        linear-gradient(180deg,#202024,#18181c);
    }

    .channel-grid{
      flex:none;
      align-self:stretch;
    }

    @media(max-width:900px){
      .channel-grid{
        max-width:none;
      }
    }

  
    /* ===== playlist mode rotary-style selector button ===== */
    .transport-btn--playlist-mode{
      width:clamp(30px,3.3vw,38px) !important;
      min-width:clamp(30px,3.3vw,38px) !important;
      padding:0 !important;
      color:#b7b0a3 !important;
      background:
        linear-gradient(180deg,rgba(255,255,255,.055),transparent 18%),
        linear-gradient(180deg,#504d53,#343238 72%,#26252a) !important;
      border-color:#111014 !important;
      box-shadow:
        0 2px 0 #070709,
        0 0 0 2px #28262b,
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -2px 2px rgba(0,0,0,.29) !important;
    }

    .transport-btn--playlist-mode i{
      font-size:10px;
      transition:transform .12s ease,filter .12s ease;
    }

    .transport-btn--playlist-mode[data-mode="loop"]{
      color:#2a1705 !important;
      background:
        radial-gradient(ellipse at 50% 52%,#ffd37c 0%,#dc9840 44%,transparent 73%),
        linear-gradient(180deg,#daa151,#ad6b2d 70%,#7c451b) !important;
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #382819,
        0 0 6px rgba(230,142,43,.38),
        inset 0 0 7px rgba(255,224,156,.48) !important;
    }

    .transport-btn--playlist-mode[data-mode="shuffle"]{
      color:#15200f !important;
      background:
        radial-gradient(ellipse at 50% 52%,#d5eba1 0%,#93b96e 44%,transparent 73%),
        linear-gradient(180deg,#9ebf78,#6f9553 70%,#506b3c) !important;
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #293423,
        0 0 6px rgba(149,196,99,.34),
        inset 0 0 7px rgba(228,255,193,.44) !important;
    }

    .transport-btn--playlist-mode[data-mode="sequential"]{
      color:#23140a !important;
      background:
        radial-gradient(ellipse at 50% 52%,#f3d7ae 0%,#c5a06f 44%,transparent 73%),
        linear-gradient(180deg,#c7aa82,#947650 70%,#6a5337) !important;
      box-shadow:
        0 1px 0 #070709,
        0 0 0 2px #332b22,
        0 0 6px rgba(207,167,110,.26),
        inset 0 0 7px rgba(255,238,204,.40) !important;
    }

    .transport-btn--playlist-mode:active{
      transform:translateY(1px);
    }

    @media(max-height:500px){
      .transport-btn--playlist-mode{
        width:27px !important;
        min-width:27px !important;
      }
    }

  
    /* ===== genuine seven-segment amber LED module ===== */
    .seven-screen{
      --led:#ff9d2e;
      --led-hot:#ffd18a;
      --led-off:rgba(91,42,9,.18);
      --digit-w:clamp(6px,.72vw,10px);
      --digit-h:calc(var(--digit-w) * 1.82);
      --seg:calc(var(--digit-w) * .22);

      position:relative;
      width:clamp(190px,26vw,326px);
      height:clamp(48px,7.2vh,63px);
      min-width:0;
      overflow:hidden;
      border:1px solid #050404;
      border-radius:3px;
      background:#0c0805;
      box-shadow:
        0 2px 0 #070709,
        0 0 0 2px #353137,
        0 0 0 3px #101014,
        inset 0 2px 7px rgba(0,0,0,.94),
        inset 0 -1px 0 rgba(255,190,96,.025);
      isolation:isolate;
    }

    .seven-screen__bezel{
      position:absolute;
      inset:3px;
      z-index:0;
      border:1px solid #1d130c;
      border-radius:1px;
      background:
        radial-gradient(ellipse at 50% 35%,rgba(92,39,7,.14),transparent 68%),
        linear-gradient(180deg,#140c07,#090604);
      box-shadow:
        inset 0 1px 5px #000,
        inset 0 0 0 1px rgba(255,164,61,.018);
    }

    .seven-screen__glass{
      position:absolute;
      inset:4px;
      z-index:5;
      pointer-events:none;
      border-radius:1px;
      background:
        linear-gradient(112deg,rgba(255,233,196,.065),transparent 22% 69%,rgba(255,179,79,.025)),
        repeating-linear-gradient(to bottom,rgba(255,143,36,.018) 0 1px,transparent 1px 3px);
      box-shadow:
        inset 0 0 12px rgba(0,0,0,.46);
      opacity:.75;
    }

    .seven-screen__display{
      position:absolute;
      inset:6px 8px;
      z-index:2;
      display:grid;
      grid-template-rows:minmax(0,.72fr) minmax(0,1.28fr);
      gap:3px;
      overflow:hidden;
    }

    .seven-screen__top,
    .seven-screen__main{
      display:flex;
      min-width:0;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      overflow:hidden;
    }

    .seven-screen__top{
      padding-bottom:2px;
      border-bottom:1px solid rgba(255,126,30,.085);
      opacity:.72;
    }

    .seven-screen__main{
      align-items:flex-end;
    }

    .seven-text{
      display:flex;
      align-items:center;
      gap:1px;
      min-width:0;
      height:100%;
      overflow:hidden;
      white-space:nowrap;
    }

    .seven-text--owner,
    .seven-text--label{
      justify-content:flex-start;
      flex:1 1 auto;
    }

    .seven-text--track,
    .seven-text--value{
      justify-content:flex-end;
      flex:0 0 auto;
    }

    .seven-screen__top{
      --digit-w:clamp(4.4px,.49vw,6.7px);
    }

    .seven-screen__main{
      --digit-w:clamp(6.1px,.72vw,10.2px);
    }

    .seven-char{
      position:relative;
      flex:0 0 var(--digit-w);
      width:var(--digit-w);
      height:var(--digit-h);
      filter:drop-shadow(0 0 1px rgba(255,120,18,.09));
    }

    .seven-char--space{
      opacity:0;
    }

    .seven-seg{
      position:absolute;
      display:block;
      opacity:1;
      background:var(--led-off);
      transition:
        background .035s linear,
        box-shadow .035s linear,
        filter .035s linear;
    }

    .seven-seg.on{
      background:
        linear-gradient(
          180deg,
          var(--led-hot) 0%,
          var(--led) 28%,
          #e77617 100%
        );
      box-shadow:
        0 0 2px rgba(255,160,44,.92),
        0 0 5px rgba(255,117,17,.54),
        inset 0 0 1px rgba(255,247,215,.48);
      filter:saturate(1.1) brightness(1.08);
    }

    /* a / g / d */
    .seven-seg.a,
    .seven-seg.g,
    .seven-seg.d{
      left:var(--seg);
      width:calc(100% - var(--seg) * 2);
      height:var(--seg);
      clip-path:polygon(
        calc(var(--seg) * .5) 0,
        calc(100% - var(--seg) * .5) 0,
        100% 50%,
        calc(100% - var(--seg) * .5) 100%,
        calc(var(--seg) * .5) 100%,
        0 50%
      );
    }

    .seven-seg.a{top:0}
    .seven-seg.g{top:calc(50% - var(--seg) / 2)}
    .seven-seg.d{bottom:0}

    /* f / b / e / c */
    .seven-seg.f,
    .seven-seg.b,
    .seven-seg.e,
    .seven-seg.c{
      width:var(--seg);
      height:calc(50% - var(--seg) * .72);
      clip-path:polygon(
        50% 0,
        100% calc(var(--seg) * .55),
        100% calc(100% - var(--seg) * .55),
        50% 100%,
        0 calc(100% - var(--seg) * .55),
        0 calc(var(--seg) * .55)
      );
    }

    .seven-seg.f{left:0;top:calc(var(--seg) * .42)}
    .seven-seg.b{right:0;top:calc(var(--seg) * .42)}
    .seven-seg.e{left:0;bottom:calc(var(--seg) * .42)}
    .seven-seg.c{right:0;bottom:calc(var(--seg) * .42)}

    .seven-dot{
      position:absolute;
      right:calc(var(--seg) * -.15);
      bottom:0;
      width:calc(var(--seg) * .68);
      height:calc(var(--seg) * .68);
      border-radius:50%;
      background:var(--led-off);
    }

    .seven-dot.on{
      background:var(--led-hot);
      box-shadow:
        0 0 2px rgba(255,163,49,.95),
        0 0 5px rgba(255,113,17,.55);
    }

    .seven-colon{
      position:absolute;
      right:calc(var(--seg) * -.2);
      top:32%;
      width:calc(var(--seg) * .55);
      height:calc(var(--seg) * .55);
      border-radius:50%;
      background:var(--led-hot);
      box-shadow:0 0 3px rgba(255,129,22,.55);
    }

    .seven-colon::after{
      content:"";
      position:absolute;
      left:0;
      top:calc(var(--seg) * 1.9);
      width:100%;
      height:100%;
      border-radius:inherit;
      background:inherit;
      box-shadow:inherit;
    }

    .seven-screen.is-active{
      box-shadow:
        0 2px 0 #070709,
        0 0 0 2px #353137,
        0 0 0 3px #101014,
        0 0 9px rgba(225,113,23,.12),
        inset 0 2px 7px rgba(0,0,0,.94);
    }

    @media(max-width:640px){
      .seven-screen{
        width:clamp(174px,48vw,230px);
        --digit-w:clamp(5.4px,1.45vw,8.4px);
      }
      .seven-screen__display{inset-left:6px;inset-right:6px}
      .seven-screen__main{gap:5px}
    }

    @media(max-height:500px){
      .seven-screen{
        width:clamp(176px,29vw,258px);
        height:40px;
      }
      .seven-screen__display{
        inset:4px 7px;
        gap:2px;
      }
      .seven-screen__top{
        --digit-w:4.5px;
      }
      .seven-screen__main{
        --digit-w:6.3px;
      }
    }

  
    .seven-screen .casio-readout__top,
    .seven-screen .casio-readout__main,
    .seven-screen .casio-readout__value,
    .seven-screen .casio-readout__label,
    .seven-screen .casio-readout__ghost{
      display:none !important;
    }

  
    /* ===== fixed master dock / scrolling stems only ===== */
    .mixer-bank{
      isolation:isolate;
      background:
        radial-gradient(circle at 16% 20%,rgba(255,255,255,.012) 0 1px,transparent 1.2px) 0 0/13px 17px,
        linear-gradient(180deg,#202024,#18181c);
    }

    .mixer-bank .scroll-wrap{
      position:relative;
      z-index:1;
      height:100%;
      scrollbar-gutter:stable;
      overscroll-behavior:contain;
      touch-action:pan-x;
      border:1px solid #0f0f12;
      border-right:0;
      border-radius:4px 0 0 4px;
      background:
        radial-gradient(circle at 17% 18%,rgba(255,255,255,.012) 0 1px,transparent 1.2px) 0 0/13px 17px,
        linear-gradient(180deg,#202024,#18181c);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.012),
        inset 0 -1px 0 rgba(0,0,0,.30);
    }

    .channel-grid{
      height:100%;
      min-height:0;
      border:0 !important;
      border-radius:0 !important;
      background:transparent !important;
      overflow:hidden;
      justify-content:start;
    }

    .master-dock{
      position:relative;
      z-index:5;
      align-self:stretch;
      border:1px solid #09090b;
      border-left:2px solid #08080a;
      border-radius:0 4px 4px 0;
      background:
        linear-gradient(90deg,rgba(255,255,255,.018),transparent 8%),
        linear-gradient(180deg,#29292d,#1b1b1f);
      box-shadow:
        -5px 0 10px rgba(0,0,0,.34),
        inset 1px 0 0 rgba(255,255,255,.025),
        inset 0 1px 0 rgba(255,255,255,.018);
    }

    .master-dock .master-strip{
      width:100%;
      height:100%;
      border-left:0 !important;
      border-right:0 !important;
    }

    /* Scrollbar ends before the master, emphasizing that the master never moves. */
    .mixer-bank .scroll-wrap::-webkit-scrollbar{
      height:8px;
    }

    @media(max-width:520px){
      .master-dock{
        width:104px !important;
        min-width:104px !important;
        max-width:104px !important;
      }
    }

  
    /* LED semantics:
       OFF    = muted
       RED    = track is active / not muted
       YELLOW = track is soloed (takes priority over red) */

    .mute-led.is-solo{
      background:
        radial-gradient(circle at 50% 48%,rgba(255,210,72,.46) 0 40%,#3a2b08 43% 64%,#4b4330 67% 78%,#0b0a0c 81% 100%);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.06),
        0 1px 1px rgba(0,0,0,.86),
        0 0 0 1px #3b3323,
        0 0 7px rgba(255,207,52,.78),
        0 0 14px rgba(255,182,26,.30);
    }

    .mute-led.is-solo .mute-led__lens{
      background:
        radial-gradient(circle at 31% 24%,#fff8cb 0 9%,rgba(255,250,205,.66) 10% 14%,transparent 16%),
        radial-gradient(circle at 48% 52%,#ffe05e 0 30%,#f6c72c 48%,#b57a07 72%,#5d3b03 100%);
      box-shadow:
        0 0 4px rgba(255,220,70,.96),
        0 0 7px rgba(255,185,26,.52),
        inset 0 -1px 2px rgba(95,57,0,.34),
        inset 0 1px 1px rgba(255,255,235,.34);
    }

  
    /* ===== industrial 0.56-inch-style seven-segment geometry =====
       Proportions mirror common instrument modules:
       digit envelope ~0.563 W:H, long tapered horizontals, subtly
       slanted verticals, consistent center gaps, tight bank spacing. */

    .seven-screen{
      --led-on:#ff9a26;
      --led-core:#ffd28b;
      --led-edge:#dc6d12;
      --led-off:#261307;
      --led-off-edge:#321a0b;
    }

    .seven-screen__bezel{
      background:
        radial-gradient(ellipse at 50% 30%,rgba(88,37,7,.10),transparent 70%),
        linear-gradient(180deg,#130c08,#080503) !important;
    }

    .seven-screen__display{
      inset:6px 8px !important;
      gap:3px !important;
    }

    .seven-screen__top{
      --digit-height:clamp(10px,1.65vh,14px);
      gap:7px !important;
    }

    .seven-screen__main{
      --digit-height:clamp(18px,3.35vh,28px);
      gap:6px !important;
      align-items:center !important;
    }

    .seven-text{
      gap:clamp(1px,.11vw,2px) !important;
    }

    .seven-char{
      position:relative;
      display:inline-block;
      flex:0 0 calc(var(--digit-height) * .563);
      width:calc(var(--digit-height) * .563);
      height:var(--digit-height);
      filter:none !important;
    }

    .seven-char--space{
      opacity:1 !important;
    }

    .seven-svg{
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
    }

    .seven-svg .seg-shape{
      fill:var(--led-off);
      stroke:var(--led-off-edge);
      stroke-width:.55;
      vector-effect:non-scaling-stroke;
      transition:
        fill .045s linear,
        stroke .045s linear,
        filter .045s linear,
        opacity .045s linear;
      opacity:.72;
    }

    .seven-svg .seg-shape.on{
      fill:var(--led-on);
      stroke:var(--led-core);
      opacity:1;
      filter:
        drop-shadow(0 0 .65px rgba(255,217,151,.72))
        drop-shadow(0 0 1.7px rgba(255,127,22,.72))
        drop-shadow(0 0 3.6px rgba(255,101,12,.26));
    }

    .seven-svg .seg-highlight{
      fill:rgba(255,245,214,.26);
      opacity:0;
      pointer-events:none;
    }

    .seven-svg .seg-highlight.on{
      opacity:.55;
    }

    .seven-decimal{
      position:absolute;
      right:-8%;
      bottom:2.5%;
      width:16%;
      aspect-ratio:1;
      border-radius:50%;
      background:var(--led-on);
      box-shadow:
        0 0 1px rgba(255,231,184,.76),
        0 0 3px rgba(255,126,19,.68);
    }

    .seven-colon-svg circle{
      fill:var(--led-on);
      stroke:var(--led-core);
      stroke-width:.45;
      filter:drop-shadow(0 0 2px rgba(255,120,18,.62));
    }

    /* The real module look is dim segments behind smoked glass,
       not bright ghost strokes everywhere. */
    .seven-screen__glass{
      opacity:.48 !important;
      background:
        linear-gradient(111deg,rgba(255,239,211,.055),transparent 22% 73%,rgba(255,172,65,.018)),
        repeating-linear-gradient(to bottom,rgba(255,143,36,.012) 0 1px,transparent 1px 3px) !important;
    }

    @media(max-width:640px){
      .seven-screen__top{--digit-height:10px}
      .seven-screen__main{--digit-height:clamp(17px,5vw,23px)}
      .seven-text{gap:1px !important}
    }

    @media(max-height:500px){
      .seven-screen__top{--digit-height:9px}
      .seven-screen__main{--digit-height:17px}
      .seven-screen__display{inset:4px 7px !important}
    }

  </style>
</head>

<body>
  <div class="diamond-bg" aria-hidden="true"></div>

  <main class="fixed inset-0 h-[100dvh] w-screen overflow-hidden p-1.5 sm:p-2 lg:p-4">
    <section class="mixer relative flex h-full min-h-0 w-full min-w-0 flex-col overflow-hidden p-2 sm:p-2.5 lg:p-3" aria-label="Wifey Mix-8 digital mixer">
      <div class="screw left-2 top-2"></div>
      <div class="screw right-2 top-2"></div>
      <div class="screw bottom-2 left-2"></div>
      <div class="screw bottom-2 right-2"></div>

      <header class="relative z-[1] flex flex-none items-end justify-between gap-3 border-b border-[#34343a] px-2 pb-2 pt-0.5">
        <div class="min-w-0">
          <div class="brand">WIFEY <span>MIX-8</span></div>
          <div class="subbrand">compact analogue stem mixer</div>
          <div class="mt-1 hidden text-[6px] font-bold uppercase tracking-[0.16em] text-[#625f59] sm:block">
            STEM PLAYBACK CONSOLE · DYNAMIC CHANNELS · WEB AUDIO
          </div>
        </div>

        <div class="flex min-w-0 flex-none items-end gap-2 sm:gap-3">
          <div id="hardwareReadout" class="seven-screen" role="status" aria-live="polite" aria-atomic="true">
            <div class="seven-screen__bezel" aria-hidden="true"></div>
            <div class="seven-screen__glass" aria-hidden="true"></div>

            <div class="seven-screen__display" aria-hidden="true">
              <div class="seven-screen__top">
                <div id="sevenOwner" class="seven-text seven-text--owner"></div>
                <div id="sevenTrack" class="seven-text seven-text--track"></div>
              </div>

              <div class="seven-screen__main">
                <div id="sevenLabel" class="seven-text seven-text--label"></div>
                <div id="sevenValue" class="seven-text seven-text--value"></div>
              </div>
            </div>

            <span id="controlReadoutOwner" class="sr-only">WIFEY MIX-8</span>
            <span id="controlReadoutLabel" class="sr-only">READY</span>
            <span id="controlReadoutValue" class="sr-only">0.0 dB</span>
            <span id="trackReadout" class="sr-only">--</span>
            <span id="masterReadout" class="sr-only">-0.9 dB</span>
          </div>

          <div class="hidden h-7 w-px bg-[#35353a] shadow-[1px_0_0_#0b0b0d] sm:block"></div>
          <div class="hidden text-left text-[6px] font-extrabold uppercase leading-[1.25] tracking-[0.13em] text-[#66635e] lg:block">
            SER. WF-08<br>REV 03
          </div>
        </div>
      </header>


      <div class="transport-rack relative z-[2] mt-1 flex flex-none items-center gap-1.5 overflow-hidden px-2 py-1">
        <button id="prevTrackBtn" class="transport-btn transport-btn--nav" type="button" title="Previous folder" aria-label="Previous folder">

<script>
  const EMBEDDED_MANIFEST = {"files":["index.html","lillie_track_6/bass.mp3","lillie_track_6/drums.mp3","lillie_track_6/guitar.mp3","lillie_track_6/strings.mp3","lillie_track_6/vibes.mp3","lillie_track_6/yamaha synth.mp3"]};

  const PERSIST_KEY = "wifey-mix8-persistent-v1";

  function loadPersistentPrefs() {
    try {
      const raw = localStorage.getItem(PERSIST_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        randomizerEnabled: !!parsed.randomizerEnabled,
        megaphoneEnabled: !!parsed.megaphoneEnabled,
        playlistMode: ["loop","shuffle","sequential"].includes(parsed.playlistMode)
          ? parsed.playlistMode
          : "loop",
        lockedStemIds: parsed.lockedStemIds && typeof parsed.lockedStemIds === "object"
          ? parsed.lockedStemIds
          : {},
        stemStates: parsed.stemStates && typeof parsed.stemStates === "object"
          ? parsed.stemStates
          : {},
        masterState: parsed.masterState && typeof parsed.masterState === "object"
          ? parsed.masterState
          : null
      };
    } catch (_) {
      return {
        randomizerEnabled:false,
        megaphoneEnabled:false,
        playlistMode:"loop",
        lockedStemIds:{},
        stemStates:{},
        masterState:null
      };

  }

  const persistentPrefs = loadPersistentPrefs();

  let megaphoneEnabled = !!persistentPrefs.megaphoneEnabled;
  let playlistMode = persistentPrefs.playlistMode || "loop";
  let playlistAdvanceInProgress = false;

    } catch (_) {}
  }

  function persistentStemId(stem) {
    return String(stem?.displayPath || stem?.key || stem?.name || "");
  }

  function isStemLocked(stem) {
    const id = persistentStemId(stem);
    return !!(id && persistentPrefs.lockedStemIds[id]);
  }

  function setStemLocked(stem,locked) {
    const id = persistentStemId(stem);

    if (locked) persistentPrefs.lockedStemIds[id] = true;

  let audioCtx = null;

  let reverb = null;
  let fxReturn = null;

  // Global megaphone parallel path.
  let megaphoneDry = null;
  let megaphoneWet = null;
  let megaHighpass = null;
  let megaResonance = null;
  let megaLowpass = null;
  let megaDrive = null;

  const masterState = {
    tone: Number(persistentPrefs.masterState?.tone ?? 100),
    pan: Number(persistentPrefs.masterState?.pan ?? 50),
    room: Number(persistentPrefs.masterState?.room ?? 35),
    level: Number(persistentPrefs.masterState?.level ?? 80)
  };

  const savedStemState = new Map();

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    })[char]);
  }

  function stripExtension(filename) {
    return String(filename).replace(/\.[^.]+$/, "");
  }

  function prettifyFolder(folder) {
    const last = String(folder).split("/").filter(Boolean).pop() || "playlist";
    return last.replace(/[_-]+/g," ").replace(/\s+/g," ").trim();
  }

  function parentFolder(path) {
    const parts = String(path).split("/").filter(Boolean);
    return parts.length > 1 ? parts.slice(0,-1).join("/") : "root";
  }

  function basename(path) {
    return String(path).split("/").filter(Boolean).pop() || String(path);
  }

  function buildPlaylistsFromManifest(manifest) {
    const groups = new Map();
    for (const file of (manifest?.files || [])) {
      if (!AUDIO_EXT_RE.test(file)) continue;
      const folder = parentFolder(file);
      if (!groups.has(folder)) groups.set(folder, []);
      groups.get(folder).push({
        key:`bundle:${file}`,
        name:stripExtension(basename(file)),
        src:file,
        displayPath:file,
        kind:"url"
      });
    }
    return [...groups.entries()].map(([folder,stems],index)=>({
      id:`bundle:${folder}`,
      folder,
      title:prettifyFolder(folder),
      stems,
      source:"bundled",
      order:index
    }));
  }

  function buildPlaylistsFromFiles(fileList) {
    revokeLocalObjectUrls();
    const groups = new Map();
    for (const file of [...fileList]) {
      const rel = file.webkitRelativePath || file.name;
      if (!(file.type?.startsWith("audio/") || AUDIO_EXT_RE.test(rel))) continue;
      const folder = parentFolder(rel);
      if (!groups.has(folder)) groups.set(folder, []);
      const objectUrl = URL.createObjectURL(file);
      localObjectUrls.push(objectUrl);
      groups.get(folder).push({
        key:`local:${rel}`,
        name:stripExtension(file.name),
        src:objectUrl,
        displayPath:rel,
        kind:"object-url"
      });
    }
    return [...groups.entries()].map(([folder,stems],index)=>({
      id:`local:${folder}:${index}`,
      folder,
      title:prettifyFolder(folder),
      stems,
      source:"local",
      order:index
    }));
  }

  function revokeLocalObjectUrls() {
    for (const url of localObjectUrls) URL.revokeObjectURL(url);
    localObjectUrls = [];
  }

  async function getManifest() {
    try {
      const response = await fetch("manifest.json",{cache:"no-store"});
      if (response.ok) return await response.json();
    } catch (_) {}
    return EMBEDDED_MANIFEST;
  }

  function dbToGain(db) { return Math.pow(10,db/20); }

  function faderValueToDb(value) {
    const v = Math.max(0,Math.min(100,Number(value)));
    if (v <= 0) return -Infinity;
    if (v <= 80) return -60 + (v/80)*60;
    return ((v-80)/20)*6;
  }

  function faderValueToGain(value) {
    const db = faderValueToDb(value);
    return Number.isFinite(db) ? dbToGain(db) : 0;
  }

  function trimValueToDb(value) { return ((Number(value)-50)/50)*12; }
  function panValue(value) { return Math.max(-1,Math.min(1,(Number(value)-50)/50)); }
  function roomValue(value) { const n=Number(value)/100; return n*n*.9; }

  function formatDb(db) {
    if (!Number.isFinite(db)) return "-∞ dB";
    const rounded = Math.abs(db) < .05 ? 0 : db;
    return `${rounded >= 0 ? "+" : ""}${rounded.toFixed(1)} dB`;
  }

  function formatPanReadout(value) {
    const p = panValue(value);
    if (Math.abs(p) < .02) return "CENTER";
    return `${p < 0 ? "L" : "R"} ${String(Math.round(Math.abs(p)*100)).padStart(2,"0")}`;
  }

  function formatToneReadout(value) {
    const hz = Math.round(1800 + Math.pow(Number(value)/100,2.1)*18200);
    return hz >= 1000 ? `${(hz/1000).toFixed(hz >= 10000 ? 1 : 2)} kHz` : `${hz} Hz`;
  }

  function getControlOwnerName(input) {
    const strip = input.closest(".channel");
    const raw = strip?.querySelector(".channel-name")?.textContent?.trim() || "WIFEY";
    return raw.replace(/^\d+\s+/, "").trim() || "WIFEY";
  }

  function describeTouchedControl(input,value=Number(input.value)) {
    const owner = getControlOwnerName(input);
    const control = input.dataset.control;
    const isMasterFader = input.classList.contains("fader") &&
      (input.dataset.master === "1" || input.dataset.owner === "master");

    if (input.classList.contains("fader")) {
      return {
        owner,
        label:isMasterFader ? "MASTER LEVEL" : "LEVEL",
        value:formatDb(faderValueToDb(value))
      };
    }

    if (control === "trim") {
      return {owner,label:"TRIM",value:formatDb(trimValueToDb(value))};
    }
    if (control === "pan") {
      return {owner,label:"PAN",value:formatPanReadout(value)};
    }
    if (control === "room") {
      return {owner,label:"ROOM SEND",value:`${Math.round(value)} %`};
    }
    if (control === "tone") {
      return {owner,label:"TONE",value:formatToneReadout(value)};
    }

    return {owner,label:String(control || "CONTROL").toUpperCase(),value:`${Math.round(value)} %`};
  }

  /*
   * Genuine 7-segment renderer.
   *
   * Each character is composed from segments a..g. Letters use the standard
   * seven-segment approximations found on calculators / test equipment.
   * Unsupported letters are intentionally approximated rather than silently
   * falling back to a normal font.
   */
  const SEVEN_SEGMENT_MAP = {
    "0":"abcdef",
    "1":"bc",
    "2":"abdeg",
    "3":"abcdg",
    "4":"bcfg",
    "5":"acdfg",
    "6":"acdefg",
    "7":"abc",
    "8":"abcdefg",
    "9":"abcdfg",

    "A":"abcefg",
    "B":"cdefg",
    "C":"adef",
    "D":"bcdeg",
    "E":"adefg",
    "F":"aefg",
    "G":"acdef",
    "H":"bcefg",
    "I":"bc",
    "J":"bcde",
    "K":"efg",
    "L":"def",
    "M":"ace",
    "N":"ceg",
    "O":"abcdef",
    "P":"abefg",
    "Q":"abcfg",
    "R":"eg",
    "S":"acdfg",
    "T":"defg",
    "U":"bcdef",
    "V":"cde",
    "W":"bdf",
    "X":"bcefg",
    "Y":"bcdfg",
    "Z":"abdeg",

    "-":"g",
    "_":"d",
    "=":"dg",
    " ":""
  };

  const sevenTypeTimers = new WeakMap();

  function normalizeSevenSegmentText(value) {
    return String(value ?? "")
      .toUpperCase()
      .replace(/-∞/g,"-INF")
      .replace(/∞/g,"INF")
      .replace(/%/g,"PCT")
      .replace(/\+/g,"")
      .replace(/\//g,"-")
      .replace(/[<>]/g,"-")
      .replace(/[^0-9A-Z .,:=_-]/g," ");
  }

  const SEVEN_SVG_NS = "http://www.w3.org/2000/svg";

  // Normalized 56.3 x 100 geometry, matching the ~8.0 x 14.22 mm
  // visible digit envelope of common 0.56-inch industrial modules.
  // Vertical bars lean gently inward; horizontal bars use symmetric
  // chamfered ends instead of the previous chunky CSS hexagons.
  const INDUSTRIAL_SEGMENT_POINTS = {
    a:"8.0,4.2 45.0,4.2 50.1,9.1 45.1,14.0 8.0,14.0 3.1,9.1",
    b:"46.0,11.3 51.2,16.0 49.6,42.1 44.4,47.0 39.9,42.2 41.3,16.9",
    c:"43.9,53.0 49.1,57.8 47.5,83.9 42.3,88.8 37.9,84.0 39.3,57.9",
    d:"6.1,86.0 42.2,86.0 47.2,90.9 42.2,95.8 6.1,95.8 1.2,90.9",
    e:"2.0,53.0 7.1,57.8 5.5,83.9 .4,88.8 0,84.0 1.2,57.9",
    f:"4.1,11.3 9.2,16.0 7.7,42.1 2.5,47.0 0,42.2 1.4,16.9",
    g:"6.1,45.1 43.5,45.1 48.5,50.0 43.5,54.9 6.1,54.9 1.2,50.0"
  };

  const INDUSTRIAL_HIGHLIGHT_POINTS = {
    a:"9.1,5.4 43.8,5.4 46.2,7.7 8.0,7.7",
    b:"47.0,13.8 49.3,16.3 47.9,39.9 46.5,41.3",
    c:"44.8,55.4 47.1,58.0 45.7,81.7 44.3,83.1",
    d:"7.1,87.2 40.9,87.2 43.4,89.7 6.1,89.7",
    e:"3.0,55.4 5.3,58.0 3.9,81.7 2.5,83.1",
    f:"5.1,13.8 7.4,16.3 6.0,39.9 4.6,41.3",
    g:"7.1,46.3 42.2,46.3 44.7,48.8 6.0,48.8"
  };

  function makeSevenSegmentCharacter(character) {
    const wrapper = document.createElement("span");
    wrapper.className = "seven-char";

    const char = String(character || " ").toUpperCase();
    if (char === " ") wrapper.classList.add("seven-char--space");

    const svg = document.createElementNS(SEVEN_SVG_NS,"svg");
    svg.setAttribute("class","seven-svg");
    svg.setAttribute("viewBox","0 0 56.3 100");
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("focusable","false");
    svg.setAttribute("aria-hidden","true");

    if (char === ":") {
      svg.classList.add("seven-colon-svg");

      for (const cy of [35,65]) {
        const dot = document.createElementNS(SEVEN_SVG_NS,"circle");
        dot.setAttribute("cx","28.15");
        dot.setAttribute("cy",String(cy));
        dot.setAttribute("r","4.0");
        svg.appendChild(dot);
      }

      wrapper.appendChild(svg);
      return wrapper;
    }

    const active = new Set((SEVEN_SEGMENT_MAP[char] || "").split(""));

    for (const segmentName of ["a","b","c","d","e","f","g"]) {
      const polygon = document.createElementNS(SEVEN_SVG_NS,"polygon");
      polygon.setAttribute("points",INDUSTRIAL_SEGMENT_POINTS[segmentName]);
      polygon.setAttribute(
        "class",
        `seg-shape ${segmentName}${active.has(segmentName) ? " on" : ""}`
      );
      svg.appendChild(polygon);

      const highlight = document.createElementNS(SEVEN_SVG_NS,"polygon");
      highlight.setAttribute("points",INDUSTRIAL_HIGHLIGHT_POINTS[segmentName]);
      highlight.setAttribute(
        "class",
        `seg-highlight${active.has(segmentName) ? " on" : ""}`
      );
      svg.appendChild(highlight);
    }

    wrapper.appendChild(svg);
    return wrapper;
  }

  function splitSevenSegmentTokens(text) {
    const tokens = [];

    for (const char of normalizeSevenSegmentText(text)) {
      if ((char === "." || char === ",") && tokens.length) {
        tokens[tokens.length-1].dot = true;
        continue;
      }

      tokens.push({char,dot:false});
    }

    return tokens;
  }

  function sevenSegmentWrite(target,text,{
    maxChars=14,
    align="left"
  }={}) {
    if (!target) return;

    const oldTimer = sevenTypeTimers.get(target);
    if (oldTimer) {
      clearTimeout(oldTimer);
      sevenTypeTimers.delete(target);
    }

    let tokens = splitSevenSegmentTokens(text);

    if (tokens.length > maxChars) {
      tokens = align === "right"
        ? tokens.slice(-maxChars)
        : tokens.slice(0,maxChars);
    }

    target.replaceChildren();

    for (const token of tokens) {
      const charNode = makeSevenSegmentCharacter(token.char);

      if (token.dot) {
        const dot = document.createElement("span");
        dot.className = "seven-decimal";
        charNode.appendChild(dot);
      }

      target.appendChild(charNode);
    }
  }

  /*
   * Public dynamic typing function requested for the hardware display.
   *
   * Long strings scroll through the fixed seven-segment bank as they type,
   * exactly like a small piece of old electronic equipment with limited digits.
   *
   * Example:
   *   typeSevenSegment(sevenLabel, "PLAYLIST MODE", {maxChars:14});
   */
  function typeSevenSegment(target,text,{
    maxChars=14,
    speed=34,
    align="left",
    onDone=null
  }={}) {
    if (!target) return;

    const previous = sevenTypeTimers.get(target);
    if (previous) clearTimeout(previous);

    const tokens = splitSevenSegmentTokens(text);
    let index = 0;

    const tick = ()=>{
      index += 1;
      const visible = tokens.slice(0,index);
      const windowed = visible.length > maxChars
        ? visible.slice(visible.length-maxChars)
        : visible;

      const output = windowed
        .map(token=>token.char + (token.dot ? "." : ""))
        .join("");

      sevenSegmentWrite(target,output,{maxChars,align});

      if (index < tokens.length) {
        const timer = setTimeout(tick,speed);
        sevenTypeTimers.set(target,timer);
      } else {
        sevenTypeTimers.delete(target);
        if (typeof onDone === "function") onDone();
      }
    };

    target.replaceChildren();
    if (!tokens.length) {
      if (typeof onDone === "function") onDone();
      return;
    }

    tick();
  }

  // Expose the writer for any future mixer message / plugin.
  window.typeSevenSegment = typeSevenSegment;
  window.writeSevenSegment = sevenSegmentWrite;

  function syncSevenSegmentTrack() {
    const trackText = trackReadout?.textContent || "--";
    sevenSegmentWrite(sevenTrack,`T${trackText.replace("/","-")}`,{
      maxChars:7,
      align:"right"
    });
  }

  function setSevenSegmentScreen({
    owner="WIFEY MIX-8",
    label="READY",
    value="",
    animate=false
  }={}) {
    controlReadoutOwner.textContent = owner;
    controlReadoutLabel.textContent = label;
    controlReadoutValue.textContent = value || "READY";

    sevenSegmentWrite(sevenOwner,owner,{maxChars:12,align:"left"});
    syncSevenSegmentTrack();

    if (animate) {
      typeSevenSegment(sevenLabel,label,{
        maxChars:15,
        speed:30,
        align:"left"
      });
    } else {
      sevenSegmentWrite(sevenLabel,label,{maxChars:15,align:"left"});
    }

    sevenSegmentWrite(sevenValue,value || "READY",{
      maxChars:10,
      align:"right"
    });
  }

  function showTouchedControl(input,value=Number(input.value)) {
    if (!hardwareReadout || !input) return;
    const info = describeTouchedControl(input,value);

    // Parameter changes must feel instantaneous, not wait for a typing animation.
    setSevenSegmentScreen({
      owner:info.owner,
      label:info.label,
      value:info.value,
      animate:false
    });

    hardwareReadout.classList.remove("is-active");
    void hardwareReadout.offsetWidth;
    hardwareReadout.classList.add("is-active");
  }

  function showSystemReadout(owner="WIFEY MIX-8",label="READY",value="") {
    if (!hardwareReadout) return;

    // System / mode messages use the dynamic seven-segment typing function.
    setSevenSegmentScreen({
      owner,
      label,
      value:value || "READY",
      animate:true
    });
  }

  function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
    const mins = Math.floor(seconds/60);
    const secs = Math.floor(seconds%60);
    return `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
  }

  function createImpulse(ctx, seconds=1.7, decay=2.6) {
    const length = Math.max(1,Math.floor(ctx.sampleRate*seconds));
    const impulse = ctx.createBuffer(2,length,ctx.sampleRate);
    for (let channel=0; channel<2; channel++) {
      const data = impulse.getChannelData(channel);
      for (let i=0;i<length;i++) {
        const envelope = Math.pow(1-i/length,decay);
        data[i] = (Math.random()*2-1)*envelope;
      }
    }
    return impulse;
  }


  function createMegaphoneCurve(amount=7.5) {
    const samples = 2048;
    const curve = new Float32Array(samples);
    const drive = Math.max(1,Number(amount)||1);

    for (let i=0;i<samples;i++) {
      const x = (i*2)/(samples-1)-1;
      // Mild asymmetric loudspeaker-like saturation.
      const shaped = Math.tanh(x*drive) / Math.tanh(drive);
      curve[i] = shaped * (x < 0 ? .94 : 1);
    }

    return curve;
  }

  function setCrossfadeGain(param,value,immediate=false) {
    if (!audioCtx || !param) return;
    const now = audioCtx.currentTime;
    const target = Number(value) || 0;

    try {
      param.cancelScheduledValues(now);
      if (immediate) {
        param.setValueAtTime(target,now);
        return;
      }

      const current = Number.isFinite(param.value) ? param.value : target;
      param.setValueAtTime(current,now);
      param.linearRampToValueAtTime(target,now+.018);
    } catch (_) {
      param.value = target;
    }
  }

  function applyMegaphoneState(immediate=false) {
    if (!audioCtx || !megaphoneDry || !megaphoneWet) return;
    setCrossfadeGain(megaphoneDry.gain,megaphoneEnabled ? 0 : 1,immediate);
    setCrossfadeGain(megaphoneWet.gain,megaphoneEnabled ? 1 : 0,immediate);
  }

  function syncMegaphoneButton() {
    const button = document.getElementById("megaphoneBtn");
    if (!button) return;

    button.classList.toggle("active",megaphoneEnabled);
    button.setAttribute("aria-pressed",String(megaphoneEnabled));
    button.title = megaphoneEnabled ? "Megaphone effect ON" : "Megaphone effect OFF";
    button.setAttribute("aria-label",button.title);
  }

  function toggleMegaphone() {
    megaphoneEnabled = !megaphoneEnabled;
    persistentPrefs.megaphoneEnabled = megaphoneEnabled;
    savePersistentPrefs();

    ensureAudioGraph();
    applyMegaphoneState(false);
    syncMegaphoneButton();

    showSystemReadout(
      "MASTER",
      "MEGAPHONE",
      megaphoneEnabled ? "ON · 1.05 kHz" : "OFF"
    );
  }

  function ensureAudioGraph() {
    if (audioCtx) return audioCtx;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error("Web Audio is not supported in this browser.");
    try {
      audioCtx = new AudioContextClass({latencyHint:"interactive"});
    } catch (_) {
      audioCtx = new AudioContextClass();
    }

    masterBus = audioCtx.createGain();
    masterTone = audioCtx.createBiquadFilter();
    masterTone.type = "lowpass";
    masterTone.Q.value = .12;
    masterPan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();

    masterGain = audioCtx.createGain();
    masterAnalyser = audioCtx.createAnalyser();
    masterAnalyser.fftSize = 256;
    masterAnalyser.smoothingTimeConstant = .72;
    masterMeterData = new Uint8Array(masterAnalyser.fftSize);

    reverb = audioCtx.createConvolver();
    reverb.buffer = createImpulse(audioCtx);
    fxReturn = audioCtx.createGain();

    // Megaphone parallel path:
    // high-pass -> resonant 1.05 kHz peak -> low-pass -> mild speaker saturation.
    megaphoneDry = audioCtx.createGain();
    megaphoneWet = audioCtx.createGain();

    megaHighpass = audioCtx.createBiquadFilter();
    megaHighpass.type = "highpass";
    megaHighpass.frequency.value = 360;
    megaHighpass.Q.value = .78;

    megaResonance = audioCtx.createBiquadFilter();
    megaResonance.type = "peaking";
    megaResonance.frequency.value = 1050;
    megaResonance.Q.value = 2.15;
    megaResonance.gain.value = 7.5;

    megaLowpass = audioCtx.createBiquadFilter();
    megaLowpass.type = "lowpass";
    megaLowpass.frequency.value = 3550;
    megaLowpass.Q.value = .92;

    megaDrive = audioCtx.createWaveShaper();
    megaDrive.curve = createMegaphoneCurve(7.5);
    if ("oversample" in megaDrive) megaDrive.oversample = "2x";

    reverb.connect(fxReturn);
    fxReturn.connect(masterBus);

    masterBus.connect(masterTone);
    masterTone.connect(masterPan);

    // Dry and megaphone paths recombine before the master fader.
    masterPan.connect(megaphoneDry);
    megaphoneDry.connect(masterGain);

    masterPan.connect(megaHighpass);
    megaHighpass.connect(megaResonance);
    megaResonance.connect(megaLowpass);
    megaLowpass.connect(megaDrive);
    megaDrive.connect(megaphoneWet);
    megaphoneWet.connect(masterGain);

    masterGain.connect(masterAnalyser);
    masterAnalyser.connect(audioCtx.destination);

    applyMasterState();
    applyMegaphoneState(true);
    return audioCtx;
  }

  function setParam(param,value,time=.012) {
    if (!audioCtx || !param) return;
    const now = audioCtx.currentTime;
    const safeValue = Number.isFinite(Number(value)) ? Number(value) : 0;

    try {
      param.cancelScheduledValues(now);

      // Important for master/channel faders: zero must be a real zero.
      // setTargetAtTime(0) only approaches zero asymptotically.
      if (Math.abs(safeValue) <= 1e-7) {
        param.setValueAtTime(0,now);
        return;
      }

      param.setTargetAtTime(safeValue,now,time);
    } catch (_) {
      param.value = safeValue;
    }
  }

  function applyMasterState() {
    if (!audioCtx) return;
    const toneNorm = Number(masterState.tone)/100;
    const frequency = 1800 + Math.pow(toneNorm,2.1)*18200;
    setParam(masterTone.frequency,frequency,.025);
    if (masterPan?.pan) setParam(masterPan.pan,panValue(masterState.pan));
    setParam(fxReturn.gain,(Number(masterState.room)/100)*.72);
    setParam(masterGain.gain,faderValueToGain(masterState.level));
    masterReadout.textContent = formatDb(faderValueToDb(masterState.level));
  }

  function defaultStemState(stem) {
    const id = persistentStemId(stem);
    const persisted = id ? persistentPrefs.stemStates?.[id] : null;
    const remembered = savedStemState.get(stem.key);

    const source = remembered || persisted;
    const state = source
      ? {
          trim:Number(source.trim ?? 50),
          pan:Number(source.pan ?? 50),
          room:Number(source.room ?? 18),
          level:Number(source.level ?? 80),
          mute:!!source.mute,
          solo:!!source.solo
        }
      : { trim:50, pan:50, room:18, level:80, mute:false, solo:false };

    state.locked = isStemLocked(stem);
    return state;
  }

  function saveChannelState(channel) {
    if (!channel?.stem?.key) return;

    const snapshot = {
      trim:Number(channel.state.trim),
      pan:Number(channel.state.pan),
      room:Number(channel.state.room),
      level:Number(channel.state.level),
      mute:!!channel.state.mute,
      solo:!!channel.state.solo
    };

    savedStemState.set(channel.stem.key,snapshot);

    const id = persistentStemId(channel.stem);
    if (id) {
      persistentPrefs.stemStates[id] = snapshot;
      savePersistentPrefs();
    }
  }

  function saveMasterState() {
    persistentPrefs.masterState = {
      tone:Number(masterState.tone),
      pan:Number(masterState.pan),
      room:Number(masterState.room),
      level:Number(masterState.level)
    };
    persistentPrefs.megaphoneEnabled = !!megaphoneEnabled;
    savePersistentPrefs();
  }

  function stopChannelSources(channel,when=null) {
    if (!channel?.sources) return;
    const stopAt = when ?? (audioCtx?.currentTime || 0);

    for (const source of [...channel.sources]) {
      try { source.onended = null; } catch (_) {}
      try { source.stop(stopAt); } catch (_) {}
      try { source.disconnect(); } catch (_) {}
    }

    channel.sources.clear();
  }

  function stopAllScheduledSources() {
    for (const channel of channels) stopChannelSources(channel);
  }

  function cleanupChannels() {
    stopAllScheduledSources();

    for (const channel of channels) {
      saveChannelState(channel);

      for (const node of [channel.trim,channel.pan,channel.fader,channel.send,channel.analyser]) {
        try { node?.disconnect(); } catch (_) {}
      }

      channel.buffer = null;
    }

    channels = [];
    audioRack.replaceChildren();
  }
