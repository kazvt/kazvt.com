  <script>
  (() => {
    'use strict';

    const CELL = 16;
    const ROOM_COLS = 5;
    const ROOM_ROWS = 4;
    const ROOM_W = 48;
    const ROOM_H = 32;
    const MAP_W = ROOM_COLS * ROOM_W;
    const MAP_H = ROOM_ROWS * ROOM_H;
    const WORLD_W = MAP_W * CELL;
    const WORLD_H = MAP_H * CELL;
    const AIR = -1;
    const TILE = { ROCK: 1, RAMP_UP: 2, RAMP_DOWN: 3, CRACK: 4, GATE: 5 };
    const CAT = { TERRAIN: 1, PLAYER: 2, ENEMY: 4, PICKUP: 8, BOMB: 16, BUMPER: 32, FLIPPER:64 };
    const UPGRADE_KEYS = ['ghost', 'virtual', 'echo', 'bomb', 'super', 'phase', 'grip'];
    const UPGRADE_LABELS = {
      ghost: 'Ghost flipper', virtual: 'Virtual flipper', echo: 'Echo Lens',
      bomb: 'Bomb Kit', super: 'Super Bomb', phase: 'Phase Bomb', grip: 'Spider Ball'
    };
    const ROOM_DEFS = [
      { id:0, name:'Dock' }, { id:1, name:'Coilworks' }, { id:2, name:'Launch Gallery' }, { id:3, name:'Crown Access' }, { id:4, name:'Echo Vault' },
      { id:5, name:'Sump' }, { id:6, name:'Junction' }, { id:7, name:'Bomb Bay' }, { id:8, name:'Spinner Hall' }, { id:9, name:'Observatory' },
      { id:10, name:'Underloop' }, { id:11, name:'Bulkhead' }, { id:12, name:'Foundry' }, { id:13, name:'Needle Run' }, { id:14, name:'Phase Lab' },
      { id:15, name:'Reservoir' }, { id:16, name:'Spider Gate' }, { id:17, name:'Capacitor' }, { id:18, name:'Superforge' }, { id:19, name:'Core' }
    ];
    // A connected room graph with several return loops. Upgrade doors create routes;
    // they do not replace the ball's pinball traversal through each room.
    const DOOR_DEFS = [
      { id:'dock-coil', from:0, to:1 }, { id:'dock-sump', from:0, to:5 },
      { id:'coil-launch', from:1, to:2 }, { id:'coil-junction', from:1, to:6 },
      { id:'sump-junction', from:5, to:6 }, { id:'gallery-bay', from:2, to:7 }, { id:'junction-bay', from:6, to:7 },
      { id:'ghost-crown', from:2, to:3, requires:'ghost' }, { id:'crown-echo', from:3, to:4 },
      { id:'crown-spinner', from:3, to:8 }, { id:'echo-observatory', from:4, to:9 }, { id:'spinner-observatory', from:8, to:9 },
      { id:'spinner-needle', from:8, to:13 }, { id:'observatory-phase', from:9, to:14 }, { id:'needle-phase', from:13, to:14 },
      { id:'junction-underloop', from:6, to:11 }, { id:'bomb-bulkhead', from:11, to:12, requires:'bomb', breakable:true },
      { id:'bulkhead-spider', from:11, to:16 }, { id:'spider-capacitor', from:16, to:17 },
      { id:'capacitor-superforge', from:17, to:18 }, { id:'needle-superforge', from:13, to:18, requires:'super' },
      { id:'foundry-shortcut', from:12, to:13, requires:'phase' }, { id:'sump-underloop', from:5, to:10, requires:'grip' },
      { id:'underloop-reservoir', from:10, to:15 }, { id:'reservoir-spider', from:15, to:16 },
      { id:'phase-core', from:14, to:19, requires:'phase' }, { id:'super-core', from:18, to:19, requires:'super' }
    ];
    const BALL = {
      // Normal-speed Spinball tuning: preserve a fast, inertial roll while keeping
      // one room from disappearing in a single launch. Values are world pixels per
      // fixed 60 Hz Matter step, not CSS pixels.
      radius:8, maxSpeed:12, launchReach:32,
      flipperReach:4, flipCooldownMs:110,
      airFlipXKick:2.4, airFlipYKick:6.2, airCorrectionPer60HzStep:0.09, airCorrectionMaxDirectionalSpeed:3.5,
      walkSpeed:2.4, walkAcceleration:0.2, walkBraking:0.34, groundFrictionFactor:0.985,
      groundJumpSpeed:5.2, groundJumpMaxSpeed:0.55, fastFallExtraGravity:2,
      spinDashStartSpeed:0.75, spinDashBaseSpeed:5.5, spinDashChargeSpeed:1.1, spinDashMaxCharges:5,
      spiderBallSpeed:1.9,
      spiderAdhesion:0.16, spiderContactGraceMs:90, spiderTraverseMs:900, coyoteMs:67,
      surfaceContactGraceMs:34, slopeSnapTolerance:5, flipperLength:56, flipperWidth:10, flipperSwingRate:0.016, bumperCooldownMs:380
    };
    const GRAVITY = { x:0, y:1, scale:0.001 };
    const ART_TILE = 8;
    const CHUNK_CELLS = 8;
    const CHUNK_PIXELS = CHUNK_CELLS * CELL;
    const SOUND_VOLUME = 0.25;
    const XP_SOUND_FILES = [
      'chimes.wav',
      'chord.wav',
      'ding.wav',
      'notify.wav',
      'recycle.wav',
      'ringin.wav',
      'ringout.wav',

      'tada.wav',
      'Windows Feed Discovered.wav',
      'Windows Information Bar.wav',
      'Windows Navigation Start.wav',
      'Windows Pop-up Blocked.wav',
      'Windows XP Balloon.wav',
      'Windows XP Battery Critical.wav',
      'Windows XP Battery Low.wav',
      'Windows XP Critical Stop.wav',
      'Windows XP Default.wav',
      'Windows XP Ding.wav',
      'Windows XP Error.wav',
      'Windows XP Exclamation.wav',

      'Windows XP Hardware Insert.wav',
      'Windows XP Hardware Remove.wav',
      'Windows XP Information Bar.wav',
      'Windows XP Logoff Sound.wav',
      'Windows XP Logon Sound.wav',
      'Windows XP Menu Command.wav',
      'Windows XP Minimize.wav',
      'Windows XP Notify.wav',
      'Windows XP Pop-up Blocked.wav',
      'Windows XP Print complete.wav',
      'Windows XP Recycle.wav',
      'Windows XP Restore.wav',
      'Windows XP Ringin.wav',
      'Windows XP Ringout.wav',
      'Windows XP Shutdown.wav',
      'Windows XP Start.wav',
      'Windows XP Startup.wav'
    ];
    const XP_SOUND_GROUPS = {
      launch: ['start.wav'],
      movement: ['start.wav'],
      pickup: ['chimes.wav', 'notify.wav', 'Windows Feed Discovered.wav', 'Windows Information Bar.wav', 'Windows XP Balloon.wav', 'Windows XP Information Bar.wav', 'Windows XP Notify.wav', 'tada.wav', 'chord.wav', 'Windows XP Print complete.wav', 'start.wav', 'start.wav', 'Windows XP Default.wav', 'Windows Navigation Start.wav', 'start.wav', 'start.wav', 'Windows XP Logon Sound.wav'],
      bomb: ['start.wav'],
      ui: ['Windows XP Menu Command.wav', 'Windows XP Minimize.wav', 'Windows XP Restore.wav', 'Windows Pop-up Blocked.wav', 'Windows XP Pop-up Blocked.wav', 'start.wav', 'start.wav', 'start.wav', 'start.wav'],
      damage: ['Windows XP Battery Critical.wav', 'Windows XP Battery Low.wav', 'Windows XP Critical Stop.wav', 'Windows XP Error.wav', 'Windows XP Exclamation.wav', 'Windows XP Hardware Fail.wav', 'Windows XP Logoff Sound.wav', 'Windows XP Shutdown.wav', 'recycle.wav', 'Windows XP Recycle.wav', 'Windows XP Hardware Insert.wav', 'Windows XP Hardware Remove.wav']
    };
    const xpSoundKey = file => 'xp-' + file.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const rampRuns = [];
    const rampUnderlay = new Set();
    const BOMB_TYPES = [
      { key:'standard', label:'STANDARD', damage:2, radius:70, fuse:1250, phase:false },
      { key:'super', label:'SUPER', damage:5, radius:112, fuse:1050, phase:false },
      { key:'phase', label:'PHASE', damage:3, radius:76, fuse:1200, phase:true }
    ];

    const ROOM_LAYOUTS = [
      {
        ramps:[{ x:5, lift:2, steps:5, direction:'up' }, { x:38, lift:6, steps:5, direction:'down' }],
        shelves:[[16,17,9],[28,12,7]], blocks:[[13,22,2,4],[34,21,2,5]]
      },
      {
        ramps:[{ x:6, lift:6, steps:6, direction:'down' }, { x:39, lift:3, steps:5, direction:'up' }],
        shelves:[[14,14,8],[27,18,8]], blocks:[[12,19,2,6],[34,22,2,4]]
      },
      {
        ramps:[{ x:8, lift:3, steps:5, direction:'up' }, { x:38, lift:7, steps:6, direction:'down' }],
        shelves:[[16,13,7],[28,16,9]], blocks:[[13,19,2,8],[34,20,2,6]]
      },
      {
        ramps:[{ x:9, lift:7, steps:5, direction:'down' }, { x:39, lift:2, steps:5, direction:'up' }],
        shelves:[[14,18,8],[27,11,10]], blocks:[[12,22,2,6],[34,19,2,8]]
      },
      {
        ramps:[{ x:6, lift:5, steps:5, direction:'up' }, { x:38, lift:5, steps:5, direction:'down' }],
        shelves:[[14,11,9],[28,16,8]], blocks:[[13,18,2,7],[34,20,2,6]]
      },
      {
        ramps:[{ x:7, lift:6, steps:6, direction:'down' }, { x:39, lift:6, steps:5, direction:'up' }],
        shelves:[[13,15,8],[29,12,7]], blocks:[[12,21,2,6],[34,18,2,8]]
      },
      {
        ramps:[{ x:8, lift:6, steps:5, direction:'up' }, { x:38, lift:6, steps:6, direction:'down' }],
        shelves:[[16,12,8],[27,19,9]], blocks:[[13,19,2,8],[34,21,2,6]]
      },
      {
        ramps:[{ x:5, lift:5, steps:5, direction:'down' }, { x:38, lift:5, steps:5, direction:'up' }],
        shelves:[[13,18,8],[28,13,9]], blocks:[[12,20,2,7],[34,20,2,7]]
      }
    ];

    const roomPoint = (roomId, cellX, cellY) => {
      const col = roomId % ROOM_COLS;
      const row = Math.floor(roomId / ROOM_COLS);
      return { x:(col * ROOM_W + cellX) * CELL, y:(row * ROOM_H + cellY) * CELL };
    };
    const enemyInRoom = (id, roomId, cellX, cellY, minCellX, maxCellX, hp, options = {}) => {
      const point = roomPoint(roomId, cellX, cellY);
      return {
        id, x:point.x, y:point.y,
        minX:roomPoint(roomId, minCellX, cellY).x,
        maxX:roomPoint(roomId, maxCellX, cellY).x,
        hp, ...options
      };
    };

    const grid = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(AIR));
    const doorTileLookup = new Map();
    const setTile = (x, y, type) => {
      if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H) grid[y][x] = type;
    };
    const fillRect = (x, y, w, h, type) => {
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) setTile(xx, yy, type);
    };
    const addRamp = (startX, startY, steps, direction, floorY) => {
      if (direction === 'down' && startY + steps > floorY) throw new Error('Descending ramp extends below its room floor.');
      rampRuns.push({ startX, startY, steps, direction, floorY });
      for (let i = 0; i < steps; i++) {
        const tx = startX + i;
        const ty = direction === 'up' ? startY - i : startY + i;
        setTile(tx, ty, direction === 'up' ? TILE.RAMP_UP : TILE.RAMP_DOWN);
        for (let fy = ty + 1; fy < floorY; fy++) {
          setTile(tx, fy, TILE.ROCK);
          rampUnderlay.add(`${tx},${fy}`);
        }
      }
    };

    function doorCells(door) {
      const fromCol = door.from % ROOM_COLS;
      const fromRow = Math.floor(door.from / ROOM_COLS);
      const toCol = door.to % ROOM_COLS;
      const toRow = Math.floor(door.to / ROOM_COLS);
      if (Math.abs(fromCol - toCol) + Math.abs(fromRow - toRow) !== 1) {
        throw new Error('Door ' + door.id + ' must join neighboring rooms.');
      }
      if (fromRow === toRow) {
        const x = Math.max(fromCol, toCol) * ROOM_W;
        const roomTop = fromRow * ROOM_H;
        return Array.from({ length:5 }, (_, index) => ({ x, y:roomTop + 23 + index }));
      }
      const y = Math.max(fromRow, toRow) * ROOM_H;
      const roomLeft = fromCol * ROOM_W;
      const upperFloor = Math.min(fromRow, toRow) * ROOM_H + 28;
      return Array.from({ length:5 }, (_, index) => ({ x:roomLeft + 22 + index, y:upperFloor }))
        .concat(Array.from({ length:5 }, (_, index) => ({ x:roomLeft + 22 + index, y })));
    }

    function buildWorldGrid() {
      doorTileLookup.clear();
      for (let y = 0; y < MAP_H; y++) {
        setTile(0, y, TILE.ROCK);
        setTile(MAP_W - 1, y, TILE.ROCK);
      }
      for (let x = 0; x < MAP_W; x++) {
        setTile(x, 0, TILE.ROCK);
        setTile(x, MAP_H - 1, TILE.ROCK);
      }
      for (let col = 1; col < ROOM_COLS; col++) {
        for (let y = 1; y < MAP_H - 1; y++) setTile(col * ROOM_W, y, TILE.ROCK);
      }
      for (let row = 1; row < ROOM_ROWS; row++) {
        for (let x = 1; x < MAP_W - 1; x++) setTile(x, row * ROOM_H, TILE.ROCK);
      }

      for (const room of ROOM_DEFS) {
        const col = room.id % ROOM_COLS;
        const row = Math.floor(room.id / ROOM_COLS);
        const rx = col * ROOM_W;
        const ry = row * ROOM_H;
        const floor = ry + 28;
        for (let x = rx + 1; x < rx + ROOM_W - 1; x++) {
          setTile(x, floor, TILE.ROCK);
        }

        const layout = ROOM_LAYOUTS[room.id % ROOM_LAYOUTS.length];
        for (const ramp of layout.ramps) addRamp(rx + ramp.x, floor - ramp.lift, ramp.steps, ramp.direction, floor);
        for (const [x, y, width] of layout.shelves) fillRect(rx + x, ry + y, width, 1, TILE.ROCK);
        for (const [x, y, width, height] of layout.blocks) fillRect(rx + x, ry + y, width, height, TILE.ROCK);
      }

      for (const door of DOOR_DEFS) {
        door.cells = doorCells(door);
        const type = door.breakable ? TILE.CRACK : door.requires ? TILE.GATE : AIR;
        for (const cell of door.cells) {
          setTile(cell.x, cell.y, type);
          if (type !== AIR) doorTileLookup.set(cell.x + ',' + cell.y, door.id);
        }
      }
    }
    buildWorldGrid();
    const worldChunks = packWorldChunks(grid);


    // The authored map stays a 16px metatile grid; this compiler packs eight-by-eight metatile chunks.
    // Each visible 16px block is painted from four 8px art patterns in the atlas below.
    function packWorldChunks(source) {
      const columns = Math.ceil(MAP_W / CHUNK_CELLS);
      const rows = Math.ceil(MAP_H / CHUNK_CELLS);
      const definitions = [];
      const layout = [];
      const ids = new Map();
      for (let cy = 0; cy < rows; cy++) {
        const layoutRow = [];
        for (let cx = 0; cx < columns; cx++) {
          const cells = [];
          for (let y = 0; y < CHUNK_CELLS; y++) for (let x = 0; x < CHUNK_CELLS; x++) {
            const row = source[cy * CHUNK_CELLS + y];
            cells.push(row && row[cx * CHUNK_CELLS + x] !== undefined ? row[cx * CHUNK_CELLS + x] : AIR);
          }
          const signature = cells.join(',');
          let id = ids.get(signature);
          if (id === undefined) { id = definitions.length; ids.set(signature, id); definitions.push(cells); }
          layoutRow.push(id);
        }
        layout.push(layoutRow);
      }
      return { columns, rows, definitions, layout, chunkCells:CHUNK_CELLS, chunkPixels:CHUNK_PIXELS };
    }

    function unpackWorldChunks(chunks) {
      const result = Array.from({ length:MAP_H }, () => Array(MAP_W).fill(AIR));
      for (let cy = 0; cy < chunks.rows; cy++) for (let cx = 0; cx < chunks.columns; cx++) {
        const cells = chunks.definitions[chunks.layout[cy][cx]];
        for (let y = 0; y < CHUNK_CELLS; y++) for (let x = 0; x < CHUNK_CELLS; x++) {
          const worldX = cx * CHUNK_CELLS + x;
          const worldY = cy * CHUNK_CELLS + y;
          if (worldX < MAP_W && worldY < MAP_H) result[worldY][worldX] = cells[y * CHUNK_CELLS + x];
        }
      }
      return result;
    }

    const pickupDefs = [
      { id:'score-dock', kind:'score', ...roomPoint(0,4,24), amount:500 },
      { id:'ammo-coil', kind:'ammo', ...roomPoint(1,18,24), amount:1 },
      { id:'ghost', kind:'upgrade', upgrade:'ghost', ...roomPoint(1,25,23) },
      { id:'score-gallery', kind:'score', ...roomPoint(2,24,24), amount:500 },

      applyPixelCamera() {
        const viewportHeight = this.scale.height || this.scale.gameSize.height || window.innerHeight || 240;
        // Keep a 240 px world height and follow the viewport aspect without stretching.
        const zoom = Math.max(1, viewportHeight / 240);
        const camera = this.cameras.main;
        camera.setZoom(zoom);
        const viewWidth = camera.width / zoom;
        const viewHeight = camera.height / zoom;
        camera.setDeadzone(Math.round(viewWidth * 0.25), Math.round(viewHeight * 0.2));
        document.documentElement.style.fontSize = (8 * zoom) + 'px';

      playSfx(group) {
        const files = XP_SOUND_GROUPS[group];
        if (!files || !files.length || !this.sound) return;
        const now = this.time ? this.time.now : 0;
        const cooldown = group === 'movement' ? 75 : 45;
        if (now - (this.sfxLastAt[group] ?? -Infinity) < cooldown) return;
        const index = this.sfxCursor[group] || 0;
        const file = files[index];
        this.sfxCursor[group] = (index + 1) % files.length;
        this.sfxLastAt[group] = now;
        this.sound.play(xpSoundKey(file), { volume: SOUND_VOLUME });
      }

      playSurfaceSfx(pair) {
        const surface = this.surfaceContact(pair);
        if (!surface) return;
        const velocity = this.player.body.velocity;
        const incomingSpeed = -(velocity.x * surface.normal.x + velocity.y * surface.normal.y);
        if (incomingSpeed > 2.5) this.playSfx('movement');
