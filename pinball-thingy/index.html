<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>pinball thingy</title>
  <link rel="preload" href="./assets/fonts/MonaspaceKryptonFrozen-Regular.ttf?v=1" as="font" type="font/ttf" crossorigin>
  <style>
    :root { color-scheme:dark; --white:#fff; --black:#000; }
    @font-face {
      font-family: "Monaspace Krypton Frozen";
      src: url("./assets/fonts/MonaspaceKryptonFrozen-Regular.ttf?v=1") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Monaspace Krypton Frozen";
      src: url("./assets/fonts/MonaspaceKryptonFrozen-Bold.ttf?v=1") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; color:#fff; font-family:"Monaspace Krypton Frozen",ui-monospace,SFMono-Regular,Consolas,monospace; }
    #game-frame { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; overflow:hidden; background:#000; }
    button,input,select,textarea { font:inherit; }
    #game { position:absolute; inset:0; width:100%; height:100%; outline:none; }
    #game canvas { display:block; width:100%; height:100%; image-rendering:pixelated; outline:none; }
    .game-hud { position:absolute; z-index:5; top:.5rem; left:.5rem; right:.5rem; display:grid; grid-template-columns:minmax(140px,1.5fr) repeat(3,minmax(72px,.8fr)); gap:.5rem; padding:.375rem .5rem; border:1px solid #fff; background:#000; pointer-events:none; }
    .hud-block { min-width:0; }
    .hud-label { display:block; color:#fff; font-size:.62rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    .hud-value { display:block; overflow:hidden; color:#fff; font-size:.82rem; font-weight:700; line-height:1.25; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .score-track { height:.3125rem; margin-top:.25rem; border:1px solid #fff; background:#000; }
    #score-bar { height:100%; width:25%; background:#fff; }
    #boss-label { margin-top:.125rem; color:#fff; font-size:.58rem; }
    .game-overlay { position:absolute; z-index:10; inset:0; display:none; place-items:center; background:#000; pointer-events:none; }
    .game-overlay.visible { display:grid; }
    .overlay-panel { min-width:7.5rem; padding:.75rem 1.125rem; border:1px solid #fff; background:#000; text-align:center; }
    .overlay-title { color:#fff; font-weight:700; }
    .map-card { display:none; }
    .map-card.map-focus { position:absolute; z-index:20; top:50%; left:50%; display:block; width:min(92vw,35rem); max-height:calc(100% - 6.25rem); overflow:auto; padding:.75rem; transform:translate(-50%,-50%); border:1px solid #fff; background:#000; }
    .map-heading { display:flex; justify-content:space-between; gap:.75rem; margin-bottom:.625rem; color:#fff; font-size:.8rem; font-weight:700; }
    .room-map { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.1875rem; }
    .room-node { min-height:3.375rem; display:flex; flex-direction:column; justify-content:center; padding:.375rem; border:1px solid #fff; background:#000; color:#fff; font-size:.72rem; line-height:1.2; }
    .room-node.visited { border-style:double; }
    .room-node.current { background:#fff; color:#000; }
    .room-node.locked { border-style:dashed; }
    @media (max-width:560px) {
      .game-hud { top:.3125rem; left:.3125rem; right:.3125rem; grid-template-columns:1.25fr repeat(3,minmax(0,.8fr)); gap:.25rem; padding:.3125rem; }
      .hud-label { font-size:.54rem; }
      .hud-value { font-size:.68rem; }
      #boss-label { font-size:.5rem; }
      .map-card.map-focus { max-height:calc(100% - 5rem); }
      .room-node { min-height:2.75rem; font-size:.62rem; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main id="game-frame" aria-label="pinball thingy game">
    <div id="game" role="application" aria-label="pinball thingy game canvas." tabindex="0"></div>
    <section id="game-hud" class="game-hud" aria-label="Game status">
      <div class="hud-block">
        <span class="hud-label">Hull score</span>
        <span class="hud-value"><span id="score-value">2,500</span> / 10,000</span>
        <div class="score-track" role="progressbar" aria-label="Hull score" aria-valuemin="0" aria-valuemax="10000" aria-valuenow="2500"><div id="score-bar"></div></div>
      </div>
      <div class="hud-block"><span class="hud-label">Ammo</span><span class="hud-value"><span id="ammo-value">4</span> / 10</span></div>
      <div class="hud-block"><span class="hud-label">Bomb</span><span id="bomb-label" class="hud-value">LOCKED</span><span id="echo-count" class="hud-label">ECHO 0</span></div>
      <div class="hud-block"><span class="hud-label" id="room-label">DOCK 01</span><span id="boss-label" class="hud-value">CORE: 8 HP</span><span id="ability-value" class="hud-label">SPIDER OFF</span></div>
    </section>
    <section id="map-card" class="map-card" aria-label="World map" aria-hidden="true">
      <div class="map-heading"><span>WORLD MAP</span></div>
      <div id="world-map" class="room-map" role="img" aria-label="A connected six-room map arranged in two rows of three.">
        <div id="room-0" class="room-node current">Dock</div>
        <div id="room-1" class="room-node">Relay</div>
        <div id="room-2" class="room-node">Shelf</div>
        <div id="room-3" class="room-node">Underrail</div>
        <div id="room-4" class="room-node">Foundry</div>
        <div id="room-5" class="room-node">Core</div>
      </div>
    </section>
    <div id="game-overlay" class="game-overlay" aria-hidden="true"><div class="overlay-panel"><div id="overlay-title" class="overlay-title">PAUSED</div></div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script>
  (() => {
    'use strict';

    const CELL = 16;
    const ROOM_COLS = 3;
    const ROOM_ROWS = 2;
    const ROOM_W = 48;
    const ROOM_H = 32;
    const MAP_W = ROOM_COLS * ROOM_W;
    const MAP_H = ROOM_ROWS * ROOM_H;
    const WORLD_W = MAP_W * CELL;
    const WORLD_H = MAP_H * CELL;
    const AIR = -1;
    const TILE = { ROCK: 1, RAMP_UP: 2, RAMP_DOWN: 3, CRACK: 4, GATE: 5 };
    const CAT = { TERRAIN: 1, PLAYER: 2, ENEMY: 4, PICKUP: 8, BOMB: 16 };
    const UPGRADE_KEYS = ['ghost', 'virtual', 'echo', 'bomb', 'super', 'phase', 'grip'];
    const UPGRADE_LABELS = {
      ghost: 'Ghost flipper', virtual: 'Virtual flipper', echo: 'Echo Lens',
      bomb: 'Bomb Kit', super: 'Super Bomb', phase: 'Phase Bomb', grip: 'Spider Ball'
    };
    const BALL = {
      radius:8, maxSpeed:10, airSteerPer60HzStep:0.12, maxAirSpeedX:7.5,
      rollAcceleration:0.24, rollBrake:0.42, maxRollSpeed:4.8,
      flipReach:36, flipCooldownMs:190, flipXKick:4.2, flipYKick:7.2,
      airFlipXKick:2.4, airFlipYKick:6.8, nudgeCooldownMs:160,
      nudgeXKick:2.2, nudgeYKick:0.7, spiderBallSpeed:1.7,
      spiderAdhesion:0.16, spiderContactGraceMs:90, coyoteMs:160,
      surfaceContactGraceMs:45, slopeSnapTolerance:5
    };
    const GRAVITY = { x:0, y:1, scale:0.001 };
    const ART_TILE = 8;
    const CHUNK_CELLS = 8;
    const CHUNK_PIXELS = CHUNK_CELLS * CELL;
    const PHYSICS_STEP_MS = 1000 / 60;
    const SOUND_VOLUME = 0.25;
    const XP_SOUND_FILES = [
      'chimes.wav',
      'chord.wav',
      'ding.wav',
      'notify.wav',
      'recycle.wav',
      'ringin.wav',
      'ringout.wav',
      'start.wav',
      'tada.wav',
      'Windows Feed Discovered.wav',
      'Windows Information Bar.wav',
      'Windows Navigation Start.wav',
      'Windows Pop-up Blocked.wav',
      'Windows XP Balloon.wav',
      'Windows XP Battery Critical.wav',
      'Windows XP Battery Low.wav',
      'Windows XP Critical Stop.wav',
      'Windows XP Default.wav',
      'Windows XP Ding.wav',
      'Windows XP Error.wav',
      'Windows XP Exclamation.wav',
      'Windows XP Hardware Fail.wav',
      'Windows XP Hardware Insert.wav',
      'Windows XP Hardware Remove.wav',
      'Windows XP Information Bar.wav',
      'Windows XP Logoff Sound.wav',
      'Windows XP Logon Sound.wav',
      'Windows XP Menu Command.wav',
      'Windows XP Minimize.wav',
      'Windows XP Notify.wav',
      'Windows XP Pop-up Blocked.wav',
      'Windows XP Print complete.wav',
      'Windows XP Recycle.wav',
      'Windows XP Restore.wav',
      'Windows XP Ringin.wav',
      'Windows XP Ringout.wav',
      'Windows XP Shutdown.wav',
      'Windows XP Start.wav',
      'Windows XP Startup.wav'
    ];
    const XP_SOUND_GROUPS = {
      launch: ['start.wav'],
      movement: ['start.wav'],
      pickup: ['chimes.wav', 'notify.wav', 'Windows Feed Discovered.wav', 'Windows Information Bar.wav', 'Windows XP Balloon.wav', 'Windows XP Information Bar.wav', 'Windows XP Notify.wav', 'tada.wav', 'chord.wav', 'Windows XP Print complete.wav', 'ding.wav', 'Windows XP Ding.wav', 'Windows XP Default.wav', 'Windows Navigation Start.wav', 'Windows XP Start.wav', 'Windows XP Startup.wav', 'Windows XP Logon Sound.wav'],
      bomb: ['start.wav'],
      ui: ['Windows XP Menu Command.wav', 'Windows XP Minimize.wav', 'Windows XP Restore.wav', 'Windows Pop-up Blocked.wav', 'Windows XP Pop-up Blocked.wav', 'ringin.wav', 'Windows XP Ringin.wav', 'ringout.wav', 'Windows XP Ringout.wav'],
      damage: ['Windows XP Battery Critical.wav', 'Windows XP Battery Low.wav', 'Windows XP Critical Stop.wav', 'Windows XP Error.wav', 'Windows XP Exclamation.wav', 'Windows XP Hardware Fail.wav', 'Windows XP Logoff Sound.wav', 'Windows XP Shutdown.wav', 'recycle.wav', 'Windows XP Recycle.wav', 'Windows XP Hardware Insert.wav', 'Windows XP Hardware Remove.wav']
    };
    const xpSoundKey = file => 'xp-' + file.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const rampRuns = [];
    const rampUnderlay = new Set();
    const BOMB_TYPES = [
      { key:'standard', label:'STANDARD', damage:2, radius:62, fuse:1250, phase:false },
      { key:'super', label:'SUPER', damage:5, radius:112, fuse:1050, phase:false },
      { key:'phase', label:'PHASE', damage:3, radius:76, fuse:1200, phase:true }
    ];

    const grid = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(AIR));
    const setTile = (x, y, type) => {
      if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H) grid[y][x] = type;
    };
    const fillRect = (x, y, w, h, type) => {
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) setTile(xx, yy, type);
    };
    const addRamp = (startX, startY, steps, direction, floorY) => {
      rampRuns.push({ startX, startY, steps, direction, floorY });
      for (let i = 0; i < steps; i++) {
        const tx = startX + i;
        const ty = direction === 'up' ? startY - i : startY + i;
        setTile(tx, ty, direction === 'up' ? TILE.RAMP_UP : TILE.RAMP_DOWN);
        for (let fy = ty + 1; fy < floorY; fy++) {
          setTile(tx, fy, TILE.ROCK);
          rampUnderlay.add(`${tx},${fy}`);
        }
      }
    };

    function buildWorldGrid() {
      // Room shells and low corridor floors. Openings form one connected 3-by-2 loop.
      for (let y = 0; y < MAP_H; y++) {
        setTile(0, y, TILE.ROCK);
        setTile(MAP_W - 1, y, TILE.ROCK);
      }
      for (let x = 0; x < MAP_W; x++) {
        setTile(x, 0, TILE.ROCK);
        setTile(x, MAP_H - 1, TILE.ROCK);
      }
      for (const boundaryX of [ROOM_W, ROOM_W * 2]) {
        for (let y = 1; y < MAP_H - 1; y++) setTile(boundaryX, y, TILE.ROCK);
        for (let row = 0; row < ROOM_ROWS; row++) {
          const roomTop = row * ROOM_H;
          for (let y = roomTop + 23; y <= roomTop + 27; y++) setTile(boundaryX, y, AIR);
        }
      }
      const lowerBoundaryY = ROOM_H;
      for (let x = 1; x < MAP_W - 1; x++) setTile(x, lowerBoundaryY, TILE.ROCK);
      for (let col = 0; col < ROOM_COLS; col++) {
        const center = col * ROOM_W + 22;
        for (let x = center; x <= center + 4; x++) setTile(x, lowerBoundaryY, AIR);
      }

      for (let row = 0; row < ROOM_ROWS; row++) {
        for (let col = 0; col < ROOM_COLS; col++) {
          const rx = col * ROOM_W;
          const ry = row * ROOM_H;
          const floor = ry + 28;
          // Leave a wide vertical shaft through each chamber to the lower loop.
          for (let x = rx + 1; x < rx + ROOM_W - 1; x++) {
            if (row === 0 && x >= rx + 22 && x <= rx + 26) continue;
            setTile(x, floor, TILE.ROCK);
          }
          // A pair of low ramps and a high shelf make the tile slopes visible and traversable.
          addRamp(rx + 7, floor - 2, 5, 'up', floor);
          addRamp(rx + 34, floor - 6, 5, 'down', floor);
          fillRect(rx + 16, ry + 17, 9, 1, TILE.ROCK);
          fillRect(rx + 28, ry + 12, 7, 1, TILE.ROCK);
          // A small bumper tower gives each room a recognizable silhouette.
          fillRect(rx + 5, ry + 22, 2, 5, TILE.ROCK);
          fillRect(rx + 40, ry + 19, 2, 8, TILE.ROCK);
        }
      }

      // Broken plating hides a shortcut in Foundry; the far vault has another sealed flank.
      fillRect(ROOM_W + 31, ROOM_H + 21, 1, 6, TILE.CRACK);
      fillRect(ROOM_W * 2 + 38, ROOM_H + 15, 1, 6, TILE.CRACK);
      // The boss gate is permanent until the Core Warden falls.
      fillRect(ROOM_W * 2 + 39, ROOM_H + 23, 1, 5, TILE.GATE);
    }
    buildWorldGrid();
    const worldChunks = packWorldChunks(grid);


    // The authored map stays a 16px metatile grid; this compiler packs eight-by-eight metatile chunks.
    // Each visible 16px block is painted from four 8px art patterns in the atlas below.
    function packWorldChunks(source) {
      const columns = Math.ceil(MAP_W / CHUNK_CELLS);
      const rows = Math.ceil(MAP_H / CHUNK_CELLS);
      const definitions = [];
      const layout = [];
      const ids = new Map();
      for (let cy = 0; cy < rows; cy++) {
        const layoutRow = [];
        for (let cx = 0; cx < columns; cx++) {
          const cells = [];
          for (let y = 0; y < CHUNK_CELLS; y++) for (let x = 0; x < CHUNK_CELLS; x++) {
            const row = source[cy * CHUNK_CELLS + y];
            cells.push(row && row[cx * CHUNK_CELLS + x] !== undefined ? row[cx * CHUNK_CELLS + x] : AIR);
          }
          const signature = cells.join(',');
          let id = ids.get(signature);
          if (id === undefined) { id = definitions.length; ids.set(signature, id); definitions.push(cells); }
          layoutRow.push(id);
        }
        layout.push(layoutRow);
      }
      return { columns, rows, definitions, layout, chunkCells:CHUNK_CELLS, chunkPixels:CHUNK_PIXELS };
    }

    function unpackWorldChunks(chunks) {
      const result = Array.from({ length:MAP_H }, () => Array(MAP_W).fill(AIR));
      for (let cy = 0; cy < chunks.rows; cy++) for (let cx = 0; cx < chunks.columns; cx++) {
        const cells = chunks.definitions[chunks.layout[cy][cx]];
        for (let y = 0; y < CHUNK_CELLS; y++) for (let x = 0; x < CHUNK_CELLS; x++) {
          const worldX = cx * CHUNK_CELLS + x;
          const worldY = cy * CHUNK_CELLS + y;
          if (worldX < MAP_W && worldY < MAP_H) result[worldY][worldX] = cells[y * CHUNK_CELLS + x];
        }
      }
      return result;
    }

    const pickupDefs = [
      { id: 'score-a', kind: 'score', x: 5 * CELL, y: 24 * CELL, amount: 500 },
      { id: 'ammo-a', kind: 'ammo', x: 20 * CELL, y: 26 * CELL, amount: 1 },
      { id: 'ghost', kind: 'upgrade', upgrade: 'ghost', x: 14 * CELL, y: 25 * CELL },
      { id: 'score-b', kind: 'score', x: 44 * CELL, y: 25 * CELL, amount: 500 },
      { id: 'virtual', kind: 'upgrade', upgrade: 'virtual', x: 80 * CELL, y: 15 * CELL },
      { id: 'echo-lens', kind: 'upgrade', upgrade: 'echo', x: 128 * CELL, y: 17 * CELL },
      { id: 'score-c', kind: 'score', x: 119 * CELL, y: 25 * CELL, amount: 500 },
      { id: 'spider-ball', kind: 'upgrade', upgrade: 'grip', x: 11 * CELL, y: 47 * CELL },
      { id: 'bomb-kit', kind: 'upgrade', upgrade: 'bomb', x: 37 * CELL, y: 55 * CELL },
      { id: 'ammo-b', kind: 'ammo', x: 45 * CELL, y: 58 * CELL, amount: 1 },
      { id: 'super-bomb', kind: 'upgrade', upgrade: 'super', x: 77 * CELL, y: 52 * CELL },
      { id: 'score-d', kind: 'score', x: 67 * CELL, y: 58 * CELL, amount: 500 },
      { id: 'phase-bomb', kind: 'upgrade', upgrade: 'phase', x: 127 * CELL, y: 49 * CELL },
      { id: 'ammo-c', kind: 'ammo', x: 138 * CELL, y: 58 * CELL, amount: 1 }
    ];

    const echoGemDefs = [
      { id: 'echo-gem-a', kind: 'echoGem', x: 27 * CELL, y: 14 * CELL },
      { id: 'echo-gem-b', kind: 'echoGem', x: 61 * CELL, y: 14 * CELL }
    ];

    const enemyDefs = [
      { id:'mite-1', x:27 * CELL, y:26 * CELL, minX:25 * CELL, maxX:34 * CELL, hp:1 },
      { id:'mite-2', x:60 * CELL, y:25 * CELL, minX:55 * CELL, maxX:67 * CELL, hp:2 },
      { id:'shield-1', x:105 * CELL, y:25 * CELL, minX:99 * CELL, maxX:112 * CELL, hp:3, shielded:true },
      { id:'mite-3', x:33 * CELL, y:57 * CELL, minX:29 * CELL, maxX:38 * CELL, hp:2 },
      { id:'shield-2', x:75 * CELL, y:57 * CELL, minX:70 * CELL, maxX:84 * CELL, hp:3, shielded:true },
      { id:'core-warden', x:134 * CELL, y:(ROOM_H + 26) * CELL, minX:130 * CELL, maxX:139 * CELL, hp:8, boss:true, shielded:true }
    ];

    class PinballThingyScene extends Phaser.Scene {
      constructor() { super('PinballThingy'); }

      preload() {
        for (const file of XP_SOUND_FILES) {
          this.load.audio(xpSoundKey(file), './assets/sounds/windows-xp/' + encodeURIComponent(file));
        }
      }

      create() {
        // Keep Matter's simulation on one stable 60 Hz step; input control scales with frame delta.
        this.matter.set60Hz();
        this.score = 2500;
        this.scoreCap = 10000;
        this.ammo = 4;
        this.ammoCap = 10;
        this.respawnScore = 2500;
        this.respawnAmmo = 4;
        this.upgrades = Object.fromEntries(UPGRADE_KEYS.map(key => [key, false]));
        this.echoCharges = 0;
        this.collectedGems = new Set();
        this.visitedRooms = new Set([0]);
        this.currentRoom = 0;
        this.selectedBomb = 'standard';
        this.lastFlipper = 'left';
        this.airUses = { ghost: false, virtual: false };
        this.groundedUntil = 0;
        this.playerIFrameUntil = 0;
        this.nextFlipAt = 0;
        this.lastNudgeAt = -BALL.nudgeCooldownMs;
        this.initialLaunchAvailable = true;
        this.lastPlayerVelocity = { x: 0, y: 0 };
        this.lastPlayerHit = 0;
        this.spiderEnabled = false;
        this.spiderAttached = null;
        this.paused = false;
        this.deathLockUntil = 0;
        this.bombs = [];
        this.enemies = [];
        this.pickups = [];
        this.dropPickups = [];
        this.terrainBodies = [];
        this.bossKilled = false;
        this.bossHealth = 8;
        this.lastHudUpdate = 0;
        this.playerFacing = 1;
        this.sfxCursor = Object.create(null);
        this.sfxLastAt = Object.create(null);

        this.createBackdrop();
        this.chunkMap = worldChunks;
        this.createTileAtlas();
        this.createSpriteAtlas();
        this.createTilemap();
        this.buildTerrainBodies();
        this.createRoomDecor();
        this.createFlippers();
        this.createPlayer();
        this.createEnemies();
        this.createPickups();
        this.createKeyboard();
        this.bindPhysicsEvents();

        this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.roundPixels = true;
        this.scale.on('resize', this.applyPixelCamera, this);
        this.applyPixelCamera();
        this.game.canvas.setAttribute('tabindex', '0');
        this.game.canvas.setAttribute('aria-label', 'pinball thingy game canvas.');
        this.game.canvas.focus({ preventScroll: true });
        window.pinballThingyScene = this;
        this.updateHud(true);
      }

      applyPixelCamera() {
        const viewportHeight = this.scale.height || this.scale.gameSize.height || window.innerHeight || 240;
        // Keep a 240 px world height and follow the viewport aspect without stretching.
        const zoom = Math.max(1, viewportHeight / 240);
        const camera = this.cameras.main;
        camera.setZoom(zoom);
        const viewWidth = camera.width / zoom;
        const viewHeight = camera.height / zoom;
        camera.setDeadzone(Math.round(viewWidth * 0.25), Math.round(viewHeight * 0.2));
        document.documentElement.style.fontSize = (8 * zoom) + 'px';
      }

      playSfx(group) {
        const files = XP_SOUND_GROUPS[group];
        if (!files || !files.length || !this.sound) return;
        const now = this.time ? this.time.now : 0;
        const cooldown = group === 'movement' ? 75 : 45;
        if (now - (this.sfxLastAt[group] ?? -Infinity) < cooldown) return;
        const index = this.sfxCursor[group] || 0;
        const file = files[index];
        this.sfxCursor[group] = (index + 1) % files.length;
        this.sfxLastAt[group] = now;
        this.sound.play(xpSoundKey(file), { volume: SOUND_VOLUME });
      }

      playSurfaceSfx(pair) {
        const surface = this.surfaceContact(pair);
        if (!surface) return;
        const velocity = this.player.body.velocity;
        const incomingSpeed = -(velocity.x * surface.normal.x + velocity.y * surface.normal.y);
        if (incomingSpeed > 2.5) this.playSfx('movement');
      }
      createBackdrop() {
        this.add.rectangle(WORLD_W / 2, WORLD_H / 2, WORLD_W, WORLD_H, 0x000000).setDepth(-5);
      }

      createTileAtlas() {
        const texture = this.textures.createCanvas('pinballThingyTiles', CELL * 5, CELL);
        const ctx = texture.getContext();
        const patterns = {
          stoneA:['11111111','10000001','10010001','10000001','10001001','10000001','10000001','11111111'],
          stoneB:['11111111','10000001','10001001','10000001','10000001','10100001','10000001','11111111'],
          crackA:['11111111','10000001','10100001','10010001','10001001','10000101','10000001','11111111'],
          crackB:['11111111','10000001','10000101','10001001','10010001','10100001','10000001','11111111'],
          gateA:['11111111','10000001','10000001','10000001','10000001','10000001','10000001','11111111'],
          gateB:['11111111','10000001','10100001','10000001','10000001','10000001','10000001','11111111']
        };
        const draw8 = (x, y, name) => {
          const rows = patterns[name];
          for (let py = 0; py < ART_TILE; py++) for (let px = 0; px < ART_TILE; px++) {
            if (rows[py][px] === '1') { ctx.fillStyle = '#fff'; ctx.fillRect(x + px, y + py, 1, 1); }
          }
        };
        const block = (index, parts) => {
          const ox = index * CELL;
          ctx.fillStyle = '#000'; ctx.fillRect(ox, 0, CELL, CELL);
          for (let part = 0; part < 4; part++) draw8(ox + (part % 2) * ART_TILE, Math.floor(part / 2) * ART_TILE, parts[part]);
        };
        ctx.fillStyle = '#fff';
        block(0, ['stoneA','stoneB','stoneB','stoneA']);
        for (const [index, rising] of [[1, true],[2, false]]) {
          const ox = index * CELL;
          ctx.fillStyle = '#000'; ctx.fillRect(ox, 0, CELL, CELL);
          for (let x = 0; x < CELL; x++) {
            const surface = rising ? CELL - 1 - x : x;
            ctx.fillStyle = '#fff'; ctx.fillRect(ox + x, surface, 1, CELL - surface);
          }
        }
        block(3, ['crackA','crackB','crackB','crackA']);
        block(4, ['gateA','gateB','gateB','gateA']);
        for (let x = 3; x < CELL; x += 4) { ctx.fillStyle = '#fff'; ctx.fillRect(CELL * 4 + x, 2, 1, 12); }
        texture.refresh();
      }

      createSpriteAtlas() {
        const frames = [];
        const add = (name, draw) => frames.push({ name, draw });
        const pixel = (ctx, x, y, w, h, color) => { ctx.fillStyle = color || '#fff'; ctx.fillRect(x, y, w, h); };
        const disk = (ctx, cx, cy, radius, color) => {
          for (let y = 0; y < CELL; y++) for (let x = 0; x < CELL; x++) {
            const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
            if (dx * dx + dy * dy <= radius * radius) pixel(ctx, x, y, 1, 1, color);
          }
        };
        const ball = (ctx, frame) => {
          disk(ctx, 8, 8, 7.6, '#000'); disk(ctx, 8, 8, 6.3, '#fff');
          const marks = [
            [[4,7,3,2],[9,5,2,2]], [[7,4,2,3],[9,9,2,3]],
            [[9,7,3,2],[5,9,2,2]], [[7,9,2,3],[5,5,2,2]]
          ][frame];
          for (const m of marks) pixel(ctx, m[0], m[1], m[2], m[3], '#000');
          for (let i = 1; i < marks.length; i++) pixel(ctx, marks[i][0], marks[i][1], marks[i][2], marks[i][3], '#000');
        };
        const mite = (ctx, frame, armored, boss) => {
          if (boss) {
            pixel(ctx, 7,1,2,3); pixel(ctx,3,4,10,2); pixel(ctx,2,6,12,6); pixel(ctx,4,12,8,2);
            pixel(ctx,1,8,2,3); pixel(ctx,13,8,2,3); pixel(ctx,3,14,3,1); pixel(ctx,10,14,3,1);
            pixel(ctx,5,7,2,2,'#000'); pixel(ctx,9,7,2,2,'#000'); pixel(ctx,7,10,2,1,'#000');
            if (frame) { pixel(ctx,2,5,2,1); pixel(ctx,12,5,2,1); }
            return;
          }
          if (armored) {
            pixel(ctx,5,2,6,2); pixel(ctx,3,4,10,8); pixel(ctx,5,12,6,2);
            pixel(ctx,2,5,1,6); pixel(ctx,13,5,1,6); pixel(ctx,4,3,1,1); pixel(ctx,11,3,1,1);
            pixel(ctx,6,6,1,2,'#000'); pixel(ctx,9,6,1,2,'#000'); pixel(ctx,5,9,6,1,'#000');
            if (frame) { pixel(ctx,4,13,2,2); pixel(ctx,10,13,2,2); }
            return;
          }
          pixel(ctx,6,2,2,2); pixel(ctx,8,2,2,2); pixel(ctx,4,4,8,2); pixel(ctx,3,6,10,5);
          pixel(ctx,5,11,6,2); pixel(ctx,3,12,3,2); pixel(ctx,10,12,3,2);
          pixel(ctx,2,5,2,2); pixel(ctx,12,5,2,2);
          pixel(ctx,5,7,2,2,'#000'); pixel(ctx,9,7,2,2,'#000'); pixel(ctx,7,10,2,1,'#000');
          if (frame) { pixel(ctx,2,13,3,1); pixel(ctx,11,13,3,1); }
        };
        const diamond = (ctx, color, center) => {
          pixel(ctx,7,2,2,2,color); pixel(ctx,5,4,6,2,color); pixel(ctx,3,6,10,4,color);
          pixel(ctx,5,10,6,2,color); pixel(ctx,7,12,2,2,color);
          if (center) pixel(ctx,7,6,2,4,'#000');
        };
        for (let i = 0; i < 4; i++) add('ball-' + i, ctx => ball(ctx, i));
        add('mite-0', ctx => mite(ctx,0,false,false)); add('mite-1', ctx => mite(ctx,1,false,false));
        add('shield-0', ctx => mite(ctx,0,true,false)); add('shield-1', ctx => mite(ctx,1,true,false));
        add('warden-0', ctx => mite(ctx,0,false,true)); add('warden-1', ctx => mite(ctx,1,false,true));
        add('bomb-0', ctx => { disk(ctx,8,8,6,'#fff'); pixel(ctx,7,1,2,3); pixel(ctx,8,3,3,1,'#000'); pixel(ctx,6,7,4,2,'#000'); });
        add('bomb-1', ctx => { diamond(ctx,'#fff',false); pixel(ctx,6,7,4,2,'#000'); });
        add('bomb-2', ctx => { disk(ctx,8,8,7,'#fff'); pixel(ctx,6,6,4,4,'#000'); pixel(ctx,7,1,2,3); });
        add('score', ctx => { disk(ctx,8,8,5,'#fff'); pixel(ctx,7,7,2,2,'#000'); });
        add('ammo', ctx => { pixel(ctx,3,4,10,8); pixel(ctx,5,6,2,2,'#000'); pixel(ctx,9,6,2,2,'#000'); pixel(ctx,6,9,4,1,'#000'); });
        add('upgrade', ctx => diamond(ctx,'#fff',true));
        add('gem', ctx => { diamond(ctx,'#fff',false); pixel(ctx,7,6,2,4,'#000'); });
        add('grip', ctx => { pixel(ctx,3,7,10,2); pixel(ctx,7,3,2,10); pixel(ctx,4,4,2,2); pixel(ctx,10,4,2,2); pixel(ctx,4,10,2,2); pixel(ctx,10,10,2,2); });
        const columns = 6, rows = Math.ceil(frames.length / columns);
        const texture = this.textures.createCanvas('pinballThingySprites', columns * CELL, rows * CELL);
        const ctx = texture.getContext();
        frames.forEach((entry, index) => {
          const x = (index % columns) * CELL, y = Math.floor(index / columns) * CELL;
          ctx.save(); ctx.translate(x,y); entry.draw(ctx); ctx.restore();
          texture.add(entry.name, 0, x, y, CELL, CELL);
        });
        texture.refresh();
      }

      createTilemap() {
        const data = unpackWorldChunks(this.chunkMap);
        this.tilemap = this.make.tilemap({ data, tileWidth:CELL, tileHeight:CELL });
        const set = this.tilemap.addTilesetImage('pinballThingy', 'pinballThingyTiles', CELL, CELL, 0, 0, 1);
        this.tileLayer = this.tilemap.createLayer(0, set, 0, 0).setDepth(0);
        this.tileLayer.setCollisionByExclusion([-1]);
      }

      buildTerrainBodies() {
        for (const body of this.terrainBodies) this.matter.world.remove(body);
        this.terrainBodies.length = 0;
        const seen = Array.from({ length:MAP_H }, () => Array(MAP_W).fill(false));
        const common = {
          isStatic:true, friction:0.1, frictionStatic:0.35, restitution:0.03,
          collisionFilter:{ category:CAT.TERRAIN, mask:CAT.PLAYER | CAT.ENEMY | CAT.BOMB }
        };
        const addRect = (tx, ty, w, h, type) => {
          const body = this.matter.add.rectangle((tx + w / 2) * CELL, (ty + h / 2) * CELL, w * CELL, h * CELL, { ...common, label:type === TILE.GATE ? 'gate' : 'terrain' });
          body.plugin.gameMeta = { kind:type === TILE.CRACK ? 'breakable' : 'terrain', tx, ty, w, h };
          this.terrainBodies.push(body);
        };
        for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
          const type = grid[y][x];
          if (seen[y][x] || rampUnderlay.has(x + ',' + y) || (type !== TILE.ROCK && type !== TILE.GATE)) continue;
          let width = 1;
          while (x + width < MAP_W && !seen[y][x + width] && !rampUnderlay.has((x + width) + ',' + y) && grid[y][x + width] === type) width++;
          let height = 1;
          outer: while (y + height < MAP_H) {
            for (let xx = x; xx < x + width; xx++) if (seen[y + height][xx] || rampUnderlay.has(xx + ',' + (y + height)) || grid[y + height][xx] !== type) break outer;
            height++;
          }
          for (let yy = y; yy < y + height; yy++) for (let xx = x; xx < x + width; xx++) seen[yy][xx] = true;
          addRect(x, y, width, height, type);
        }
        for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
          if (grid[y][x] === TILE.CRACK) addRect(x, y, 1, 1, TILE.CRACK);
        }
        const Matter = Phaser.Physics.Matter.Matter;
        for (const ramp of rampRuns) {
          const x0 = ramp.startX * CELL;
          const x1 = (ramp.startX + ramp.steps) * CELL;
          const surfaceY0 = (ramp.direction === 'up' ? ramp.startY + 1 : ramp.startY) * CELL;
          const surfaceY1 = (ramp.direction === 'up' ? ramp.startY - ramp.steps + 1 : ramp.startY + ramp.steps) * CELL;
          const floorY = ramp.floorY * CELL;
          const points = [
            { x:x0, y:surfaceY0 }, { x:x1, y:surfaceY1 },
            { x:x1, y:floorY }, { x:x0, y:floorY }
          ];
          const center = Matter.Vertices.centre(points);
          const body = this.matter.add.fromVertices(center.x, center.y, points, { ...common, label:'slope' }, true);
          body.plugin.gameMeta = { kind:'terrain', slope:ramp.direction, tx:ramp.startX, ty:ramp.startY, steps:ramp.steps };
          this.terrainBodies.push(body);
        }
      }

      createRoomDecor() {
        const decor = this.add.graphics().setDepth(1);
        decor.lineStyle(1, 0xffffff, 1);
        for (let col = 1; col < ROOM_COLS; col++) decor.lineBetween(col * ROOM_W * CELL, 0, col * ROOM_W * CELL, WORLD_H);
        decor.lineBetween(0, ROOM_H * CELL, WORLD_W, ROOM_H * CELL);
      }

      createFlippers() {
        this.flippers = [];
        for (let row = 0; row < ROOM_ROWS; row++) for (let col = 0; col < ROOM_COLS; col++) {
          const rx = col * ROOM_W;
          const ry = row * ROOM_H;
          this.flippers.push({ x:(rx + 12) * CELL, y:(ry + 27) * CELL, side:'left', room:row * ROOM_COLS + col });
          this.flippers.push({ x:(rx + 36) * CELL, y:(ry + 27) * CELL, side:'right', room:row * ROOM_COLS + col });
          this.flippers.push({ x:(rx + 23) * CELL, y:(ry + 15) * CELL, side:col % 2 ? 'right' : 'left', room:row * ROOM_COLS + col });
        }
        const g = this.add.graphics().setDepth(3);
        for (const pad of this.flippers) {
          g.lineStyle(1, 0xffffff, 1).strokeRect(pad.x - 16, pad.y - 4, 32, 8);
          g.lineStyle(2, 0xffffff, 1).lineBetween(pad.x - 12, pad.y + 1, pad.x + 12, pad.y - (pad.side === 'left' ? 4 : -4));
        }
      }

      createMatterCircle(x, y, radius, options, meta) {
        let frame = 'bomb-0';
        if (meta.kind === 'player') frame = 'ball-0';
        else if (meta.kind === 'enemy') frame = meta.boss ? 'warden-0' : meta.shielded ? 'shield-0' : 'mite-0';
        else if (meta.kind === 'bomb') frame = meta.type.key === 'super' ? 'bomb-1' : meta.type.key === 'phase' ? 'bomb-2' : 'bomb-0';
        const object = this.add.sprite(x, y, 'pinballThingySprites', frame).setDepth(5).setDisplaySize(radius * 2, radius * 2);
        this.matter.add.gameObject(object, { shape:{ type:'circle', radius }, ...options });
        object.body.plugin.gameMeta = meta;
        return object;
      }

      createPlayer() {
        const start = { x:12 * CELL, y:27 * CELL };
        this.spawn = start;
        this.player = this.createMatterCircle(start.x, start.y, BALL.radius, {
          label:'player', friction:0.08, frictionStatic:0.2, frictionAir:0.0015, restitution:0.04, density:0.006,
          collisionFilter:{ category:CAT.PLAYER, mask:CAT.TERRAIN | CAT.ENEMY | CAT.PICKUP }
        }, { kind:'player' });
        this.rollAngle = 0;
        this.groundSurface = null;
        this.groundContactUntil = 0;
        this.lastPlayerPosition = { x:start.x, y:start.y };
      }

      createKeyboard() {
        this.keys = this.input.keyboard.addKeys({
          left: 'LEFT', right: 'RIGHT', a: 'A', d: 'D', space: 'SPACE', shift: 'SHIFT',
          e: 'E', m: 'M', g: 'G', esc: 'ESC', enter: 'ENTER'
        });
        // Keep arrows and Space from scrolling the browser while they control the ball.
        this.input.keyboard.addCapture('LEFT,RIGHT,SPACE');
        const once = (key, action) => this.input.keyboard.on('keydown-' + key, event => {
          if (event && event.repeat) return;
          action(event);
        });
        once('M', () => this.toggleMap());
        once('ESC', () => {
          if (document.getElementById('map-card').classList.contains('map-focus')) this.toggleMap(false);
          else this.togglePause();
        });
        once('P', () => this.togglePause());
        once('E', () => this.cycleBomb());
        once('G', () => this.toggleSpiderBall());
        once('SHIFT', () => this.throwBomb());
        once('SPACE', () => this.launchOrNudge());
        once('R', event => {
          if (event && (event.ctrlKey || event.altKey || event.metaKey)) return;
          window.location.reload();
        });
        once('F', event => {
          if (event && (event.ctrlKey || event.altKey || event.metaKey)) return;
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => this.showNotice('Could not leave fullscreen.'));
          } else if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => this.showNotice('Fullscreen is unavailable in this browser.'));
          } else {
            this.showNotice('Fullscreen is unavailable in this browser.');
          }
        });
      }

      bindPhysicsEvents() {
        this.matter.world.on('collisionstart', event => {
          for (const pair of event.pairs) {
            const a = pair.bodyA;
            const b = pair.bodyB;
            const ma = a.plugin && a.plugin.gameMeta;
            const mb = b.plugin && b.plugin.gameMeta;
            if (ma && ma.kind === 'player') { this.handlePlayerContact(b, mb, pair); if (mb && (mb.kind === 'terrain' || mb.kind === 'breakable')) this.playSurfaceSfx(pair); }
            else if (mb && mb.kind === 'player') { this.handlePlayerContact(a, ma, pair); if (ma && (ma.kind === 'terrain' || ma.kind === 'breakable')) this.playSurfaceSfx(pair); }
            if (ma && ma.kind === 'bomb') this.handleBombContact(ma, b, mb);
            else if (mb && mb.kind === 'bomb') this.handleBombContact(mb, a, ma);
            if ((ma && ma.kind === 'player') || (mb && mb.kind === 'player')) this.attachSpiderBall(pair);
          }
        });
        this.matter.world.on('collisionactive', event => {
          for (const pair of event.pairs) {
            const a = pair.bodyA;
            const b = pair.bodyB;
            const ma = a.plugin && a.plugin.gameMeta;
            const mb = b.plugin && b.plugin.gameMeta;
            if (ma && ma.kind === 'player' && mb && (mb.kind === 'terrain' || mb.kind === 'breakable')) {
              this.handlePlayerContact(b, mb, pair);
              this.refreshSpiderSurface(pair);
            } else if (mb && mb.kind === 'player' && ma && (ma.kind === 'terrain' || ma.kind === 'breakable')) {
              this.handlePlayerContact(a, ma, pair);
              this.refreshSpiderSurface(pair);
            }
          }
        });
      }

      createEnemies() {
        for (const def of enemyDefs) {
          if (def.boss && this.bossKilled) continue;
          const hp = def.boss ? this.bossHealth : def.hp;
          const enemy = this.createMatterCircle(def.x, def.y, def.boss ? 12 : 9, {
            label:def.boss ? 'boss' : 'enemy', friction:0.03, frictionAir:0.025, restitution:0.06, density:0.009,
            collisionFilter: { category: CAT.ENEMY, mask: CAT.TERRAIN | CAT.PLAYER | CAT.BOMB }
          }, { kind: 'enemy', id: def.id, hp, maxHp: def.hp, minX: def.minX, maxX: def.maxX, dir: 1, shielded: !!def.shielded, boss: !!def.boss, dead: false });
          enemy.setData('def', def);
          this.enemies.push(enemy);
        }
      }

      createPickups() {
        for (const def of pickupDefs) this.spawnPickup({ ...def }, false);
      }

      spawnPickup(def, isDrop) {
        if (def.kind === 'upgrade' && this.upgrades[def.upgrade]) return null;
        if (def.kind === 'echoGem' && this.collectedGems.has(def.id)) return null;
        const radius = def.kind === 'upgrade' ? 8 : def.kind === 'echoGem' ? 6 : 5;
        const frame = def.kind === 'score' ? 'score' : def.kind === 'ammo' ? 'ammo' : def.kind === 'echoGem' ? 'gem' : def.upgrade === 'grip' ? 'grip' : 'upgrade';
        const item = this.add.sprite(def.x, def.y, 'pinballThingySprites', frame).setDepth(5).setDisplaySize(radius * 2, radius * 2);
        this.matter.add.gameObject(item, {
          shape:{ type:'circle', radius }, label:'pickup', isStatic:true, isSensor:true, friction:0, restitution:0,
          collisionFilter:{ category:CAT.PICKUP, mask:CAT.PLAYER }
        });
        item.body.plugin.gameMeta = { kind:'pickup', def, isDrop:!!isDrop, taken:false };
        this.pickups.push(item);
        if (isDrop) this.dropPickups.push(item);
        return item;
      }

      handlePlayerContact(otherBody, meta, pair) {
        if (!meta) return;
        if (meta.kind === 'pickup') {
          this.collectPickup(meta);
          return;
        }
        if (meta.kind === 'enemy') {
          this.hitByEnemy(meta);
          return;
        }
        if (meta.kind === 'terrain' || meta.kind === 'breakable') {
          const surface = this.surfaceContact(pair);
          if (surface && surface.normal.y < -.35) {
            this.groundSurface = surface;
            this.groundContactUntil = this.time.now + BALL.surfaceContactGraceMs;
            this.groundedUntil = this.time.now + BALL.coyoteMs;
            this.airUses = { ghost:false, virtual:false };
          }
        }
      }

      hitByEnemy(enemyMeta) {
        if (this.time.now < this.playerIFrameUntil || this.time.now < this.deathLockUntil) return;
        if (this.spiderEnabled) this.releaseSpiderBall();
        this.playerIFrameUntil = this.time.now + 850;
        this.lastPlayerHit = this.time.now;
        this.playSfx('damage');
        if (enemyMeta.shielded) {
          this.changeScore(-500);
          this.showNotice('Shielded alien: bombs only. Hull −500.');
        } else if (this.ammo > 0) {
          this.ammo -= 1;
          this.damageEnemy(enemyMeta, 1);
          this.showNotice('Impact blast absorbed with 1 ammo. Enemy takes 1 damage.');
        } else {
          this.changeScore(-500);
          this.showNotice('Out of ammo. Hull −500. Find a refill.');
        }
        const direction = this.player.x < (enemyMeta.id ? this.enemyX(enemyMeta.id) : this.player.x + 1) ? -1 : 1;
        const Matter = Phaser.Physics.Matter.Matter;
        Matter.Body.setVelocity(this.player.body, { x: direction * 4.5, y: -5.5 });
      }

      enemyX(id) {
        const enemy = this.enemies.find(item => item.body.plugin.gameMeta.id === id);
        return enemy ? enemy.x : this.player.x + 1;
      }

      collectPickup(meta) {
        if (meta.taken) return;
        const def = meta.def;
        if (def.kind === 'score' && this.score >= this.scoreCap) { this.showNotice('Score already at cap.'); return; }
        if (def.kind === 'ammo' && this.ammo >= this.ammoCap) { this.showNotice('Ammo already at cap.'); return; }
        meta.taken = true;
        this.playSfx('pickup');
        const item = this.pickups.find(p => p.body.plugin.gameMeta === meta);
        if (item) this.removePickup(item);
        if (def.kind === 'score') {
          this.changeScore(def.amount || 500);
          this.showNotice(`Score +${def.amount || 500}.`);
        } else if (def.kind === 'ammo') {
          this.ammo = Math.min(this.ammoCap, this.ammo + (def.amount || 1));
          this.showNotice('Ammo +1.');
        } else if (def.kind === 'upgrade') {
          this.upgrades[def.upgrade] = true;
          if (def.upgrade === 'bomb') this.selectedBomb = 'standard';
          if (def.upgrade === 'super' && this.selectedBomb === 'standard') this.selectedBomb = 'super';
          if (def.upgrade === 'phase') this.selectedBomb = 'phase';
          this.showNotice(`${UPGRADE_LABELS[def.upgrade] || 'Upgrade'} acquired.`);
          if (def.upgrade === 'echo') this.revealEchoGems();
        } else if (def.kind === 'echoGem') {
          this.collectedGems.add(def.id);
          this.echoCharges += 1;
          this.showNotice('Echo crystal collected: +1 aerial flipper charge.');
        }
        this.updateHud(true);
      }

      removePickup(item) {
        this.matter.world.remove(item.body);
        item.destroy();
        this.pickups = this.pickups.filter(entry => entry !== item);
        this.dropPickups = this.dropPickups.filter(entry => entry !== item);
      }

      revealEchoGems() {
        for (const def of echoGemDefs) this.spawnPickup({ ...def }, false);
      }

      changeScore(amount) {
        this.score = Phaser.Math.Clamp(this.score + amount, 0, this.scoreCap);
        if (this.score <= 0) this.die();
        this.updateHud();
      }

      damageEnemy(enemyMeta, amount) {
        const enemy = this.enemies.find(item => item.body.plugin.gameMeta === enemyMeta);
        if (!enemy || enemyMeta.dead) return;
        this.playSfx('bomb');
        enemyMeta.hp = Math.max(0, enemyMeta.hp - amount);
        enemy.setTintFill(0xffffff);
        this.time.delayedCall(100, () => { if (enemy.active) enemy.clearTint(); });
        if (enemyMeta.boss) this.bossHealth = enemyMeta.hp;
        if (enemyMeta.hp <= 0) this.killEnemy(enemy, enemyMeta);
        else this.showNotice(`${enemyMeta.boss ? 'Core Warden' : 'Alien'}: ${enemyMeta.hp} HP remain.`);
      }

      killEnemy(enemy, meta) {
        if (meta.dead) return;
        meta.dead = true;
        const x = enemy.x;
        const y = enemy.y;
        if (meta.boss) {
          this.bossKilled = true;
          this.bossHealth = 0;
          this.showNotice('CORE WARDEN DISABLED. The vault gate is open permanently.');
          this.openBossGate();
        } else {
          this.spawnPickup({ id: `drop-score-${meta.id}-${this.time.now}`, kind: 'score', x: x - 8, y, amount: 500 }, true);
          this.spawnPickup({ id: `drop-ammo-${meta.id}-${this.time.now}`, kind: 'ammo', x: x + 9, y, amount: 1 }, true);
          this.showNotice('Alien down. Score pellet + ammo dropped.');
        }
        this.enemies = this.enemies.filter(item => item !== enemy);
        this.matter.world.remove(enemy.body);
        enemy.destroy();
        this.updateHud(true);
      }

      openBossGate() {
        let changed = false;
        for (let y = ROOM_H + 23; y < ROOM_H + 28; y++) {
          const x = ROOM_W * 2 + 39;
          if (grid[y][x] === TILE.GATE) {
            grid[y][x] = AIR;
            this.tileLayer.removeTileAt(x, y);
            changed = true;
          }
        }
        if (changed) this.buildTerrainBodies();
      }

      lineBlocked(x1, y1, x2, y2) {
        const distance = Phaser.Math.Distance.Between(x1, y1, x2, y2);
        const count = Math.max(1, Math.ceil(distance / 8));
        for (let i = 1; i < count; i++) {
          const t = i / count;
          const tx = Math.floor(Phaser.Math.Linear(x1, x2, t) / CELL);
          const ty = Math.floor(Phaser.Math.Linear(y1, y2, t) / CELL);
          const tile = grid[ty] && grid[ty][tx];
          if (tile === TILE.ROCK || tile === TILE.CRACK || tile === TILE.GATE || tile === TILE.RAMP_UP || tile === TILE.RAMP_DOWN) return true;
        }
        return false;
      }

      handleBombContact(bombMeta, otherBody, otherMeta) {
        if (bombMeta.detonated || !bombMeta.object) return;
        if (otherMeta && otherMeta.kind === 'enemy') this.explodeBomb(bombMeta, bombMeta.object.x, bombMeta.object.y);
        else if (otherMeta && otherMeta.kind === 'breakable') this.explodeBomb(bombMeta, bombMeta.object.x, bombMeta.object.y);
        else if (otherMeta && otherMeta.kind === 'terrain' && !bombMeta.phase) this.explodeBomb(bombMeta, bombMeta.object.x, bombMeta.object.y);
      }

      throwBomb() {
        if (!this.upgrades.bomb || this.ammo <= 0 || this.paused || this.time.now < this.deathLockUntil) {
          if (!this.upgrades.bomb) this.showNotice('Find the Bomb Kit first.');
          else if (this.ammo <= 0) this.showNotice('No ammo for a bomb.');
          return;
        }
        const type = this.activeBomb();
        this.playSfx('bomb');
        this.ammo -= 1;
        const x = this.player.x + this.playerFacing * 20;
        const y = this.player.y - 8;
        const bomb = this.createMatterCircle(x, y, type.key === 'super' ? 7 : 5, {
          label:'bomb', friction:0.005, frictionAir:0.001, restitution:0.12, density:0.002,
          collisionFilter: { category: CAT.BOMB, mask: type.phase ? CAT.ENEMY : CAT.TERRAIN | CAT.ENEMY }
        }, { kind: 'bomb', type, damage: type.damage, radius: type.radius, phase: type.phase, detonated: false, bornAt: this.time.now });
        bomb.body.plugin.gameMeta.object = bomb;
        Phaser.Physics.Matter.Matter.Body.setVelocity(bomb.body, { x: this.playerFacing * (type.key === 'super' ? 8 : 7), y: -3.5 });
        this.bombs.push(bomb);
        this.time.delayedCall(type.fuse, () => {
          if (bomb.active && !bomb.body.plugin.gameMeta.detonated) this.explodeBomb(bomb.body.plugin.gameMeta, bomb.x, bomb.y);
        });
        this.showNotice(`${type.label} bomb launched · −1 ammo.`);
        this.updateHud(true);
      }

      activeBomb() {
        return BOMB_TYPES.find(type => type.key === this.selectedBomb) || BOMB_TYPES[0];
      }

      cycleBomb() {
        this.playSfx('ui');
        const available = ['standard', ...(this.upgrades.super ? ['super'] : []), ...(this.upgrades.phase ? ['phase'] : [])];
        const index = available.indexOf(this.selectedBomb);
        this.selectedBomb = available[(index + 1) % available.length];
        this.showNotice(`${this.activeBomb().label} bomb selected.`);
        this.updateHud(true);
      }

      explodeBomb(meta, x, y) {
        if (!meta || meta.detonated) return;
        meta.detonated = true;
        this.playSfx('bomb');
        const type = meta.type;
        const ring = this.add.graphics().setDepth(9);
        const waveSizes = [6, Math.round(type.radius * .55), Math.round(type.radius * 1.1), Math.round(type.radius * 1.65), Math.round(type.radius * 2)];
        waveSizes.forEach((size, index) => this.time.delayedCall(index * 42, () => {
          if (!ring.active) return;
          const extent = Math.max(4, size);
          ring.clear().lineStyle(1, 0xffffff, 1).strokeRect(Math.round(x - extent / 2), Math.round(y - extent / 2), extent, extent);
        }));
        this.time.delayedCall(230, () => ring.destroy());
        let removedAny = false;
        const minX = Math.max(0, Math.floor((x - type.radius) / CELL));
        const maxX = Math.min(MAP_W - 1, Math.floor((x + type.radius) / CELL));
        const minY = Math.max(0, Math.floor((y - type.radius) / CELL));
        const maxY = Math.min(MAP_H - 1, Math.floor((y + type.radius) / CELL));
        if (meta.phase) {
          for (const enemy of [...this.enemies]) {
            const target = enemy.body.plugin.gameMeta;
            if (Phaser.Math.Distance.Between(x, y, enemy.x, enemy.y) <= type.radius + 10) this.damageEnemy(target, type.damage);
          }
        } else {
          for (const enemy of [...this.enemies]) {
            const target = enemy.body.plugin.gameMeta;
            if (Phaser.Math.Distance.Between(x, y, enemy.x, enemy.y) <= type.radius + 10 && !this.lineBlocked(x, y, enemy.x, enemy.y)) this.damageEnemy(target, type.damage);
          }
        }
        if (this.upgrades.bomb) {
          for (let ty = minY; ty <= maxY; ty++) for (let tx = minX; tx <= maxX; tx++) {
            if (grid[ty][tx] !== TILE.CRACK) continue;
            const cx = (tx + .5) * CELL, cy = (ty + .5) * CELL;
            if (Phaser.Math.Distance.Between(x, y, cx, cy) > type.radius) continue;
            if (!meta.phase && this.lineBlocked(x, y, cx, cy)) continue;
            grid[ty][tx] = AIR;
            this.tileLayer.removeTileAt(tx, ty);
            removedAny = true;
          }
        }
        if (removedAny) this.buildTerrainBodies();
        const bomb = meta.object;
        this.bombs = this.bombs.filter(entry => entry !== bomb);
        if (bomb && bomb.active) {
          this.matter.world.remove(bomb.body);
          bomb.destroy();
        }
        this.showNotice(`${type.label} blast · ${type.damage} damage${removedAny ? ' · plating broken' : ''}.`);
      }

      sampleRampSurface(meta, x, y) {
        if (!meta || !meta.slope || !meta.steps) return null;
        const x0 = meta.tx * CELL;
        const x1 = (meta.tx + meta.steps) * CELL;
        if (x < x0 - BALL.radius || x > x1 + BALL.radius) return null;
        const clampedX = Phaser.Math.Clamp(x, x0, x1);
        const y0 = (meta.slope === 'up' ? meta.ty + 1 : meta.ty) * CELL;
        const y1 = (meta.slope === 'up' ? meta.ty - meta.steps + 1 : meta.ty + meta.steps) * CELL;
        const m = (y1 - y0) / (x1 - x0);
        const surfaceY = y0 + m * (clampedX - x0);
        const invLength = 1 / Math.hypot(m, 1);
        const normal = { x:m * invLength, y:-invLength };
        const signedDistance = (x - clampedX) * normal.x + (y - surfaceY) * normal.y;
        if (Math.abs(signedDistance - BALL.radius) > BALL.slopeSnapTolerance) return null;
        return { x:clampedX, y:surfaceY, normal, angle:Math.atan2(m, 1), distance:signedDistance, slope:meta.slope };
      }

      surfaceContact(pair) {
        const collision = pair && (pair.collision || pair);
        if (!collision || !collision.normal) return null;
        const bodyA = collision.parentA || (collision.bodyA && (collision.bodyA.parent || collision.bodyA));
        const bodyB = collision.parentB || (collision.bodyB && (collision.bodyB.parent || collision.bodyB));
        const playerIsA = bodyA === this.player.body;
        const playerIsB = bodyB === this.player.body;
        if (!playerIsA && !playerIsB) return null;
        const rawSurfaceBody = playerIsA ? bodyB : bodyA;
        const meta = rawSurfaceBody.plugin && rawSurfaceBody.plugin.gameMeta;
        if (!rawSurfaceBody.isStatic || !meta || (meta.kind !== 'terrain' && meta.kind !== 'breakable')) return null;
        let nx = collision.normal.x * (playerIsA ? 1 : -1);
        let ny = collision.normal.y * (playerIsA ? 1 : -1);
        const length = Math.hypot(nx, ny);
        if (length < .001) return null;
        const actualNormal = { x:nx / length, y:ny / length };
        if (meta.slope && actualNormal.y < -.35) {
          const sampled = this.sampleRampSurface(meta, this.player.x, this.player.y);
          if (sampled) return { body:rawSurfaceBody, normal:sampled.normal, angle:sampled.angle, slope:sampled.slope };
        }
        // Keep the Matter face normal for ramp end-caps so Spider Ball can still grip walls.
        return { body:rawSurfaceBody, normal:actualNormal, angle:Math.atan2(actualNormal.x, -actualNormal.y), slope:null };
      }

      surfaceTangent(normal) {
        // A consistent clockwise route: floor → right wall → ceiling → left wall.
        return { x: -normal.y, y: normal.x };
      }

      attachSpiderBall(pair) {
        if (!this.spiderEnabled || this.time.now < this.deathLockUntil) return;
        const contact = this.surfaceContact(pair);
        if (!contact) return;
        const previous = this.spiderAttached;
        const tangent = this.surfaceTangent(contact.normal);
        let direction = 1;
        if (previous) {
          const oldTangent = this.surfaceTangent(previous.normal);
          const oldTravelX = oldTangent.x * previous.direction;
          const oldTravelY = oldTangent.y * previous.direction;
          const alignment = tangent.x * oldTravelX + tangent.y * oldTravelY;
          if (alignment < -.001) direction = -1;
          else direction = previous.direction;
        } else {
          const along = this.lastPlayerVelocity.x * tangent.x + this.lastPlayerVelocity.y * tangent.y;
          if (Math.abs(along) > .25) direction = Math.sign(along);
          else if (Math.abs(tangent.x) > .25) direction = Math.sign(tangent.x * this.playerFacing) || 1;
        }
        this.spiderAttached = { body: contact.body, normal: contact.normal, direction, lastContactAt: this.time.now };
        const speed = BALL.spiderBallSpeed * direction;
        Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: tangent.x * speed, y: tangent.y * speed });
        if (!previous) this.showNotice('Spider Ball attached · A/D to crawl.');
      }

      refreshSpiderSurface(pair) {
        if (!this.spiderEnabled) return;
        const contact = this.surfaceContact(pair);
        if (!contact) return;
        if (!this.spiderAttached) {
          this.attachSpiderBall(pair);
          return;
        }
        // Keep the current path through a seam; a new surface takes over on collisionstart.
        if (this.spiderAttached.body !== contact.body) return;
        const oldTangent = this.surfaceTangent(this.spiderAttached.normal);
        const travelX = oldTangent.x * this.spiderAttached.direction;
        const travelY = oldTangent.y * this.spiderAttached.direction;
        const tangent = this.surfaceTangent(contact.normal);
        const alignment = tangent.x * travelX + tangent.y * travelY;
        if (alignment < -.001) this.spiderAttached.direction *= -1;
        this.spiderAttached.normal = contact.normal;
        this.spiderAttached.lastContactAt = this.time.now;
      }

      toggleSpiderBall() {
        if (this.paused || this.time.now < this.deathLockUntil) return;
        this.playSfx('ui');
        if (!this.upgrades.grip) {
          this.showNotice('Spider Ball not found.');
          return;
        }
        this.spiderEnabled = !this.spiderEnabled;
        if (!this.spiderEnabled) {
          this.spiderAttached = null;
          this.showNotice('Spider Ball OFF.');
        } else {
          const Matter = Phaser.Physics.Matter.Matter;
          const contacts = Matter.Query.collides(this.player.body, this.terrainBodies);
          for (const pair of contacts) {
            if (this.surfaceContact(pair)) { this.attachSpiderBall(pair); break; }
          }
          this.showNotice(this.spiderAttached ? 'Spider Ball ON · A/D to crawl.' : 'Spider Ball ON · touch a surface.');
        }
        this.updateHud(true);
      }

      releaseSpiderBall() {
        this.spiderEnabled = false;
        this.spiderAttached = null;
        this.updateHud(true);
      }

      updateSpiderBall(time) {
        if (!this.spiderEnabled || !this.spiderAttached) return;
        const attached = this.spiderAttached;
        if (!this.terrainBodies.includes(attached.body) || time - attached.lastContactAt > BALL.spiderContactGraceMs) {
          this.spiderAttached = null;
          return;
        }
        const normal = attached.normal;
        const tangent = this.surfaceTangent(normal);
        const left = this.keys.left.isDown || this.keys.a.isDown;
        const right = this.keys.right.isDown || this.keys.d.isDown;
        const crawlInput = Number(right) - Number(left);
        if (crawlInput) attached.direction = crawlInput;

        // Hold a direction to crawl. With no input, stay attached and let the
        // surface adhesion cancel gravity instead of drifting along the wall.
        const gravityDotNormal = GRAVITY.x * normal.x + GRAVITY.y * normal.y;
        const forceScale = this.player.body.mass * GRAVITY.scale * (gravityDotNormal + BALL.spiderAdhesion);
        this.player.body.force.x -= forceScale * normal.x;
        this.player.body.force.y -= forceScale * normal.y;
        const speed = crawlInput ? BALL.spiderBallSpeed * attached.direction : 0;
        Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: tangent.x * speed, y: tangent.y * speed });
      }

      requestFlip(side) {
        if (this.paused || this.time.now < this.deathLockUntil) return;
        const now = this.time.now;
        if (this.spiderAttached) return;
        const pad = this.flippers
          .filter(item => item.side === side && Phaser.Math.Distance.Between(item.x, item.y, this.player.x, this.player.y) < BALL.flipReach)
          .sort((a, b) => Phaser.Math.Distance.Between(a.x, a.y, this.player.x, this.player.y) - Phaser.Math.Distance.Between(b.x, b.y, this.player.x, this.player.y))[0];
        if (pad && now >= this.nextFlipAt) {
          this.nextFlipAt = now + BALL.flipCooldownMs;
          this.initialLaunchAvailable = false;
          this.lastFlipper = side;
          this.airUses = { ghost: false, virtual: false };
          this.groundedUntil = now + 200;
          const toward = side === 'left' ? 1 : -1;
          const velocity = this.player.body.velocity;
          const vx = Phaser.Math.Clamp(velocity.x + toward * BALL.flipXKick, -10, 10);
          const vy = Math.max(-12, Math.min(velocity.y, 0) - BALL.flipYKick);
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: vx, y: vy });
          this.playerFacing = toward;
          this.playSfx('movement');
          this.showNotice(`${side === 'left' ? 'Left' : 'Right'} flipper.`);
          return;
        }
        if (now > this.groundedUntil) {
          const jump = this.findAirBounce(side);
          if (jump) {
            this.playerFacing = side === 'left' ? -1 : 1;
            const velocity = this.player.body.velocity;
            const direction = side === 'left' ? -1 : 1;
            const vx = Phaser.Math.Clamp(velocity.x + direction * BALL.airFlipXKick, -10, 10);
            const vy = Math.max(-12, Math.min(velocity.y, 0) - BALL.airFlipYKick);
            Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: vx, y: vy });
            this.playSfx('movement');
            this.showNotice(jump);
            return;
          }
        }
      }

      findAirBounce(side) {
        if (this.upgrades.ghost && !this.airUses.ghost && side === this.lastFlipper) {
          this.airUses.ghost = true;
          return 'GHOST FLIP · same flipper, one mid-air bounce.';
        }
        if (this.upgrades.virtual && !this.airUses.virtual) {
          this.airUses.virtual = true;
          return 'VIRTUAL FLIP · either side, one mid-air bounce.';
        }
        if (this.echoCharges > 0) {
          this.echoCharges -= 1;
          return `ECHO FLIP · ${this.echoCharges} charge${this.echoCharges === 1 ? '' : 's'} left.`;
        }
        return '';
      }

      launchOrNudge() {
        if (this.paused || this.time.now < this.deathLockUntil) return;
        if (this.spiderAttached) {
          this.playSfx('ui');
          this.releaseSpiderBall();
          this.showNotice('Spider Ball OFF · released.');
          return;
        }
        if (this.time.now - this.lastNudgeAt < BALL.nudgeCooldownMs) return;
        this.lastNudgeAt = this.time.now;
        const velocity = this.player.body.velocity;
        const vx = Phaser.Math.Clamp(velocity.x + this.playerFacing * BALL.nudgeXKick, -10, 10);
        if (this.time.now <= this.groundedUntil || this.initialLaunchAvailable) {
          this.initialLaunchAvailable = false;
          const vy = Math.max(-10, Math.min(velocity.y, 0) - 6.5);
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: vx, y: vy });
          this.groundedUntil = 0;
          this.playSfx('launch');
          this.showNotice('Launch.');
        } else {
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: vx, y: velocity.y - BALL.nudgeYKick });
          this.playSfx('movement');
          this.showNotice('Nudge.');
        }
      }

      die() {
        if (this.time.now < this.deathLockUntil) return;
        this.playSfx('damage');
        this.deathLockUntil = this.time.now + 1000;
        this.score = this.respawnScore;
        this.ammo = this.respawnAmmo;
        this.airUses = { ghost: false, virtual: false };
        this.spiderEnabled = false;
        this.spiderAttached = null;
        this.playerIFrameUntil = this.time.now + 1000;
        Phaser.Physics.Matter.Matter.Body.setPosition(this.player.body, this.spawn);
        Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: 0, y: 0 });
        this.rollAngle = 0;
        this.lastPlayerPosition = { x: this.spawn.x, y: this.spawn.y };
        this.groundedUntil = this.time.now + 180;
        this.groundSurface = null;
        this.groundContactUntil = 0;
        this.initialLaunchAvailable = false;
        for (const bomb of [...this.bombs]) {
          if (bomb.active) { this.matter.world.remove(bomb.body); bomb.destroy(); }
        }
        this.bombs.length = 0;
        for (const item of [...this.pickups]) this.removePickup(item);
        this.dropPickups.length = 0;
        for (const def of pickupDefs) this.spawnPickup({ ...def }, false);
        if (this.upgrades.echo) this.revealEchoGems();
        for (const enemy of [...this.enemies]) {
          const meta = enemy.body.plugin.gameMeta;
          if (meta.boss) continue;
          this.matter.world.remove(enemy.body);
          enemy.destroy();
        }
        this.enemies = this.enemies.filter(enemy => enemy.body.plugin.gameMeta.boss);
        for (const def of enemyDefs) {
          if (def.boss || this.enemies.some(enemy => enemy.body.plugin.gameMeta.id === def.id)) continue;
          const enemy = this.createMatterCircle(def.x, def.y, 9, {
            label:'enemy', friction:0.03, frictionAir:0.025, restitution:0.06, density:0.009,
            collisionFilter: { category: CAT.ENEMY, mask: CAT.TERRAIN | CAT.PLAYER | CAT.BOMB }
          }, { kind: 'enemy', id: def.id, hp: def.hp, maxHp: def.hp, minX: def.minX, maxX: def.maxX, dir: 1, shielded: !!def.shielded, boss: false, dead: false });
          this.enemies.push(enemy);
        }
        this.showNotice('HULL EMPTY · respawned. Score/ammo drops and ordinary aliens returned; upgrades persist.');
        this.updateHud(true);
      }

      updateEnemies(time) {
        const Matter = Phaser.Physics.Matter.Matter;
        for (const enemy of this.enemies) {
          const meta = enemy.body.plugin.gameMeta;
          const frame = Math.floor(time / 240) % 2;
          if (meta.frame !== frame) {
            meta.frame = frame;
            enemy.setFrame(meta.boss ? 'warden-' + frame : meta.shielded ? 'shield-' + frame : 'mite-' + frame);
          }
          if (meta.boss) continue;
          if (enemy.x < meta.minX || enemy.x > meta.maxX) meta.dir *= -1;
          const desired = meta.dir * 1.15;
          Matter.Body.setVelocity(enemy.body, { x: desired, y: enemy.body.velocity.y });
        }
      }

      updateRoom() {
        const col = Phaser.Math.Clamp(Math.floor(this.player.x / (ROOM_W * CELL)), 0, ROOM_COLS - 1);
        const row = Phaser.Math.Clamp(Math.floor(this.player.y / (ROOM_H * CELL)), 0, ROOM_ROWS - 1);
        const nextRoom = row * ROOM_COLS + col;
        if (nextRoom !== this.currentRoom) this.playSfx('movement');
        this.currentRoom = nextRoom;
        this.visitedRooms.add(this.currentRoom);
      }

      applyGroundSurfaceResponse(time) {
        if (!this.groundSurface || time > this.groundContactUntil) {
          this.groundSurface = null;
          return;
        }
        const normal = this.groundSurface.normal;
        const velocity = this.player.body.velocity;
        const intoSurface = velocity.x * normal.x + velocity.y * normal.y;
        // Keep tangent speed on the tile's measured slope; only cancel a small inward solver bounce.
        if (intoSurface < 0 && intoSurface > -2.5) {
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, {
            x:velocity.x - normal.x * intoSurface,
            y:velocity.y - normal.y * intoSurface
          });
        }
      }

      update(time, delta) {
        if (!this.player) return;
        if (this.paused) return;
        const deltaScale = Phaser.Math.Clamp(delta / PHYSICS_STEP_MS, 0, 2);
        if (!this.spiderAttached && (Phaser.Input.Keyboard.JustDown(this.keys.left) || Phaser.Input.Keyboard.JustDown(this.keys.a))) this.requestFlip('left');
        if (!this.spiderAttached && (Phaser.Input.Keyboard.JustDown(this.keys.right) || Phaser.Input.Keyboard.JustDown(this.keys.d))) this.requestFlip('right');
        if (this.keys.left.isDown || this.keys.a.isDown) {
          this.playerFacing = -1;
          if (!this.spiderAttached) this.drive(-1, deltaScale, time);
        }
        if (this.keys.right.isDown || this.keys.d.isDown) {
          this.playerFacing = 1;
          if (!this.spiderAttached) this.drive(1, deltaScale, time);
        }
        this.updateSpiderBall(time);
        this.applyGroundSurfaceResponse(time);
        const speed = this.player.body.velocity;
        if (Math.hypot(speed.x, speed.y) > BALL.maxSpeed) {
          const factor = BALL.maxSpeed / Math.hypot(speed.x, speed.y);
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, { x: speed.x * factor, y: speed.y * factor });
        }
        const currentVelocity = this.player.body.velocity;
        const dx = this.player.x - this.lastPlayerPosition.x;
        const dy = this.player.y - this.lastPlayerPosition.y;
        if (this.spiderAttached) {
          const tangent = this.surfaceTangent(this.spiderAttached.normal);
          const direction = this.spiderAttached.direction;
          this.rollAngle += (dx * tangent.x + dy * tangent.y) * direction / BALL.radius;
        } else if (this.groundSurface && time <= this.groundContactUntil) {
          const tangent = this.surfaceTangent(this.groundSurface.normal);
          this.rollAngle += (dx * tangent.x + dy * tangent.y) / BALL.radius;
        } else if (Math.abs(dx) > .01) this.rollAngle += dx / BALL.radius;
        if (this.player.active) {
          const frame = ((Math.floor(this.rollAngle / (Math.PI / 2)) % 4) + 4) % 4;
          this.player.setFrame('ball-' + frame);
        }
        this.lastPlayerPosition = { x: this.player.x, y: this.player.y };
        this.lastPlayerVelocity = { x: currentVelocity.x, y: currentVelocity.y };
        this.updateEnemies(time);
        this.updateRoom();
        if (time > this.lastHudUpdate + 120) this.updateHud();
      }

      // Apply AM2R-style directional acceleration along the real floor or ramp tangent.
      drive(direction, deltaScale, time) {
        if (this.groundSurface && time <= this.groundContactUntil) {
          const velocity = this.player.body.velocity;
          const normal = this.groundSurface.normal;
          const tangent = this.surfaceTangent(normal);
          const tangentSpeed = velocity.x * tangent.x + velocity.y * tangent.y;
          const normalSpeed = velocity.x * normal.x + velocity.y * normal.y;
          const reversing = tangentSpeed * direction < -0.05;
          const acceleration = reversing ? BALL.rollBrake : BALL.rollAcceleration;
          const nextTangentSpeed = Phaser.Math.Clamp(
            tangentSpeed + direction * acceleration * deltaScale,
            -BALL.maxRollSpeed,
            BALL.maxRollSpeed
          );
          Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, {
            x: tangent.x * nextTangentSpeed + normal.x * normalSpeed,
            y: tangent.y * nextTangentSpeed + normal.y * normalSpeed
          });
          return;
        }
        if (time > this.groundedUntil) this.steer(direction, deltaScale);
      }
      steer(direction, deltaScale) {
        const velocity = this.player.body.velocity;
        Phaser.Physics.Matter.Matter.Body.setVelocity(this.player.body, {
          x: Phaser.Math.Clamp(velocity.x + direction * BALL.airSteerPer60HzStep * deltaScale, -BALL.maxAirSpeedX, BALL.maxAirSpeedX),
          y: velocity.y
        });
      }

      updateHud(force) {
        if (!force && this.time.now < this.lastHudUpdate + 110) return;
        this.lastHudUpdate = this.time.now;
        const score = document.getElementById('score-value');
        const bar = document.getElementById('score-bar');
        const progress = bar.parentElement;
        score.textContent = this.score.toLocaleString('en-US');
        bar.style.width = ((this.score / this.scoreCap) * 100) + '%';
        progress.setAttribute('aria-valuenow', String(this.score));
        document.getElementById('ammo-value').textContent = this.ammo;
        document.getElementById('bomb-label').textContent = this.upgrades.bomb ? this.activeBomb().label : 'LOCKED';
        document.getElementById('room-label').textContent = 'ZONE 0' + (this.currentRoom + 1);
        document.getElementById('boss-label').textContent = this.bossKilled ? 'CORE: CLEARED' : 'CORE: ' + this.bossHealth + ' HP';
        document.getElementById('echo-count').textContent = 'ECHO ' + this.echoCharges;
        document.getElementById('ability-value').textContent = !this.upgrades.grip ? 'SPIDER LOCKED' : this.spiderEnabled ? 'SPIDER ON' : 'SPIDER READY';
        for (let i = 0; i < 6; i++) {
          const node = document.getElementById('room-' + i);
          node.classList.toggle('current', this.currentRoom === i);
          node.classList.toggle('visited', this.visitedRooms.has(i));
        }
      }

      showNotice() {}

      toggleMap(force) {
        this.playSfx('ui');
        const card = document.getElementById('map-card');
        const shouldOpen = typeof force === 'boolean' ? force : !card.classList.contains('map-focus');
        card.classList.toggle('map-focus', shouldOpen);
        card.setAttribute('aria-hidden', String(!shouldOpen));
      }

      togglePause() {
        this.paused = !this.paused;
        if (this.paused) { this.matter.world.pause(); this.sound.pauseAll(); } else { this.matter.world.resume(); this.sound.resumeAll(); }
        const overlay = document.getElementById('game-overlay');
        overlay.classList.toggle('visible', this.paused);
        overlay.setAttribute('aria-hidden', String(!this.paused));
        document.getElementById('overlay-title').textContent = this.paused ? 'PAUSED' : '';
        this.playSfx('ui');
        this.showNotice(this.paused ? 'Game paused.' : 'Back in play.');
      }

    }

    const config = {
      type: Phaser.AUTO,
      width: 960,
      height: 540,
      parent: 'game',
      backgroundColor:'#000000',
      pixelArt: true,
      roundPixels: true,
      physics: {
        default: 'matter',
        matter: {
          gravity: GRAVITY,
          enableSleeping: false,
          positionIterations: 8,
          velocityIterations: 6,
          constraintIterations: 3,
          debug: false
        }
      },
      scale: { mode: Phaser.Scale.RESIZE },
      render: { antialias: false, pixelArt: true, roundPixels: true },
      scene: [PinballThingyScene]
    };

    if (!window.Phaser) {
      console.error('Phaser did not load. Check the network connection.');
      return;
    }
    const game = new Phaser.Game(config);
    window.pinballThingyGame = game;

  })();
  </script>
</body>
</html>
