# The post editor is retained in the public repository for local authoring,
# but must never be included in the public GitHub Pages build.
exclude:
  # Preserve Jekyll 3's standard exclusions; user-defined entries replace
  # that default list in Jekyll 3 (used by GitHub Pages).
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Keep protected radio mirror files in Git, but do not publish them as a
  # second copy of the public audio library. They are not playlist entries.
  - radio/assets/tracks/*_DONTTOUCH.*
  - radio/assets/tracks/**/*_DONTTOUCH.*
  - blog/write
  - blog/write/**
  # The reward editor is served only by its loopback-only Python server.
  - tools/reward-editor-local
  - tools/reward-editor-local/**
