<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>burger</title>
</head>
<body>
  <center>
    <p>
      <a href="../" title="go home">
        <img src="join.png" alt="Click To Join Cult">
      </a>
    </p>

    <p>
      <img src="burger.jpg" alt="burger" style="width: 50%; max-width: 600px; height: auto;">
    </p>

    <p style="font-size: 1.25rem;">(click anywhere to start the music)</p>
  </center>

  <audio id="background-music" autoplay loop preload="auto">
    <source src="pussy.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>

  <script>
    const music = document.getElementById("background-music");

    function startMusic() {
      const attempt = music.play();
      if (attempt && typeof attempt.then === "function") {
        attempt.then(() => {
          document.removeEventListener("pointerdown", startMusic);
          document.removeEventListener("keydown", startMusic);
        }).catch(() => {});
      }
    }

    document.addEventListener("pointerdown", startMusic, { passive: true });
    document.addEventListener("keydown", startMusic, { passive: true });
    music.play().catch(() => {});
  </script>
</body>
</html>
