<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collectables</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .card {
      perspective: 1000px;
    }

    .collectable {
      transform-style: preserve-3d;
      will-change: transform, filter;
    }

    .collectable-wrap::before {
      content: "";
      position: absolute;
      inset: 8%;
      z-index: -1;
      border-radius: 9999px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.35),
        rgba(120, 120, 255, 0.22),
        rgba(255, 0, 180, 0.12),
        transparent 70%
      );
      filter: blur(28px);
      opacity: 0;
      transform: scale(0.75);
      transition:
        opacity 350ms ease,
        transform 350ms ease;
    }

    .collectable-wrap:hover::before {
      opacity: 1;
      transform: scale(1.08);
    }
  </style>
</head>

<body class="m-0 min-h-screen overflow-hidden bg-black">
  <main
    class="
      min-h-screen
      w-full
      p-4
      grid
      place-items-center
      gap-4
      [grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))]
      auto-rows-fr
    "
  >
    <div class="card grid place-items-center">
      <div class="collectable-wrap relative grid place-items-center">
        <img
          src="3.gif"
          alt=""
          class="collectable max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-110 hover:drop-shadow-[0_0_35px_rgba(255,255,255,0.35)]"
        />
      </div>
    </div>

    <div class="card grid place-items-center">
      <div class="collectable-wrap relative grid place-items-center">
        <img
          src="1.gif"
          alt=""
          class="collectable max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-110 hover:drop-shadow-[0_0_35px_rgba(255,255,255,0.35)]"
        />
      </div>
    </div>

    <div class="card grid place-items-center">
      <div class="collectable-wrap relative grid place-items-center">
        <img
          src="2.gif"
          alt=""
          class="collectable max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-110 hover:drop-shadow-[0_0_35px_rgba(255,255,255,0.35)]"
        />
      </div>
    </div>

    <div class="card grid place-items-center">
      <div class="collectable-wrap relative grid place-items-center">
        <img
          src="4.gif"
          alt=""
          class="collectable max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-110 hover:drop-shadow-[0_0_35px_rgba(255,255,255,0.35)]"
        />
      </div>
    </div>
  </main>

  <script>
    const cards = document.querySelectorAll(".card");

    cards.forEach((card) => {
      const image = card.querySelector(".collectable");

      card.addEventListener("mousemove", (event) => {
        const rect = card.getBoundingClientRect();

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        image.style.transform = `
          scale(1.12)
          rotateX(${rotateX}deg)
          rotateY(${rotateY}deg)
          translateY(-10px)
        `;
      });

      card.addEventListener("mouseleave", () => {
        image.style.transform = `
          scale(1)
          rotateX(0deg)
          rotateY(0deg)
          translateY(0)
        `;
      });
    });
  </script>
</body>
</html>
