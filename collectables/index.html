<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collectables</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .collectable-wrap::before {
      content: "";
      position: absolute;
      inset: 8%;
      z-index: -1;
      border-radius: 9999px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.35),
        rgba(255, 255, 255, 0.22),
        rgba(255, 255, 255, 0.12),
        transparent 70%
      );
      filter: blur(28px);
      opacity: 0;
      transform: scale(0.75);
      transition:
        opacity 350ms ease,
        transform 350ms ease;
    }

    .collectable-wrap:hover::before {
      opacity: 1;
      transform: scale(1.08);
    }
  </style>
</head>

<body class="m-0 min-h-screen overflow-x-hidden bg-black">
  <main
    class="
      min-h-screen
      w-full
      p-4
      grid
      place-items-center
      gap-4
      [grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))]
      auto-rows-fr
    "
  >
    <div class="collectable-wrap relative grid place-items-center">
      <img
        src="3.gif"
        alt=""
        class="max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-125 hover:drop-shadow-[0_0_35px_rgba(200,255,0,0.35)]"
      />
    </div>

    <div class="collectable-wrap relative grid place-items-center">
      <img
        src="1.gif"
        alt=""
        class="max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-125 hover:drop-shadow-[0_0_35px_rgba(200,255,0,0.35)]"
      />
    </div>

    <div class="collectable-wrap relative grid place-items-center">
      <img
        src="2.gif"
        alt=""
        class="max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-125 hover:drop-shadow-[0_0_35px_rgba(200,255,0,0.35)]"
      />
    </div>

    <div class="collectable-wrap relative grid place-items-center">
      <img
        src="4.gif"
        alt=""
        class="max-h-[45vh] sm:max-h-[50vh] md:max-h-[60vh] w-full object-contain transition duration-300 ease-out hover:scale-125 hover:drop-shadow-[0_0_35px_rgba(200,255,0,0.35)]"
      />
    </div>
  </main>
</body>
</html>
