<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ramble Gamble — Private player</title><link rel="stylesheet" href="../../ramblegamble/card-room-player.css?v=1"><script type="module" src="../../ramblegamble/card-room-player.mjs?v=1"></script></head><body><main><header><img id="berry" alt="" hidden><h1 id="player">PRIVATE PLAYER</h1></header><p id="connection" role="status">Open your personal invitation from the host.</p><button id="connect" type="button" hidden>CONNECT / RETRY</button><section id="round" hidden><h2 id="mode"></h2><p id="prompt"></p><form id="form"><label id="text-label" for="answer">Your answer (Enter to submit)</label><input id="answer" maxlength="800" autocomplete="off"><fieldset id="hand" hidden><legend>Choose one evidence card</legend><div id="choices"></div></fieldset><button id="submit" type="submit">SUBMIT</button></form><p id="submission" role="status"></p><section id="fallback" hidden><p>If live connection fails, send this private packet to the host. It is not accepted until the host imports it.</p><textarea id="packet" readonly aria-label="Private submission packet" rows="4"></textarea><button id="copy" type="button">COPY PACKET</button></section></section></main></body></html>
