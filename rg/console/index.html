<!doctype html>
<html lang="en" data-theme="p2">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#090b0a">
    <link rel="canonical" href="https://kazvt.com/rg/console/">
    <title>RG Console</title>
    <link rel="stylesheet" href="/rg/console/console.css?v=reader-election-20261126-v1">
    <script type="module" src="/rg/console/console.js?v=reader-election-20261126-v1"></script>
  </head>
  <body>
    <main class="terminal" aria-label="Ramble Gamble points console">
      <header class="terminal-header"><span>RG CONSOLE</span><span>POINTS / SMEEMO / ROOM</span></header>
      <details id="console-card-room" class="terminal-room">
        <summary>PRIVATE CARD ROOM / READER</summary>
        <p data-room-status role="status">Preparing shared room…</p>
        <button type="button" data-room-start>START ONLINE ROOM</button>
        <button type="button" data-room-stop>STOP ONLINE ROOM</button>
        <p>Private invitations — do not show on stream. Either host page can receive submissions.</p>
        <div data-room-links></div>
        <label>Offline answer packet<textarea data-room-packet rows="2"></textarea></label>
        <button type="button" data-room-import>IMPORT ANSWER</button>
      </details>
      <section class="terminal-output" id="terminal-output" role="log" aria-live="polite" aria-relevant="additions text"></section>
      <form class="terminal-form" id="terminal-form" autocomplete="off">
        <label for="terminal-input" aria-hidden="true">&gt;</label>
        <input id="terminal-input" name="command" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autofocus aria-label="Enter console command">
      </form>
    </main>
  </body>
</html>
