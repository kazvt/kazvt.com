<!doctype html>
<html data-rg-host-locked lang="en" data-theme="p2">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#090b0a">
    <link rel="canonical" href="https://kazvt.com/rg/console/">
    <title>RG Console</title>
    <link rel="stylesheet" href="/rg/console/console.css?v=show-energy-20261127-v1">
    <link rel="stylesheet" href="/ramblegamble/trivia-live.css?v=match-number-20261127-v1">
    <link rel="stylesheet" href="/ramblegamble/host-access.css?v=host-toggle-20261126-v1">
    <script type="module" src="/ramblegamble/host-access.mjs?v=points-stinger-20261128-v1"></script>
  </head>
  <body>
    <main class="terminal" aria-label="Ramble Gamble host console">
      <header class="terminal-header"><span>RG CONSOLE</span><span>POINTS / STARS / ROOM</span></header>
      <div class="terminal-host-lock"><button type="button" data-host-lock>LOCK HOST</button> <button type="button" data-host-policy-download>DOWNLOAD SITE LOCK</button></div>
      <div class="terminal-room terminal-audience" id="terminal-audience" role="group" aria-label="Audience emotion"><span>AUDIENCE</span></div>
      <details id="console-card-room" class="terminal-room">
        <summary>PRIVATE PLAYER ROOM / READER</summary>
        <p data-room-status role="status">Preparing shared room…</p>
        <button type="button" data-room-start>START ONLINE ROOM</button>
        <button type="button" data-room-stop>STOP ONLINE ROOM</button>
        <p>Private invitations — do not show on stream. Either host page can receive submissions.</p>
        <div data-room-links></div>
        <button type="button" data-room-rotate>REPLACE ALL ROOM INVITATIONS</button>
        <label>Offline answer packet<textarea data-room-packet rows="2"></textarea></label>
        <button type="button" data-room-import>IMPORT ANSWER</button>
      </details>
      <details id="console-answers" class="terminal-room"><summary>PRIVATE ANSWERS</summary><div id="console-answer-content"></div></details>
      <section class="terminal-output" id="terminal-output" role="log" aria-live="polite" aria-relevant="additions text"></section>
      <form class="terminal-form" id="terminal-form" autocomplete="off">
        <label for="terminal-input" aria-hidden="true">&gt;</label>
        <div class="terminal-command-entry">
          <div id="terminal-suggestions" class="terminal-suggestions" role="listbox" aria-label="Command suggestions" hidden></div>
          <div class="terminal-input-wrap">
          <div id="terminal-ghost" class="terminal-ghost" aria-hidden="true"></div>
        <input role="combobox" aria-autocomplete="both" aria-controls="terminal-suggestions" aria-expanded="false" id="terminal-input" name="command" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autofocus aria-label="Enter console command">
          </div>
        </div>
      </form>
    </main>
    <section id="rg-host-gate" aria-label="Host access">
      <div data-unlock-landing class="rg-lock-panel" hidden>
        <button type="button" data-host-unlock disabled>UNLOCK HOST</button>
      </div>
      <div class="rg-lock-panel" data-unlock-panel><h1 id="rg-host-lock-title">RAMBLE GAMBLE / HOST</h1>
      <form method="post"><label>Password<input type="password" name="passphrase" disabled required maxlength="1024" autocomplete="current-password"></label>
      <label data-confirm hidden>Confirm password<input type="password" name="confirmation" maxlength="1024" disabled></label>
      <label class="rg-lock-remember"><input type="checkbox" name="remember" checked> Remember this browser</label>
      <button type="submit" disabled>UNLOCK</button></form>
      <p role="status" aria-live="polite"></p>
      <noscript>JavaScript is required to unlock host controls.</noscript></div>
    </section>
  </body>
</html>
