<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>forum signature dasher</title>
  <script>
    window.tailwind = { config: { corePlugins: { preflight: false } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <script src="https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/dist/gifuct.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <style>
    @font-face {
      font-family: "Monaspace Krypton Frozen";
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src:
        local("Monaspace Krypton Frozen"),
        local("MonaspaceKryptonFrozen-Regular"),
        url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-400-normal.woff2") format("woff2"),
        url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-400-normal.woff") format("woff");
    }

    @font-face {
      font-family: "Monaspace Krypton Frozen";
      font-style: normal;
      font-display: swap;
      font-weight: 700;
      src:
        local("Monaspace Krypton Frozen Bold"),
        local("MonaspaceKryptonFrozen-Bold"),
        url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-700-normal.woff2") format("woff2"),
        url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-700-normal.woff") format("woff");
    }

    @font-face {
      font-family: "Monaspace Krypton Frozen";
      font-style: normal;
      font-display: swap;
      font-weight: 800 900;
      src:
        local("Monaspace Krypton Frozen ExtraBold"),
        local("MonaspaceKryptonFrozen-ExtraBold"),
        url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-800-normal.woff2") format("woff2"),
        url("https://cdn.jsdelivr.net/fontsource/fonts/monaspace-krypton@latest/latin-800-normal.woff") format("woff");
    }

    :root {
      --paper: #fff6d8;
      --paper2: #efe0b8;
      --paper3: #dfc995;
      --ink: #140306;
      --ink2: #2a070c;
      --accent: #9d3d2c;
      --line: #140306;
      --shadow: rgba(20, 3, 6, 0.35);
      --checker1: #ead9ad;
      --checker2: #fff6d8;
      --blue: #2563eb;
      --ui-font: "Monaspace Krypton Frozen", "Monaspace Krypton", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-family: var(--ui-font);
      font-weight: 700;
      color: var(--ink);
      background: var(--paper);
    }

    * {
      box-sizing: border-box;
      font-family: var(--ui-font) !important;
      font-weight: 700 !important;
      font-variant-ligatures: contextual common-ligatures;
      font-feature-settings: "calt" 1, "liga" 1, "ss01" 1, "ss02" 1, "ss03" 1, "ss04" 1, "ss05" 1, "ss06" 1, "ss07" 1, "ss08" 1, "ss09" 1, "ss10" 1;
    }

    *::before,
    *::after {
      font-family: var(--ui-font) !important;
      font-weight: 700 !important;
    }

    button,
    input,
    select,
    textarea,
    label,
    option,
    .small,
    .status-chip,
    .scale-readout {
      font-family: var(--ui-font) !important;
      font-weight: 700 !important;
      font-synthesis-weight: none;
    }

    ::placeholder {
      font-family: var(--ui-font) !important;
      font-weight: 700 !important;
      opacity: 0.75;
    }

    h1, h2, h3,
    .brand,
    .head,
    .btn,
    .file-btn,
    button {
      font-family: var(--ui-font) !important;
      font-weight: 900 !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui-font);
      font-weight: 700;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 44px 1fr;
      background: var(--paper);
    }

    .top {
      border-bottom: 3px solid var(--line);
      background: var(--ink);
      color: var(--paper);
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 0 12px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand {
      white-space: nowrap;
      font-size: 16px;
      letter-spacing: 0.12em;
    }

    .top-pill,
    .top-center {
      min-width: 0;
      height: 28px;
      border: 2px solid var(--paper);
      border-radius: 999px;
      display: grid;
      place-items: center;
      padding: 0 14px;
      font-size: 11px;
      background: rgba(255, 246, 216, 0.08);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-center {
      background: transparent;
    }

    .status-chip {
      justify-self: end;
      font-size: 11px;
      opacity: 0.75;
      white-space: nowrap;
      letter-spacing: 0.05em;
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(350px, 410px) minmax(430px, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .panel,
    .preview {
      min-width: 0;
      min-height: 0;
      border: 3px solid var(--line);
      background: var(--paper2);
      display: grid;
      grid-template-rows: 36px 1fr;
      box-shadow: 0 5px 0 var(--ink);
      overflow: hidden;
    }

    .preview {
      position: static;
      padding: 0;
      max-height: none;
    }

    .head {
      background: var(--paper);
      border-bottom: 3px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .panel-scroll,
    .preview-body {
      min-height: 0;
      overflow: auto;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .panel-scroll {
      direction: rtl;
      scrollbar-gutter: stable both-edges;
    }

    .panel-scroll > * {
      direction: ltr;
    }

    .preview-body {
      background:
        linear-gradient(45deg, var(--checker1) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker1) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker1) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker1) 75%),
        var(--checker2);
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    }

    .canvas-stage {
      min-width: 0;
      min-height: 0;
      border: 2px solid var(--line);
      background: var(--paper);
      box-shadow: 0 4px 0 var(--ink);
      padding: 12px;
      display: grid;
      place-items: center;
    }

    .editor-block {
      min-width: 0;
      border: 2px solid var(--line);
      background: var(--paper);
      box-shadow: 0 4px 0 var(--ink);
      padding: 8px;
    }

    .editor-block + .editor-block {
      margin-top: 0;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    p {
      color: var(--ink);
      line-height: 1.45;
    }

    label {
      display: block;
      margin-top: 8px;
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      width: 100%;
      margin-top: 4px;
      font: inherit;
    }

    input[type="file"] {
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      padding: 7px;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 3px 0 var(--ink);
    }

    input[type="file"]::file-selector-button {
      min-height: 28px;
      margin-right: 8px;
      border: 2px solid var(--line);
      background: var(--accent);
      color: var(--paper);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--ink);
    }

    select,
    input[type="number"],
    input[type="text"] {
      height: 32px;
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-weight: 900;
      padding: 0 6px;
      border-radius: 0;
      box-shadow: 0 3px 0 var(--ink);
    }

    input[type="color"] {
      width: 100%;
      height: 34px;
      border: 2px solid var(--line);
      background: var(--paper2);
      padding: 2px;
      border-radius: 0;
      box-shadow: 0 3px 0 var(--ink);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
    }

    input[type="checkbox"] {
      accent-color: var(--ink);
    }

    button {
      min-height: 34px;
      border: 2px solid var(--line);
      border-radius: 0;
      background: var(--paper2);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      font-weight: 900;
      font-size: 12px;
      line-height: 1.1;
      user-select: none;
      padding: 0 8px;
      text-transform: uppercase;
      transition: background 0.1s;
    }

    button:hover {
      background: var(--paper);
    }

    button:active,
    button.is-active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    button.is-active {
      background: var(--ink);
      color: var(--paper);
    }

    button.secondary {
      background: var(--paper);
      color: var(--ink);
    }

    button.secondary:hover {
      background: var(--paper2);
    }

    #renderBtn,
    #downloadBtn {
      background: var(--accent);
      color: var(--paper);
    }

    #downloadBtn.secondary {
      background: var(--ink);
      color: var(--paper);
    }

    #downloadBtn:not(:disabled):hover {
      background: var(--ink2);
      color: var(--paper);
    }

    button:disabled,
    input:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: start;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 6px;
      margin-top: 6px;
    }

    .button-row button {
      margin-top: 0;
    }

    .colour-control-row,
    .picker-action-row {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 6px;
      align-items: end;
    }

    .colour-control-row input,
    .picker-action-row select {
      margin-top: 4px;
    }

    button.icon-button {
      width: 36px;
      min-width: 36px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      margin-top: 4px;
      border-radius: 0;
    }

    .dropper-icon {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .dropper-icon path {
      fill: currentColor;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .toggle-field {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      padding: 7px 9px;
      border: 2px solid var(--line);
      background: var(--paper);
      box-shadow: 0 2px 0 var(--ink);
      font-size: 10.5px;
      font-weight: 900;
      line-height: 1.25;
      cursor: pointer;
    }

    .toggle-field input {
      width: auto;
      margin: 0;
      flex: 0 0 auto;
    }

    .colour-transparent-toggle {
      margin-top: 7px;
      color: var(--ink);
      opacity: 0.88;
    }

    .picker-card {
      margin-top: 10px;
      padding: 8px;
      border: 2px solid var(--line);
      background: var(--paper);
      box-shadow: 0 3px 0 var(--ink);
    }

    .picked-colour-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .picked-colour-swatch {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 2px solid var(--line);
      box-shadow: 0 2px 0 var(--ink);
      background-image:
        linear-gradient(45deg, var(--checker1) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker1) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker1) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker1) 75%),
        var(--checker2);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }

    .small {
      font-size: 11px;
      color: var(--ink);
      font-weight: 900;
      line-height: 1.5;
      opacity: 0.7;
    }

    .scale-readout {
      margin-top: 2px;
      text-align: right;
    }

    canvas {
      display: block;
      max-width: 100%;
      border: 3px solid var(--line);
      background-image:
        linear-gradient(45deg, var(--checker1) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker1) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker1) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker1) 75%),
        var(--checker2);
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
      box-shadow: 0 4px 0 var(--ink);
      image-rendering: pixelated;
    }

    body.smooth-rendering canvas {
      image-rendering: auto;
    }

    .crop-shell {
      display: inline-block;
      max-width: 100%;
      border: 0;
      background: transparent;
      overflow: hidden;
    }

    .crop-canvas {
      cursor: grab;
      touch-action: none;
    }

    .crop-canvas.is-dragging {
      cursor: grabbing;
    }

    canvas.is-picking,
    .crop-canvas.is-picking {
      cursor: crosshair;
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
    }

    .metric-grid label,
    .background-compact label,
    .side-section > label {
      margin-top: 0;
    }

    .compact-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .hint-dot {
      width: 16px;
      height: 16px;
      border: 2px solid var(--line);
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      font-size: 9px;
      line-height: 1;
      background: var(--paper2);
      box-shadow: 0 2px 0 var(--ink);
      cursor: help;
      flex-shrink: 0;
    }

    .background-compact {
      border: 2px solid var(--line);
      background: var(--paper);
      box-shadow: 0 3px 0 var(--ink);
      padding: 7px;
      display: grid;
      gap: 6px;
    }

    .background-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }

    .toggle-pill,
    .mini-check {
      height: 34px;
      margin: 0;
      border: 2px solid var(--line);
      background: var(--paper2);
      box-shadow: 0 3px 0 var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 9px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 10.5px;
      transition: background 0.1s;
    }

    .toggle-pill:hover,
    .mini-check:hover {
      background: var(--paper);
    }

    .toggle-pill input,
    .mini-check input {
      width: auto;
      margin: 0;
    }

    .background-row .colour-control-row {
      min-width: 0;
    }

    .background-row input[type="color"] {
      margin-top: 0;
    }

    .background-row .icon-button {
      margin-top: 0;
    }

    .side-section {
      display: grid;
      gap: 6px;
    }

    .side-button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .side-choice {
      min-height: 36px;
      margin: 0;
      grid-template-columns: 24px 1fr;
      justify-content: start;
      justify-items: start;
      gap: 6px;
      text-align: left;
      font-size: 10.5px;
      letter-spacing: 0.04em;
    }

    .side-choice svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .side-choice.is-active,
    .side-choice[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 2px solid var(--line);
    }

    .head span:last-child {
      opacity: 0.5;
      font-size: 10px;
    }

    .action-row button {
      margin-top: 0 !important;
    }

    @media (max-width: 520px) {
      .metric-grid,
      .background-row,
      .action-row {
        grid-template-columns: 1fr;
      }

      .side-button-grid {
        grid-template-columns: 1fr;
      }
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 1000px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto 1fr;
      }

      .top {
        grid-template-columns: 1fr auto;
        row-gap: 7px;
        padding: 8px 12px;
      }

      .top-pill,
      .top-center {
        grid-column: 1 / -1;
        width: 100%;
      }

      .status-chip {
        grid-column: 2;
        grid-row: 1;
      }

      main {
        grid-template-columns: 1fr;
      }

      .panel,
      .preview {
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="brand">DASHER</div>
      <div class="top-pill">like those uhh old forum style alternating dash border signature thingies</div>
      <div class="top-center">Recommended: 1116 × 257 px</div>
      <div class="status-chip">PNG/JPEG/GIF</div>
    </header>

    <main>
      <section class="panel controls-panel">
        <div class="head">
          <span>Controls</span>
          <span>Export PNG/GIF</span>
        </div>
        <div class="panel-scroll">
      <label for="fileInput">Image file</label>
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/gif,.png,.jpg,.jpeg,.gif" />

      <div id="cropControls" hidden>
        <input id="fixedCropToggle" type="checkbox" checked hidden aria-hidden="true" />
        <div id="cropSizingControls">
          <div class="row">
            <div>
              <label for="cropWidth">Crop width, px</label>
              <input id="cropWidth" type="number" min="1" step="1" title="Starter crop is 1116 × 257. Change it once and future uploads in this tab reuse that size." />
            </div>
            <div>
              <label for="cropHeight">Crop height, px</label>
              <input id="cropHeight" type="number" min="1" step="1" title="Starter crop is 1116 × 257. Change it once and future uploads in this tab reuse that size." />
            </div>
          </div>

          <label for="imageScale">Image size</label>
          <input id="imageScale" type="range" min="1" max="800" step="1" value="100" />
          <div id="scaleValue" class="small scale-readout">100%</div>

          <div class="button-row">
            <button id="fitImageBtn" class="secondary" type="button" title="Fit the full image inside the crop">Fit</button>
            <button id="fillImageBtn" class="secondary" type="button" title="Fill the whole crop with the image">Fill</button>
            <button id="centerImageBtn" class="secondary" type="button" title="Centre the image in the crop">Centre</button>
            <button id="useImageSizeBtn" class="secondary" type="button" title="Set crop width and height to the uploaded image's actual pixel dimensions">Image size</button>
            <button id="resetCropBtn" class="secondary" type="button" title="Reset crop position, zoom, and size for this tab">Reset</button>
          </div>
        </div>
      </div>

      <div class="metric-grid grid grid-cols-2 gap-2">
        <div>
          <label for="resamplingMode">Resampling</label>
          <select id="resamplingMode" title="Nearest neighbour keeps small pixel art sharp; bilinear smooths scaled images.">
            <option value="nearest" selected>Nearest neighbour</option>
            <option value="bilinear">Bilinear</option>
          </select>
        </div>
        <div>
          <label for="exportFormat">Export as</label>
          <select id="exportFormat" title="PNG exports the current frame. GIF exports imported GIF frames and/or marching ants animation.">
            <option value="png" selected>PNG</option>
            <option value="gif">GIF</option>
          </select>
        </div>
      </div>

      <div class="metric-grid grid grid-cols-2 gap-2">
        <div>
          <label class="compact-label" for="dashCount">
            <span>Dashes</span>
            <span class="hint-dot" title="Total dash segments along the selected border path. Segments are evenly spaced with no gaps.">?</span>
          </label>
          <input id="dashCount" type="number" min="1" step="1" value="62" title="Total dash segments along the selected border path" />
        </div>
        <div>
          <label class="compact-label" for="lineWidth">
            <span>Dash width</span>
            <span class="hint-dot" title="Line thickness in pixels.">?</span>
          </label>
          <input id="lineWidth" type="number" min="1" step="1" value="11" title="Line thickness in pixels" />
        </div>
      </div>

      <div class="row">
        <div>

                <path d="M14.7 3.3a2.4 2.4 0 0 1 3.4 0l2.6 2.6a2.4 2.4 0 0 1 0 3.4l-1.6 1.6 1.1 1.1-1.4 1.4-1.1-1.1-7.9 7.9H4v-5.8l7.9-7.9-1.1-1.1 1.4-1.4 1.1 1.1 1.4-1.8Zm-8.7 12v2.7h2.7l7.6-7.6-2.7-2.7-7.6 7.6Zm9-9 2.7 2.7 1.6-1.6a.4.4 0 0 0 0-.6l-2.6-2.6a.4.4 0 0 0-.6 0L15 6.3Z" fill="currentColor" />

  <script>
    const fileInput = document.getElementById("fileInput");
    const cropControls = document.getElementById("cropControls");
    const fixedCropToggle = document.getElementById("fixedCropToggle");
    const cropSizingControls = document.getElementById("cropSizingControls");
    const cropWidthInput = document.getElementById("cropWidth");
    const cropHeightInput = document.getElementById("cropHeight");
    const imageScaleInput = document.getElementById("imageScale");
    const scaleValue = document.getElementById("scaleValue");
    const fitImageBtn = document.getElementById("fitImageBtn");
    const fillImageBtn = document.getElementById("fillImageBtn");
    const centerImageBtn = document.getElementById("centerImageBtn");
    const resetCropBtn = document.getElementById("resetCropBtn");
    const useImageSizeBtn = document.getElementById("useImageSizeBtn");
    const dashCountInput = document.getElementById("dashCount");
    const lineWidthInput = document.getElementById("lineWidth");
    const colorAInput = document.getElementById("colorA");
    const colorATransparentInput = document.getElementById("colorATransparent");
    const pickColorABtn = document.getElementById("pickColorABtn");
    const colorBInput = document.getElementById("colorB");
    const colorBTransparentInput = document.getElementById("colorBTransparent");
    const pickColorBBtn = document.getElementById("pickColorBBtn");
    const canvasBackgroundToggle = document.getElementById("canvasBackgroundToggle");
    const canvasBackgroundColorInput = document.getElementById("canvasBackgroundColor");
    const canvasBackgroundTransparentInput = document.getElementById("canvasBackgroundTransparent");
    const pickCanvasBackgroundBtn = document.getElementById("pickCanvasBackgroundBtn");
    const pickTargetInput = document.getElementById("pickTarget");
    const startColorPickBtn = document.getElementById("startColorPickBtn");
    const pickedColorSwatch = document.getElementById("pickedColorSwatch");
    const pickedColorValue = document.getElementById("pickedColorValue");
    const insetInput = document.getElementById("inset");
    const outsideStrokeAlignToggle = document.getElementById("outsideStrokeAlignToggle");
    const marchingAntsToggle = document.getElementById("marchingAntsToggle");
    const marchingAntsSpeedInput = document.getElementById("marchingAntsSpeed");
    const resamplingModeInput = document.getElementById("resamplingMode");
    const exportFormatInput = document.getElementById("exportFormat");
    const sidesInput = document.getElementById("sides");
    const sideChoiceButtons = Array.from(document.querySelectorAll("[data-sides]"));
    const renderBtn = document.getElementById("renderBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const cropEditor = document.getElementById("cropEditor");
    const cropCanvas = document.getElementById("cropCanvas");
    const cropCtx = cropCanvas.getContext("2d");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const status = document.getElementById("status");
    const editedCanvas = document.createElement("canvas");
    const editedCtx = editedCanvas.getContext("2d");
    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 1;
    sampleCanvas.height = 1;
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    const DEFAULT_CROP_WIDTH = 1116;
    const DEFAULT_CROP_HEIGHT = 257;
    const MAX_CANVAS_SIZE = 12000;
    const DEFAULT_GIF_DELAY = 80;
    const MARCHING_ANTS_LOOP_MS = 1200;
    const MARCHING_ANTS_EXPORT_FRAMES = 24;
    const GIF_WORKER_SCRIPT = "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js";
    const SUPPORTED_IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif"];
    const SUPPORTED_IMAGE_EXTENSION = /\.(png|jpe?g|gif)$/i;
    const GIF_IMAGE_EXTENSION = /\.gif$/i;

    let originalImage = null;
    let originalFrames = [];
    let originalBaseName = "alternating-dashes";
    let originalFileName = "alternating-dashes.png";
    let currentFrameIndex = 0;
    let previewAnimationStartTime = 0;
    let animationFrameRequest = null;
    let isExportingGif = false;
    let isColorPickMode = false;
    let hasUserChangedCropSize = false;
    let sessionCropWidth = DEFAULT_CROP_WIDTH;
    let sessionCropHeight = DEFAULT_CROP_HEIGHT;
    let showCropGuides = false;
    let cropGuideHideTimer = null;
    let currentOutputPadding = 0;
    let cropState = {
      width: 1,
      height: 1,
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      previewScale: 1,
      dragging: false,
      pointerId: null,
      lastX: 0,
      lastY: 0
    };


    const colourDropperButtons = [
      pickColorABtn,
      pickColorBBtn,
      pickCanvasBackgroundBtn,
      startColorPickBtn
    ];

    fileInput.addEventListener("change", loadImageFile);
    renderBtn.addEventListener("click", render);
    downloadBtn.addEventListener("click", downloadCurrentExport);
    fixedCropToggle.addEventListener("change", handleFixedCropToggle);
    cropWidthInput.addEventListener("input", handleCropSizeInput);
    cropHeightInput.addEventListener("input", handleCropSizeInput);
    imageScaleInput.addEventListener("input", handleScaleInput);
    fitImageBtn.addEventListener("click", () => setImageFit("fit"));
    fillImageBtn.addEventListener("click", () => setImageFit("fill"));
    centerImageBtn.addEventListener("click", () => {
      centerImage();
      updateEditedPreviewAndOutput();
    });
    resetCropBtn.addEventListener("click", resetCrop);
    useImageSizeBtn.addEventListener("click", useImageDimensionsForCrop);
    outsideStrokeAlignToggle.addEventListener("change", () => {
      syncOutsideStrokeAlignment();
      if (originalImage) render();
    });
    marchingAntsToggle.addEventListener("change", () => {
      syncAnimationLoop();
      if (originalImage) render();
    });
    marchingAntsSpeedInput.addEventListener("input", () => {
      syncAnimationLoop();
      if (originalImage) render();
    });
    resamplingModeInput.addEventListener("change", () => {
      syncResamplingUi();
      if (originalImage) updateEditedPreviewAndOutput();
    });
    exportFormatInput.addEventListener("change", syncDownloadButtonLabel);
    canvasBackgroundToggle.addEventListener("change", () => {
      syncCanvasBackgroundUi();
      if (originalImage) updateEditedPreviewAndOutput();
    });
    canvasBackgroundColorInput.addEventListener("input", () => {
      if (originalImage) updateEditedPreviewAndOutput();
    });
    sideChoiceButtons.forEach(button => {
      button.addEventListener("click", () => {
        sidesInput.value = button.dataset.sides;
        syncSideButtons();
        if (originalImage) render();
      });
    });
    [
      colorATransparentInput,
      colorBTransparentInput,
      canvasBackgroundTransparentInput
    ].forEach(control => {
      control.addEventListener("change", () => {
        syncColourTransparencyUi();
        if (originalImage) updateEditedPreviewAndOutput();
      });
    });
    pickColorABtn.addEventListener("click", () => startColorPickForTarget("colorA"));
    pickColorBBtn.addEventListener("click", () => startColorPickForTarget("colorB"));
    pickCanvasBackgroundBtn.addEventListener("click", () => startColorPickForTarget("canvasBackgroundColor"));
    startColorPickBtn.addEventListener("click", toggleColorPickMode);
    canvas.addEventListener("pointerdown", handleCanvasPointerDown);
    canvas.addEventListener("pointermove", handleCanvasPointerMove);
    canvas.addEventListener("pointerleave", scheduleCropGuideHide);
    canvas.addEventListener("pointerenter", handleCanvasPointerMove);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && isColorPickMode) {
        setColorPickMode(false);
        if (originalImage) render();
      }
    });
    canvas.addEventListener("pointerup", endCropDrag);
    canvas.addEventListener("pointercancel", endCropDrag);
    canvas.addEventListener("wheel", zoomCropImage, { passive: false });
    window.addEventListener("resize", () => {
      if (originalImage) drawCropPreview();
    });

    [
      dashCountInput,
      lineWidthInput,
      colorAInput,
      colorBInput,
      colorATransparentInput,
      colorBTransparentInput,
      insetInput,
      sidesInput
    ].forEach(control => {
      control.addEventListener("input", () => {
        if (control === lineWidthInput) syncOutsideStrokeAlignment();
        if (originalImage) render();
      });
    });

    setLoadedControls(false);
    syncCanvasBackgroundUi();
    syncSideButtons();
    syncOutsideStrokeAlignment();
    syncResamplingUi();
    syncDownloadButtonLabel();

    function syncSideButtons() {
      sideChoiceButtons.forEach(button => {
        const isActive = button.dataset.sides === sidesInput.value;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function getLineWidthValue() {
      return Math.max(1, Math.floor(Number(lineWidthInput.value) || 1));
    }

    function syncOutsideStrokeAlignment() {
      const isOutsideAligned = outsideStrokeAlignToggle.checked;
      insetInput.disabled = isOutsideAligned;

      if (isOutsideAligned) {
        insetInput.value = String(-getLineWidthValue());
      }
    }

    function isNearestResampling() {
      return resamplingModeInput.value === "nearest";
    }

    function syncResamplingUi() {
      document.body.classList.toggle("smooth-rendering", !isNearestResampling());
    }

    function setCanvasResampling(context) {
      const useNearest = isNearestResampling();
      context.imageSmoothingEnabled = !useNearest;
      context.imageSmoothingQuality = useNearest ? "low" : "high";
    }

    function syncDownloadButtonLabel() {
      const format = exportFormatInput.value === "gif" ? "GIF" : "PNG";
      downloadBtn.textContent = `Export ${format}`;
      originalFileName = `${originalBaseName}-alternating-dashes.${format.toLowerCase()}`;
    }

    function getOriginalWidth() {
      return originalImage ? (originalImage.naturalWidth || originalImage.width || 0) : 0;
    }

    function getOriginalHeight() {
      return originalImage ? (originalImage.naturalHeight || originalImage.height || 0) : 0;
    }

    function getFrameImage(frameIndex = currentFrameIndex) {
      if (!originalFrames.length) return originalImage;
      const safeIndex = ((Math.floor(frameIndex) % originalFrames.length) + originalFrames.length) % originalFrames.length;
      return originalFrames[safeIndex].image;
    }

    function getFrameDelay(frameIndex = currentFrameIndex) {
      if (!originalFrames.length) return DEFAULT_GIF_DELAY;
      const safeIndex = ((Math.floor(frameIndex) % originalFrames.length) + originalFrames.length) % originalFrames.length;
      return normalizeFrameDelay(originalFrames[safeIndex].delay);
    }

    function isMarchingAntsEnabled() {
      return marchingAntsToggle.checked;
    }

    function getMarchingAntsSpeed() {
      const speed = Number(marchingAntsSpeedInput.value);
      return Number.isFinite(speed) ? Math.min(8, Math.max(0.1, speed)) : 1;
    }

    function getMarchingAntsProgressForElapsed(elapsedMs) {
      if (!isMarchingAntsEnabled()) return 0;
      const loopMs = MARCHING_ANTS_LOOP_MS / getMarchingAntsSpeed();
      return ((elapsedMs % loopMs) / loopMs) * 2;
    }

    function getMarchingAntsProgress(timestamp = performance.now()) {
      if (!isMarchingAntsEnabled()) return 0;
      if (!previewAnimationStartTime) previewAnimationStartTime = timestamp;
      return getMarchingAntsProgressForElapsed(timestamp - previewAnimationStartTime);
    }

    function shouldAnimatePreview() {
      return Boolean(originalImage) && (originalFrames.length > 1 || isMarchingAntsEnabled());
    }

    function startAnimationLoop() {
      if (animationFrameRequest || !shouldAnimatePreview()) return;
      previewAnimationStartTime = performance.now();
      animationFrameRequest = requestAnimationFrame(runAnimationFrame);
    }

    function stopAnimationLoop() {
      if (animationFrameRequest) {
        cancelAnimationFrame(animationFrameRequest);
        animationFrameRequest = null;
      }
    }

    function syncAnimationLoop() {
      if (shouldAnimatePreview()) {
        startAnimationLoop();
      } else {
        stopAnimationLoop();
      }
    }

    function runAnimationFrame(timestamp) {
      animationFrameRequest = null;

      if (!shouldAnimatePreview() || isExportingGif) {
        syncAnimationLoop();
        return;
      }

      currentFrameIndex = getFrameIndexAtTime(timestamp);
      render({ timestamp });
      animationFrameRequest = requestAnimationFrame(runAnimationFrame);
    }

    function getFrameIndexAtTime(timestamp = performance.now()) {
      if (!originalFrames.length || originalFrames.length === 1) return 0;
      if (!previewAnimationStartTime) previewAnimationStartTime = timestamp;

      const totalDuration = originalFrames.reduce((sum, frame) => sum + normalizeFrameDelay(frame.delay), 0);
      let elapsed = (timestamp - previewAnimationStartTime) % totalDuration;

      for (let i = 0; i < originalFrames.length; i++) {
        elapsed -= normalizeFrameDelay(originalFrames[i].delay);
        if (elapsed <= 0) return i;
      }

      return originalFrames.length - 1;
    }

    function handleCanvasPointerDown(event) {
      revealCropGuidesFromPointer(event);

      if (isColorPickMode) {
        pickColorFromDashedPreview(event);
        return;
      }

      startCropDrag(event);
    }

    function handleCanvasPointerMove(event) {
      revealCropGuidesFromPointer(event);
      dragCropImage(event);
    }

    function revealCropGuidesFromPointer(event) {
      if (!originalImage) return;

      if (cropState.dragging || isPointInsideCropRect(event)) {
        setCropGuidesVisible(true);
        clearTimeout(cropGuideHideTimer);
      } else {
        scheduleCropGuideHide();
      }
    }

    function scheduleCropGuideHide() {
      clearTimeout(cropGuideHideTimer);
      cropGuideHideTimer = setTimeout(() => setCropGuidesVisible(false), 2000);
    }

    function setCropGuidesVisible(isVisible) {
      if (showCropGuides === isVisible) return;
      showCropGuides = isVisible;
      if (originalImage) render();
    }

    async function loadImageFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!isSupportedImageFile(file)) {
        alert("Please choose a PNG, JPEG, or GIF file.");
        fileInput.value = "";
        return;
      }

      stopAnimationLoop();
      originalImage = null;
      originalFrames = [];
      currentFrameIndex = 0;
      previewAnimationStartTime = 0;
      originalBaseName = file.name.replace(SUPPORTED_IMAGE_EXTENSION, "") || "alternating-dashes";
      originalFileName = `${originalBaseName}-alternating-dashes.png`;
      status.textContent = "Loading image...";

      try {
        if (isGifFile(file)) {
          await loadGifFile(file);
        } else {
          await loadStaticImageFile(file);
        }

        initializeCrop();
        setLoadedControls(true);
        updateEditedPreviewAndOutput();
        syncAnimationLoop();
      } catch (error) {
        console.error(error);
        alert("Could not load this image.");
        fileInput.value = "";
        setLoadedControls(false);
        status.textContent = "Load an image to get started.";
      }
    }

    function loadStaticImageFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = () => {
          originalImage = img;
          originalFrames = [{ image: img, delay: DEFAULT_GIF_DELAY }];
          exportFormatInput.value = "png";
          syncDownloadButtonLabel();
          URL.revokeObjectURL(objectUrl);
          resolve();
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Could not load static image."));
        };

        img.src = objectUrl;
      });
    }

    async function loadGifFile(file) {
      const decoder = getGifDecoder();
      if (!decoder) {
        throw new Error("GIF decoder library did not load.");
      }

      const buffer = await file.arrayBuffer();
      const decodedFrames = decodeGifFrames(buffer, decoder);

      if (!decodedFrames.length) {
        throw new Error("No GIF frames decoded.");
      }

      originalFrames = decodedFrames;
      originalImage = originalFrames[0].image;
      exportFormatInput.value = "gif";
      syncDownloadButtonLabel();
    }

    function getGifDecoder() {
      if (typeof parseGIF === "function" && typeof decompressFrames === "function") {
        return { parseGIF, decompressFrames };
      }

      if (window.gifuct && typeof window.gifuct.parseGIF === "function" && typeof window.gifuct.decompressFrames === "function") {
        return window.gifuct;
      }

      return null;
    }

    function decodeGifFrames(buffer, decoder) {
      const gif = decoder.parseGIF(buffer);
      const frames = decoder.decompressFrames(gif, true);
      const width = gif.lsd.width;
      const height = gif.lsd.height;
      const compositeCanvas = document.createElement("canvas");
      const compositeCtx = compositeCanvas.getContext("2d");
      const outputFrames = [];

      compositeCanvas.width = width;
      compositeCanvas.height = height;
      compositeCtx.imageSmoothingEnabled = false;

      frames.forEach(frame => {
        const dims = frame.dims;
        const previousImageData = frame.disposalType === 3
          ? compositeCtx.getImageData(0, 0, width, height)
          : null;
        const patchData = new ImageData(new Uint8ClampedArray(frame.patch), dims.width, dims.height);

        compositeCtx.putImageData(patchData, dims.left, dims.top);

        const frameCanvas = document.createElement("canvas");
        const frameCtx = frameCanvas.getContext("2d");
        frameCanvas.width = width;
        frameCanvas.height = height;
        frameCtx.imageSmoothingEnabled = false;
        frameCtx.drawImage(compositeCanvas, 0, 0);

        outputFrames.push({
          image: frameCanvas,
          delay: normalizeFrameDelay((frame.delay || 10) * 10)
        });

        if (frame.disposalType === 2) {
          compositeCtx.clearRect(dims.left, dims.top, dims.width, dims.height);
        } else if (frame.disposalType === 3 && previousImageData) {
          compositeCtx.putImageData(previousImageData, 0, 0);
        }
      });

      return outputFrames;
    }

    function isSupportedImageFile(file) {
      return SUPPORTED_IMAGE_TYPES.includes(file.type) || SUPPORTED_IMAGE_EXTENSION.test(file.name);
    }

    function isGifFile(file) {
      return file.type === "image/gif" || GIF_IMAGE_EXTENSION.test(file.name);
    }

    function normalizeFrameDelay(delayMs) {
      const delay = Number(delayMs);
      if (!Number.isFinite(delay) || delay <= 0) return DEFAULT_GIF_DELAY;
      return Math.min(1000, Math.max(20, Math.round(delay)));
    }

    function isFinitePositiveDimension(value) {
      return Number.isFinite(value) && value >= 1;
    }

    function hasValidCanvasSize(sourceCanvas) {
      return Boolean(sourceCanvas) &&
        isFinitePositiveDimension(sourceCanvas.width) &&
        isFinitePositiveDimension(sourceCanvas.height);
    }

    function setLoadedControls(isLoaded) {
      renderBtn.disabled = !isLoaded;
      downloadBtn.disabled = !isLoaded;
      startColorPickBtn.disabled = !isLoaded;
      colourDropperButtons.forEach(button => {
        button.disabled = !isLoaded;
      });
      cropControls.hidden = !isLoaded;

      [
        fixedCropToggle,
        cropWidthInput,
        cropHeightInput,
        imageScaleInput,
        fitImageBtn,
        fillImageBtn,
        centerImageBtn,
        resetCropBtn,
        useImageSizeBtn,
        marchingAntsToggle,
        marchingAntsSpeedInput,
        exportFormatInput
      ].forEach(control => {
        control.disabled = !isLoaded;
      });

      syncCropModeUi();
      syncCanvasBackgroundUi();
      syncOutsideStrokeAlignment();
      syncDownloadButtonLabel();
    }

    function initializeCrop() {
      fixedCropToggle.checked = true;
      cropState.width = hasUserChangedCropSize ? sessionCropWidth : DEFAULT_CROP_WIDTH;
      cropState.height = hasUserChangedCropSize ? sessionCropHeight : DEFAULT_CROP_HEIGHT;
      cropState.scale = 1;
      cropState.offsetX = 0;
      cropState.offsetY = 0;
      showCropGuides = false;
      clearTimeout(cropGuideHideTimer);
      centerImage();

      cropWidthInput.value = cropState.width;
      cropHeightInput.value = cropState.height;
      syncScaleControl();
      syncCropModeUi();
    }

    function handleFixedCropToggle() {
      if (!originalImage) {
        syncCropModeUi();
        return;
      }

      initializeCrop();
      updateEditedPreviewAndOutput();
    }

    function syncCropModeUi() {
      const isLoaded = Boolean(originalImage);
      fixedCropToggle.checked = true;
      cropSizingControls.hidden = !isLoaded;
      cropEditor.hidden = true;

      [
        cropWidthInput,
        cropHeightInput,
        imageScaleInput,
        fitImageBtn,
        fillImageBtn,
        centerImageBtn,
        resetCropBtn,
        useImageSizeBtn
      ].forEach(control => {
        control.disabled = !isLoaded;
      });
    }

    function syncCanvasBackgroundUi() {
      syncColourTransparencyUi();
    }

    function syncColourTransparencyUi() {
      colorAInput.disabled = colorATransparentInput.checked;
      colorBInput.disabled = colorBTransparentInput.checked;
      canvasBackgroundTransparentInput.disabled = !canvasBackgroundToggle.checked;
      canvasBackgroundColorInput.disabled = !canvasBackgroundToggle.checked || canvasBackgroundTransparentInput.checked;
      pickCanvasBackgroundBtn.disabled = !originalImage || !canvasBackgroundToggle.checked || canvasBackgroundTransparentInput.checked;
    }

    function isTransparentColourValue(colour) {
      return colour === "transparent";
    }

    function getColourFromInputs(colourInput, transparentInput) {
      return transparentInput.checked ? "transparent" : colourInput.value;
    }

    function setColourOnInputs(colourInput, transparentInput, colour) {
      const isTransparent = isTransparentColourValue(colour);
      transparentInput.checked = isTransparent;

      if (!isTransparent) {
        colourInput.value = colour;
      }

      syncColourTransparencyUi();
    }

    function formatColourForDisplay(colour) {
      return isTransparentColourValue(colour) ? "transparent / no colour" : colour.toUpperCase();
    }

    function setPickedSwatchColour(colour) {
      pickedColorSwatch.style.background = isTransparentColourValue(colour) ? "" : colour;
    }

    function isCanvasBackgroundEnabled() {
      return canvasBackgroundToggle.checked;
    }

    function getCanvasBackgroundColor() {
      return getColourFromInputs(canvasBackgroundColorInput, canvasBackgroundTransparentInput);
    }

    function fillCanvasBackground(context, width, height) {
      if (!isCanvasBackgroundEnabled()) return;

      const backgroundColour = getCanvasBackgroundColor();
      if (isTransparentColourValue(backgroundColour)) return;

      context.fillStyle = backgroundColour;
      context.fillRect(0, 0, width, height);
    }

    function startColorPickForTarget(targetValue) {
      if (!originalImage) return;
      pickTargetInput.value = targetValue;
      setColorPickMode(true);
    }

    function toggleColorPickMode() {
      if (!originalImage) return;
      setColorPickMode(!isColorPickMode);
    }

    function setColorPickMode(isActive) {
      isColorPickMode = isActive;
      const activeTarget = pickTargetInput.value;
      colourDropperButtons.forEach(button => button.classList.remove("is-active"));

      if (isActive) {
        startColorPickBtn.classList.add("is-active");
        if (activeTarget === "colorA") pickColorABtn.classList.add("is-active");
        if (activeTarget === "colorB") pickColorBBtn.classList.add("is-active");
        if (activeTarget === "canvasBackgroundColor") pickCanvasBackgroundBtn.classList.add("is-active");
        startColorPickBtn.title = "Cancel colour pick";
        startColorPickBtn.setAttribute("aria-label", "Cancel colour pick");
      } else {
        startColorPickBtn.title = "Pick selected colour from preview";
        startColorPickBtn.setAttribute("aria-label", "Pick selected colour from preview");
      }

      canvas.classList.toggle("is-picking", isActive);

      if (isActive) {
        status.textContent = `Pick ${getPickTargetLabel()}: click the live canvas. Esc cancels.`;
      }
    }

    function pickColorFromCropPreview(event) {
      if (!isColorPickMode || !originalImage) return;

      event.preventDefault();
      const point = getCropPoint(event);
      const sourceX = Math.floor((point.x - cropState.offsetX) / cropState.scale);
      const sourceY = Math.floor((point.y - cropState.offsetY) / cropState.scale);

      if (
        sourceX < 0 ||
        sourceY < 0 ||
        sourceX >= getOriginalWidth() ||
        sourceY >= getOriginalHeight()
      ) {
        status.textContent = "That spot is outside the uploaded image. Click on the image itself, or use the dashed preview to sample the final canvas/background.";
        return;
      }

      const colour = sampleOriginalImagePixel(sourceX, sourceY);
      if (colour) applyPickedColor(colour);
    }

    function pickColorFromDashedPreview(event) {
      if (!isColorPickMode || !originalImage) return;

      event.preventDefault();
      const colour = sampleCanvasPixel(canvas, ctx, event);
      if (colour) applyPickedColor(colour);
    }

    function sampleOriginalImagePixel(sourceX, sourceY) {
      const frameImage = getFrameImage();
      sampleCtx.clearRect(0, 0, 1, 1);
      sampleCtx.drawImage(frameImage, sourceX, sourceY, 1, 1, 0, 0, 1, 1);
      const [red, green, blue, alpha] = sampleCtx.getImageData(0, 0, 1, 1).data;

      if (alpha === 0) {
        return "transparent";
      }

      return rgbToHex(red, green, blue);
    }

    function sampleCanvasPixel(sourceCanvas, sourceCtx, event) {
      const rect = sourceCanvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) * sourceCanvas.width / rect.width);
      const y = Math.floor((event.clientY - rect.top) * sourceCanvas.height / rect.height);

      if (x < 0 || y < 0 || x >= sourceCanvas.width || y >= sourceCanvas.height) {
        return null;
      }

      const [red, green, blue, alpha] = sourceCtx.getImageData(x, y, 1, 1).data;

      if (alpha === 0) {
        return "transparent";
      }

      return rgbToHex(red, green, blue);
    }

    function rgbToHex(red, green, blue) {
      return `#${[red, green, blue]
        .map(value => value.toString(16).padStart(2, "0"))
        .join("")}`;
    }

    function applyPickedColor(colour) {
      const targetInput = getPickTargetInput();
      const targetTransparentInput = getPickTargetTransparentInput();
      if (!targetInput || !targetTransparentInput) return;

      if (targetInput === canvasBackgroundColorInput) {
        canvasBackgroundToggle.checked = true;
      }

      setColourOnInputs(targetInput, targetTransparentInput, colour);
      setPickedSwatchColour(colour);
      pickedColorValue.textContent = `Picked ${formatColourForDisplay(colour)} for ${getPickTargetLabel()}.`;
      setColorPickMode(false);
      updateEditedPreviewAndOutput();
    }

    function getPickTargetInput() {
      if (pickTargetInput.value === "colorA") return colorAInput;
      if (pickTargetInput.value === "colorB") return colorBInput;
      return canvasBackgroundColorInput;
    }

    function getPickTargetTransparentInput() {
      if (pickTargetInput.value === "colorA") return colorATransparentInput;
      if (pickTargetInput.value === "colorB") return colorBTransparentInput;
      return canvasBackgroundTransparentInput;
    }

    function getPickTargetLabel() {
      if (pickTargetInput.value === "colorA") return "dash colour A";
      if (pickTargetInput.value === "colorB") return "dash colour B";
      return "canvas background colour";
    }

    function handleCropSizeInput() {
      if (!originalImage) return;

      const nextSize = readCropSizeInputs();
      if (!nextSize) return;

      const oldWidth = cropState.width;
      const oldHeight = cropState.height;
      const imageAnchorX = (oldWidth / 2 - cropState.offsetX) / cropState.scale;
      const imageAnchorY = (oldHeight / 2 - cropState.offsetY) / cropState.scale;

      cropState.width = nextSize.width;
      cropState.height = nextSize.height;
      hasUserChangedCropSize = true;
      sessionCropWidth = cropState.width;
      sessionCropHeight = cropState.height;
      cropState.offsetX = cropState.width / 2 - imageAnchorX * cropState.scale;
      cropState.offsetY = cropState.height / 2 - imageAnchorY * cropState.scale;

      cropWidthInput.value = cropState.width;
      cropHeightInput.value = cropState.height;
      updateEditedPreviewAndOutput();
    }

    function readCropSizeInputs() {
      const width = Math.floor(Number(cropWidthInput.value));
      const height = Math.floor(Number(cropHeightInput.value));

      if (!Number.isFinite(width) || !Number.isFinite(height) || width < 1 || height < 1) {
        return null;
      }

      return {
        width: Math.min(MAX_CANVAS_SIZE, width),
        height: Math.min(MAX_CANVAS_SIZE, height)
      };
    }

    function handleScaleInput() {
      if (!originalImage) return;

      const nextScale = Number(imageScaleInput.value) / 100;
      setImageScale(nextScale, cropState.width / 2, cropState.height / 2);
      updateEditedPreviewAndOutput();
    }

    function setImageFit(mode) {
      if (!originalImage) return;

      const fitScale = Math.min(
        cropState.width / getOriginalWidth(),
        cropState.height / getOriginalHeight()
      );
      const fillScale = Math.max(
        cropState.width / getOriginalWidth(),
        cropState.height / getOriginalHeight()
      );

      cropState.scale = mode === "fill" ? fillScale : fitScale;
      centerImage();
      syncScaleControl();
      updateEditedPreviewAndOutput();
    }

    function centerImage() {
      if (!originalImage) return;

      cropState.offsetX = (cropState.width - getOriginalWidth() * cropState.scale) / 2;
      cropState.offsetY = (cropState.height - getOriginalHeight() * cropState.scale) / 2;
    }

    function useImageDimensionsForCrop() {
      if (!originalImage) return;

      const imageWidth = Math.min(MAX_CANVAS_SIZE, Math.max(1, Math.floor(getOriginalWidth())));
      const imageHeight = Math.min(MAX_CANVAS_SIZE, Math.max(1, Math.floor(getOriginalHeight())));

      if (!imageWidth || !imageHeight) {
        status.textContent = "Could not read the uploaded image dimensions.";
        return;
      }

      cropState.width = imageWidth;
      cropState.height = imageHeight;
      cropState.scale = 1;
      cropState.offsetX = 0;
      cropState.offsetY = 0;
      hasUserChangedCropSize = true;
      sessionCropWidth = cropState.width;
      sessionCropHeight = cropState.height;
      cropWidthInput.value = cropState.width;
      cropHeightInput.value = cropState.height;
      syncScaleControl();
      updateEditedPreviewAndOutput();
      status.textContent += ` Crop size matched uploaded image: ${imageWidth} × ${imageHeight}px.`;
    }

    function resetCrop() {
      if (!originalImage) return;

      initializeCrop();
      updateEditedPreviewAndOutput();
    }

    function setImageScale(nextScale, anchorX, anchorY) {
      const oldScale = cropState.scale || 1;
      const scale = Math.min(80, Math.max(0.01, nextScale));
      const imageAnchorX = (anchorX - cropState.offsetX) / oldScale;
      const imageAnchorY = (anchorY - cropState.offsetY) / oldScale;

      cropState.scale = scale;
      cropState.offsetX = anchorX - imageAnchorX * scale;
      cropState.offsetY = anchorY - imageAnchorY * scale;
      syncScaleControl();
    }

    function syncScaleControl() {
      const percent = Math.max(1, Math.round(cropState.scale * 100));
      imageScaleInput.max = String(Math.max(800, percent));
      imageScaleInput.value = String(percent);
      scaleValue.textContent = `${percent}%`;
    }

    function updateEditedPreviewAndOutput() {
      syncCropModeUi();
      render();
    }

    function drawCropPreview() {
      render();
    }

    function drawFixedCropGuides(imageX = currentOutputPadding, imageY = currentOutputPadding) {
      const guideWidth = Math.max(1, Math.min(4, Math.round(Math.min(cropState.width, cropState.height) / 90)));
      const borderInset = Math.min(guideWidth / 2, cropState.width / 2, cropState.height / 2);

      ctx.save();
      ctx.translate(imageX, imageY);
      ctx.beginPath();
      ctx.moveTo(cropState.width / 3, 0);
      ctx.lineTo(cropState.width / 3, cropState.height);
      ctx.moveTo(cropState.width * 2 / 3, 0);
      ctx.lineTo(cropState.width * 2 / 3, cropState.height);
      ctx.moveTo(0, cropState.height / 3);
      ctx.lineTo(cropState.width, cropState.height / 3);
      ctx.moveTo(0, cropState.height * 2 / 3);
      ctx.lineTo(cropState.width, cropState.height * 2 / 3);
      ctx.lineWidth = guideWidth * 2;
      ctx.strokeStyle = "rgba(20, 3, 6, 0.65)";
      ctx.stroke();
      ctx.lineWidth = guideWidth;
      ctx.strokeStyle = "rgba(255, 246, 216, 0.95)";
      ctx.stroke();

      ctx.lineWidth = guideWidth * 2;
      ctx.strokeStyle = "rgba(20, 3, 6, 0.88)";
      ctx.strokeRect(
        borderInset,
        borderInset,
        Math.max(0, cropState.width - borderInset * 2),
        Math.max(0, cropState.height - borderInset * 2)
      );
      ctx.restore();
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
      };
    }

    function getCropPoint(event) {
      const point = getCanvasPoint(event);

      return {
        x: point.x - currentOutputPadding,
        y: point.y - currentOutputPadding
      };
    }

    function isPointInsideCropRect(event) {
      const point = getCropPoint(event);
      return point.x >= 0 && point.y >= 0 && point.x <= cropState.width && point.y <= cropState.height;
    }

    function startCropDrag(event) {
      if (!originalImage || isColorPickMode || !isPointInsideCropRect(event)) return;

      const point = getCropPoint(event);
      cropState.dragging = true;
      cropState.pointerId = event.pointerId;
      cropState.lastX = point.x;
      cropState.lastY = point.y;
      canvas.classList.add("is-dragging");
      canvas.setPointerCapture(event.pointerId);
    }

    function dragCropImage(event) {
      if (!cropState.dragging || cropState.pointerId !== event.pointerId) return;

      const point = getCropPoint(event);
      cropState.offsetX += point.x - cropState.lastX;
      cropState.offsetY += point.y - cropState.lastY;
      cropState.lastX = point.x;
      cropState.lastY = point.y;

      updateEditedPreviewAndOutput();
    }

    function endCropDrag(event) {
      if (cropState.pointerId !== event.pointerId) return;

      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }

      cropState.dragging = false;
      cropState.pointerId = null;
      canvas.classList.remove("is-dragging");
      scheduleCropGuideHide();
    }

    function zoomCropImage(event) {
      if (!originalImage || !fixedCropToggle.checked || isColorPickMode) return;

      event.preventDefault();
      const point = getCropPoint(event);
      const zoomFactor = Math.exp(-event.deltaY * 0.001);
      setImageScale(cropState.scale * zoomFactor, point.x, point.y);
      updateEditedPreviewAndOutput();
    }

    function buildEditedImage(frameIndex = currentFrameIndex) {
      const frameImage = getFrameImage(frameIndex);

      editedCanvas.width = cropState.width;
      editedCanvas.height = cropState.height;
      editedCtx.clearRect(0, 0, editedCanvas.width, editedCanvas.height);
      fillCanvasBackground(editedCtx, editedCanvas.width, editedCanvas.height);
      setCanvasResampling(editedCtx);
      editedCtx.drawImage(
        frameImage,
        cropState.offsetX,
        cropState.offsetY,
        getOriginalWidth() * cropState.scale,
        getOriginalHeight() * cropState.scale
      );

      return editedCanvas;
    }

    function getDashSource(frameIndex = currentFrameIndex) {
      const editedImage = buildEditedImage(frameIndex);

      return {
        image: editedImage,
        width: editedImage.width,
        height: editedImage.height,
        mode: "crop"
      };
    }

    function render(options = {}) {
      if (!originalImage) return false;

      const frameIndex = options.frameIndex ?? currentFrameIndex;
      const timestamp = options.timestamp ?? performance.now();
      const includeGuides = options.includeGuides ?? showCropGuides;
      const shouldUpdateStatus = options.updateStatus !== false;
      const marchingAntsProgress = options.marchingAntsProgress ?? getMarchingAntsProgress(timestamp);
      const source = getDashSource(frameIndex);
      if (!source || !isFinitePositiveDimension(source.width) || !isFinitePositiveDimension(source.height)) {
        status.textContent = "The current crop produced an invalid canvas size. Check crop width and height.";
        return false;
      }

      const dashCount = Math.max(1, Math.floor(Number(dashCountInput.value) || 1));
      const lineWidth = getLineWidthValue();
      const colorA = getColourFromInputs(colorAInput, colorATransparentInput);
      const colorB = getColourFromInputs(colorBInput, colorBTransparentInput);

      syncOutsideStrokeAlignment();

      // Allow negative inset.
      const extraInset = Math.floor(Number(insetInput.value) || 0);
      const selectedSides = sidesInput.value;

      // If inset is negative, expand the canvas so the outside border is included.
      const outsidePadding = Math.max(0, -extraInset);
      currentOutputPadding = outsidePadding;

      canvas.width = source.width + outsidePadding * 2;
      canvas.height = source.height + outsidePadding * 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fillCanvasBackground(ctx, canvas.width, canvas.height);
      setCanvasResampling(ctx);

      // Draw the current source centered inside the expanded canvas.
      ctx.drawImage(source.image, outsidePadding, outsidePadding);

      const didDrawBorder = drawInsideAlternatingBorder({
        dashCount,
        lineWidth,
        colorA,
        colorB,
        extraInset,
        selectedSides,
        imageX: outsidePadding,
        imageY: outsidePadding,
        imageWidth: source.width,
        imageHeight: source.height,
        marchingAntsProgress
      });

      if (!didDrawBorder) return false;

      if (includeGuides) {
        drawFixedCropGuides(outsidePadding, outsidePadding);
      }

      if (!shouldUpdateStatus) return true;

      status.textContent = `${source.width} x ${source.height}px crop, ${canvas.width} x ${canvas.height}px export.`;

      if (originalFrames.length > 1) {
        status.textContent += ` Animated GIF source: ${originalFrames.length} frames.`;
      }

      if (isMarchingAntsEnabled()) {
        status.textContent += " Marching ants preview is on.";
      }

      if (outsideStrokeAlignToggle.checked) {
        status.textContent += " Outside stroke alignment is setting inset to -dash width.";
      }

      if (outsidePadding > 0) {
        status.textContent += isCanvasBackgroundEnabled() && !isTransparentColourValue(getCanvasBackgroundColor())
          ? " Negative inset added background-coloured padding."
          : " Negative inset added transparent padding.";
      }

      if (isCanvasBackgroundEnabled()) {
        status.textContent += ` Canvas background: ${formatColourForDisplay(getCanvasBackgroundColor())}.`;
      }

      return true;
    }

    function shouldDrawSide(selectedSides, side) {
      if (selectedSides === "all") return true;
      if (selectedSides === side) return true;
      if (selectedSides === "top-bottom" && (side === "top" || side === "bottom")) return true;
      if (selectedSides === "left-right" && (side === "left" || side === "right")) return true;
      return false;
    }

    function drawInsideAlternatingBorder(options) {
      const {
        dashCount,
        lineWidth,
        colorA,
        colorB,
        extraInset,
        selectedSides,
        imageX,
        imageY,
        imageWidth,
        imageHeight,
        marchingAntsProgress = 0
      } = options;

      const half = lineWidth / 2;

      const x1 = imageX + extraInset + half;
      const y1 = imageY + extraInset + half;
      const x2 = imageX + imageWidth - extraInset - half;
      const y2 = imageY + imageHeight - extraInset - half;

      if (x2 <= x1 || y2 <= y1) {
        status.textContent = "The line is too thick or inset too far for this image.";
        return false;
      }

      const pathSegments = [];

      if (shouldDrawSide(selectedSides, "top")) {
        pathSegments.push(makeSegment(x1, y1, x2, y1, "horizontal"));
      }

      if (shouldDrawSide(selectedSides, "right")) {
        pathSegments.push(makeSegment(x2, y1, x2, y2, "vertical"));
      }

      if (shouldDrawSide(selectedSides, "bottom")) {
        pathSegments.push(makeSegment(x2, y2, x1, y2, "horizontal"));
      }

      if (shouldDrawSide(selectedSides, "left")) {
        pathSegments.push(makeSegment(x1, y2, x1, y1, "vertical"));
      }

      if (pathSegments.length === 0) return false;

      const totalLength = pathSegments.reduce((sum, segment) => sum + segment.length, 0);
      if (totalLength <= 0) return false;

      const dashLength = totalLength / dashCount;
      const phaseDistance = (marchingAntsProgress % 2) * dashLength;

      ctx.save();

      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.clip();

      for (let i = 0; i < dashCount; i++) {
        const dashStart = i * dashLength + phaseDistance;
        const dashEnd = dashStart + dashLength;

        const dashColour = i % 2 === 0 ? colorA : colorB;
        if (isTransparentColourValue(dashColour)) continue;

        ctx.fillStyle = dashColour;

        drawWrappedFilledIntervalAlongPath({
          pathSegments,
          intervalStart: dashStart,
          intervalEnd: dashEnd,
          totalLength,
          lineWidth
        });
      }

      ctx.restore();
      return true;
    }

    function makeSegment(x1, y1, x2, y2, orientation) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.hypot(dx, dy);

      return {
        x1,
        y1,
        x2,
        y2,
        length,
        ux: dx / length,
        uy: dy / length,
        orientation
      };
    }

    function drawWrappedFilledIntervalAlongPath(options) {
      const {
        pathSegments,
        intervalStart,
        intervalEnd,
        totalLength,
        lineWidth
      } = options;
      const intervalLength = intervalEnd - intervalStart;

      if (intervalLength <= 0 || totalLength <= 0) return;

      const wrappedStart = ((intervalStart % totalLength) + totalLength) % totalLength;
      const wrappedEnd = wrappedStart + intervalLength;

      if (wrappedEnd <= totalLength) {
        drawFilledIntervalAlongPath({
          pathSegments,
          intervalStart: wrappedStart,
          intervalEnd: wrappedEnd,
          lineWidth
        });
        return;
      }

      drawFilledIntervalAlongPath({
        pathSegments,
        intervalStart: wrappedStart,
        intervalEnd: totalLength,
        lineWidth
      });
      drawFilledIntervalAlongPath({
        pathSegments,
        intervalStart: 0,
        intervalEnd: wrappedEnd - totalLength,
        lineWidth
      });
    }

    function drawFilledIntervalAlongPath(options) {
      const {
        pathSegments,
        intervalStart,
        intervalEnd,
        lineWidth
      } = options;

      const half = lineWidth / 2;
      const tinyOverlap = 0.05;
      let travelled = 0;

      for (const segment of pathSegments) {
        const segmentStart = travelled;
        const segmentEnd = travelled + segment.length;

        const overlapStart = Math.max(intervalStart, segmentStart);
        const overlapEnd = Math.min(intervalEnd, segmentEnd);

        if (overlapEnd > overlapStart) {
          let localStart = overlapStart - segmentStart;
          let localEnd = overlapEnd - segmentStart;

          // Tiny overlap avoids subpixel hairline cracks between alternating colours.
          localStart -= tinyOverlap;
          localEnd += tinyOverlap;

          // When a coloured section reaches the end of a side, extend it by half
          // the line width into the corner square to avoid corner holes.
          if (overlapStart <= segmentStart + tinyOverlap) {
            localStart = -half;
          }

          if (overlapEnd >= segmentEnd - tinyOverlap) {
            localEnd = segment.length + half;
          }

          fillSegmentRectangle(segment, localStart, localEnd, lineWidth);
        }

        travelled = segmentEnd;

        if (travelled >= intervalEnd) break;
      }
    }

    function fillSegmentRectangle(segment, localStart, localEnd, lineWidth) {
      const half = lineWidth / 2;

      const ax = segment.x1 + segment.ux * localStart;
      const ay = segment.y1 + segment.uy * localStart;
      const bx = segment.x1 + segment.ux * localEnd;
      const by = segment.y1 + segment.uy * localEnd;

      if (segment.orientation === "horizontal") {
        const x = Math.min(ax, bx);
        const y = segment.y1 - half;
        const width = Math.abs(bx - ax);
        const height = lineWidth;

        ctx.fillRect(x, y, width, height);
      } else {
        const x = segment.x1 - half;
        const y = Math.min(ay, by);
        const width = lineWidth;
        const height = Math.abs(by - ay);

        ctx.fillRect(x, y, width, height);
      }
    }

    async function downloadCurrentExport() {
      if (!originalImage || isExportingGif) return;

      syncDownloadButtonLabel();

      if (exportFormatInput.value === "gif") {
        await downloadGif();
        return;
      }

      downloadPng();
    }

    function downloadPng() {
      if (!originalImage) return;

      const guidesWereVisible = showCropGuides;
      showCropGuides = false;
      render({ includeGuides: false });

      const link = document.createElement("a");
      link.download = `${originalBaseName}-alternating-dashes.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();

      showCropGuides = guidesWereVisible;
      if (showCropGuides) render();
    }

    async function downloadGif() {
      if (!originalImage) return;

      if (typeof GIF !== "function") {
        alert("The GIF exporter did not load. Check your connection and try again, or export PNG instead.");
        return;
      }

      const guidesWereVisible = showCropGuides;
      const previousFrameIndex = currentFrameIndex;
      const wasAnimating = Boolean(animationFrameRequest);
      const frames = buildGifExportFramePlan();

      isExportingGif = true;
      stopAnimationLoop();
      showCropGuides = false;
      downloadBtn.disabled = true;
      status.textContent = `Rendering GIF: 0/${frames.length} frames...`;

      try {
        const gifBlob = await encodeGif(frames);
        const objectUrl = URL.createObjectURL(gifBlob);
        const link = document.createElement("a");
        link.download = `${originalBaseName}-alternating-dashes.gif`;
        link.href = objectUrl;
        link.click();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        status.textContent = `Exported GIF with ${frames.length} frame${frames.length === 1 ? "" : "s"}.`;
      } catch (error) {
        console.error(error);
        alert("Could not export the GIF. Try a smaller crop, fewer GIF frames, or export PNG instead.");
        status.textContent = "GIF export failed.";
      } finally {
        isExportingGif = false;
        showCropGuides = guidesWereVisible;
        currentFrameIndex = previousFrameIndex;
        downloadBtn.disabled = !originalImage;
        render();
        if (wasAnimating || shouldAnimatePreview()) syncAnimationLoop();
      }
    }

    function buildGifExportFramePlan() {
      const hasSourceAnimation = originalFrames.length > 1;
      const hasMarchingAnts = isMarchingAntsEnabled();

      if (hasSourceAnimation) {
        let elapsed = 0;
        return originalFrames.map((frame, index) => {
          const delay = normalizeFrameDelay(frame.delay);
          const plan = {
            frameIndex: index,
            delay,
            marchingAntsProgress: hasMarchingAnts ? getMarchingAntsProgressForElapsed(elapsed) : 0
          };
          elapsed += delay;
          return plan;
        });
      }

      if (hasMarchingAnts) {
        const delay = Math.round(MARCHING_ANTS_LOOP_MS / getMarchingAntsSpeed() / MARCHING_ANTS_EXPORT_FRAMES);
        return Array.from({ length: MARCHING_ANTS_EXPORT_FRAMES }, (_, index) => ({
          frameIndex: 0,
          delay: normalizeFrameDelay(delay),
          marchingAntsProgress: index / MARCHING_ANTS_EXPORT_FRAMES * 2
        }));
      }

      return [{
        frameIndex: 0,
        delay: 250,
        marchingAntsProgress: 0
      }];
    }

    function encodeGif(frames) {
      return new Promise((resolve, reject) => {
        if (!frames.length) {
          reject(new Error("No GIF frames to export."));
          return;
        }

        const firstFrame = frames[0];
        const firstFrameRendered = render({
          frameIndex: firstFrame.frameIndex,
          marchingAntsProgress: firstFrame.marchingAntsProgress,
          includeGuides: false,
          updateStatus: false
        });

        if (!firstFrameRendered || !hasValidCanvasSize(canvas)) {
          reject(new Error("GIF export could not render a valid first frame."));
          return;
        }

        const gifWidth = Math.floor(canvas.width);
        const gifHeight = Math.floor(canvas.height);
        const frameCanvas = document.createElement("canvas");
        const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
        frameCanvas.width = gifWidth;
        frameCanvas.height = gifHeight;
        setCanvasResampling(frameCtx);

        const gif = new GIF({
          workers: 2,
          quality: isNearestResampling() ? 1 : 10,
          width: gifWidth,
          height: gifHeight,
          workerScript: GIF_WORKER_SCRIPT,
          transparent: null
        });

        function addRenderedCanvasToGif(frame, index) {
          if (!hasValidCanvasSize(canvas)) {
            throw new Error("GIF export rendered an invalid frame size.");
          }

          if (canvas.width !== gifWidth || canvas.height !== gifHeight) {
            throw new Error("GIF export frame size changed while rendering.");
          }

          frameCtx.clearRect(0, 0, gifWidth, gifHeight);
          frameCtx.drawImage(canvas, 0, 0);
          gif.addFrame(frameCanvas, { copy: true, delay: normalizeFrameDelay(frame.delay) });
          status.textContent = `Rendering GIF: ${index + 1}/${frames.length} frames...`;
        }

        try {
          addRenderedCanvasToGif(firstFrame, 0);

          frames.slice(1).forEach((frame, frameOffset) => {
            render({
              frameIndex: frame.frameIndex,
              marchingAntsProgress: frame.marchingAntsProgress,
              includeGuides: false,
              updateStatus: false
            });
            addRenderedCanvasToGif(frame, frameOffset + 1);
          });
        } catch (error) {
          reject(error);
          return;
        }

        gif.on("progress", progress => {
          status.textContent = `Encoding GIF: ${Math.round(progress * 100)}%...`;
        });
        gif.on("finished", resolve);
        gif.on("abort", () => reject(new Error("GIF export was aborted.")));
        gif.render();
      });
    }
  </script>
</body>
